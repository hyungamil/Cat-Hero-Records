<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>길드 통합 관리 시스템</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
        
        :root {
            --brand-primary: #2563eb;
            --brand-slate: #f8fafc;
            --brand-dark: #0f172a;
        }

        body { 
            font-family: 'Noto Sans KR', 'Inter', sans-serif; 
            transition: background-color 0.2s, color 0.2s;
            background-color: #f1f5f9; 
            letter-spacing: -0.025em;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            width: 100%;
        }

        .dark body { background-color: #020617; }

        .dashboard-card { 
            border-radius: 0.75rem; 
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            transition: background-color 0.2s, border-color 0.2s;
        }

        .dark .dashboard-card {
            background-color: #1e293b;
            border-color: #334155;
            color: #f1f5f9;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .animate-marquee {
            display: inline-block;
            white-space: nowrap;
            animation: marquee 30s linear infinite;
        }

        .app-container {
            width: 100%;
            max-width: 1440px;
            margin: 0 auto;
            min-height: 100vh;
        }

        .agent-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 0.75rem;
        }

        @media (min-width: 768px) {
            .agent-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1.25rem;
            }
        }

        @media (min-width: 1024px) {
            .desktop-layout {
                display: grid;
                grid-template-columns: 380px 1fr;
                gap: 1.5rem;
                align-items: start;
            }
        }

        .main-tab-active {
            background-color: var(--brand-primary);
            color: white;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
        }

        .custom-modal-overlay {
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
        }

        @keyframes slideUpFade {
            0% { transform: translateY(10px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        .log-animate {
            animation: slideUpFade 0.5s ease-out forwards;
        }
    </style>
</head>
<body class="text-slate-900 dark:text-slate-100 font-bold">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, serverTimestamp, deleteDoc, doc, setDoc, updateDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCOt_5hYk7Y9EDwo1Cd55et5-JT6k7LIcc",
            authDomain: "cat-hero-record.firebaseapp.com",
            projectId: "cat-hero-record",
            storageBucket: "cat-hero-record.firebasestorage.app",
            messagingSenderId: "1059204432454",
            appId: "1:1059204432454:web:b365ddd7d6a3da2c624047"
        };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'cat-hero-v24-final';
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const { useState, useEffect, useMemo } = React;

        const TOTAL_RESOURCES = 10; 
        const BASE_TIME_PER_SWORD = 2; // 1회당 2분, 총 20분
        const INITIAL_MEMBERS = ["늑대벼리", "마자유", "고기쟁이", "김동순", "일민", "캣핑", "콘스", "하늘구름바다", "창식2", "나는도비", "노들노들", "포저", "라잌늑냥", "베리발", "장귝", "유나s"];
        
        const mobs = ['일반몹', '보스'];

        const TITLES_LIST = [
            { id: 1, name: "길드의 새싹", score: 0 },
            { id: 2, name: "견습 길드원", score: 50 },
            { id: 3, name: "정식 길드원", score: 100 },
            { id: 4, name: "베테랑", score: 200 },
            { id: 5, name: "에이스", score: 400 },
            { id: 6, name: "정예 길드원", score: 600 },
            { id: 7, name: "전설의 길드원", score: 800 },
            { id: 8, name: "길드의 수호자", score: 1000 },
            { id: 9, name: "불멸의 전사", score: 1500 },
            { id: 10, name: "길드의 태양", score: 2000 },
            { id: 11, name: "길드의 자부심", score: 5000 },
            { id: 12, name: "길드의 신", score: 10000 },
        ];

        const stableRandomMap = {};
        INITIAL_MEMBERS.forEach(name => {
            stableRandomMap[name] = Math.random();
        });

        // 격전지 상층 몬스터 정보 (참고용)
        const UPPER_MONSTERS = {
            tier1: [
                { name: '유령크랩', defaultHp: 300000 },
                { name: '유령 꿀벌', defaultHp: 350000 },
                { name: '유령 격전쥐', defaultHp: 400000 }
            ],
            tier2: [
                { name: '루니', defaultHp: 500000 },
                { name: '루이', defaultHp: 550000 },
                { name: '루나', defaultHp: 600000 },
                { name: '바나냥', defaultHp: 650000 }
            ]
        };

        function App() {
            const [user, setUser] = useState(null);
            const [nickname, setNickname] = useState(localStorage.getItem('cat_hero_nickname') || '');
            const [isNameSet, setIsNameSet] = useState(!!localStorage.getItem('cat_hero_nickname'));
            const [isAdminMode, setIsAdminMode] = useState(false);
            const [adminPass, setAdminPass] = useState("");
            const [showAdminEntry, setShowAdminEntry] = useState(false);
            const [isDarkMode, setIsDarkMode] = useState(localStorage.getItem('isDarkMode') === 'true');
            const [mainCategory, setMainCategory] = useState('conquest');
            
            const [conquestFilter, setConquestFilter] = useState('timeSort');
            const [raidFilter, setRaidFilter] = useState('all');

            const [selectedDiaryDate, setSelectedDiaryDate] = useState(new Date().toISOString().split('T')[0]);
            const [selectedConquestSeasonIndex, setSelectedConquestSeasonIndex] = useState(0);

            const [selectedMob, setSelectedMob] = useState('일반몹');
            const [playMin, setPlayMin] = useState(0);
            const [playSec, setPlaySec] = useState(0);
            
            const [logs, setLogs] = useState([]);
            const [raidLogs, setRaidLogs] = useState([]);
            const [members, setMembers] = useState([]);
            const [notices, setNotices] = useState([]);
            const [newNotice, setNewNotice] = useState("");
            const [newMemberName, setNewMemberName] = useState("");
            const [timeLeftStr, setTimeLeftStr] = useState("");

            const [showAllLogsModal, setShowAllLogsModal] = useState(false);
            const [showAllNoticesModal, setShowAllNoticesModal] = useState(false);

            const [uiAlert, setUiAlert] = useState(null);
            const [uiConfirm, setUiConfirm] = useState(null);

            // 신규 일격 상태값
            const [strikeSubTab, setStrikeSubTab] = useState('calc'); // 'calc' | 'distribute' | 'report'
            const [bossScore, setBossScore] = useState('');
            const [selectedCalcMembers, setSelectedCalcMembers] = useState([]); 
            const [calcMemberSearch, setCalcMemberSearch] = useState(''); 
            
            // 신규 전리품 분배 시스템 상태값
            const [distributeMode, setDistributeMode] = useState('quick'); // 'quick' (간편) | 'detailed' (일반)
            const [selectedRewards, setSelectedRewards] = useState({});
            const [distResults, setDistResults] = useState(null);
            const REWARD_TYPES = ['장비', '레시피', '픽업', '룬 소환서', '특수룬 소환서'];

            // 내 전투 제원 상태 변수 추가
            const [isMyStatLoaded, setIsMyStatLoaded] = useState(false);
            const [myStatInput, setMyStatInput] = useState('');
            const [myMountInput, setMyMountInput] = useState('');

            const showAlert = (msg, type = 'success') => setUiAlert({ message: msg, type });
            const closeAlert = () => setUiAlert(null);

            // 클립보드 복사 헬퍼 함수
            const copyToClipboard = (text) => {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    showAlert("복사되었습니다.");
                } catch (err) {
                    showAlert("복사 실패", "error");
                }
                document.body.removeChild(textArea);
            };

            const handleResetSession = () => {
                setUiConfirm({ 
                    message: "길드원 정보를 초기화하고 이름 선택 화면으로 돌아가시겠습니까?", 
                    onConfirm: () => { 
                        localStorage.removeItem('cat_hero_nickname'); 
                        setNickname(''); 
                        setIsNameSet(false); 
                        window.location.reload(); 
                    } 
                });
            };

            const recentDates = useMemo(() => {
                const dates = [];
                for(let i=0; i<7; i++) {
                    const d = new Date();
                    d.setDate(d.getDate() - i);
                    dates.push(d.toISOString().split('T')[0]);
                }
                return dates;
            }, []);

            useEffect(() => {
                if (isDarkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
                localStorage.setItem('isDarkMode', isDarkMode);
            }, [isDarkMode]);

            useEffect(() => {
                const updateTimer = () => {
                    const now = new Date();
                    const day = now.getDay();
                    let target = new Date();
                    target.setHours(8, 45, 0, 0);
                    const daysUntilMonday = (1 + 7 - day) % 7 || 7;
                    target.setDate(now.getDate() + daysUntilMonday);
                    const diff = target - now;
                    if (diff <= 0) setTimeLeftStr("시즌 종료");
                    else {
                        const d = Math.floor(diff / 86400000);
                        const h = Math.floor((diff % 86400000) / 3600000);
                        const m = Math.floor((diff % 3600000) / 60000);
                        const s = Math.floor((diff % 60000) / 1000);
                        setTimeLeftStr(`${d}일 ${h}:${m}:${s}`);
                    }
                };
                const timerId = setInterval(updateTimer, 1000);
                updateTimer();
                return () => clearInterval(timerId);
            }, []);

            useEffect(() => {
                const initAuth = async () => {
                    try { await signInAnonymously(auth); } catch (e) { console.error(e); } 
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsubMembers = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'members_v24'), (snapshot) => {
                    if (snapshot.empty) {
                        INITIAL_MEMBERS.forEach(name => addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'members_v24'), { name, score: 0 }));
                    } else {
                        setMembers(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort((a, b) => (b.score || 0) - (a.score || 0)));
                    }
                }, (error) => console.error(error));

                const unsubLogs = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'conquest_logs_v24'), (snapshot) => {
                    setLogs(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0)));
                }, (error) => console.error(error));

                const unsubRaidLogs = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'raid_logs_v24'), (snapshot) => {
                    setRaidLogs(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                }, (error) => console.error(error));

                const unsubNotices = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'notices_v24'), (snapshot) => {
                    setNotices(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0)));
                }, (error) => console.error(error));

                return () => { unsubMembers(); unsubLogs(); unsubRaidLogs(); unsubNotices(); };
            }, [user]);

            // 본인 스탯 초기화 로드
            useEffect(() => {
                if (!isMyStatLoaded && members.length > 0 && nickname) {
                    const m = members.find(mem => mem.name === nickname);
                    if (m) {
                        setMyStatInput(m.stat ? String(m.stat) : '');
                        setMyMountInput(m.mount ? String(m.mount) : '');
                        setIsMyStatLoaded(true);
                    }
                }
            }, [members, nickname, isMyStatLoaded]);

            const rankingData = useMemo(() => {
                const sortedByScore = [...members].sort((a, b) => (b.score || 0) - (a.score || 0));
                const raidCounts = {};
                raidLogs.forEach(l => { raidCounts[l.nickname] = (raidCounts[l.nickname] || 0) + Number(l.keysUsed || 0); });

                const getPersonalStatus = (name) => {
                    const m = members.find(mem => mem.name === name) || { score: 0 };
                    const currentScore = m.score || 0;
                    const currentTitle = [...TITLES_LIST].reverse().find(t => currentScore >= t.score) || TITLES_LIST[0];
                    const nextTitle = TITLES_LIST.find(t => t.score > currentScore);
                    const rankIdx = sortedByScore.findIndex(mem => mem.name === name);
                    return { currentTitle, nextTitle, score: currentScore, rank: rankIdx + 1, raidCount: raidCounts[name] || 0 };
                };
                return { weekly: sortedByScore, season: sortedByScore, getPersonalStatus };
            }, [members, raidLogs]);

            const stats = useMemo(() => {
                const playerMap = {};
                members.forEach(m => playerMap[m.name] = { swords: 0, totalInputTimeSec: 0, bossTimeSec: 0, raidToday: 0 });
                logs.forEach(l => { 
                    if (playerMap[l.nickname]) { 
                        playerMap[l.nickname].swords += 1; 
                        const duration = (Number(l.playMin || 0) * 60 + Number(l.playSec || 0));
                        playerMap[l.nickname].totalInputTimeSec += duration;
                        if (l.mob === '보스') playerMap[l.nickname].bossTimeSec += duration;
                    } 
                });
                const todayStart = new Date(); todayStart.setHours(0,0,0,0);
                raidLogs.forEach(l => { 
                    const ld = l.timestamp?.seconds ? new Date(l.timestamp.seconds * 1000) : new Date(); 
                    if (ld >= todayStart && playerMap[l.nickname]) playerMap[l.nickname].raidToday += Number(l.keysUsed || 0); 
                });
                return { playerMap };
            }, [logs, raidLogs, members]);

            const diaryHistory = useMemo(() => {
                const getRaidReport = (targetDateStr) => {
                    return members.map(m => {
                        const dayLogs = raidLogs.filter(l => {
                            const d = l.timestamp?.seconds ? new Date(l.timestamp.seconds * 1000) : new Date();
                            return d.toISOString().split('T')[0] === targetDateStr && l.nickname === m.name;
                        });
                        const used = dayLogs.reduce((acc, curr) => acc + Number(curr.keysUsed), 0);
                        return { name: m.name, used, remaining: Math.max(0, 2 - used) };
                    }).sort((a, b) => b.remaining - a.remaining);
                };

                const getConquestSeasonsReport = () => {
                    const seasons = [];
                    let currentSat = new Date();
                    const day = currentSat.getDay();
                    const diffToSat = (day + 1) % 7; 
                    currentSat.setDate(currentSat.getDate() - diffToSat);
                    currentSat.setHours(9, 0, 0, 0);

                    for (let i = 0; i < 4; i++) {
                        let start = new Date(currentSat);
                        start.setDate(currentSat.getDate() - (i * 7));
                        let end = new Date(start);
                        end.setDate(start.getDate() + 2);
                        end.setHours(9, 0, 0, 0);

                        const label = `${start.getMonth() + 1}/${start.getDate()} ~ ${end.getMonth() + 1}/${end.getDate()}`;
                        const reports = members.map(m => {
                            const seasonLogs = logs.filter(l => {
                                const ld = l.timestamp?.seconds ? new Date(l.timestamp.seconds * 1000) : new Date();
                                return ld >= start && ld <= end && l.nickname === m.name;
                            });
                            const usedSwords = seasonLogs.length;
                            const usedSec = seasonLogs.reduce((acc, curr) => acc + (Number(curr.playMin) * 60 + Number(curr.playSec)), 0);
                            const totalBudgetSec = TOTAL_RESOURCES * BASE_TIME_PER_SWORD * 60;
                            const remainingSec = Math.max(0, totalBudgetSec - usedSec);
                            return {
                                name: m.name,
                                usedSwords,
                                remainingSwords: Math.max(0, TOTAL_RESOURCES - usedSwords),
                                remainingMin: Math.floor(remainingSec / 60),
                                remainingSec: remainingSec % 60
                            };
                        }).sort((a, b) => b.remainingSwords - a.remainingSwords); 
                        seasons.push({ label, range: `${start.toLocaleString()} ~ ${end.toLocaleString()}`, reports });
                    }
                    return seasons;
                };
                return { getRaidReport, conquestSeasons: getConquestSeasonsReport() };
            }, [logs, raidLogs, members]);

            // 격추 수치 계산 공식: 격추 = (스탯 + 6 + 탈것) * 10 + 1000
            const getMemberGyeokchu = (m) => {
                if (m.directGyeokchu && Number(m.directGyeokchu) > 0) {
                    return Number(m.directGyeokchu);
                }
                const statVal = parseInt(m.stat, 10) || 0;
                const mountVal = parseInt(m.mount, 10) || 0;
                if (statVal > 0 || mountVal > 0) {
                    return (statVal + 6 + mountVal) * 10 + 1000;
                }
                return 0; // 미등록
            };

            const handleSubmitConquest = async (e) => {
                e.preventDefault();
                if (!nickname || (playMin === 0 && playSec === 0)) return;
                const member = members.find(m => m.name === nickname);
                if ((stats.playerMap[nickname]?.swords || 0) >= TOTAL_RESOURCES) return showAlert(`한도(${TOTAL_RESOURCES}회) 초과`, "error");
                try {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'conquest_logs_v24'), { nickname, mob: selectedMob, playMin: Number(playMin), playSec: Number(playSec), timestamp: serverTimestamp(), uid: user.uid });
                    if (member) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members_v24', member.id), { score: (member.score || 0) + 5 });
                    setPlayMin(0); setPlaySec(0); showAlert("작전 보고 완료.");
                } catch (err) { showAlert("실패", "error"); }
            };

            const handleUndoLastConquest = async () => {
                const myLogs = logs.filter(l => l.nickname === nickname).sort((a,b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
                const latestLogDoc = myLogs[0];
                if (!latestLogDoc) return showAlert("취소할 최근 균격 기록이 없습니다.", "error");

                setUiConfirm({
                    message: `마지막 균격 기록 [${latestLogDoc.mob} - ${latestLogDoc.playMin}분 ${latestLogDoc.playSec}초]을 취소하고 차감하시겠습니까?`,
                    onConfirm: async () => {
                        try {
                            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'conquest_logs_v24', latestLogDoc.id));
                            const member = members.find(m => m.name === nickname);
                            if (member) {
                                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members_v24', member.id), { score: Math.max(0, (member.score || 0) - 5) });
                            }
                            showAlert("마지막 균격 기록이 취소되었습니다.");
                        } catch (err) { showAlert("취소 실패", "error"); }
                    }
                });
            };

            const handleSubmitRaid = async (keys) => {
                const member = members.find(m => m.name === nickname);
                try {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'raid_logs_v24'), { nickname, keysUsed: keys, timestamp: serverTimestamp(), uid: user.uid });
                    if (member) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members_v24', member.id), { score: (member.score || 0) + (keys * 10) });
                    showAlert(`${keys}개 보고 완료.`);
                } catch (err) { showAlert("실패", "error"); }
            };

            const handleResetRaid = async () => {
                const today = new Date(); today.setHours(0, 0, 0, 0);
                const myLogs = raidLogs.filter(l => l.nickname === nickname && (l.timestamp?.seconds ? new Date(l.timestamp.seconds * 1000) : new Date()) >= today);
                setUiConfirm({ message: "오늘의 기록을 초기화하시겠습니까?", onConfirm: async () => { 
                    let totalKeys = 0;
                    for (const l of myLogs) { totalKeys += Number(l.keysUsed); await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'raid_logs_v24', l.id)); }
                    const member = members.find(m => m.name === nickname);
                    if (member) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members_v24', member.id), { score: Math.max(0, (member.score || 0) - (totalKeys * 10)) });
                    showAlert("초기화 완료"); 
                } });
            };

            const handleUpdateScore = async (id, newScore) => {
                try {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members_v24', id), { score: Number(newScore) });
                    showAlert("점수가 수정되었습니다.");
                } catch (e) { showAlert("실패", "error"); }
            };

            const handleUpdateMemberField = async (id, field, value) => {
                try {
                    const val = value === '' ? null : Number(value);
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members_v24', id), { [field]: val });
                    showAlert("수정되었습니다.");
                } catch (e) { showAlert("실패", "error"); }
            };

                    showAlert("내 전투 제원이 성공적으로 저장되었습니다.");
                } catch (e) {
                    showAlert("스탯 저장 실패", "error");
                }
            };

            const adjustTime = (type, val) => {
                if (type === 'min') setPlayMin(p => Math.max(0, p + val));
                else setPlaySec(p => (p + val >= 60 ? (setPlayMin(m => m + 1), p + val - 60) : Math.max(0, p + val)));
            };

            const sortedConquestMembers = useMemo(() => {
                return members
                    .filter(m => {
                        if (conquestFilter === 'inactive') return (stats.playerMap[m.name]?.swords || 0) === 0;
                        return true;
                    })
                    .sort((a, b) => {
                        if (conquestFilter === 'all') {
                            return (stableRandomMap[a.name] || 0) - (stableRandomMap[b.name] || 0);
                        }
                        const timeA = stats.playerMap[a.name]?.totalInputTimeSec || 0;
                        const timeB = stats.playerMap[b.name]?.totalInputTimeSec || 0;

                    });
            }, [members, conquestFilter, stats]);

            const sortedRaidMembers = useMemo(() => {
                return members

                    })
                    .sort((a, b) => {
                        if (raidFilter === 'all') {
                            return (stableRandomMap[a.name] || 0) - (stableRandomMap[b.name] || 0);
                        }
                        return 0;

            // 일격 계산기 대상 길드원 목록 (검색 적용)
            const filteredCalcMembers = useMemo(() => {
                return members.filter(m => {
                    if (!calcMemberSearch) return true;
                    return m.name.toLowerCase().includes(calcMemberSearch.toLowerCase());
                });
            }, [members, calcMemberSearch]);

            // 일격 공동공격 실시간 기여도 계산 연산
            const calcStrikeReport = useMemo(() => {
                let totalGyeokchu = 0;
                const activeMembers = [];

                selectedCalcMembers.forEach(id => {
                    const m = members.find(mem => mem.id === id);
                    if (m) {
                        const gk = getMemberGyeokchu(m);
                        totalGyeokchu += gk;
                        activeMembers.push({
                            id: m.id,
                            name: m.name,
                            gyeokchu: gk
                        });
                    }
                });

                const hp = Number(bossScore) || 0;
                // 예상 처치 시간(초)
                const expectedSeconds = (hp > 0 && totalGyeokchu > 0) ? Math.ceil(hp / totalGyeokchu) : 0;
                
                // 멤버별 기여도 및 예상 점수 도출 후 고득점순 정렬
                const individualReports = activeMembers.map(m => {
                    const rate = totalGyeokchu > 0 ? (m.gyeokchu / totalGyeokchu) * 100 : 0;
                    const score = (hp > 0 && totalGyeokchu > 0) ? Math.round(hp * (m.gyeokchu / totalGyeokchu)) : 0;
                    return {
                        ...m,
                        rate: Number(rate.toFixed(2)),
                        expectedScore: score
                    };
                }).sort((a, b) => b.gyeokchu - a.gyeokchu);

                return {
                    totalGyeokchu,
                    expectedSeconds,
                    individualReports
                };
            }, [selectedCalcMembers, members, bossScore]);

            // 전리품 분배 시스템 로직 (개편)
            const handleDistributeRandom = () => {
                if(selectedCalcMembers.length === 0) return showAlert("참여 대원이 없습니다. '격전지 추가 점수(격추)' 탭에서 참여자를 먼저 지정해주세요.", "error");
                
                const itemKeys = Object.keys(selectedRewards);
                if(itemKeys.length === 0) return showAlert("선택된 드랍 보상이 없습니다.", "error");

                let results = {};
                const participants = selectedCalcMembers.map(id => {
                    const m = members.find(mem => mem.id === id);
                    results[m.name] = {};
                    return m.name;
                });

                itemKeys.forEach(itemName => {
                    const qty = selectedRewards[itemName] || 1;
                    for(let i=0; i<qty; i++) {
                        const winner = participants[Math.floor(Math.random() * participants.length)];
                        results[winner][itemName] = (results[winner][itemName] || 0) + 1;
                    }
                });
                setDistResults(results);
                showAlert(distributeMode === 'quick' ? "간편 모드 무작위 분배 완료!" : "상세 수량에 맞춰 랜덤 분배 완료!");
            };

            const handleDistributeContribution = () => {
                if(selectedCalcMembers.length === 0) return showAlert("참여 대원이 없습니다. '격전지 추가 점수(격추)' 탭에서 참여자를 먼저 지정해주세요.", "error");
                
                const itemKeys = Object.keys(selectedRewards);
                if(itemKeys.length === 0) return showAlert("선택된 드랍 보상이 없습니다.", "error");
                if(calcStrikeReport.totalGyeokchu === 0) return showAlert("기여도 산출이 불가합니다. 대원들의 격추 스탯이 정상 등록되었는지 확인하세요.", "error");

                let results = {};
                calcStrikeReport.individualReports.forEach(r => {
                    results[r.name] = {};
                });

                itemKeys.forEach(itemName => {
                    let totalQty = selectedRewards[itemName] || 1;
                    let remainders = [];

                    calcStrikeReport.individualReports.forEach(r => {
                        let exactShare = (r.rate / 100) * totalQty;
                        let floorShare = Math.floor(exactShare);
                        if (floorShare > 0) {
                            results[r.name][itemName] = (results[r.name][itemName] || 0) + floorShare;
                        }
                        // 남은 소수점 기록 (해밀턴 방식 배분을 위해)
                        remainders.push({ name: r.name, remainder: exactShare - floorShare });
                    });

                    let distributedSoFar = calcStrikeReport.individualReports.reduce((acc, r) => acc + Math.floor((r.rate / 100) * totalQty), 0);
                    let leftover = totalQty - distributedSoFar;

                    // 소수점이 큰 순서대로 내림차순 정렬하여 남은 수량 1개씩 분배
                    remainders.sort((a, b) => b.remainder - a.remainder);

                    for(let i=0; i<leftover; i++) {
                        let winner = remainders[i % remainders.length].name;
                        results[winner][itemName] = (results[winner][itemName] || 0) + 1;
                    }
                });
                setDistResults(results);
                showAlert("공략 기여도(%)에 비례하여 완벽하게 배분되었습니다!");
            };

                                    <button onClick={() => setIsDarkMode(!isDarkMode)} className="w-9 h-9 border dark:border-slate-700 rounded-xl flex items-center justify-center text-slate-400 hover:text-yellow-500 shadow-sm"><i className={`fas ${isDarkMode ? 'fa-sun' : 'fa-moon'}`}></i></button>
                                </div>
                            </div>

                        {/* 공지사항 전역 노출 */}

                            <div className="bg-indigo-600 dark:bg-indigo-800 text-white px-4 py-2.5 flex items-center justify-between shadow-sm relative z-20">

                                </div>

                                    전체 보기
                                </button>
                            </div>

                                <div className="desktop-layout">
                                    <aside className="space-y-6">

                                            <div className="flex justify-between items-center">
                                                <h3 className="text-xs font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest flex items-center gap-2"><i className="fas fa-broadcast-tower text-red-500 animate-pulse"></i> 실시간 처치 기록</h3>
                                                <button onClick={() => setShowAllLogsModal(true)} className="text-[10px] bg-slate-100 dark:bg-slate-800 text-slate-500 px-2 py-1 rounded-md font-bold hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">전체 보기</button>
                                            </div>
                                            <div className="space-y-2.5 max-h-[150px] overflow-y-auto no-scrollbar">
                                                {logs.slice(0, 5).map((l, idx) => (
                                                    <div key={idx} className="text-[10px] leading-relaxed border-b border-slate-50 dark:border-slate-800/50 pb-1.5 animate-fadeIn">
                                                        <span className="text-blue-500 dark:text-blue-400 font-black">[{l.nickname}]</span> {l.mob} 성공
                                                    </div>
                                                ))}
                                                {logs.length === 0 && <p className="text-[10px] text-slate-400 text-center py-4">활동 기록 대기 중...</p>}

                                        </div>
                                        <form onSubmit={handleSubmitConquest} className="dashboard-card p-6 md:p-8 space-y-6 text-slate-900 dark:text-white border-l-[8px] border-blue-500">

                                            <div className="space-y-4">
                                                <label className="text-[10px] text-slate-400 uppercase tracking-widest block mb-2 font-bold">01. 대상 등급</label>
                                                <div className="grid grid-cols-2 gap-2.5">
                                                    {mobs.map(m => (
                                                        <button key={m} type="button" onClick={() => setSelectedMob(m)} className={`py-3.5 rounded-xl border-2 text-[10px] font-black uppercase transition-all ${selectedMob === m ? 'border-blue-600 bg-blue-600 text-white' : 'border-slate-100 dark:border-slate-800 text-slate-400'}`}>{m}</button>
                                                    ))}
                                                </div>
                                            </div>
                                            <div className="bg-slate-900 rounded-[2rem] p-6 text-center border border-slate-800">
                                                <div className="text-4xl md:text-5xl font-black text-white italic mb-8 font-mono">{String(playMin).padStart(2, '0')}<span className="text-blue-500 mx-1.5">:</span>{String(playSec).padStart(2, '0')}</div>
                                                <div className="grid grid-cols-3 gap-2">
                                                    {[1, 10, 1].map((v, i) => (
                                                        <button key={i} type="button" onClick={() => adjustTime(i===0?'min':'sec', v)} className="bg-white/10 p-2.5 rounded-lg text-[10px] font-black text-white">+{v}{i===0?'분':'초'}</button>
                                                    ))}
                                                    {[-1, -10, -1].map((v, i) => (
                                                        <button key={i} type="button" onClick={() => adjustTime(i===0?'min':'sec', v)} className="bg-red-500/10 p-2.5 rounded-lg text-[10px] font-black text-red-400">{-v}{i===0?'분':'초'}</button>
                                                    ))}
                                                </div>
                                            </div>
                                            <div className="flex flex-col gap-3">
                                                <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white py-6 rounded-2xl font-black text-xl shadow-lg shadow-blue-500/20 transition-all active:scale-95 uppercase italic border-b-4 border-blue-800">제출 승인</button>
                                                <button type="button" onClick={handleUndoLastConquest} className="w-full bg-slate-100 dark:bg-slate-800 hover:bg-red-50 dark:hover:bg-red-950/20 text-red-500 border border-slate-200 dark:border-slate-700 py-3.5 rounded-xl font-black text-xs uppercase tracking-widest transition-all">마지막 균격 기록 취소</button>
                                            </div>
                                        </form>
                                    </aside>

                                    <section className="space-y-6 mt-8 lg:mt-0">
                                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 px-2">
                                            <h3 className="font-black text-lg italic uppercase text-blue-500 shrink-0">길드원 기록 현황</h3>
                                            <div className="flex gap-1.5 bg-slate-200 dark:bg-slate-800 p-1 rounded-xl w-full md:w-auto overflow-x-auto no-scrollbar">
                                                <button onClick={() => setConquestFilter('timeSort')} className={`whitespace-nowrap px-4 py-1.5 rounded-lg text-[10px] font-black transition-all ${conquestFilter === 'timeSort' ? 'bg-white dark:bg-slate-600 shadow-sm text-emerald-600' : 'text-slate-500 dark:text-slate-400'}`}>남은시간 순</button>
                                                <button onClick={() => setConquestFilter('all')} className={`whitespace-nowrap px-4 py-1.5 rounded-lg text-[10px] font-black transition-all ${conquestFilter === 'all' ? 'bg-white dark:bg-slate-600 shadow-sm text-blue-600' : 'text-slate-500 dark:text-slate-400'}`}>전체</button>
                                                <button onClick={() => setConquestFilter('inactive')} className={`whitespace-nowrap px-4 py-1.5 rounded-lg text-[10px] font-black transition-all ${conquestFilter === 'inactive' ? 'bg-white dark:bg-slate-600 shadow-sm text-red-600' : 'text-slate-500 dark:text-slate-400'}`}>미참여</button>
                                            </div>
                                        </div>
                                        <div className="agent-grid">
                                            {sortedConquestMembers.map(mDoc => {
                                                const st = stats.playerMap[mDoc.name] || { swords: 0, totalInputTimeSec: 0, bossTimeSec: 0 };
                                                const usedSwordsCount = st.swords || 0;
                                                const totalBudgetSec = TOTAL_RESOURCES * BASE_TIME_PER_SWORD * 60; 
                                                const remainingSec = Math.max(0, totalBudgetSec - st.totalInputTimeSec);
                                                const remMin = Math.floor(remainingSec / 60);
                                                const remSec = remainingSec % 60;
                                                const isInactive = usedSwordsCount === 0;
                                                return (
                                                    <div key={mDoc.id} className={`dashboard-card p-5 md:p-6 border-l-[6px] ${!isInactive ? 'border-l-blue-500 shadow-md' : 'border-l-slate-300 dark:border-l-slate-700 bg-slate-50/50 dark:bg-slate-800/40'} hover:translate-y-[-4px] transition-all`}>
                                                        <div className="flex flex-col mb-4 gap-1.5 min-w-0">
                                                            <div className="flex justify-between items-start gap-2">
                                                                <span className={`text-lg font-black whitespace-normal break-words italic ${!isInactive ? 'text-slate-900 dark:text-white' : 'text-slate-600 dark:text-slate-400'}`}>{mDoc.name}</span>
                                                                <span className={`text-[8px] md:text-[9px] font-black px-2 py-0.5 rounded-full shadow-sm whitespace-nowrap shrink-0 ${isInactive ? 'bg-slate-100 dark:bg-slate-800 text-slate-400 dark:text-slate-500' : (TOTAL_RESOURCES - usedSwordsCount) <= 0 ? 'bg-red-50 dark:bg-red-950/30 text-red-500' : 'bg-blue-50 dark:bg-blue-950/30 text-blue-600 dark:text-blue-400'}`}>
                                                                    {isInactive ? '미참여' : `잔여: ${TOTAL_RESOURCES - usedSwordsCount}`}
                                                                </span>
                                                            </div>
                                                            <span className={`text-[9px] font-black italic tracking-widest whitespace-normal break-words ${!isInactive ? 'text-blue-500 dark:text-blue-300' : 'text-slate-400 dark:text-slate-500'}`}>
                                                                {rankingData.getPersonalStatus(mDoc.name).currentTitle.name}
                                                            </span>
                                                        </div>
                                                        <div className="space-y-4">
                                                            <div className="relative h-2 w-full bg-slate-100 dark:bg-black/30 rounded-full overflow-hidden">
                                                                <div className={`h-full ${!isInactive ? 'bg-gradient-to-r from-blue-600 to-cyan-400' : 'bg-slate-300 dark:bg-slate-700'} transition-all duration-1000`} style={{ width: `${(usedSwordsCount / TOTAL_RESOURCES) * 100}%` }}></div>
                                                            </div>
                                                            <div className={`flex flex-col gap-1 text-[10px] md:text-[11px] font-black ${!isInactive ? 'text-slate-500 dark:text-slate-400' : 'text-slate-400 dark:text-slate-500'}`}>
                                                                <div className="flex justify-between">
                                                                    <span>칼 사용</span>
                                                                    <span className={!isInactive ? 'text-slate-900 dark:text-white italic' : ''}>{(usedSwordsCount)} / {TOTAL_RESOURCES}</span>
                                                                </div>
                                                                <div className={`flex justify-between border-t pt-2 ${!isInactive ? 'text-emerald-500 border-slate-50 dark:border-slate-800' : 'text-slate-400 dark:text-slate-500 border-slate-100 dark:border-slate-800/40'}`}>
                                                                    <span>남은 시간</span>
                                                                    <span className={`italic font-mono ${!isInactive ? 'text-blue-600 dark:text-blue-400' : ''}`}>{remMin}분 {remSec}초</span>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </section>
                                </div>
                            )}

                            {mainCategory === 'raid' && (
                                <div className="space-y-6">
                                    {/* 일격 전용 서브 탭 헤더 */}
                                    <div className="flex justify-center gap-2 md:gap-4 mb-8 bg-slate-200 dark:bg-slate-800/80 p-1.5 rounded-2xl w-fit mx-auto shadow-sm overflow-x-auto no-scrollbar max-w-full">
                                        <button onClick={() => setStrikeSubTab('calc')} className={`whitespace-nowrap px-4 md:px-6 py-2.5 rounded-xl text-[10px] md:text-xs font-black transition-all flex items-center gap-2 ${strikeSubTab === 'calc' ? 'bg-white dark:bg-slate-700 text-blue-600 dark:text-blue-400 shadow-md' : 'text-slate-500 dark:text-slate-400'}`}><i className="fas fa-calculator"></i>격전지 추가 점수(격추)</button>
                                        <button onClick={() => setStrikeSubTab('distribute')} className={`whitespace-nowrap px-4 md:px-6 py-2.5 rounded-xl text-[10px] md:text-xs font-black transition-all flex items-center gap-2 ${strikeSubTab === 'distribute' ? 'bg-white dark:bg-slate-700 text-purple-600 dark:text-purple-400 shadow-md' : 'text-slate-500 dark:text-slate-400'}`}><i className="fas fa-gift"></i>격전지 분배 시스템</button>
                                        <button onClick={() => setStrikeSubTab('report')} className={`whitespace-nowrap px-4 md:px-6 py-2.5 rounded-xl text-[10px] md:text-xs font-black transition-all flex items-center gap-2 ${strikeSubTab === 'report' ? 'bg-white dark:bg-slate-700 text-emerald-600 dark:text-emerald-400 shadow-md' : 'text-slate-500 dark:text-slate-400'}`}><i className="fas fa-key"></i>일격 열쇠 보고 (기존)</button>
                                    </div>

                                    {strikeSubTab === 'calc' && (
                                        <div className="space-y-8 animate-fadeIn">
                                            <div className="dashboard-card p-6 md:p-8 space-y-8">
                                                <div>
                                                    <h2 className="text-xl font-black italic text-blue-600 dark:text-blue-400 flex items-center gap-2"><i className="fas fa-calculator"></i>격전지 추가 점수(격추)</h2>
                                                    <p className="text-xs text-slate-400 dark:text-slate-500 mt-1">본인의 제원을 관리하고 참여 길드원별 격추 수치를 토대로 공동공격 예상 결과를 실시간 산출합니다.</p>
                                                </div>

                                                {/* 내 전투 제원 (본인 전용 패널) */}
                                                <div className="p-5 md:p-6 bg-blue-50/50 dark:bg-blue-900/10 border-2 border-blue-100 dark:border-blue-900/30 rounded-2xl space-y-4">
                                                    <h3 className="text-sm font-black text-blue-800 dark:text-blue-300 flex items-center gap-2"><i className="fas fa-user-shield"></i>{nickname}님의 격추</h3>
                                                    <div className="grid grid-cols-2 md:grid-cols-5 gap-3 items-end">
                                                        <div className="col-span-2 md:col-span-1">
                                                            <label className="text-[10px] text-slate-500 dark:text-slate-400 uppercase font-black block mb-1">닉네임</label>
                                                            <input type="text" value={nickname} disabled className="w-full p-3 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 font-bold border border-transparent" />
                                                        </div>
                                                        <div className="col-span-1">
                                                            <label className="text-[10px] text-slate-500 dark:text-slate-400 uppercase font-black block mb-1">스탯 수치</label>
                                                            <input type="text" value={myStatInput} onChange={handleMyStatChange} placeholder="값 입력" className="w-full p-3 rounded-xl border-2 border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-900 dark:text-white outline-none focus:border-blue-500 font-mono font-bold" />
                                                        </div>
                                                        <div className="col-span-1">
                                                            <label className="text-[10px] text-slate-500 dark:text-slate-400 uppercase font-black block mb-1">탈것 수치</label>
                                                            <input type="text" value={myMountInput} onChange={handleMyMountChange} placeholder="값 입력" className="w-full p-3 rounded-xl border-2 border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-900 dark:text-white outline-none focus:border-blue-500 font-mono font-bold" />
                                                        </div>
                                                        <div className="col-span-2 md:col-span-1">
                                                            <label className="text-[10px] text-blue-600 dark:text-blue-400 uppercase font-black block mb-1">예상 격추</label>
                                                            <div className="w-full p-3 rounded-xl bg-blue-100 dark:bg-blue-900/40 text-blue-700 dark:text-blue-300 font-black font-mono text-center border border-blue-200 dark:border-blue-800/50">
                                                                {(() => {
                                                                    const mDoc = members.find(mem => mem.name === nickname);
                                                                    if (mDoc && mDoc.directGyeokchu && Number(mDoc.directGyeokchu) > 0) return Number(mDoc.directGyeokchu).toLocaleString();
                                                                    const s = parseInt(myStatInput, 10) || 0;
                                                                    const m = parseInt(myMountInput, 10) || 0;
                                                                    return (s > 0 || m > 0) ? ((s + 6 + m) * 10 + 1000).toLocaleString() : 0;
                                                                })()}
                                                            </div>
                                                        </div>
                                                        <div className="col-span-2 md:col-span-1">
                                                            <button onClick={handleSaveMyStats} className="w-full p-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-black shadow-lg shadow-blue-500/20 transition-all">저장</button>
                                                        </div>
                                                    </div>
                                                </div>

                                                <div className="space-y-4 pt-2 border-t border-slate-100 dark:border-slate-800">
                                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 items-end">
                                                        <div className="space-y-3 md:col-span-2">
                                                            <label className="text-[10px] text-slate-400 dark:text-slate-500 uppercase tracking-widest block font-bold">1단계: 몬스터 체력(점수) 직접 입력 <span className="text-blue-500 font-normal ml-1">(선택사항)</span></label>
                                                            <div className="flex gap-2">
                                                                <input type="number" className="flex-1 p-3.5 bg-slate-50 dark:bg-slate-900 border-2 border-slate-200 dark:border-slate-700 rounded-xl outline-none focus:border-blue-500 font-mono text-lg font-bold text-slate-900 dark:text-white" value={bossScore} onChange={e => setBossScore(e.target.value === '' ? '' : Math.max(0, Number(e.target.value)))} placeholder="값 입력 (생략 가능)" />
                                                                <button onClick={() => setBossScore('')} className="px-4 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 rounded-xl text-xs font-black hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">리셋</button>
                                                            </div>
                                                        </div>
                                                        <div className="flex flex-wrap gap-2">
                                                            <button onClick={() => setBossScore(Number(bossScore) + 100000)} className="px-3 py-2.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-lg text-[10px] font-black font-mono">+10만</button>
                                                            <button onClick={() => setBossScore(Number(bossScore) + 500000)} className="px-3 py-2.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-lg text-[10px] font-black font-mono">+50만</button>
                                                            <button onClick={() => setBossScore(Number(bossScore) + 1000000)} className="px-3 py-2.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-lg text-[10px] font-black font-mono">+100만</button>
                                                        </div>
                                                    </div>
                                                </div>

                                                <div className="space-y-4 pt-4 border-t border-slate-100 dark:border-slate-800">
                                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                                                        <div className="flex flex-col sm:flex-row items-start sm:items-center gap-3">
                                                            <div className="space-y-1">
                                                                <label className="text-[10px] text-slate-400 dark:text-slate-500 uppercase tracking-widest block font-bold">2단계: 참여 길드원 선택 ({selectedCalcMembers.length}명 지정됨)</label>
                                                                <p className="text-[10px] text-slate-400 dark:text-slate-500">타 길드원의 격추는 연산에만 사용되며, 스텟은 본인만 수정 가능합니다.</p>
                                                            </div>
                                                            {selectedCalcMembers.length > 0 && (
                                                                <button onClick={() => setSelectedCalcMembers([])} className="text-[10px] bg-red-50 text-red-500 dark:bg-red-900/30 px-3 py-1.5 rounded-lg font-bold hover:bg-red-100 transition-colors">
                                                                    전체 선택 해제
                                                                </button>
                                                            )}
                                                        </div>
                                                        <div className="relative w-full sm:w-60">
                                                            <input type="text" value={calcMemberSearch} onChange={e => setCalcMemberSearch(e.target.value)} placeholder="🔍 길드원 이름 검색" className="w-full p-2 pl-8 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-xs outline-none focus:border-blue-500 text-slate-900 dark:text-white" />
                                                            <i className="fas fa-search absolute left-3 top-3 text-[10px] text-slate-400"></i>
                                                        </div>
                                                    </div>

                                                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 max-h-[320px] overflow-y-auto pr-1 no-scrollbar bg-slate-50 dark:bg-slate-900/40 p-3 rounded-2xl border border-slate-100 dark:border-slate-800">
                                                        {filteredCalcMembers.map(m => {
                                                            const isSelected = selectedCalcMembers.includes(m.id);
                                                            const gyeokchu = getMemberGyeokchu(m);
                                                            const hasStats = gyeokchu > 0;
                                                            const isMe = m.name === nickname;
                                                            return (
                                                                <div key={m.id} className={`p-3.5 rounded-xl border-2 transition-all flex items-center justify-between gap-2 relative ${isSelected ? 'border-blue-600 bg-blue-500/10 shadow-sm' : 'border-slate-100 dark:border-slate-800 bg-white dark:bg-slate-800'} ${isMe ? 'ring-2 ring-amber-400 ring-offset-1 dark:ring-offset-slate-900' : ''}`}>
                                                                    <button type="button" onClick={() => {
                                                                        if (isSelected) {
                                                                            setSelectedCalcMembers(prev => prev.filter(id => id !== m.id));
                                                                        } else {
                                                                            setSelectedCalcMembers(prev => [...prev, m.id]);
                                                                        }
                                                                    }} className="flex-1 text-left min-w-0">
                                                                        <div className="flex items-center gap-2">
                                                                            <div className={`w-3.5 h-3.5 rounded-md border flex items-center justify-center text-[8px] text-white shrink-0 ${isSelected ? 'bg-blue-600 border-blue-600' : 'border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-950'}`}>{isSelected && '✓'}</div>
                                                                            <span className={`text-xs font-black whitespace-normal break-words ${isSelected ? 'text-blue-600 dark:text-blue-400' : 'text-slate-800 dark:text-slate-200'}`}>
                                                                                {m.name} {isMe && <span className="ml-1 text-[9px] text-amber-500">(나)</span>}
                                                                            </span>
                                                                        </div>
                                                                        <div className="text-[10px] font-bold font-mono text-slate-400 mt-1 pl-5">
                                                                            {hasStats ? `격추: ${gyeokchu.toLocaleString()}` : '격추: 미등록'}
                                                                        </div>
                                                                    </button>
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                </div>

                                                {/* 자동 연산 결과 */}
                                                <div className="space-y-4 pt-6 border-t border-slate-100 dark:border-slate-800">
                                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                                                        <h3 className="text-xs font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest flex items-center gap-2">
                                                            <i className="fas fa-poll-h text-blue-500"></i>격전지 비율 최종 결과
                                                        </h3>
