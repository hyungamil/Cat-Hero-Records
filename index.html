<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>라임길드 통합 관리 시스템</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
        
        :root {
            --brand-primary: #2563eb;
            --brand-slate: #f8fafc;
            --brand-dark: #0f172a;
        }

        body { 
            font-family: 'Noto Sans KR', 'Inter', sans-serif; 
            transition: background-color 0.2s;
            background-color: #f1f5f9; 
            letter-spacing: -0.025em;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            width: 100%;
        }

        .dark body { background-color: #020617; }

        .dashboard-card { 
            border-radius: 0.75rem; 
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
        }

        .dark .dashboard-card {
            background-color: #1e293b;
            border-color: #334155;
            color: #f1f5f9;
        }

        .nav-link {
            padding: 0.5rem 0.25rem;
            font-weight: 600;
            color: #64748b;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .nav-link.active {
            color: var(--brand-primary);
            border-bottom-color: var(--brand-primary);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        .animate-marquee { display: inline-block; animation: marquee 30s linear infinite; }

        .app-container {
            width: 100%;
            max-width: 1440px;
            margin: 0 auto;
            min-height: 100vh;
        }

        .agent-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
        }

        @media (min-width: 768px) {
            .agent-grid {
                gap: 1.25rem;
            }
        }

        @media (min-width: 1024px) {
            .desktop-layout {
                display: grid;
                grid-template-columns: 380px 1fr;
                gap: 1.5rem;
                align-items: start;
            }
        }

        .custom-modal-overlay {
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
        }

        .main-tab-active {
            background-color: var(--brand-primary);
            color: white;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
        }
    </style>
</head>
<body class="text-slate-900">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, serverTimestamp, deleteDoc, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCOt_5hYk7Y9EDwo1Cd55et5-JT6k7LIcc",
            authDomain: "cat-hero-record.firebaseapp.com",
            projectId: "cat-hero-record",
            storageBucket: "cat-hero-record.firebasestorage.app",
            messagingSenderId: "1059204432454",
            appId: "1:1059204432454:web:b365ddd7d6a3da2c624047"
        };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'cat-hero-v24-final';
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const { useState, useEffect, useMemo } = React;

        const islands = [
            { name: '해적', icon: 'fa-anchor' },
            { name: '늑대', icon: 'fa-paw' },
            { name: '고양이', icon: 'fa-cat' },
            { name: '음식', icon: 'fa-utensils' },
        ];

        const mobs = ['일반몹', '보스'];
        const TOTAL_RESOURCES = 20; 
        const INITIAL_MEMBERS = ["늑대벼리", "마자유", "고기쟁이", "김동순", "일민", "캣핑", "콘스", "하늘구름바다", "창식2", "나는도비", "노들노들", "포저", "라잌늑냥", "베리발", "장귝", "유나s"];

        function App() {
            // -- 상태 관리 --
            const [user, setUser] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);
            const [nickname, setNickname] = useState(localStorage.getItem('cat_hero_nickname') || '');
            const [isNameSet, setIsNameSet] = useState(!!localStorage.getItem('cat_hero_nickname'));
            const [isAdminMode, setIsAdminMode] = useState(false);
            const [adminPass, setAdminPass] = useState("");
            const [showAdminEntry, setShowAdminEntry] = useState(false);
            const [isDarkMode, setIsDarkMode] = useState(localStorage.getItem('isDarkMode') === 'true');
            
            const [mainCategory, setMainCategory] = useState('conquest');
            const [activeMenu, setActiveMenu] = useState('record');
            
            const [selectedIsland, setSelectedIsland] = useState('해적');
            const [selectedMob, setSelectedMob] = useState('일반몹');
            const [playMin, setPlayMin] = useState(0);
            const [playSec, setPlaySec] = useState(0);
            
            const [logs, setLogs] = useState([]);
            const [raidLogs, setRaidLogs] = useState([]);
            const [members, setMembers] = useState([]);
            const [notice, setNotice] = useState("시스템이 정상 작동 중입니다.");
            const [newNotice, setNewNotice] = useState("");
            const [newMemberName, setNewMemberName] = useState("");
            const [timeLeftStr, setTimeLeftStr] = useState("");

            const [uiAlert, setUiAlert] = useState(null);
            const [uiConfirm, setUiConfirm] = useState(null);

            const showAlert = (msg, type = 'success') => setUiAlert({ message: msg, type });
            const closeAlert = () => setUiAlert(null);

            useEffect(() => {
                if (isDarkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
                localStorage.setItem('isDarkMode', isDarkMode);
            }, [isDarkMode]);

            useEffect(() => {
                const updateTimer = () => {
                    const now = new Date();
                    const day = now.getDay();
                    let target = new Date();
                    target.setHours(8, 45, 0, 0);
                    const daysUntilMonday = (1 + 7 - day) % 7 || 7;
                    target.setDate(now.getDate() + daysUntilMonday);
                    const diff = target - now;
                    if (diff <= 0) setTimeLeftStr("시즌 종료");
                    else {
                        const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                        const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
                        const m = Math.floor((diff / (1000 * 60)) % 60);
                        const s = Math.floor((diff / 1000) % 60);
                        setTimeLeftStr(`${d}일 ${h}:${m}:${s}`);
                    }
                };
                const timerId = setInterval(updateTimer, 1000);
                updateTimer();
                return () => clearInterval(timerId);
            }, []);

            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            try {
                                await signInWithCustomToken(auth, __initial_auth_token);
                            } catch (e) { await signInAnonymously(auth); }
                        } else { await signInAnonymously(auth); }
                    } catch (error) {
                        if (error.code === 'auth/configuration-not-found') {
                            showAlert("익명 로그인 활성화가 필요합니다.", "error");
                        }
                    } finally { setAuthLoading(false); }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    setUser(u);
                    if (u) setAuthLoading(false);
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user || authLoading) return;
                const unsubMembers = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'members_v24'), (snapshot) => {
                    if (snapshot.empty) {
                        INITIAL_MEMBERS.forEach(name => addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'members_v24'), { name }));
                    } else {
                        const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        setMembers(data.sort((a, b) => a.name.localeCompare(b.name)));
                    }
                });
                const unsubLogs = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'conquest_logs_v24'), (snapshot) => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setLogs(data.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0)));
                });
                const unsubRaidLogs = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'raid_logs_v24'), (snapshot) => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setRaidLogs(data);
                });
                const unsubSettings = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'global'), (snapshot) => {
                    if (snapshot.exists()) {
                        const s = snapshot.data();
                        setNotice(s.notice || "");
                        setNewNotice(s.notice || "");
                    }
                });
                return () => { unsubMembers(); unsubLogs(); unsubRaidLogs(); unsubSettings(); };
            }, [user, authLoading]);

            // -- 통계 로직 --
            const stats = useMemo(() => {
                const playerMap = {};
                members.forEach(m => playerMap[m.name] = { swords: 0, timeSec: 0, participated: false, raidKeysToday: 0, raidKeysMonth: 0 });
                
                logs.forEach(log => {
                    if (playerMap[log.nickname]) {
                        playerMap[log.nickname].swords += 1;
                        playerMap[log.nickname].timeSec += (Number(log.playMin || 0) * 60 + Number(log.playSec || 0));
                        playerMap[log.nickname].participated = true;
                    }
                });

                const now = new Date();
                const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);

                raidLogs.forEach(log => {
                    if (playerMap[log.nickname]) {
                        const logDate = log.timestamp?.seconds ? new Date(log.timestamp.seconds * 1000) : new Date();
                        const keys = Number(log.keysUsed || 0);
                        
                        if (logDate >= todayStart) playerMap[log.nickname].raidKeysToday += keys;
                        if (logDate >= monthStart) playerMap[log.nickname].raidKeysMonth += keys;
                    }
                });

                const ranking = Object.entries(playerMap)
                    .filter(([_, data]) => data.participated)
                    .sort((a, b) => b[1].swords - a[1].swords || b[1].timeSec - a[1].timeSec);
                return { playerMap, myRank: ranking.findIndex(r => r[0] === nickname) + 1 };
            }, [logs, raidLogs, members, nickname]);

            const handleResetSession = () => {
                setUiConfirm({
                    message: "요원 정보를 초기화하고 이름 선택 화면으로 돌아가시겠습니까?",
                    onConfirm: () => {
                        localStorage.removeItem('cat_hero_nickname');
                        setNickname('');
                        setIsNameSet(false);
                        window.location.reload();
                    }
                });
            };

            const handleSubmitConquest = async (e) => {
                e.preventDefault();
                if (!user) return;
                if (!nickname) { showAlert("사용자 정보가 없습니다.", "error"); return; }
                if (stats.playerMap[nickname]?.swords >= TOTAL_RESOURCES) { showAlert("보고 횟수를 모두 소진했습니다.", "error"); return; }
                if (playMin === 0 && playSec === 0) { showAlert("수행 시간을 입력해 주세요.", "error"); return; }

                try {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'conquest_logs_v24'), {
                        nickname, island: selectedIsland, mob: selectedMob,
                        playMin: Number(playMin), playSec: Number(playSec),
                        timestamp: serverTimestamp(), uid: user.uid
                    });
                    setPlayMin(0); setPlaySec(0);
                    showAlert("기록이 제출되었습니다.");
                } catch (err) { showAlert("보고 실패: " + err.message, "error"); }
            };

            const handleSubmitRaid = async (keys) => {
                if (!user) return;
                try {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'raid_logs_v24'), {
                        nickname, keysUsed: keys,
                        timestamp: serverTimestamp(), uid: user.uid
                    });
                    showAlert(`열쇠 ${keys}개 소모 보고 완료!`);
                } catch (err) { showAlert("보고 실패: " + err.message, "error"); }
            };

            // 레이드 수치 줄이기 (마지막 로그 삭제)
            const handleReduceRaid = async () => {
                if (!user) return;
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const myTodayLogs = raidLogs
                    .filter(l => l.nickname === nickname)
                    .filter(l => (l.timestamp?.seconds ? new Date(l.timestamp.seconds * 1000) : new Date()) >= today)
                    .sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));

                if (myTodayLogs.length > 0) {
                    try {
                        await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'raid_logs_v24', myTodayLogs[0].id));
                        showAlert("마지막 레이드 보고를 취소했습니다.");
                    } catch (err) { showAlert("오류가 발생했습니다.", "error"); }
                } else {
                    showAlert("오늘 보고한 내역이 없습니다.", "error");
                }
            };

            // 오늘 레이드 내역 전체 초기화
            const handleResetRaid = async () => {
                if (!user) return;
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const myTodayLogs = raidLogs
                    .filter(l => l.nickname === nickname)
                    .filter(l => (l.timestamp?.seconds ? new Date(l.timestamp.seconds * 1000) : new Date()) >= today);

                if (myTodayLogs.length === 0) return showAlert("오늘 기록된 내역이 없습니다.", "error");

                setUiConfirm({
                    message: "오늘 보고한 모든 레이드 기록을 초기화하시겠습니까?",
                    onConfirm: async () => {
                        try {
                            for (const log of myTodayLogs) {
                                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'raid_logs_v24', log.id));
                            }
                            showAlert("오늘의 레이드 기록이 초기화되었습니다.");
                        } catch (err) { showAlert("오류가 발생했습니다.", "error"); }
                    }
                });
            };

            const handleDeleteLog = (logId, type = 'conquest') => {
                const colName = type === 'conquest' ? 'conquest_logs_v24' : 'raid_logs_v24';
                setUiConfirm({
                    message: "해당 기록을 영구 삭제하시겠습니까?",
                    onConfirm: async () => {
                        try {
                            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', colName, logId));
                            showAlert("삭제되었습니다.");
                        } catch (err) { showAlert("삭제 중 오류가 발생했습니다.", "error"); }
                    }
                });
            };

            const adjustTime = (type, val) => {
                if (type === 'min') setPlayMin(p => Math.max(0, p + val));
                else {
                    setPlaySec(p => {
                        let n = p + val;
                        if (n >= 60) { setPlayMin(m => m + 1); return n - 60; }
                        if (n < 0 && playMin > 0) { setPlayMin(m => m - 1); return n + 60; }
                        return Math.max(0, Math.min(59, n));
                    });
                }
            };

            if (!isNameSet && !isAdminMode) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-slate-200">
                        <div className="dashboard-card p-8 md:p-12 w-full max-w-sm text-center shadow-2xl border-t-8 border-blue-600 animate-fadeIn">
                            <h1 className="text-2xl font-black tracking-tight mb-1 text-blue-600 italic uppercase">라임길드 요원 인증</h1>
                            <p className="text-[10px] text-slate-400 mb-10 font-bold uppercase tracking-widest text-center">통합 관리 시스템</p>
                            <div className="space-y-6">
                                <div className="text-left">
                                    <label className="text-[11px] font-black text-slate-500 uppercase ml-1 mb-2 block">요원 선택</label>
                                    <select className="w-full p-4 bg-slate-50 text-sm font-bold border-2 border-slate-200 focus:border-blue-500 outline-none rounded-xl" 
                                        value={nickname} onChange={e => setNickname(e.target.value)}>
                                        <option value="">본인 성명을 선택하세요</option>
                                        {members.map(m => <option key={m.id} value={m.name}>{m.name}</option>)}
                                    </select>
                                </div>
                                <button onClick={() => { if(nickname) { localStorage.setItem('cat_hero_nickname', nickname); setIsNameSet(true); } else { showAlert("이름을 선택해 주세요.", "error"); }}} 
                                    className="w-full bg-blue-600 text-white font-black py-4 rounded-xl shadow-lg hover:bg-blue-700 transition-all transform active:scale-95">상황실 접속</button>
                                <button onClick={() => setShowAdminEntry(true)} className="text-[10px] text-slate-400 hover:text-slate-600 uppercase font-bold">관리자 전용</button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="app-container">
                    <div className="bg-blue-600 text-white h-11 flex items-center relative overflow-hidden border-b-2 border-blue-700 shadow-md">
                        <div className="px-3 md:px-5 bg-slate-900 font-black h-full flex items-center z-20 skew-x-[-15deg] -ml-3 text-white border-r-4 border-blue-500">
                            <span className="skew-x-[15deg] flex items-center gap-1.5 text-xs md:text-sm whitespace-nowrap">
                                <i className="fas fa-bullhorn text-yellow-400"></i> 중요 공지
                            </span>
                        </div>
                        <div className="animate-marquee whitespace-nowrap font-bold text-sm md:text-base opacity-100 tracking-wide pl-6 z-10">
                            {notice} &nbsp;&nbsp;&nbsp; {notice} &nbsp;&nbsp;&nbsp; {notice}
                        </div>
                        <div className="absolute right-0 top-0 bottom-0 w-24 bg-gradient-to-l from-blue-600 to-transparent z-20"></div>
                    </div>

                    <header className="bg-white dark:bg-slate-900 p-4 md:p-6 border-b-2 border-slate-200 dark:border-slate-700 sticky top-0 z-30 shadow-sm text-slate-900 dark:text-white">
                        <div className="flex flex-wrap justify-between items-center gap-4">
                            <div className="flex items-center gap-3 md:gap-5">
                                <button onClick={handleResetSession} className="flex flex-col items-center justify-center w-10 h-10 md:w-12 md:h-12 bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-500 hover:text-red-500 transition-all shadow-sm">
                                    <i className="fas fa-sync-alt text-xs md:text-sm mb-0.5 md:mb-1"></i>
                                    <span className="text-[7px] md:text-[8px] font-black uppercase tracking-tighter">초기화</span>
                                </button>
                                <div>
                                    <div className="flex items-center gap-2 md:gap-3">
                                        <button onClick={() => setMainCategory('conquest')} className={`px-3 md:px-5 py-1.5 rounded-lg text-xs md:text-sm font-black transition-all ${mainCategory === 'conquest' ? 'main-tab-active' : 'bg-slate-50 dark:bg-slate-800 text-slate-400 hover:text-slate-600'}`}>균격 관리</button>
                                        <button onClick={() => setMainCategory('raid')} className={`px-3 md:px-5 py-1.5 rounded-lg text-xs md:text-sm font-black transition-all ${mainCategory === 'raid' ? 'main-tab-active' : 'bg-slate-50 dark:bg-slate-800 text-slate-400 hover:text-slate-600'}`}>길드 레이드</button>
                                    </div>
                                    <div className="flex items-center gap-2 mt-2">
                                        <span className="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span>
                                        <span className="text-[9px] md:text-[10px] font-bold text-slate-400 uppercase tracking-tighter font-bold">인증 요원: <span className="text-blue-600 font-black">{nickname}</span></span>
                                    </div>
                                </div>
                            </div>
                            
                            <div className="flex items-center gap-2 md:gap-4 ml-auto">
                                <div className="bg-slate-900 text-white px-3 py-2 md:px-6 md:py-2 rounded-xl border border-slate-700 text-center min-w-[100px] md:min-w-[150px] shadow-lg">
                                    <div className="text-[7px] md:text-[8px] text-slate-500 font-black uppercase tracking-widest">남은 시간</div>
                                    <div className="text-xs md:text-sm font-black tracking-widest font-mono text-yellow-400">{timeLeftStr}</div>
                                </div>
                                <button onClick={() => setIsDarkMode(!isDarkMode)} className="w-10 h-10 border border-slate-200 dark:border-slate-700 rounded-xl flex items-center justify-center dark:text-white hover:bg-slate-50 transition-colors shadow-sm">
                                    <i className={`fas ${isDarkMode ? 'fa-sun' : 'fa-moon'}`}></i>
                                </button>
                            </div>
                        </div>
                        {mainCategory === 'conquest' && (
                            <nav className="flex gap-6 md:gap-10 mt-4 md:mt-6 text-[11px] md:text-[12px] lg:hidden overflow-x-auto no-scrollbar whitespace-nowrap">
                                <button onClick={() => setActiveMenu('record')} className={`nav-link ${activeMenu === 'record' ? 'active' : ''}`}>내역 보고</button>
                                <button onClick={() => setActiveMenu('status')} className={`nav-link ${activeMenu === 'status' ? 'active' : ''}`}>참여 지표</button>
                                <button onClick={() => setActiveMenu('logs')} className={`nav-link ${activeMenu === 'logs' ? 'active' : ''}`}>활동 로그</button>
                            </nav>
                        )}
                    </header>

                    <main className="p-4 md:p-6 pb-24">
                        {mainCategory === 'conquest' ? (
                            <div className="desktop-layout">
                                <section className={`${activeMenu === 'record' ? 'block' : 'hidden lg:block'} space-y-6`}>
                                    <form onSubmit={handleSubmitConquest} className="dashboard-card p-6 md:p-8 space-y-8 shadow-xl border-t-4 border-blue-600 lg:sticky lg:top-[140px] text-slate-900 dark:text-white">
                                        <div className="flex justify-between items-center border-b pb-4 dark:border-slate-700 font-bold">
                                            <h2 className="font-black text-slate-800 dark:text-white flex items-center gap-3 uppercase tracking-tighter text-sm md:text-base">
                                                <i className="fas fa-shield-alt text-blue-500"></i> 균격 작전 보고
                                            </h2>
                                            <span className="text-[9px] font-black text-slate-400 bg-slate-100 dark:bg-slate-800 px-2 py-1 rounded text-center">라임 전용</span>
                                        </div>
                                        <div className="space-y-4">
                                            <label className="text-[10px] md:text-[11px] font-black text-slate-400 uppercase tracking-widest font-bold">01. 거점 선택</label>
                                            <div className="grid grid-cols-2 gap-3">
                                                {islands.map(i => (
                                                    <button key={i.name} type="button" onClick={() => setSelectedIsland(i.name)} 
                                                        className={`p-3 md:p-4 rounded-xl border-2 flex flex-col items-center gap-2 transition-all ${selectedIsland === i.name ? 'border-blue-500 bg-blue-50 dark:bg-blue-900/30 text-blue-600 shadow-md scale-[1.02]' : 'border-slate-50 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50 text-slate-400 hover:border-slate-200'}`}>
                                                        <i className={`fas ${i.icon} text-base md:text-lg`}></i>
                                                        <span className="font-black text-[10px] md:text-[11px] uppercase text-center">{i.name}</span>
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                        <div className="space-y-4">
                                            <label className="text-[10px] md:text-[11px] font-black text-slate-400 uppercase tracking-widest font-bold">02. 목표 등급</label>
                                            <div className="grid grid-cols-2 gap-3">
                                                {mobs.map(m => (
                                                    <button key={m} type="button" onClick={() => setSelectedMob(m)} 
                                                        className={`py-3 rounded-lg border-2 text-[10px] font-black uppercase transition-all ${selectedMob === m ? 'bg-slate-800 border-slate-800 text-white scale-[1.02]' : 'bg-white dark:bg-slate-800 border-slate-100 dark:border-slate-700 text-slate-400 shadow-sm'}`}>
                                                        {m}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                        <div className="space-y-4 font-bold">
                                            <label className="text-[10px] md:text-[11px] font-black text-slate-400 uppercase tracking-widest">03. 소요 시간 기록</label>
                                            <div className="bg-slate-900 rounded-2xl p-6 md:p-8 text-center shadow-inner border border-slate-800">
                                                <div className="text-4xl md:text-5xl font-mono font-black text-white mb-6 md:mb-8 tracking-widest flex justify-center items-center font-bold">
                                                    {String(playMin).padStart(2, '0')}<span className="text-blue-500 mx-1">:</span>{String(playSec).padStart(2, '0')}
                                                </div>
                                                <div className="grid grid-cols-3 gap-2 text-center text-white">
                                                    {[1, 10, 1].map((v, i) => (
                                                        <button key={i} type="button" onClick={() => adjustTime(i===0?'min':'sec', v)} className="bg-white/10 py-3 rounded-lg text-[9px] md:text-[10px] font-black hover:bg-white/20 transition-all font-bold">+{v}{i===0?'분':'초'}</button>
                                                    ))}
                                                    {[-1, -10, -1].map((v, i) => (
                                                        <button key={i} type="button" onClick={() => adjustTime(i===0?'min':'sec', v)} className="bg-white/5 text-red-400 py-3 rounded-lg text-[9px] md:text-[10px] font-black hover:bg-white/10 transition-all font-bold">{v}{i===0?'분':'초'}</button>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                        <button type="submit" className="w-full bg-blue-600 text-white py-4 md:py-5 rounded-xl font-black text-base md:text-lg shadow-xl hover:bg-blue-700 active:scale-95 transition-all border-b-4 border-blue-800 uppercase tracking-widest">보고 완료</button>
                                    </form>
                                </section>

                                <div className="space-y-8 font-bold">
                                    <section className={`${activeMenu === 'status' ? 'block' : 'hidden lg:block'} animate-fadeIn`}>
                                        <div className="flex justify-between items-center mb-6 px-2 text-center text-slate-900 dark:text-white">
                                            <h3 className="font-black text-slate-800 dark:text-white uppercase flex items-center gap-2 text-sm md:text-base font-bold">
                                                <i className="fas fa-chart-bar text-blue-500"></i> 요원 참여 지표 (전체 인원)
                                            </h3>
                                            <span className="text-[9px] md:text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-tighter">{members.length} 요원 실시간</span>
                                        </div>
                                        <div className="agent-grid">
                                            {members.map(mDoc => {
                                                const st = stats.playerMap[mDoc.name];
                                                const remS = TOTAL_RESOURCES - (st.swords || 0);
                                                return (
                                                    <div key={mDoc.id} className={`dashboard-card p-4 md:p-6 transition-all border-l-4 md:border-l-8 ${st.participated ? 'border-l-blue-500 shadow-md' : 'opacity-40 grayscale border-l-slate-300'} hover:scale-[1.02] overflow-hidden`}>
                                                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 md:mb-5 gap-1 font-bold">
                                                            <span className="text-base md:text-xl font-black dark:text-white truncate max-w-full">{mDoc.name}</span>
                                                            <span className={`text-[8px] md:text-xs font-black px-2 md:px-3 py-0.5 md:py-1 rounded-full shadow-sm whitespace-nowrap ${remS <= 0 ? 'bg-red-100 text-red-600' : 'bg-blue-100 text-blue-600'}`}>잔여: {remS}</span>
                                                        </div>
                                                        <div className="space-y-3 font-bold text-slate-900 dark:text-white">
                                                            <div className="h-2.5 w-full bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden border border-slate-200 dark:border-slate-700">
                                                                <div className="h-full bg-blue-500 transition-all duration-1000 shadow-[0_0_8px_rgba(37,99,235,0.4)]" style={{ width: `${((st.swords || 0)/20)*100}%` }}></div>
                                                            </div>
                                                            <div className="flex justify-between items-center font-black font-bold">
                                                                <div className="flex flex-col">
                                                                    <span className="text-[8px] md:text-[10px] text-slate-400 uppercase tracking-tighter">참여</span>
                                                                    <span className="text-xs md:text-sm dark:text-slate-200 font-black">{(st.swords || 0)}/20회</span>
                                                                </div>
                                                                <div className="flex flex-col items-end text-right border-l pl-3 md:pl-4 border-slate-200 dark:border-slate-700 font-bold">
                                                                    <span className="text-[8px] md:text-[10px] text-slate-400 uppercase tracking-tighter">누적 시간</span>
                                                                    <span className="text-xs md:text-sm text-blue-600 dark:text-blue-400 font-black whitespace-nowrap font-bold">{Math.floor((st.timeSec || 0)/60)}분 {(st.timeSec || 0)%60}초</span>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </section>
                                    
                                    <section className={`${activeMenu === 'logs' ? 'block' : 'hidden lg:block'} animate-fadeIn`}>
                                        <div className="dashboard-card overflow-hidden border-t-4 border-slate-800 shadow-xl">
                                            <div className="p-4 border-b bg-slate-50 dark:bg-slate-800/50 flex justify-between items-center text-center font-bold">
                                                <h3 className="text-xs font-black dark:text-white uppercase tracking-widest font-bold">상세 기록 이력</h3>
                                                <span className="text-[8px] font-bold text-blue-500 animate-pulse tracking-tighter uppercase font-black">Live Data Sync</span>
                                            </div>
                                            <div className="overflow-x-auto max-h-[600px] overflow-y-auto no-scrollbar font-bold text-slate-900 dark:text-white">
                                                <table className="w-full text-[10px] md:text-[11px] text-left">
                                                    <thead className="bg-slate-50 dark:bg-slate-800 text-slate-400 uppercase font-black sticky top-0 z-10 shadow-sm border-b font-bold">
                                                        <tr>
                                                            <th className="px-4 py-4 text-center">시간</th>
                                                            <th className="px-4 py-4 text-center">요원</th>
                                                            <th className="px-4 py-4 text-center">거점</th>
                                                            <th className="px-4 py-4 text-center text-blue-600">수행</th>
                                                            <th className="px-4 py-4 text-right">관리</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y dark:divide-slate-700 text-center dark:text-white font-bold">
                                                        {logs.map(l => (
                                                            <tr key={l.id} className="hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
                                                                <td className="px-4 py-4 text-slate-400 font-bold whitespace-nowrap font-bold">
                                                                    {l.timestamp ? new Date(l.timestamp.seconds * 1000).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) : "-"}
                                                                </td>
                                                                <td className="px-4 py-4 font-black whitespace-nowrap">{l.nickname}</td>
                                                                <td className="px-4 py-4 font-bold whitespace-nowrap text-slate-500 dark:text-slate-400">
                                                                    {l.island} <span className="text-[8px] px-1 bg-slate-100 dark:bg-slate-700 rounded uppercase font-black">{l.mob}</span>
                                                                </td>
                                                                <td className="px-4 py-4 font-mono font-black text-blue-600 dark:text-blue-400 italic whitespace-nowrap">{l.playMin}m {l.playSec}s</td>
                                                                <td className="px-4 py-4 text-right">
                                                                    {user && (l.uid === user.uid || isAdminMode) && (
                                                                        <button onClick={() => handleDeleteLog(l.id)} className="text-red-400 hover:text-red-600 p-2 bg-red-50 dark:bg-red-900/10 rounded-lg transition-all shadow-sm">
                                                                            <i className="fas fa-trash-alt"></i>
                                                                        </button>
                                                                    )}
                                                                </td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </section>
                                </div>
                            </div>
                        ) : (
                            /* 길드 레이드 영역 (수정됨: 줄이기/초기화 버튼 추가) */
                            <div className="desktop-layout">
                                <section className="space-y-6">
                                    <div className="dashboard-card p-6 md:p-8 space-y-8 shadow-xl border-t-4 border-emerald-500 lg:sticky lg:top-[140px] text-slate-900 dark:text-white">
                                        <div className="flex justify-between items-center border-b pb-4 dark:border-slate-700 font-bold">
                                            <h2 className="font-black text-slate-800 dark:text-white flex items-center gap-3 uppercase tracking-tighter text-sm md:text-base font-bold">
                                                <i className="fas fa-dragon text-emerald-500"></i> 레이드 소모 보고
                                            </h2>
                                            <span className="text-[9px] font-black text-slate-400 bg-slate-100 dark:bg-slate-800 px-2 py-1 rounded text-center">정밀 트래킹</span>
                                        </div>
                                        <div className="p-4 md:p-6 bg-slate-50 dark:bg-slate-800/50 rounded-2xl text-center space-y-6 md:space-y-8">
                                            <div className="text-sm font-bold text-slate-500 dark:text-slate-400 leading-relaxed font-bold">
                                                레이드 전투 완료 시마다 버튼을 누르세요.<br/>
                                                <span className="text-[10px] text-red-500 font-black mt-2 block bg-red-50 dark:bg-red-900/30 py-1.5 rounded-full uppercase tracking-tighter">※ 하루 2개 지급 / 최대 6개 보관 가능</span>
                                            </div>
                                            
                                            {/* 메인 보고 버튼 */}
                                            <button 
                                                onClick={() => handleSubmitRaid(1)} 
                                                className="w-full bg-emerald-600 text-white border-b-8 border-emerald-800 py-6 md:py-8 rounded-[1.5rem] md:rounded-[2rem] font-black text-xl md:text-2xl shadow-xl hover:bg-emerald-500 active:scale-95 active:border-b-0 active:translate-y-1 transition-all flex flex-col items-center justify-center gap-2"
                                            >
                                                <i className="fas fa-key text-yellow-300 text-2xl md:text-3xl"></i>
                                                열쇠 1개 사용 보고
                                            </button>
                                            
                                            {/* 실수 방지용 줄이기/초기화 버튼 추가 */}
                                            <div className="flex gap-3 font-bold">
                                                <button 
                                                    onClick={handleReduceRaid}
                                                    className="flex-1 bg-white dark:bg-slate-700 text-red-500 border-2 border-red-100 dark:border-red-900/30 py-3 rounded-xl font-black text-xs md:text-sm hover:bg-red-50 transition-all flex items-center justify-center gap-2"
                                                >
                                                    <i className="fas fa-minus-circle"></i> 취소 (-1)
                                                </button>
                                                <button 
                                                    onClick={handleResetRaid}
                                                    className="flex-1 bg-slate-800 text-slate-300 py-3 rounded-xl font-black text-xs md:text-sm hover:bg-slate-900 transition-all flex items-center justify-center gap-2 shadow-lg"
                                                >
                                                    <i className="fas fa-trash-can"></i> 전체 초기화
                                                </button>
                                            </div>
                                        </div>
                                        
                                        <div className="dashboard-card p-5 bg-blue-50 dark:bg-blue-900/10 border-blue-100 dark:border-blue-900/50 font-bold">
                                            <div className="flex justify-between items-center font-black text-blue-600 dark:text-blue-400">
                                                <span className="text-xs uppercase tracking-widest font-bold">오늘 나의 총 소모량</span>
                                                <span className="text-2xl font-mono font-bold">{stats.playerMap[nickname]?.raidKeysToday || 0}</span>
                                            </div>
                                        </div>
                                    </div>
                                </section>

                                <section className="space-y-6 animate-fadeIn font-bold">
                                    <div className="flex justify-between items-center mb-6 px-2 text-center text-slate-900 dark:text-white">
                                        <h3 className="font-black text-slate-800 dark:text-white uppercase flex items-center gap-2 text-sm md:text-base font-bold">
                                            <i className="fas fa-key text-yellow-500"></i> 요원별 레이드 현황 (전원 필수)
                                        </h3>
                                        <span className="text-[9px] md:text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-tighter font-bold">Real-time Stats</span>
                                    </div>
                                    <div className="agent-grid">
                                        {members.map(mDoc => {
                                            const st = stats.playerMap[mDoc.name];
                                            const usedToday = st.raidKeysToday || 0;
                                            const usedMonth = st.raidKeysMonth || 0;
                                            return (
                                                <div key={mDoc.id} className={`dashboard-card p-6 transition-all border-l-8 ${usedToday > 0 ? 'border-l-emerald-500 shadow-md' : 'opacity-40 grayscale border-l-slate-300'} hover:scale-[1.02] overflow-hidden`}>
                                                    <div className="flex justify-between items-center mb-4 font-bold">
                                                        <span className="text-base md:text-xl font-black dark:text-white truncate pr-1">{mDoc.name}</span>
                                                        <span className={`text-[10px] font-black px-2 py-0.5 rounded-full ${usedToday >= 2 ? 'bg-emerald-100 text-emerald-600' : 'bg-slate-100 text-slate-500'}`}>
                                                            {usedToday >= 2 ? '목표 달성' : '진행 중'}
                                                        </span>
                                                    </div>
                                                    
                                                    <div className="grid grid-cols-2 gap-2 mb-4 font-bold">
                                                        <div className="bg-slate-50 dark:bg-slate-900/40 p-3 rounded-xl text-center border border-slate-100 dark:border-slate-700">
                                                            <div className="text-[8px] text-slate-400 font-black uppercase mb-1">오늘 소모</div>
                                                            <div className="text-xl font-black text-slate-700 dark:text-white font-bold">{usedToday}</div>
                                                        </div>
                                                        <div className="bg-emerald-50 dark:bg-emerald-900/20 p-3 rounded-xl text-center border border-emerald-100 dark:border-emerald-800">
                                                            <div className="text-[8px] text-emerald-400 font-black uppercase mb-1">이번 달 누적</div>
                                                            <div className="text-xl font-black text-emerald-600 dark:text-emerald-400 font-bold">{usedMonth}</div>
                                                        </div>
                                                    </div>

                                                    <div className="w-full bg-slate-200 dark:bg-slate-800 h-1.5 rounded-full overflow-hidden">
                                                        <div className="h-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.5)] transition-all duration-1000" style={{width: `${Math.min(100, (usedMonth/60)*100)}%`}}></div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </section>
                            </div>
                        )}
                    </main>

                    {/* 하단 통합 지표 바 */}
                    <div className="fixed bottom-4 md:bottom-6 left-1/2 -translate-x-1/2 w-[92%] md:w-full md:max-w-2xl px-2 md:px-4 z-50 animate-fadeIn font-bold">
                        <div className="bg-slate-900/95 backdrop-blur-md text-white px-4 py-3 md:px-10 md:py-5 rounded-2xl flex justify-between items-center shadow-2xl border border-white/10 ring-1 ring-white/10">
                            <div className="flex flex-col">
                                <span className="text-[7px] md:text-[9px] text-blue-400 font-black uppercase tracking-[0.1em] mb-0.5 md:mb-1">Authenticated</span>
                                <span className="text-sm md:text-xl font-black truncate max-w-[80px] md:max-w-none">{nickname}</span>
                            </div>
                            <div className="h-8 md:h-10 w-px bg-slate-700"></div>
                            {mainCategory === 'conquest' ? (
                                <>
                                    <div className="flex flex-col text-center">
                                        <span className="text-[7px] md:text-[9px] text-indigo-400 font-black uppercase tracking-[0.1em] mb-0.5 md:mb-1 font-bold">균격 참여</span>
                                        <span className="text-sm md:text-xl font-black">{stats.playerMap[nickname]?.swords || 0} <span className="text-slate-500 font-bold text-[10px] md:text-xs">/ 20</span></span>
                                    </div>
                                    <div className="h-8 md:h-10 w-px bg-slate-700"></div>
                                    <div className="flex flex-col text-center font-bold">
                                        <span className="text-[7px] md:text-[9px] text-emerald-400 font-black uppercase tracking-[0.1em] mb-0.5 md:mb-1">성과 순위</span>
                                        <span className="text-sm md:text-xl font-black italic">{stats.myRank > 0 ? stats.myRank : "--"}위</span>
                                    </div>
                                </>
                            ) : (
                                <>
                                    <div className="flex flex-col text-center font-bold">
                                        <span className="text-[7px] md:text-[9px] text-emerald-400 font-black uppercase tracking-[0.1em] mb-0.5 md:mb-1">오늘 소모</span>
                                        <span className="text-sm md:text-xl font-black">{stats.playerMap[nickname]?.raidKeysToday || 0}개</span>
                                    </div>
                                    <div className="h-8 md:h-10 w-px bg-slate-700"></div>
                                    <div className="flex flex-col text-center font-bold">
                                        <span className="text-[7px] md:text-[9px] text-yellow-400 font-black uppercase tracking-[0.1em] mb-0.5 md:mb-1">월간 누적</span>
                                        <span className="text-sm md:text-xl font-black text-emerald-400">{stats.playerMap[nickname]?.raidKeysMonth || 0}개</span>
                                    </div>
                                </>
                            )}
                            <button onClick={handleResetSession} className="bg-slate-800 hover:bg-red-600 text-white px-3 py-2 md:px-6 md:py-3 rounded-xl text-[8px] md:text-[10px] font-black uppercase transition-all shadow-lg border border-slate-700 active:scale-95 text-center ml-2">
                                변경
                            </button>
                        </div>
                    </div>

                    {/* 시스템 모달 */}
                    {uiAlert && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 custom-modal-overlay animate-fadeIn text-slate-900">
                            <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl p-8 max-w-sm w-full text-center border-t-4 border-blue-500">
                                <div className={`w-12 h-12 md:w-16 md:h-16 rounded-full flex items-center justify-center mx-auto mb-6 ${uiAlert.type === 'error' ? 'bg-red-50 text-red-500' : 'bg-green-50 text-green-500'}`}>
                                    <i className={`fas ${uiAlert.type === 'error' ? 'fa-times-circle' : 'fa-check-circle'} text-3xl`}></i>
                                </div>
                                <h3 className="text-lg font-black mb-2 dark:text-white uppercase tracking-tighter font-bold">시스템 안내</h3>
                                <p className="text-slate-600 dark:text-slate-400 mb-8 font-bold leading-relaxed">{uiAlert.message}</p>
                                <button onClick={closeAlert} className="w-full bg-slate-900 text-white py-3 rounded-xl font-black uppercase shadow-lg active:scale-95 transition-all tracking-widest text-sm md:text-base">확인</button>
                            </div>
                        </div>
                    )}

                    {uiConfirm && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 custom-modal-overlay animate-fadeIn text-slate-900">
                            <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl p-8 max-w-sm w-full text-center border-t-4 border-red-500 font-bold">
                                <div className="w-12 h-12 md:w-16 md:h-16 rounded-full bg-red-50 text-red-500 flex items-center justify-center mx-auto mb-4 md:mb-6">
                                    <i className="fas fa-exclamation-triangle text-2xl md:text-3xl"></i>
                                </div>
                                <h3 className="text-base md:text-lg font-black mb-2 dark:text-white uppercase tracking-tighter font-bold">실행 확인</h3>
                                <p className="text-slate-600 dark:text-slate-400 mb-8 font-bold leading-relaxed">{uiConfirm.message}</p>
                                <div className="flex gap-2 text-center font-bold">
                                    <button onClick={() => setUiConfirm(null)} className="flex-1 bg-slate-100 text-slate-600 py-3 rounded-xl font-black uppercase tracking-widest text-xs md:text-sm">취소</button>
                                    <button onClick={() => { uiConfirm.onConfirm(); setUiConfirm(null); }} className="flex-1 bg-red-600 text-white py-3 rounded-xl font-black uppercase shadow-lg active:scale-95 transition-all tracking-widest text-sm text-center">진행</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
