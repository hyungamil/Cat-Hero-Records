            transition: background-color 0.2s, color 0.2s;
            background-color: #F8FAFC;

        @media (min-width: 768px) { .agent-grid { grid-template-columns: repeat(2, 1fr); gap: 1.25rem; } }
        @media (min-width: 1024px) { .desktop-layout { display: grid; grid-template-columns: 380px 1fr; gap: 1.5rem; align-items: start; } }

        .log-animate { animation: slideUpFade 0.5s ease-out forwards; }
        .animate-fadeIn { animation: slideUpFade 0.3s ease-out forwards; }
        
        @keyframes slotSpin { 0% { transform: translateY(-20px); opacity: 0; } 50% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(20px); opacity: 0; } }
        .slot-animation { animation: slotSpin 0.15s infinite linear; }
        
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.25rem; }

<body class="font-bold">

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo, useRef } from "react";
        import { createRoot } from "react-dom/client";
        
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, deleteDoc, doc, updateDoc, getDocs, setDoc, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        let parsedFirebaseConfig = null;
        try {
            if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                parsedFirebaseConfig = JSON.parse(__firebase_config);
            }
        } catch (e) { console.error("Firebase config parsing error:", e); }

        const firebaseConfig = parsedFirebaseConfig || {
            apiKey: "AIzaSyCOt_5hYk7Y9EDwo1Cd55et5-JT6k7LIcc",
            authDomain: "cat-hero-record.firebaseapp.com",
            projectId: "cat-hero-record",
            storageBucket: "cat-hero-record.firebasestorage.app",
            messagingSenderId: "1059204432454",
            appId: "1:1059204432454:web:b365ddd7d6a3da2c624047"
        };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'cat-hero-v24-final';
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const safeGetItem = (key, defaultValue) => { try { return localStorage.getItem(key) || defaultValue; } catch (e) { return defaultValue; } };
        const safeGetJSON = (key, defaultValue) => { try { const item = localStorage.getItem(key); if (!item || item === "undefined") return defaultValue; return JSON.parse(item); } catch (e) { return defaultValue; } };
        const safeSetItem = (key, value) => { try { localStorage.setItem(key, value); } catch (e) {} };
        const safeRemoveItem = (key) => { try { localStorage.removeItem(key); } catch (e) {} };

        const TOTAL_RESOURCES = 10; 
        const BASE_TIME_PER_SWORD = 2; 
        const INITIAL_MEMBERS = ["늑대벼리", "마자유", "고기쟁이", "김동순", "일민", "캣핑", "콘스", "하늘구름바다", "창식2", "나는도비", "노들노들", "포저", "라잌늑냥", "베리발", "장귝", "유나s"];
        
        const EQUIP_GRADES = ['일반', '고급', '희귀', '영웅', '전설', '신화'];
        const EQUIP_TYPES = ['반지', '목걸이', '모자', '장갑', '목도리', '신발', '목걸이 상자', '반지 상자'];
        const RECIPE_GRADES = ['일반', '고급', '희귀', '영웅', '전설', '신화'];
        const REWARDS_LIST = ['픽업', '신화 픽업', '룬 소환서', '특수룬 소환서', '동료 소환서'];
        const MONSTERS = ["루이", "루니", "루나", "바나냥", "토끼", "꿀벌", "크랩", "해적보스", "고양이보스", "늑대보스", "음식보스"];
        const BD_CONTENTS = ["상층1", "상층2", "상층3", "일격보스", "기타"]; 
        const ZOOM_LEVELS = [50, 75, 90, 100, 110, 125, 150, 175, 200];

        function App() {
            const [user, setUser] = useState(null);
            
            const [nickname, setNickname] = useState(() => safeGetItem('cat_hero_nickname', ''));
            const [isNameSet, setIsNameSet] = useState(() => !!safeGetItem('cat_hero_nickname', ''));
            const [themeMode, setThemeMode] = useState(() => safeGetItem('cat_hero_theme', 'system'));
            const [zoomIndex, setZoomIndex] = useState(() => Number(safeGetItem('cat_hero_zoom', 3)));
            const [favorites, setFavorites] = useState(() => safeGetJSON('cat_hero_favorites', []));
            const [enableAnimation, setEnableAnimation] = useState(() => safeGetItem('cat_hero_enable_anim', 'true') !== 'false');

            const [isAdminMode, setIsAdminMode] = useState(false);
            const [adminPass, setAdminPass] = useState("");
            const [showAdminEntry, setShowAdminEntry] = useState(false);
            const [adminPasswordSetting, setAdminPasswordSetting] = useState("");

            const [mainCategory, setMainCategory] = useState('conquest'); 
            const [conquestFilter, setConquestFilter] = useState('timeSort');
            const [historyTab, setHistoryTab] = useState('conquest');

            const [conquestNormalCount, setConquestNormalCount] = useState(0);
            const [conquestBossCount, setConquestBossCount] = useState(0);
            const [playMin, setPlayMin] = useState(0);
            const [playSec, setPlaySec] = useState(0);
            
            const [logs, setLogs] = useState([]); 
            const [lootLogs, setLootLogs] = useState([]); 
            const [vaultLogs, setVaultLogs] = useState([]); 
            const [members, setMembers] = useState([]); 
            
            const [notice, setNotice] = useState("시스템 가동 중입니다.");
            const [newNotice, setNewNotice] = useState("");
            const [newMemberName, setNewMemberName] = useState("");
            const [newNicknameInput, setNewNicknameInput] = useState('');
            
            const [myStat, setMyStat] = useState("");
            const [myMount, setMyMount] = useState("");

            const [uiAlert, setUiAlert] = useState(null);
            const [uiConfirm, setUiConfirm] = useState(null);
            const [showNoticeModal, setShowNoticeModal] = useState(false);

            const [strikeSubTab, setStrikeSubTab] = useState('calc'); 
            const [selectedCalcMembers, setSelectedCalcMembers] = useState([]); 
            const [calcMemberSearch, setCalcMemberSearch] = useState(''); 
            
            const [basketItems, setBasketItems] = useState([]);
            const [customEquipments, setCustomEquipments] = useState([]);
            const [customRecipes, setCustomRecipes] = useState([]);
            const [equipType, setEquipType] = useState('반지');
            const [equipGrade, setEquipGrade] = useState('일반'); 
            const [equipQty, setEquipQty] = useState('');
            const [recipeGrade, setRecipeGrade] = useState('일반');
            const [recipeQty, setRecipeQty] = useState('');
            
            const [distMonster, setDistMonster] = useState(''); 
            const [distResult, setDistResult] = useState(null);
            const [isDistSaved, setIsDistSaved] = useState(false);
            const captureRef = useRef(null);
            const ratioCaptureRef = useRef(null); 
            const [preventDupLoot, setPreventDupLoot] = useState(false);

            const [manualStagingList, setManualStagingList] = useState([]);
            const [manualLootMonster, setManualLootMonster] = useState('');
            const [manualLootItem, setManualLootItem] = useState('');
            const [manualLootWinner, setManualLootWinner] = useState('');
            const [manualLootQty, setManualLootQty] = useState(1);
            const [manualLootMemo, setManualLootMemo] = useState('');
            const [manualLootGrade, setManualLootGrade] = useState('일반'); 
            const [manualEquipType, setManualEquipType] = useState('반지');
            const [manualRecipeGrade, setManualRecipeGrade] = useState('일반');
            const [manualIsUnallocated, setManualIsUnallocated] = useState(false); 
            const [showManualLootForm, setShowManualLootForm] = useState(false);
            const [selectedLootGroupId, setSelectedLootGroupId] = useState(null); 

            const [currentMonth, setCurrentMonth] = useState(() => {
                const now = new Date();
                return new Date(now.getFullYear(), now.getMonth(), 1);
            });
            const [selectedDateStr, setSelectedDateStr] = useState(() => {
                const now = new Date();
                return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            });

            const [isDistAnimating, setIsDistAnimating] = useState(false);
            const [tempDistList, setTempDistList] = useState([]);
            const [slotDisplayNames, setSlotDisplayNames] = useState([]);

            const [adminSearch, setAdminSearch] = useState('');
            const [adminSortType, setAdminSortType] = useState('gyeokchu');

            // --- 블다 금고 (N빵 분배 시스템) 상태 ---
            const [bdSeller, setBdSeller] = useState(''); 
            const [bdContent, setBdContent] = useState('');
            const [bdTotal, setBdTotal] = useState('');
            const [bdFeeRate, setBdFeeRate] = useState(10);
            const [bdMemo, setBdMemo] = useState('');
            const [showVaultDepositForm, setShowVaultDepositForm] = useState(false);
            
            // 분배 실행 모달
            const [distributeModal, setDistributeModal] = useState({ isOpen: false, log: null, participants: [], search: '' });

            const [vaultFilterMember, setVaultFilterMember] = useState('all');
            const [vaultFilterSource, setVaultFilterSource] = useState('all');

            const showAlert = (msg, type = 'success') => setUiAlert({ message: msg, type });
            const closeAlert = () => setUiAlert(null);

            const currentUserMember = members.find(m => m.name === nickname);
            const isManager = currentUserMember?.isManager === true;
            const isGuildAdmin = currentUserMember?.isAdmin === true; 
            const hasAnyAdmin = members.some(m => m.isAdmin);
            
            // [핵심 보안 패치] 설정 탭의 민감한 관리자 도구는 무조건 비밀번호 인증(isAdminMode) 필요
            const canAccessAdminTools = isAdminMode && (!hasAnyAdmin || isGuildAdmin);
            
            // [수정] 관리자 및 총무 직책을 부여받은 길드원은 암호 입력 없이도 즉시 블다 금고 등록/분배 가능
            const canEditLoot = isGuildAdmin || isManager || isAdminMode;

            const renderBadges = (m) => {
                if (!m) return null;
                return (
                    <span className="inline-flex gap-1 items-center align-middle">
                        {m.isAdmin && <span className="px-1.5 py-0.5 rounded text-[8px] font-black bg-red-100 text-red-600 dark:bg-red-900/30 dark:text-red-400 border border-red-200 dark:border-red-800/50 shadow-sm leading-none whitespace-nowrap">👑 관리자</span>}
                        {m.isManager && !m.isAdmin && <span className="px-1.5 py-0.5 rounded text-[8px] font-black bg-yellow-100 text-yellow-600 dark:bg-yellow-900/30 dark:text-yellow-400 border border-yellow-200 dark:border-yellow-800/50 shadow-sm leading-none whitespace-nowrap">⭐ 총무</span>}
                    </span>
                );
            };

            const handleTimeChange = (type, val) => {
                const strVal = val.replace(/[^0-9]/g, '');
                if (strVal === '') {
                    if (type === 'min') setPlayMin('');
                    else setPlaySec('');
                    return;
                }
                const num = parseInt(strVal, 10);
                if (type === 'min') setPlayMin(num);
                else setPlaySec(num);
            };

            const handleTimeBlur = () => {
                let currentMin = playMin === '' ? 0 : parseInt(playMin, 10);
                let currentSec = playSec === '' ? 0 : parseInt(playSec, 10);

                if (currentSec >= 60) {
                    currentMin += Math.floor(currentSec / 60);
                    currentSec = currentSec % 60;
                }
                setPlayMin(currentMin);
                setPlaySec(currentSec);
            };

            const handleAddTime = (type, val) => {
                let currentMin = playMin === '' ? 0 : parseInt(playMin, 10);
                let currentSec = playSec === '' ? 0 : parseInt(playSec, 10);

                if (type === 'min') {
                    setPlayMin(Math.max(0, currentMin + val));
                    setPlaySec(currentSec);
                } else {
                    let newSec = currentSec + val;
                    let newMin = currentMin;
                    
                    if (newSec >= 60) {
                        newMin += Math.floor(newSec / 60);
                        newSec = newSec % 60;
                    } else if (newSec < 0) {
                        if (newMin > 0) {
                            const borrow = Math.ceil(Math.abs(newSec) / 60);
                            if (newMin >= borrow) {
                                newMin -= borrow;
                                newSec = 60 * borrow + newSec;
                            } else {
                                newMin = 0;
                                newSec = 0;
                            }
                        } else {
                            newSec = 0;
                        }
                    }
                    setPlayMin(newMin);
                    setPlaySec(newSec);
                }
            };

            const handleResetSession = () => {
                setUiConfirm({ 
                    message: "로그아웃하고 닉네임 선택 화면으로 돌아가시겠습니까?", 
                    onConfirm: () => { 
                        safeRemoveItem('cat_hero_nickname'); 
                        setNickname(''); 
                        setIsNameSet(false); 
                    } 
                });
            };

            const toggleFavorite = (e, targetName) => {
                e.stopPropagation();
                let newFavs = [...favorites];
                if (newFavs.includes(targetName)) {
                    newFavs = newFavs.filter(f => f !== targetName);
                } else {
                    newFavs.push(targetName);
                }
                setFavorites(newFavs);
                safeSetItem('cat_hero_favorites', JSON.stringify(newFavs));
            };

            const getMemberGyeokchu = (m) => {
                if (m.directGyeokchu && Number(m.directGyeokchu) > 0) return Number(m.directGyeokchu);
                const statVal = Math.floor(Number(m.stat) || 0);
                const mountVal = Math.floor(Number(m.mount) || 0);
                if (statVal > 0 || mountVal > 0) return (statVal + 6 + mountVal) * 10 + 1000;
                return 0; 
            };

            const copyToClipboard = (text) => {
                const ta = document.createElement("textarea");
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                try {
                    document.execCommand('copy');
                    showAlert("텍스트가 복사되었습니다.");
                } catch(e) {
                    showAlert("복사 실패", "error");
                }
                document.body.removeChild(ta);
            };

            const handleAdminUpdateField = async (id, field, value) => {
                try {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members_v24', id), { [field]: value });
                    showAlert("권한/정보가 안전하게 저장되었습니다.");
                } catch (e) {
                    showAlert("저장에 실패했습니다.", "error");
                }
            };

            const handleSaveMyStat = async () => {
                const member = members.find(m => m.name === nickname);
                if (!member) return;
                try {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members_v24', member.id), {
                        stat: myStat === '' ? null : Math.floor(Number(myStat)),
                        mount: myMount === '' ? null : Math.floor(Number(myMount))
                    });
                    showAlert("저장되었습니다.");
                } catch(e) { showAlert("저장에 실패했습니다.", "error"); }
            };

            const handleChangeNickname = async () => {
                if (!newNicknameInput || newNicknameInput.trim() === '') return showAlert('새 닉네임을 입력해주세요.', 'error');
                const targetName = newNicknameInput.trim();
                if (targetName === nickname) return showAlert('현재 닉네임과 동일합니다.', 'error');
                if (members.find(m => m.name === targetName)) return showAlert('이미 존재하는 닉네임입니다. 다른 닉네임을 사용해주세요.', 'error');
                
                setUiConfirm({
                    message: `[${nickname}] 에서 [${targetName}](으)로 닉네임을 변경하시겠습니까?\n과거 기록도 새 닉네임으로 함께 업데이트됩니다.`,
                    onConfirm: async () => {
                        try {
                            const batch = writeBatch(db);
                            
                            const myMem = members.find(m => m.name === nickname);
                            if (myMem) batch.update(doc(db, 'artifacts', appId, 'public', 'data', 'members_v24', myMem.id), { name: targetName });

                            logs.filter(l => l.nickname === nickname).forEach(l => {
                                batch.update(doc(db, 'artifacts', appId, 'public', 'data', 'conquest_logs_v24', l.id), { nickname: targetName });
                            });

                            lootLogs.filter(l => l.list?.some(i => i.winner === nickname)).forEach(l => {
                                const newList = l.list.map(item => item.winner === nickname ? { ...item, winner: targetName } : item);
                                batch.update(doc(db, 'artifacts', appId, 'public', 'data', 'loot_history_v24', l.id), { list: newList });
                            });

                            // Update BD logs for sellers and participants
                            vaultLogs.forEach(log => {
                                let needsUpdate = false;
                                let updateData = {};
                                
                                if (log.seller === nickname) {
                                    updateData.seller = targetName;
                                    needsUpdate = true;
                                }
                                
                                if (log.participants?.includes(nickname)) {
                                    updateData.participants = log.participants.map(p => p === nickname ? targetName : p);
                                    needsUpdate = true;
                                }
                                
                                if (needsUpdate) {
                                    batch.update(doc(db, 'artifacts', appId, 'public', 'data', 'bd_vault_logs_v24', log.id), updateData);
                                }
                            });

                            await batch.commit();

                            let newFavs = [...favorites];
                            if (newFavs.includes(nickname)) {
                                newFavs = newFavs.map(f => f === nickname ? targetName : f);
                                setFavorites(newFavs);
                                safeSetItem('cat_hero_favorites', JSON.stringify(newFavs));
                            }

                            safeSetItem('cat_hero_nickname', targetName);
                            setNickname(targetName);
                            setNewNicknameInput('');
                            showAlert(`성공적으로 닉네임이 [${targetName}](으)로 변경되었습니다!`);
                        } catch (e) {
                            console.error(e);
                            showAlert('닉네임 변경 처리 중 오류가 발생했습니다.', 'error');
                        }
                    }
                });
            };

            const handleChangeAdminPassword = async () => {
                if (!adminPasswordSetting || adminPasswordSetting.trim() === '') return showAlert('새 비밀번호를 입력해주세요.', 'error');
                
                try {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'admin'), {
                        password: adminPasswordSetting.trim()
                    }, { merge: true });
                    showAlert("관리자 비밀번호가 성공적으로 변경되었습니다.");
                    setAdminPasswordSetting('');
                } catch (e) {
                    showAlert("비밀번호 변경 실패", "error");
                }
            };

            const handleAdminLogin = async () => {
                try {
                    const docSnap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'settings'));
                    let currentPass = "123456"; 
                    
                    docSnap.forEach(doc => {
                        if (doc.id === 'admin' && doc.data().password) {
                            currentPass = doc.data().password;
                        }
                    });

                    if (adminPass === currentPass) {
                        setIsAdminMode(true);
                        const myMem = members.find(m => m.name === nickname);
                        const hasAdm = members.some(m => m.isAdmin);
                        if (!hasAdm || myMem?.isAdmin) showAlert("관리자 권한이 활성화되었습니다.");

            };

            const executeDistribution = (type) => { 
                if(selectedCalcMembers.length === 0) return showAlert("참여 길드원이 없습니다.", "error");
                if(basketItems.length === 0 && customEquipments.length === 0 && customRecipes.length === 0) return showAlert("등록된 보상이 없습니다.", "error");

                let resultArr = [];
                const pNames = selectedCalcMembers.map(id => members.find(m => m.id === id)?.name).filter(Boolean);

                if (type === 'random') {
                    let allItemsToDistribute = [];
                    customEquipments.forEach(eq => { for(let i=0; i<eq.qty; i++){ allItemsToDistribute.push({ name: `${eq.grade} ${eq.type}`, isEquip: true }); } });
                    customRecipes.forEach(rcp => { for(let i=0; i<rcp.qty; i++){ allItemsToDistribute.push({ name: `${rcp.grade} 레시피`, isEquip: false }); } });
                    basketItems.forEach(item => { for(let i=0; i<item.qty; i++){ allItemsToDistribute.push({ name: item.name, isEquip: false }); } });

                    allItemsToDistribute.forEach(item => {
                        let candidates = [...pNames];
                        const winner = candidates[Math.floor(Math.random() * candidates.length)];
                        resultArr.push({ itemStr: item.name, winner, isEquip: item.isEquip, isRandom: true });
                    });
                } else if (type === 'contrib') {
                    if(calcStrikeReport.individualReports.length === 0) return showAlert("격추 데이터가 없습니다.", "error");
                    let allItemTypes = [];
                    basketItems.forEach(b => { allItemTypes.push({ name: b.name, qty: b.qty, isEquip: false }); });
                    customRecipes.forEach(rcp => { allItemTypes.push({ name: `${rcp.grade} 레시피`, qty: rcp.qty, isEquip: false }); });
                    customEquipments.forEach(eq => { allItemTypes.push({ name: `${eq.grade} ${eq.type}`, qty: eq.qty, isEquip: true }); });

                    allItemTypes.forEach(item => {
                        let totalQty = item.qty;
                        let validReports = calcStrikeReport.individualReports;
                        let remain = totalQty;
                        let fractions = [];
                        
                        validReports.forEach(r => {
                            const alloc = totalQty * (r.rate / 100);
                            const base = Math.floor(alloc);
                            remain -= base;
                            fractions.push({ name: r.name, frac: alloc - base, base });
                        });
                        fractions.sort((a,b) => b.frac - a.frac);
                        for(let i=0; i<remain; i++){ fractions[i].base += 1; }
                        
                        fractions.forEach(f => {
                            if(f.base > 0) resultArr.push({ itemStr: `${item.name}`, winner: f.name, qty: f.base, isEquip: item.isEquip, isRandom: false });
                        });
                    });
                }
                const finalResult = { type: type === 'random' ? '무작위 랜덤 분배' : '기여도 기반 분배', list: resultArr };
                setIsDistSaved(false);

                                            <div>

                                                                <span className="text-[9px] bg-blue-100 text-blue-600 dark:bg-blue-900/30 dark:text-blue-400 px-1.5 py-0.5 rounded ml-1">오늘로</span>
                                                            </div>
                                                            <button onClick={() => setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 1))} className="w-8 h-8 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800 flex items-center justify-center transition-colors"><i className="fas fa-chevron-right text-xs"></i></button>
                                                        </div>
                                                        
                                                        <div className="calendar-grid mb-1 text-center text-[10px] font-bold text-slate-400 dark:text-slate-500">
                                                            <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
                                                        </div>
                                                        <div className="calendar-grid mb-4">
                                                            {renderCalendar()}
                                                        </div>
                                                        
                                                        <div className="bg-slate-50 dark:bg-slate-900/50 rounded-xl p-3 border border-slate-100 dark:border-slate-800 grid grid-cols-2 gap-2 text-[9px] font-bold text-slate-600 dark:text-slate-400">
                                                            <div className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-blue-500"></span>아이템 분배</div>
                                                            <div className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-yellow-400"></span>일반 메모</div>
                                                            <div className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-red-500"></span>미분배자 기록</div>
                                                            <div className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-green-500"></span>분배+메모</div>
                                                        </div>
                                                        
                                                        <div className="mt-4">
                                                            <button onClick={() => setShowManualLootForm(true)} className="w-full py-3 bg-slate-800 dark:bg-slate-700 text-white rounded-xl text-xs font-black shadow-sm hover:bg-slate-900 transition-colors flex justify-center items-center gap-2">
                                                                <i className="fas fa-plus"></i>수동 분배 기록 추가
                                                            </button>
                                                        </div>
                                                    </div>

                                                    <div className="flex-1 flex flex-col h-full bg-slate-50 dark:bg-[#0B1220] rounded-2xl border border-slate-200 dark:border-slate-800 overflow-hidden relative">
                                                        <div className="p-4 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center bg-white dark:bg-slate-900 sticky top-0 z-10">
                                                            <h3 className="font-black text-slate-800 dark:text-slate-100 flex items-center gap-2">
                                                                <i className="far fa-calendar-check text-blue-500"></i>
                                                                {selectedDateStr} 기록 목록
                                                            </h3>
                                                            <span className="text-[10px] font-bold text-slate-400 bg-slate-100 dark:bg-slate-800 px-2 py-1 rounded-lg">총 {selectedLogs.length}건</span>
                                                        </div>
                                                        <div className="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar">
                                                            {selectedLogs.map((docItem) => {
                                                                const uniqueWinners = new Set(docItem.list?.map(i => i.winner)).size || 0;
                                                                const totalItems = docItem.list?.length || 0;
                                                                
                                                                return (
                                                                <div key={docItem.id} className="relative p-5 md:p-6 rounded-2xl bg-white dark:bg-slate-800 border-t-[6px] border-x border-b border-slate-200 dark:border-slate-700 shadow-sm transition-all flex flex-col group border-t-emerald-500 hover:shadow-md">
                                                                    <div className="flex justify-between items-start mb-3 border-b border-slate-100 dark:border-slate-700/50 pb-3">
                                                                        <div className="flex flex-col gap-1">
                                                                            <span className="text-[10px] text-slate-400 dark:text-slate-500 font-mono tracking-widest">{docItem.timestamp?.seconds ? new Date(docItem.timestamp.seconds * 1000).toLocaleString() : (docItem.timestamp ? new Date(docItem.timestamp).toLocaleString() : '')}</span>
                                                                            <div className="flex items-center gap-2">
                                                                                {docItem.isUnallocated ? (
                                                                                    <span className="text-sm font-black text-red-500 dark:text-red-400">🟥 미분배자 기록</span>
                                                                                ) : (
                                                                                    <span className={`text-sm font-black ${docItem.distType === '수동 등록 분배' ? 'text-amber-500 dark:text-amber-400' : 'text-emerald-600 dark:text-emerald-400'}`}>
                                                                                        🟦 {docItem.monster || '분배 이력'} ({docItem.distType})
                                                                                    </span>
                                                                                )}
                                                                            </div>
                                                                        </div>
                                                                        {canEditLoot && (
                                                                            <div className="opacity-0 group-hover:opacity-100 transition-opacity">
                                                                                <button onClick={() => handleDeleteLootGroup(docItem.id)} className="text-slate-300 hover:text-red-500 p-1 transition-colors text-xs" title="그룹 전체 삭제"><i className="fas fa-trash-alt"></i></button>
                                                                            </div>
                                                                        )}
                                                                    </div>
                                                                    
                                                                    {(!docItem.isUnallocated && docItem.list && docItem.list.length > 0) && (
                                                                        <div className="flex justify-between items-center bg-slate-50 dark:bg-slate-900/50 p-3 rounded-xl mb-4 border border-slate-100 dark:border-slate-700/50">
                                                                            <div className="flex flex-col items-center flex-1 border-r border-slate-200 dark:border-slate-700">
                                                                                <span className="text-[9px] text-slate-400 font-bold mb-0.5">참여 인원</span>
                                                                                <span className="text-sm font-black text-slate-700 dark:text-slate-200">{uniqueWinners}명</span>
                                                                            </div>
                                                                            <div className="flex flex-col items-center flex-1">
                                                                                <span className="text-[9px] text-slate-400 font-bold mb-0.5">보상 총합</span>
                                                                                <span className="text-sm font-black text-slate-700 dark:text-slate-200">{totalItems}건</span>
                                                                            </div>
                                                                        </div>
                                                                    )}
                                                                    
                                                                    {docItem.memo && (
                                                                        <div className="text-[10px] text-slate-500 dark:text-slate-400 bg-yellow-50 dark:bg-yellow-900/10 px-3 py-2 rounded-lg mb-4 border border-yellow-100 dark:border-yellow-800/30">
                                                                            <span className="font-bold text-yellow-600 dark:text-yellow-400 mr-1">🟨 메모:</span>{docItem.memo}
                                                                        </div>
                                                                    )}
                                                                    
                                                                    <div className="mt-auto pt-2">
                                                                        <button onClick={() => setSelectedLootGroupId(docItem.id)} className="w-full py-2.5 bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 rounded-xl text-xs font-black hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors flex justify-center items-center gap-1.5">
                                                                            상세보기 <i className="fas fa-chevron-right text-[10px]"></i>
                                                                        </button>
                                                                    </div>
                                                                </div>
                                                                );
                                                            })}
                                                            {selectedLogs.length === 0 && (
                                                                <div className="flex flex-col items-center justify-center h-full text-slate-400 dark:text-slate-500 pb-20">
                                                                    <i className="far fa-calendar-times text-4xl mb-4 opacity-50"></i>
                                                                    <p className="font-bold text-sm">해당 날짜에 저장된 기록이 없습니다.</p>
                                                                </div>
                                                            )}
                                                        </div>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            )}

                            {}
                            {showNoticeModal && (
                                <div className="fixed inset-0 z-[1000] flex items-center justify-center p-4 custom-modal-overlay animate-fadeIn text-slate-900 dark:text-white" onClick={() => setShowNoticeModal(false)}>
                                    <div className="bg-white dark:bg-slate-900 rounded-[2rem] shadow-2xl p-8 max-w-md w-full border-t-8 border-blue-500" onClick={e=>e.stopPropagation()}>
                                        <div className="flex justify-between items-center mb-6">
                                            <h3 className="text-lg font-black flex items-center gap-2"><i className="fas fa-bullhorn text-blue-500"></i>전체 공지사항</h3>
                                            <button onClick={() => setShowNoticeModal(false)} className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"><i className="fas fa-times"></i></button>
                                        </div>
                                        <p className="text-sm text-slate-700 dark:text-slate-300 leading-relaxed whitespace-pre-wrap">{notice}</p>
                                    </div>
                                </div>
                            )}

                            {/* 블다 분배 실행 모달 */}
                            {distributeModal.isOpen && (
                                <div className="fixed inset-0 z-[1500] flex items-center justify-center p-4 custom-modal-overlay animate-fadeIn text-slate-900 dark:text-white" onClick={() => setDistributeModal({ isOpen: false, log: null, participants: [], search: '' })}>
                                    <div className="bg-white dark:bg-slate-900 rounded-[2rem] shadow-2xl p-6 md:p-8 max-w-lg w-full border-t-8 border-indigo-500 flex flex-col max-h-[90vh]" onClick={e=>e.stopPropagation()}>
                                        <h3 className="text-lg font-black mb-4 flex items-center gap-2"><i className="fas fa-hand-holding-usd text-indigo-500"></i> 파티원에게 블다 분배하기</h3>

                                        <div className="bg-indigo-50 dark:bg-indigo-900/20 p-4 rounded-xl border border-indigo-100 dark:border-indigo-800/30 mb-4 shrink-0">
                                            <div className="flex justify-between text-xs font-bold text-slate-600 dark:text-slate-300 mb-2">
                                                <span>출처: {distributeModal.log.content}</span>
                                                <span>대리 판매자: {distributeModal.log.seller}</span>
                                            </div>
                                            <div className="flex justify-between items-center border-t border-indigo-200 dark:border-indigo-800/50 pt-2">
                                                <span className="text-sm font-black text-indigo-700 dark:text-indigo-400">분배할 총 순수익</span>
                                                <span className="text-xl font-mono font-black text-indigo-700 dark:text-indigo-300">{distributeModal.log.netAmount?.toLocaleString()} 💎</span>
                                            </div>
                                        </div>

                                        <div className="flex flex-col gap-3 flex-1 min-h-0">
                                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                                                <label className="text-xs font-bold text-slate-500">참여자 선택 ({distributeModal.participants.length}명 지정됨)</label>
                                                <div className="relative w-full sm:w-48">
                                                    <input type="text" value={distributeModal.search} onChange={e => setDistributeModal({...distributeModal, search: e.target.value})} placeholder="🔍 검색" className="w-full p-2 pl-8 border border-slate-200 dark:border-slate-700 rounded-lg text-xs outline-none focus:border-indigo-500 bg-white dark:bg-slate-800 text-slate-900 dark:text-white" />
                                                    <i className="fas fa-search absolute left-3 top-2.5 text-[10px] text-slate-400"></i>
                                                </div>
                                            </div>
                                            <div className="overflow-y-auto no-scrollbar border border-slate-200 dark:border-slate-700 rounded-xl p-3 bg-slate-50 dark:bg-slate-800/50 grid grid-cols-2 gap-2 content-start">
                                                {members.filter(m => !distributeModal.search || m.name.toLowerCase().includes(distributeModal.search.toLowerCase())).map(m => {
                                                    const isSelected = distributeModal.participants.includes(m.id);
                                                    return (
                                                        <div key={m.id} className={`p-3 rounded-lg border-2 transition-all cursor-pointer flex items-center gap-2 ${isSelected ? 'border-indigo-500 bg-indigo-50 dark:bg-indigo-900/30' : 'border-transparent bg-white dark:bg-slate-800 hover:border-indigo-300 dark:hover:border-indigo-600'}`} onClick={() => {
                                                            setDistributeModal(prev => ({
                                                                ...prev,
                                                                participants: isSelected ? prev.participants.filter(id => id !== m.id) : [...prev.participants, m.id]
                                                            }));
                                                        }}>
                                                            <div className={`w-3.5 h-3.5 rounded text-[8px] flex items-center justify-center text-white shrink-0 ${isSelected ? 'bg-indigo-500' : 'bg-slate-200 dark:bg-slate-700'}`}>{isSelected && '✓'}</div>
                                                            <span className={`text-xs font-bold truncate ${isSelected ? 'text-indigo-700 dark:text-indigo-400' : 'text-slate-700 dark:text-slate-300'}`}>{m.name}</span>
                                                        </div>
                                                    )
                                                })}
                                            </div>
                                        </div>

                                        {distributeModal.participants.length > 0 && (
                                            <div className="mt-4 p-3 bg-indigo-100 dark:bg-indigo-900/40 rounded-xl flex justify-between items-center border border-indigo-200 dark:border-indigo-800 shrink-0">
                                                <span className="text-xs font-bold text-indigo-800 dark:text-indigo-300">인당 분배액 (N빵)</span>
                                                <span className="text-lg font-black font-mono text-indigo-700 dark:text-indigo-300">{Math.floor(distributeModal.log.netAmount / distributeModal.participants.length).toLocaleString()} 💎</span>
                                            </div>
                                        )}

                                        <div className="flex gap-2 pt-4 shrink-0 border-t border-slate-100 dark:border-slate-800 mt-4">
                                            <button type="button" onClick={() => setDistributeModal({ isOpen: false, log: null, participants: [], search: '' })} className="flex-1 py-3.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 rounded-xl font-bold transition-colors">취소</button>
                                            <button type="button" onClick={handleExecuteDistribution} className="flex-1 py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-black shadow-md transition-all active:scale-95">이대로 분배 완료 및 잔액 갱신</button>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {currentSelectedGroup && (
                                <div className="fixed inset-0 z-[1400] flex items-center justify-center p-4 custom-modal-overlay animate-fadeIn text-slate-900 dark:text-white" onClick={() => setSelectedLootGroupId(null)}>
                                    <div className="bg-white dark:bg-slate-900 rounded-[2.5rem] shadow-2xl w-full max-w-lg max-h-[85vh] flex flex-col border-t-8 border-emerald-500" onClick={e=>e.stopPropagation()}>
                                        <div className="p-6 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center shrink-0">
                                            <div>
                                                <h3 className="text-lg font-black flex items-center gap-2">
                                                    <i className="fas fa-list text-emerald-500"></i> (장비/아이템) 분배 상세
                                                </h3>
                                                <span className="text-[10px] text-slate-400 font-mono mt-1 block">
                                                    {currentSelectedGroup.timestamp?.seconds ? new Date(currentSelectedGroup.timestamp.seconds * 1000).toLocaleString() : ''}
                                                </span>
                                            </div>
                                            <button onClick={() => setSelectedLootGroupId(null)} className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors"><i className="fas fa-times text-xl"></i></button>
                                        </div>
                                        <div className="p-6 overflow-y-auto flex-1 space-y-3 no-scrollbar bg-slate-50 dark:bg-[#0B1220] rounded-b-[2rem]">
                                            {currentSelectedGroup.list?.map((item, idx) => {
                                                const mObj = members.find(m => m.name === item.winner);
                                                return (
                                                <div key={idx} className="p-4 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl flex justify-between items-center shadow-sm">
                                                    <div className="flex items-center gap-3 min-w-0">
                                                        <div className={`w-8 h-8 rounded-full flex items-center justify-center text-xs shrink-0 ${item.isEquip || (item.itemStr && item.itemStr.includes('장비')) ? 'bg-amber-100 text-amber-500 dark:bg-amber-900/30' : 'bg-emerald-100 text-emerald-500 dark:bg-emerald-900/30'}`}>
                                                            <i className={`fas ${item.isEquip || (item.itemStr && item.itemStr.includes('장비')) ? 'fa-khanda' : 'fa-gift'}`}></i>
                                                        </div>
                                                        <div className="truncate">
                                                            <div className="text-[10px] text-slate-500 dark:text-slate-400 font-bold mb-0.5 flex items-center gap-1">{item.winner} {renderBadges(mObj)}</div>
                                                            <div className="text-sm font-black text-slate-800 dark:text-slate-100 truncate">
                                                                <span className={item.itemStr?.includes('장비') ? 'text-amber-600 dark:text-amber-400' : 'text-emerald-600 dark:text-emerald-400'}>{item.itemStr}</span>
                                                                {item.qty && item.qty > 1 && <span className="ml-1 text-purple-500 text-[10px] font-mono">x{item.qty}</span>}
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                                );
                                            })}
                                            {currentSelectedGroup.list?.length === 0 && <div className="text-center py-10 text-slate-400 font-bold">상세 기록이 비어 있습니다.</div>}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {uiAlert && (
                                <div className="fixed top-4 right-4 z-[2000] animate-fadeIn">
                                    <div className={`px-5 py-3 rounded-xl shadow-lg border-l-4 font-bold flex items-center gap-3 ${uiAlert.type === 'error' ? 'bg-white dark:bg-slate-800 border-red-500 text-slate-800 dark:text-white' : 'bg-slate-800 dark:bg-slate-700 border-emerald-500 text-white'}`}>
                                        <i className={`fas ${uiAlert.type === 'error' ? 'fa-exclamation-circle text-red-500' : 'fa-check-circle text-emerald-500'}`}></i>
                                        {uiAlert.message}
                                        <button onClick={closeAlert} className="ml-4 opacity-50 hover:opacity-100"><i className="fas fa-times"></i></button>
                                    </div>
                                </div>
                            )}

                            {uiConfirm && (
                                <div className="fixed inset-0 z-[2000] flex items-center justify-center p-4 custom-modal-overlay animate-fadeIn text-slate-900 dark:text-white" onClick={() => setUiConfirm(null)}>
                                    <div className="bg-white dark:bg-slate-900 rounded-[2rem] shadow-2xl p-6 md:p-8 max-w-sm w-full text-center border border-slate-200 dark:border-slate-700" onClick={e=>e.stopPropagation()}>
                                        <div className="w-16 h-16 bg-blue-50 dark:bg-blue-900/30 rounded-full flex items-center justify-center mx-auto mb-4 text-blue-500 text-2xl">
                                            <i className="fas fa-question-circle"></i>
                                        </div>
                                        <p className="text-sm md:text-base font-black mb-6 whitespace-pre-wrap leading-relaxed">{uiConfirm.message}</p>
                                        
                                        {uiConfirm.checkboxLabel && (
                                            <label className="flex items-center justify-center gap-2 text-xs text-slate-500 mb-6 cursor-pointer">
                                                <input type="checkbox" id="confirmCheckbox" className="w-4 h-4 accent-blue-500" />
                                                {uiConfirm.checkboxLabel}
                                            </label>
                                        )}

                                        <div className="flex gap-3">
                                            <button onClick={() => setUiConfirm(null)} className="flex-1 py-3.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 rounded-xl font-bold transition-colors">취소</button>
                                            <button onClick={() => { 
                                                const isChecked = uiConfirm.checkboxLabel ? document.getElementById('confirmCheckbox')?.checked : false;
                                                uiConfirm.onConfirm(isChecked); 
                                                setUiConfirm(null); 
                                            }} className="flex-1 py-3.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-black shadow-md shadow-blue-500/20 transition-all active:scale-95">확인</button>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {showAdminEntry && !isAdminMode && (
                                <div className="fixed inset-0 z-[1000] flex items-center justify-center p-4 custom-modal-overlay animate-fadeIn text-slate-900 dark:text-white" onClick={() => setShowAdminEntry(false)}>
                                    <div className="bg-white dark:bg-slate-900 rounded-[2rem] shadow-2xl p-6 max-w-sm w-full border-t-8 border-slate-800" onClick={e=>e.stopPropagation()}>
                                        <h3 className="text-lg font-black mb-2 flex items-center gap-2"><i className="fas fa-lock text-slate-400"></i>관리자/총무 접근</h3>
                                        <p className="text-xs text-slate-500 dark:text-slate-400 mb-4">권한이 필요합니다. 부여받은 코드를 입력하세요.</p>
                                        <input type="password" value={adminPass} onChange={e=>setAdminPass(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleAdminLogin()} className="w-full p-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl outline-none focus:border-slate-800 dark:focus:border-slate-500 mb-4" placeholder="비밀번호" />
                                        <div className="flex gap-2">
                                            <button onClick={() => setShowAdminEntry(false)} className="flex-1 py-3 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 rounded-xl font-bold">취소</button>
                                            <button onClick={handleAdminLogin} className="flex-1 py-3 bg-slate-800 text-white rounded-xl font-black shadow-md hover:bg-slate-900">확인</button>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </main>
                    </div>
                );
            }
            return pageContent;
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
