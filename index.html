<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>라임길드 통합 관리 시스템</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
        
        :root {
            --brand-primary: #2563eb;
            --brand-slate: #f8fafc;
            --brand-dark: #0f172a;
        }

        body { 
            font-family: 'Noto Sans KR', 'Inter', sans-serif; 
            transition: background-color 0.2s;
            background-color: #f1f5f9; 
            letter-spacing: -0.025em;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            width: 100%;
        }

        .dark body { background-color: #020617; }

        .dashboard-card { 
            border-radius: 0.75rem; 
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
        }

        .dark .dashboard-card {
            background-color: #1e293b;
            border-color: #334155;
            color: #f1f5f9;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .animate-marquee {
            display: inline-block;
            white-space: nowrap;
            animation: marquee 30s linear infinite;
        }

        .app-container {
            width: 100%;
            max-width: 1440px;
            margin: 0 auto;
            min-height: 100vh;
        }

        .agent-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 0.75rem;
        }

        @media (min-width: 768px) {
            .agent-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1.25rem;
            }
        }

        @media (min-width: 1024px) {
            .desktop-layout {
                display: grid;
                grid-template-columns: 380px 1fr;
                gap: 1.5rem;
                align-items: start;
            }
        }

        .main-tab-active {
            background-color: var(--brand-primary);
            color: white;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
        }

        .custom-modal-overlay {
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
        }

        @keyframes slideUpFade {
            0% { transform: translateY(10px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        .log-animate {
            animation: slideUpFade 0.5s ease-out forwards;
        }
    </style>
</head>
<body class="text-slate-900 font-bold">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, serverTimestamp, deleteDoc, doc, setDoc, updateDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCOt_5hYk7Y9EDwo1Cd55et5-JT6k7LIcc",
            authDomain: "cat-hero-record.firebaseapp.com",
            projectId: "cat-hero-record",
            storageBucket: "cat-hero-record.firebasestorage.app",
            messagingSenderId: "1059204432454",
            appId: "1:1059204432454:web:b365ddd7d6a3da2c624047"
        };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'cat-hero-v24-final';
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const { useState, useEffect, useMemo } = React;

        const TOTAL_RESOURCES = 10; 
        const BASE_TIME_PER_SWORD = 2; // 1회당 2분, 총 20분
        const INITIAL_MEMBERS = ["늑대벼리", "마자유", "고기쟁이", "김동순", "일민", "캣핑", "콘스", "하늘구름바다", "창식2", "나는도비", "노들노들", "포저", "라잌늑냥", "베리발", "장귝", "유나s"];
        
        const mobs = ['일반몹', '보스'];

        const TITLES_LIST = [
            { id: 1, name: "라임의 새싹", score: 0 },
            { id: 2, name: "견습 길드원", score: 50 },
            { id: 3, name: "정식 길드원", score: 100 },
            { id: 4, name: "베테랑", score: 200 },
            { id: 5, name: "에이스", score: 400 },
            { id: 6, name: "정예 길드원", score: 600 },
            { id: 7, name: "전설의 길드원", score: 800 },
            { id: 8, name: "라임의 수호자", score: 1000 },
            { id: 9, name: "불멸의 전사", score: 1500 },
            { id: 10, name: "라임의 태양", score: 2000 },
            { id: 11, name: "길드의 자부심", score: 5000 },
            { id: 12, name: "라임의 신", score: 10000 },
        ];

        // 필터링용 고정 랜덤값 (세션 유지용)
        const stableRandomMap = {};
        INITIAL_MEMBERS.forEach(name => {
            stableRandomMap[name] = Math.random();
        });

        function App() {
            const [user, setUser] = useState(null);
            const [nickname, setNickname] = useState(localStorage.getItem('cat_hero_nickname') || '');
            const [isNameSet, setIsNameSet] = useState(!!localStorage.getItem('cat_hero_nickname'));
            const [isAdminMode, setIsAdminMode] = useState(false);
            const [adminPass, setAdminPass] = useState("");
            const [showAdminEntry, setShowAdminEntry] = useState(false);
            const [isDarkMode, setIsDarkMode] = useState(localStorage.getItem('isDarkMode') === 'true');
            const [mainCategory, setMainCategory] = useState('conquest');
            
            const [conquestFilter, setConquestFilter] = useState('timeSort');
            const [raidFilter, setRaidFilter] = useState('all');

            const [selectedDiaryDate, setSelectedDiaryDate] = useState(new Date().toISOString().split('T')[0]);
            const [selectedConquestSeasonIndex, setSelectedConquestSeasonIndex] = useState(0);

            const [selectedMob, setSelectedMob] = useState('일반몹');
            const [playMin, setPlayMin] = useState(0);
            const [playSec, setPlaySec] = useState(0);
            
            const [logs, setLogs] = useState([]);
            const [raidLogs, setRaidLogs] = useState([]);
            const [members, setMembers] = useState([]);
            const [notice, setNotice] = useState("시스템 가동 중입니다.");
            const [newNotice, setNewNotice] = useState("");
            const [newMemberName, setNewMemberName] = useState("");
            const [timeLeftStr, setTimeLeftStr] = useState("");

            const [uiAlert, setUiAlert] = useState(null);
            const [uiConfirm, setUiConfirm] = useState(null);

            const showAlert = (msg, type = 'success') => setUiAlert({ message: msg, type });
            const closeAlert = () => setUiAlert(null);

            const handleResetSession = () => {
                setUiConfirm({ 
                    message: "길드원 정보를 초기화하고 이름 선택 화면으로 돌아가시겠습니까?", 
                    onConfirm: () => { 
                        localStorage.removeItem('cat_hero_nickname'); 
                        setNickname(''); 
                        setIsNameSet(false); 
                        window.location.reload(); 
                    } 
                });
            };

            const recentDates = useMemo(() => {
                const dates = [];
                for(let i=0; i<7; i++) {
                    const d = new Date();
                    d.setDate(d.getDate() - i);
                    dates.push(d.toISOString().split('T')[0]);
                }
                return dates;
            }, []);

            useEffect(() => {
                if (isDarkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
                localStorage.setItem('isDarkMode', isDarkMode);
            }, [isDarkMode]);

            useEffect(() => {
                const updateTimer = () => {
                    const now = new Date();
                    const day = now.getDay();
                    let target = new Date();
                    target.setHours(8, 45, 0, 0);
                    const daysUntilMonday = (1 + 7 - day) % 7 || 7;
                    target.setDate(now.getDate() + daysUntilMonday);
                    const diff = target - now;
                    if (diff <= 0) setTimeLeftStr("시즌 종료");
                    else {
                        const d = Math.floor(diff / 86400000);
                        const h = Math.floor((diff % 86400000) / 3600000);
                        const m = Math.floor((diff % 3600000) / 60000);
                        const s = Math.floor((diff % 60000) / 1000);
                        setTimeLeftStr(`${d}일 ${h}:${m}:${s}`);
                    }
                };
                const timerId = setInterval(updateTimer, 1000);
                updateTimer();
                return () => clearInterval(timerId);
            }, []);

            useEffect(() => {
                const initAuth = async () => {
                    try { await signInAnonymously(auth); } catch (e) { console.error(e); } 
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsubMembers = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'members_v24'), (snapshot) => {
                    if (snapshot.empty) {
                        INITIAL_MEMBERS.forEach(name => addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'members_v24'), { name, score: 0 }));
                    } else {
                        setMembers(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort((a, b) => (b.score || 0) - (a.score || 0)));
                    }
                }, (error) => console.error(error));

                const unsubLogs = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'conquest_logs_v24'), (snapshot) => {
                    setLogs(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0)));
                }, (error) => console.error(error));

                const unsubRaidLogs = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'raid_logs_v24'), (snapshot) => {
                    setRaidLogs(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                }, (error) => console.error(error));

                const unsubSettings = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'global'), (snapshot) => {
                    if (snapshot.exists()) setNotice(snapshot.data().notice || "");
                }, (error) => console.error(error));

                return () => { unsubMembers(); unsubLogs(); unsubRaidLogs(); unsubSettings(); };
            }, [user]);

            const rankingData = useMemo(() => {
                const sortedByScore = [...members].sort((a, b) => (b.score || 0) - (a.score || 0));
                const raidCounts = {};
                raidLogs.forEach(l => { raidCounts[l.nickname] = (raidCounts[l.nickname] || 0) + Number(l.keysUsed || 0); });

                const getPersonalStatus = (name) => {
                    const m = members.find(mem => mem.name === name) || { score: 0 };
                    const currentScore = m.score || 0;
                    const currentTitle = [...TITLES_LIST].reverse().find(t => currentScore >= t.score) || TITLES_LIST[0];
                    const nextTitle = TITLES_LIST.find(t => t.score > currentScore);
                    const rankIdx = sortedByScore.findIndex(mem => mem.name === name);
                    return { currentTitle, nextTitle, score: currentScore, rank: rankIdx + 1, raidCount: raidCounts[name] || 0 };
                };
                return { weekly: sortedByScore, season: sortedByScore, getPersonalStatus };
            }, [members, raidLogs]);

            const stats = useMemo(() => {
                const playerMap = {};
                members.forEach(m => playerMap[m.name] = { swords: 0, totalInputTimeSec: 0, bossTimeSec: 0, raidToday: 0 });
                logs.forEach(l => { 
                    if (playerMap[l.nickname]) { 
                        playerMap[l.nickname].swords += 1; 
                        const duration = (Number(l.playMin || 0) * 60 + Number(l.playSec || 0));
                        playerMap[l.nickname].totalInputTimeSec += duration;
                        if (l.mob === '보스') playerMap[l.nickname].bossTimeSec += duration;
                    } 
                });
                const todayStart = new Date(); todayStart.setHours(0,0,0,0);
                raidLogs.forEach(l => { 
                    const ld = l.timestamp?.seconds ? new Date(l.timestamp.seconds * 1000) : new Date(); 
                    if (ld >= todayStart && playerMap[l.nickname]) playerMap[l.nickname].raidToday += Number(l.keysUsed || 0); 
                });
                return { playerMap };
            }, [logs, raidLogs, members]);

            const diaryHistory = useMemo(() => {
                const getRaidReport = (targetDateStr) => {
                    return members.map(m => {
                        const dayLogs = raidLogs.filter(l => {
                            const d = l.timestamp?.seconds ? new Date(l.timestamp.seconds * 1000) : new Date();
                            return d.toISOString().split('T')[0] === targetDateStr && l.nickname === m.name;
                        });
                        const used = dayLogs.reduce((acc, curr) => acc + Number(curr.keysUsed), 0);
                        return { name: m.name, used, remaining: Math.max(0, 2 - used) };
                    }).sort((a, b) => b.remaining - a.remaining);
                };

                const getConquestSeasonsReport = () => {
                    const seasons = [];
                    let currentSat = new Date();
                    const day = currentSat.getDay();
                    const diffToSat = (day + 1) % 7; 
                    currentSat.setDate(currentSat.getDate() - diffToSat);
                    currentSat.setHours(9, 0, 0, 0);

                    for (let i = 0; i < 4; i++) {
                        let start = new Date(currentSat);
                        start.setDate(currentSat.getDate() - (i * 7));
                        let end = new Date(start);
                        end.setDate(start.getDate() + 2);
                        end.setHours(9, 0, 0, 0);

                        const label = `${start.getMonth() + 1}/${start.getDate()} ~ ${end.getMonth() + 1}/${end.getDate()}`;
                        const reports = members.map(m => {
                            const seasonLogs = logs.filter(l => {
                                const ld = l.timestamp?.seconds ? new Date(l.timestamp.seconds * 1000) : new Date();
                                return ld >= start && ld <= end && l.nickname === m.name;
                            });
                            const usedSwords = seasonLogs.length;
                            const usedSec = seasonLogs.reduce((acc, curr) => acc + (Number(curr.playMin) * 60 + Number(curr.playSec)), 0);
                            const totalBudgetSec = TOTAL_RESOURCES * BASE_TIME_PER_SWORD * 60;
                            const remainingSec = Math.max(0, totalBudgetSec - usedSec);
                            return {
                                name: m.name,
                                usedSwords,
                                remainingSwords: Math.max(0, TOTAL_RESOURCES - usedSwords),
                                remainingMin: Math.floor(remainingSec / 60),
                                remainingSec: remainingSec % 60
                            };
                        }).sort((a, b) => b.remainingSwords - a.remainingSwords); 
                        seasons.push({ label, range: `${start.toLocaleString()} ~ ${end.toLocaleString()}`, reports });
                    }
                    return seasons;
                };
                return { getRaidReport, conquestSeasons: getConquestSeasonsReport() };
            }, [logs, raidLogs, members]);

            const handleSubmitConquest = async (e) => {
                e.preventDefault();
                if (!nickname || (playMin === 0 && playSec === 0)) return;
                const member = members.find(m => m.name === nickname);
                if ((stats.playerMap[nickname]?.swords || 0) >= TOTAL_RESOURCES) return showAlert(`한도(${TOTAL_RESOURCES}회) 초과`, "error");
                try {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'conquest_logs_v24'), { nickname, mob: selectedMob, playMin: Number(playMin), playSec: Number(playSec), timestamp: serverTimestamp(), uid: user.uid });
                    if (member) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members_v24', member.id), { score: (member.score || 0) + 5 });
                    setPlayMin(0); setPlaySec(0); showAlert("작전 보고 완료.");
                } catch (err) { showAlert("실패", "error"); }
            };

            const handleSubmitRaid = async (keys) => {
                const member = members.find(m => m.name === nickname);
                try {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'raid_logs_v24'), { nickname, keysUsed: keys, timestamp: serverTimestamp(), uid: user.uid });
                    if (member) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members_v24', member.id), { score: (member.score || 0) + (keys * 10) });
                    showAlert(`${keys}개 보고 완료.`);
                } catch (err) { showAlert("실패", "error"); }
            };

            const handleResetRaid = async () => {
                const today = new Date(); today.setHours(0, 0, 0, 0);
                const myLogs = raidLogs.filter(l => l.nickname === nickname && (l.timestamp?.seconds ? new Date(l.timestamp.seconds * 1000) : new Date()) >= today);
                setUiConfirm({ message: "오늘의 기록을 초기화하시겠습니까?", onConfirm: async () => { 
                    let totalKeys = 0;
                    for (const l of myLogs) { totalKeys += Number(l.keysUsed); await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'raid_logs_v24', l.id)); }
                    const member = members.find(m => m.name === nickname);
                    if (member) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members_v24', member.id), { score: Math.max(0, (member.score || 0) - (totalKeys * 10)) });
                    showAlert("초기화 완료"); 
                } });
            };

            const handleUpdateScore = async (id, newScore) => {
                try {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members_v24', id), { score: Number(newScore) });
                    showAlert("점수가 수정되었습니다.");
                } catch (e) { showAlert("실패", "error"); }
            };

            const adjustTime = (type, val) => {
                if (type === 'min') setPlayMin(p => Math.max(0, p + val));
                else setPlaySec(p => (p + val >= 60 ? (setPlayMin(m => m + 1), p + val - 60) : Math.max(0, p + val)));
            };

            const sortedConquestMembers = useMemo(() => {
                return members
                    .filter(m => {
                        if (conquestFilter === 'inactive') return (stats.playerMap[m.name]?.swords || 0) === 0;
                        return true;
                    })
                    .sort((a, b) => {
                        if (conquestFilter === 'all') {
                            return (stableRandomMap[a.name] || 0) - (stableRandomMap[b.name] || 0);
                        }
                        const timeA = stats.playerMap[a.name]?.totalInputTimeSec || 0;
                        const timeB = stats.playerMap[b.name]?.totalInputTimeSec || 0;
                        return timeA - timeB; 
                    });
            }, [members, conquestFilter, stats]);

            const sortedRaidMembers = useMemo(() => {
                return members
                    .filter(m => {
                        if (raidFilter === 'inactive') return (stats.playerMap[m.name]?.raidToday || 0) === 0;
                        return true;
                    })
                    .sort((a, b) => {
                        if (raidFilter === 'all') {
                            return (stableRandomMap[a.name] || 0) - (stableRandomMap[b.name] || 0);
                        }
                        return 0;
                    });
            }, [members, raidFilter, stats]);

            const latestLog = useMemo(() => logs[0] || null, [logs]);
            const myStatusObj = rankingData.getPersonalStatus(nickname);

            // 페이지 뷰 제어
            let pageContent;
            if (!isNameSet) {
                pageContent = (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-slate-200">
                        <div className="dashboard-card p-10 md:p-12 w-full max-sm:px-6 w-full max-w-sm text-center shadow-2xl border-t-8 border-blue-600 animate-fadeIn font-bold">
                            <h1 className="text-2xl font-black text-blue-600 mb-1 uppercase italic">LIME HQ</h1>
                            <p className="text-[10px] text-slate-400 mb-10 font-bold uppercase tracking-[0.2em]">Personnel Verification</p>
                            <div className="space-y-6 text-left">
                                <label className="text-[11px] font-black text-slate-500 uppercase ml-1 mb-2 block">길드원 인증</label>
                                <select className="w-full p-4 bg-slate-50 border-2 border-slate-200 focus:border-blue-500 outline-none rounded-xl font-black text-slate-900" value={nickname} onChange={e => setNickname(e.target.value)}>
                                    <option value="">본인 성명을 선택하십시오</option>
                                    {members.map(m => <option key={m.id} value={m.name}>{m.name}</option>)}
                                </select>
                                <button onClick={() => { if(nickname) { localStorage.setItem('cat_hero_nickname', nickname); setIsNameSet(true); } }} className="w-full bg-blue-600 text-white font-black py-4 rounded-xl shadow-lg hover:bg-blue-700 active:scale-95 transition-all">대시보드 접속</button>
                                <button onClick={() => setShowAdminEntry(true)} className="w-full text-center text-[9px] text-slate-400 font-bold uppercase mt-6">Administrator Portal</button>
                            </div>
                        </div>
                    </div>
                );
            } else if (isAdminMode) {
                pageContent = (
                    <div className="fixed inset-0 z-[400] overflow-y-auto bg-slate-100 dark:bg-slate-950 p-4 md:p-8 animate-fadeIn text-slate-900 font-bold">
                        <div className="max-w-4xl mx-auto dashboard-card p-6 md:p-8 border-t-8 border-slate-800 shadow-2xl">
                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 gap-4 border-b pb-6 text-slate-900 dark:text-white">
                                <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 bg-slate-100 rounded-xl flex items-center justify-center text-slate-800 font-bold"><i className="fas fa-shield-alt"></i></div>
                                    <h2 className="text-xl md:text-2xl font-black italic">관리 센터</h2>
                                </div>
                                <button onClick={() => { setIsAdminMode(false); }} className="w-full md:w-auto px-6 py-2.5 bg-slate-100 hover:bg-slate-200 rounded-xl font-black shadow-sm text-slate-900 uppercase text-xs font-black">나가기</button>
                            </div>
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 font-black">
                                <div className="space-y-8 font-black">
                                    <section>
                                        <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3 block font-black">전체 공지사항</label>
                                        <div className="flex gap-2">
                                            <input type="text" className="flex-1 p-3 border-2 border-slate-100 rounded-xl outline-none focus:border-blue-500 font-bold text-sm text-slate-900 font-black" value={newNotice} onChange={e => setNewNotice(e.target.value)} placeholder="실시간 공지 입력" />
                                            <button onClick={async () => { await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'global'), { notice: newNotice }); showAlert("반영됨"); }} className="px-5 bg-blue-600 text-white rounded-xl font-black shadow-lg">송출</button>
                                        </div>
                                    </section>
                                    <section>

                                                    <thead className="bg-slate-50 dark:bg-slate-800 text-slate-400 text-[10px] uppercase border-b font-black font-black font-black"><tr><th className="px-5 py-4 font-black">순위</th><th className="px-5 py-4 font-black">길드원</th><th className="px-5 py-4 text-right font-black">점수</th></tr></thead>
                                                    <tbody className="divide-y font-black dark:text-white font-black font-black">
                                                        {rankingData.weekly.slice(0, 10).map((r, i) => (
                                                            <tr key={r.name} className={`hover:bg-slate-50 dark:hover:bg-slate-800/40 ${r.name === nickname ? 'bg-blue-50/50 dark:bg-blue-900/20' : ''} font-black font-black font-black`}><td className="px-5 py-5 italic text-xl font-black font-black font-black">{i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `#${i+1}`}</td><td className="px-5 py-5 font-black font-black"><div className="flex flex-col font-black font-black font-black font-black"><span className="font-black font-black font-black font-black">{r.name}</span><span className="text-[9px] text-blue-500 italic truncate font-black font-black font-black">{rankingData.getPersonalStatus(r.name).currentTitle.name}</span></div></td><td className="px-5 py-5 text-right font-black text-blue-600 italic whitespace-nowrap font-black font-black font-black font-black">{r.score} P</td></tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </section>
                                        <section className="space-y-6 font-black font-black">
                                            <h3 className="font-black text-2xl italic uppercase text-emerald-600 px-2 font-black font-black font-black">시즌 명예의 전당</h3>
                                            <div className="dashboard-card overflow-hidden font-black">
                                                <table className="w-full text-left font-black font-black">
                                                    <thead className="bg-slate-50 dark:bg-slate-800 text-slate-400 text-[10px] uppercase border-b font-black font-black font-black"><tr><th className="px-5 py-4 font-black font-black">순위</th><th className="px-5 py-4 font-black font-black">길드원</th><th className="px-5 py-4 text-right font-black font-black">점수</th></tr></thead>
                                                    <tbody className="divide-y font-black dark:text-white font-black font-black">
                                                        {rankingData.season.slice(0, 10).map((r, i) => (
                                                            <tr key={r.name} className={`hover:bg-slate-50 dark:hover:bg-slate-800/40 ${r.name === nickname ? 'bg-emerald-50/50 dark:bg-emerald-900/20' : ''} font-black font-black font-black font-black`}><td className="px-5 py-5 italic text-xl font-black font-black font-black font-black">{i === 0 ? '👑' : i === 1 ? '💎' : i === 2 ? '⭐' : `#${i+1}`}</td><td className="px-5 py-5 font-black font-black font-black font-black font-black font-black"><div><span>{r.name}</span><span className="text-[9px] text-emerald-500 italic truncate font-black font-black font-black font-black font-black">{rankingData.getPersonalStatus(r.name).currentTitle.name}</span></div></td><td className="px-5 py-5 text-right font-black text-emerald-600 italic whitespace-nowrap font-black font-black font-black font-black font-black">{r.score} P</td></tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </section>
                                    </div>
                                </div>
                            )}

                            {mainCategory === 'history' && (
                                <div className="animate-fadeIn space-y-10 max-w-4xl mx-auto font-black font-black font-black font-black">
                                    <div className="flex flex-col gap-8 font-black font-black">
                                        <div className="flex justify-between items-center px-2 font-black font-black">
                                            <h3 className="font-black text-2xl italic uppercase text-pink-500 font-black font-black">작전 다이어리</h3>
                                            <div className="text-[10px] text-slate-400 font-black uppercase tracking-widest font-black font-black">Missed Ops Detailed Analytics</div>
                                        </div>
                                        <section className="space-y-6 font-black font-black font-black font-black">
                                            <div className="flex items-center gap-2 px-2 font-black font-black font-black">
                                                <div className="w-1.5 h-6 bg-emerald-500 rounded-full font-black font-black font-black"></div>
                                                <h4 className="font-black text-lg italic uppercase text-emerald-600 font-black font-black font-black">일별 레이드 상세 현황</h4>
                                            </div>
                                            <div className="flex gap-3 overflow-x-auto no-scrollbar pb-4 px-2 font-black font-black font-black font-black">
                                                {recentDates.map(date => {
                                                    const d = new Date(date);
                                                    const isToday = new Date().toISOString().split('T')[0] === date;
                                                    return (
                                                        <button key={date} onClick={() => setSelectedDiaryDate(date)} className={`shrink-0 w-24 py-5 rounded-[2rem] flex flex-col items-center gap-1 transition-all border-2 ${selectedDiaryDate === date ? 'bg-emerald-500 text-white border-emerald-500 shadow-xl scale-105 font-black font-black font-black' : 'bg-white dark:bg-slate-800 text-slate-400 border-slate-100 dark:border-slate-700 font-black font-black font-black font-black font-black font-black font-black'}`}>
                                                            <span className="text-[10px] font-black uppercase tracking-tighter font-black font-black font-black">{['일','월','화','수','목','금','토'][d.getDay()]}요일</span>
                                                            <span className="text-xl font-black italic leading-none font-black font-black">{d.getDate()}</span>
                                                            {isToday && <span className="text-[8px] font-black bg-white text-emerald-500 px-2 py-0.5 rounded-full mt-1.5 shadow-sm font-black font-black font-black font-black font-black font-black">TODAY</span>}
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                            <div className="dashboard-card p-8 border-l-[12px] border-emerald-500 shadow-lg bg-white dark:bg-slate-800 font-black font-black font-black font-black">
                                                <div className="flex justify-between items-center mb-8 border-b pb-4 font-black font-black font-black">
                                                    <h5 className="font-black text-slate-400 uppercase tracking-widest text-xs font-black font-black font-black font-black font-black font-black"><i className="far fa-calendar-alt mr-2 font-black font-black font-black font-black"></i> {selectedDiaryDate} RAID Report</h5>
                                                </div>
                                                <div className="agent-grid font-black font-black font-black font-black font-black">
                                                    {diaryHistory.getRaidReport(selectedDiaryDate).map(report => (
                                                        <div key={report.name} className={`p-4 rounded-2xl border-2 flex items-center justify-between transition-all ${report.remaining > 0 ? 'border-red-100 bg-red-50/30 font-black' : 'border-emerald-100 bg-emerald-50/20 font-black'} font-black font-black font-black font-black font-black font-black font-black`}>
                                                            <div className="flex flex-col font-black font-black font-black font-black font-black">
                                                                <span className="font-bold text-slate-700 dark:text-slate-200 font-black font-black font-black">{report.name}</span>
                                                                <span className={`text-[10px] font-black ${report.remaining > 0 ? 'text-red-500 animate-pulse font-black font-black' : 'text-emerald-500 font-black font-black'} font-black font-black font-black`}>{report.remaining > 0 ? `열쇠 ${report.remaining}개 미사용` : '열쇠 사용 완료'}</span>
                                                            </div>
                                                            <div className="text-right font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black">
                                                                <div className="text-xs font-black text-slate-400 uppercase font-black font-black font-black">Usage</div>
                                                                <div className={`text-lg font-black italic ${report.remaining > 0 ? 'text-red-600 font-black' : 'text-emerald-600 font-black'} font-black font-black font-black font-black font-black font-black`}>{report.used} / 2</div>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        </section>
                                        <hr className="border-slate-200 dark:border-slate-700 mx-2 font-black font-black font-black" />
                                        <section className="space-y-6 font-black font-black font-black font-black font-black font-black font-black font-black">
                                            <div className="flex items-center gap-2 px-2 font-black font-black font-black">
                                                <div className="w-1.5 h-6 bg-blue-500 rounded-full font-black"></div>
                                                <h4 className="font-black text-lg italic uppercase text-blue-600 font-black font-black font-black">균격 시즌 상세 현황 (최근 4주)</h4>
                                            </div>
                                            <div className="flex gap-3 overflow-x-auto no-scrollbar pb-4 px-2 font-black font-black font-black font-black font-black">
                                                {diaryHistory.conquestSeasons.map((season, idx) => (
                                                    <button key={idx} onClick={() => setSelectedConquestSeasonIndex(idx)} className={`shrink-0 px-6 py-5 rounded-[2rem] flex flex-col items-center gap-1 transition-all border-2 ${selectedConquestSeasonIndex === idx ? 'bg-blue-500 text-white border-blue-500 shadow-xl scale-105 font-black' : 'bg-white dark:bg-slate-800 text-slate-400 border-slate-100 dark:border-slate-700 font-black font-black font-black font-black font-black'}`}>
                                                        <span className="text-[10px] font-black uppercase tracking-tighter font-black font-black font-black">{idx === 0 ? 'Current' : `${idx}주 전`}</span>
                                                        <span className="text-sm font-black italic leading-none whitespace-nowrap font-black font-black font-black">{season.label}</span>
                                                    </button>
                                                ))}
                                            </div>
                                            <div className="dashboard-card p-8 border-l-[12px] border-blue-500 shadow-lg bg-white dark:bg-slate-800 font-black font-black font-black font-black">
                                                <div className="flex flex-col mb-8 border-b pb-4 font-black font-black font-black font-black">
                                                    <h5 className="font-black text-slate-400 uppercase tracking-widest text-xs mb-1 font-black font-black font-black font-black"><i className="fas fa-shield-alt mr-2 font-black font-black font-black"></i> Conquest Detail Report</h5>
                                                    <p className="text-[10px] font-bold text-blue-400 italic font-black font-black font-black">{diaryHistory.conquestSeasons[selectedConquestSeasonIndex].range}</p>
                                                </div>
                                                <div className="agent-grid font-black font-black font-black font-black font-black font-black font-black">
                                                    {diaryHistory.conquestSeasons[selectedConquestSeasonIndex].reports.map(report => (
                                                        <div key={report.name} className={`p-5 rounded-[2rem] border-2 flex flex-col gap-4 transition-all ${report.remainingSwords > 0 ? 'border-blue-100 bg-blue-50/20 font-black' : 'border-slate-100 bg-slate-50/30 grayscale opacity-80 font-black font-black font-black font-black font-black font-black'} font-black font-black font-black`}>
                                                            <div className="flex justify-between items-start font-black font-black font-black">
                                                                <div className="flex flex-col font-black font-black font-black">
                                                                    <span className="text-lg font-black italic text-slate-800 dark:text-white leading-none mb-1 font-black font-black font-black font-black font-black">{report.name}</span>
                                                                    <span className={`text-[10px] font-bold ${report.remainingSwords > 0 ? 'text-blue-600 font-black' : 'text-slate-400 font-black font-black'} font-black font-black font-black`}>{report.remainingSwords > 0 ? `${report.remainingSwords}자루 남음` : '전부 사용됨'}</span>
                                                                </div>
                                                                <div className="bg-slate-900 text-white px-3 py-1 rounded-full text-[10px] font-black italic font-black font-black font-black font-black font-black">{report.usedSwords} / 10</div>
                                                            </div>
                                                            <div className="flex items-end justify-between font-black font-black font-black font-black">
                                                                <div className="flex flex-col font-black font-black font-black font-black font-black font-black font-black">
                                                                    <span className="text-[9px] text-slate-400 font-black uppercase tracking-widest font-black font-black font-black font-black font-black font-black">Left Time</span>
                                                                    <span className={`text-base font-black font-mono leading-none ${report.remainingSwords > 0 ? 'text-blue-500 font-black font-black' : 'text-slate-400 font-black font-black font-black font-black font-black font-black font-black'} font-black font-black font-black font-black font-black font-black`}>{report.remainingMin}m {report.remainingSec}s</span>
                                                                </div>
                                                                <div className="w-16 h-1.5 bg-slate-100 dark:bg-black/30 rounded-full overflow-hidden font-black font-black font-black font-black font-black font-black font-black">
                                                                    <div className="h-full bg-blue-500 transition-all duration-1000 font-black font-black font-black font-black font-black font-black font-black" style={{ width: `${(report.usedSwords / 10) * 100}%` }}></div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        </section>
                                    </div>
                                </div>
                            )}
                        </main>

                        <div className="fixed bottom-3 md:bottom-6 left-1/2 -translate-x-1/2 w-[95%] md:w-full md:max-w-6xl z-[150] animate-fadeIn font-bold font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black">
                            <div className="bg-slate-950/95 backdrop-blur-3xl text-white px-4 md:px-12 py-3.5 md:py-5 rounded-[2rem] md:rounded-[3.5rem] flex flex-col md:flex-row justify-between items-center shadow-2xl border border-white/10 gap-3 md:gap-0 font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black">
                                <div className="flex items-center gap-4 w-full md:w-auto min-w-0 border-b md:border-b-0 border-white/10 pb-2 md:pb-0 font-black font-black font-black font-black font-black font-black font-black">
                                    <div className="flex flex-col min-w-0 font-bold font-black font-black font-black font-black font-black font-black font-black font-black font-black">
                                        <span className="text-[8px] md:text-[9px] text-blue-400 font-black uppercase tracking-[0.2em] mb-0.5 font-black font-black font-black">식별된 길드원</span>
                                        <div className="flex items-baseline gap-2 font-black font-black font-black font-black font-black font-black">
                                            <span className="text-sm md:text-xl font-black italic tracking-tighter truncate font-black font-black font-black font-black font-black">{nickname}</span>
                                            <span className="text-[8px] md:text-[10px] text-blue-300 italic truncate font-black font-black font-black font-black font-black font-black">{myStatusObj.currentTitle.name}</span>
                                        </div>
                                        {myStatusObj.nextTitle && (
                                            <span className="text-[7px] md:text-[9px] text-slate-400 font-bold font-black font-black font-black font-black font-black font-black font-black font-black">다음 단계까지 <span className="text-yellow-400 font-black font-black font-black font-black font-black font-black font-black">{myStatusObj.nextTitle.score - myStatusObj.score}p 남음</span></span>
                                        )}
                                    </div>
                                </div>
                                <div className="hidden lg:flex flex-col items-center justify-center flex-1 px-8 border-x border-white/10 mx-6 overflow-hidden font-black font-black font-black font-black font-black font-black font-black font-black font-black">
                                    <span className="text-[8px] text-slate-500 uppercase tracking-widest mb-1 font-black font-black font-black font-black font-black font-black font-black">실시간 작전 피드</span>
                                    <div className="text-[10px] text-slate-200 italic truncate max-w-full text-center log-animate font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black" key={latestLog ? latestLog.timestamp?.seconds : 'init'}>
                                        {latestLog ? (<>🚩 <span className="text-blue-400 font-black font-black font-black font-black font-black font-black font-black font-black">[{latestLog.nickname}]</span> {latestLog.mob} 공략 성공</>) : ("새로운 작전 데이터를 기다리는 중...")}
                                    </div>
                                </div>
                                <div className="flex items-center justify-around md:justify-end gap-4 md:gap-10 w-full md:w-auto shrink-0 font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black">
                                    <div className="flex flex-col text-center font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black">
                                        <span className="text-[8px] md:text-[9px] text-emerald-400 font-black uppercase tracking-[0.1em] mb-0.5 font-black font-black font-black font-black font-black font-black">나의 레이드 성과</span>
                                        <div className="flex items-center justify-center gap-1.5 font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black">
                                            <span className="text-xs md:text-lg font-black italic font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black">{myStatusObj.rank}위</span>
                                            <span className="text-[8px] md:text-[10px] text-slate-500 font-bold font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black">({myStatusObj.raidCount}개)</span>
                                        </div>
                                    </div>
                                    <div className="h-8 w-px bg-white/10 font-black font-black font-black font-black font-black font-black font-black"></div>
                                    <div className="flex flex-col text-center font-black font-black font-black font-black font-black font-black font-black">
                                        <span className="text-[8px] md:text-[9px] text-slate-500 font-black uppercase mb-0.5 font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black">시스템 상태</span>
                                        <div className="flex items-center gap-1.5 font-black justify-center font-black font-black font-black font-black font-black font-black font-black font-black font-black">
                                            <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse font-black font-black font-black font-black font-black font-black font-black font-black font-black"></span>
                                            <span className="text-[9px] md:text-xs font-black uppercase tracking-tighter text-emerald-400 font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black">정상</span>
                                        </div>
                                    </div>
                                    <button onClick={handleResetSession} className="bg-white/10 hover:bg-red-600 text-white p-2.5 md:p-3.5 rounded-xl md:rounded-2xl text-[9px] md:text-[11px] font-black uppercase transition-all border border-white/5 active:scale-90 font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black"><i className="fas fa-power-off font-black font-black font-black font-black font-black font-black"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <React.Fragment>
                    {pageContent}
                    {showAdminEntry && (
                        <div className="fixed inset-0 z-[1000] flex items-center justify-center p-4 bg-black/60 backdrop-blur-md animate-fadeIn font-bold font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black">
                            <div className="bg-white dark:bg-slate-800 dashboard-card p-8 w-full max-w-[320px] border-t-8 border-blue-600 shadow-2xl font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black">
                                <div className="mb-6 text-center font-black font-black font-black font-black font-black font-black font-black font-black font-black">
                                    <p className="text-[10px] text-slate-500 uppercase tracking-widest mb-1 font-black font-black font-black font-black font-black font-black font-black font-black">보안 인증</p>
                                    <h3 className="text-lg font-black dark:text-white font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black">관리자 코드 입력</h3>
                                </div>
                                <div className="flex flex-col gap-4 font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black">
                                    <input type="password" autoFocus placeholder="Passkey" className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl px-4 py-4 text-center text-xl outline-none focus:border-blue-500 text-slate-900 dark:text-white font-black tracking-widest font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black" value={adminPass} onChange={e => setAdminPass(e.target.value)} onKeyDown={e => { if(e.key === 'Enter' && adminPass === "123456") { setIsAdminMode(true); setShowAdminEntry(false); setAdminPass(""); } }} />
                                    <div className="grid grid-cols-2 gap-3 font-black font-black font-black font-black font-black font-black">
                                        <button onClick={() => { setShowAdminEntry(false); setAdminPass(""); }} className="py-3 bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-white rounded-xl font-bold text-sm font-black font-black font-black font-black font-black">취소</button>
                                        <button onClick={() => { if(adminPass === "123456") { setIsAdminMode(true); setShowAdminEntry(false); setAdminPass(""); } else { showAlert("비밀번호 오류", "error"); } }} className="py-3 bg-blue-600 text-white rounded-xl font-bold text-sm shadow-lg font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black">인증</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                    {uiAlert && (
                        <div className="fixed inset-0 z-[1001] flex items-center justify-center p-4 custom-modal-overlay animate-fadeIn text-slate-900 font-bold font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black">
                            <div className="bg-white dark:bg-slate-900 rounded-[2.5rem] shadow-2xl p-10 max-w-sm w-full text-center border-t-[8px] border-blue-500 font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black">
                                <p className="text-lg mb-8 dark:text-white font-bold font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black">{uiAlert.message}</p>
                                <button onClick={closeAlert} className="w-full bg-blue-600 text-white py-4 rounded-2xl font-black shadow-lg font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black">확인</button>
                            </div>
                        </div>
                    )}
                    {uiConfirm && (
                        <div className="fixed inset-0 z-[1001] flex items-center justify-center p-4 custom-modal-overlay animate-fadeIn text-slate-900 font-bold font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black">
                            <div className="bg-white dark:bg-slate-900 rounded-[2.5rem] shadow-2xl p-10 max-w-sm w-full text-center border-t-[8px] border-orange-500 font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black">
                                <p className="text-lg mb-8 dark:text-white font-bold font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black">{uiConfirm.message}</p>
                                <div className="grid grid-cols-2 gap-3 font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black">
                                    <button onClick={() => setUiConfirm(null)} className="py-4 bg-slate-100 dark:bg-slate-800 dark:text-white rounded-2xl font-black font-bold font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black">취소</button>
                                    <button onClick={() => { uiConfirm.onConfirm(); setUiConfirm(null); }} className="py-4 bg-orange-500 text-white rounded-2xl font-black shadow-lg font-bold font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black">확인</button>
                                </div>
                            </div>
                        </div>
                    )}
                </React.Fragment>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
