<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>길드 통합 관리 시스템</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
        
        :root {
            --brand-primary: #2563eb;
            --brand-slate: #f8fafc;
            --brand-dark: #0f172a;
        }

        body { 
            font-family: 'Noto Sans KR', 'Inter', sans-serif; 
            transition: background-color 0.2s, color 0.2s;
            background-color: #f1f5f9; 
            letter-spacing: -0.025em;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            width: 100%;
        }

        .dark body { background-color: #020617; }

        .dashboard-card { 
            border-radius: 0.75rem; 
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            transition: background-color 0.2s, border-color 0.2s;
        }

        .dark .dashboard-card {
            background-color: #1e293b;
            border-color: #334155;
            color: #f1f5f9;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .animate-marquee {
            display: inline-block;
            white-space: nowrap;
            animation: marquee 30s linear infinite;
        }

        .app-container {
            width: 100%;
            max-width: 1440px;
            margin: 0 auto;
            min-height: 100vh;
        }

        .agent-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 0.75rem;
        }

        @media (min-width: 768px) {
            .agent-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1.25rem;
            }
        }

        @media (min-width: 1024px) {
            .desktop-layout {
                display: grid;
                grid-template-columns: 380px 1fr;
                gap: 1.5rem;
                align-items: start;
            }
        }

        .main-tab-active {
            background-color: var(--brand-primary);
            color: white;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
        }

        .custom-modal-overlay {
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
        }

        @keyframes slideUpFade {
            0% { transform: translateY(10px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        .log-animate {
            animation: slideUpFade 0.5s ease-out forwards;
        }
    </style>
</head>
<body class="text-slate-900 dark:text-slate-100 font-bold">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, serverTimestamp, deleteDoc, doc, setDoc, updateDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCOt_5hYk7Y9EDwo1Cd55et5-JT6k7LIcc",
            authDomain: "cat-hero-record.firebaseapp.com",
            projectId: "cat-hero-record",
            storageBucket: "cat-hero-record.firebasestorage.app",
            messagingSenderId: "1059204432454",
            appId: "1:1059204432454:web:b365ddd7d6a3da2c624047"
        };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'cat-hero-v24-final';
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const { useState, useEffect, useMemo } = React;

        const TOTAL_RESOURCES = 10; 
        const BASE_TIME_PER_SWORD = 2; // 1회당 2분, 총 20분
        const INITIAL_MEMBERS = ["늑대벼리", "마자유", "고기쟁이", "김동순", "일민", "캣핑", "콘스", "하늘구름바다", "창식2", "나는도비", "노들노들", "포저", "라잌늑냥", "베리발", "장귝", "유나s"];
        
        const TITLES_LIST = [
            { id: 1, name: "길드의 새싹", score: 0 },
            { id: 2, name: "견습 길드원", score: 50 },
            { id: 3, name: "정식 길드원", score: 100 },
            { id: 4, name: "베테랑", score: 200 },
            { id: 5, name: "에이스", score: 400 },
            { id: 6, name: "정예 길드원", score: 600 },
            { id: 7, name: "전설의 길드원", score: 800 },
            { id: 8, name: "길드의 수호자", score: 1000 },
            { id: 9, name: "불멸의 전사", score: 1500 },
            { id: 10, name: "길드의 태양", score: 2000 },
            { id: 11, name: "길드의 자부심", score: 5000 },
            { id: 12, name: "길드의 신", score: 10000 },
        ];

        const STANDARD_REWARD_TYPES = ['장비', '레시피', '픽업', '룬 소환서', '특수룬 소환서'];
        const EQUIP_TYPES = ['모자', '장갑', '목도리', '신발'];

        const stableRandomMap = {};
        INITIAL_MEMBERS.forEach(name => {
            stableRandomMap[name] = Math.random();
        });

        const copyToClipboard = (text, onSuccess) => {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            if(onSuccess) onSuccess();
        };

        function App() {
            // User and system states
            const [user, setUser] = useState(null);
            const [nickname, setNickname] = useState(localStorage.getItem('cat_hero_nickname') || '');
            const [isNameSet, setIsNameSet] = useState(!!localStorage.getItem('cat_hero_nickname'));
            const [isAdminMode, setIsAdminMode] = useState(false);
            const [adminPass, setAdminPass] = useState("");
            const [showAdminEntry, setShowAdminEntry] = useState(false);
            const [isDarkMode, setIsDarkMode] = useState(localStorage.getItem('isDarkMode') === 'true');
            const [mainCategory, setMainCategory] = useState('conquest'); // conquest | raid | ranking | history
            
            // Layout and view states
            const [conquestFilter, setConquestFilter] = useState('timeSort');
            const [raidFilter, setRaidFilter] = useState('all');
            const [selectedDiaryDate, setSelectedDiaryDate] = useState(new Date().toISOString().split('T')[0]);
            const [selectedConquestSeasonIndex, setSelectedConquestSeasonIndex] = useState(0);

            // Conquest (균격) Multiple Input states
            const [normalMobCount, setNormalMobCount] = useState(0);
            const [bossMobCount, setBossMobCount] = useState(0);
            const [playMin, setPlayMin] = useState(0);
            const [playSec, setPlaySec] = useState(0);
            
            // Strike (일격) sub-tabs & calc
            const [strikeSubTab, setStrikeSubTab] = useState('calc'); // 'calc' | 'dist' | 'report'
            const [selectedCalcMembers, setSelectedCalcMembers] = useState([]); 
            const [calcMemberSearch, setCalcMemberSearch] = useState('');
            const [bossScore, setBossScore] = useState(''); // Optional Boss Score
            
            // Distribution states
            const [selectedRewards, setSelectedRewards] = useState({}); // { '픽업': '2', '장비': '' }
            const [detailedEquips, setDetailedEquips] = useState([]); // [{ type: '모자', qty: '1', id: ... }]
            const [distResultsText, setDistResultsText] = useState(null);

            // My Stats Input states
            const [myStatVal, setMyStatVal] = useState('');
            const [myMountVal, setMyMountVal] = useState('');

            // Data streams from Firebase
            const [logs, setLogs] = useState([]);
            const [raidLogs, setRaidLogs] = useState([]);
            const [members, setMembers] = useState([]);
            const [notice, setNotice] = useState("시스템 가동 중입니다.");
            const [newNotice, setNewNotice] = useState("");
            const [newMemberName, setNewMemberName] = useState("");
            const [timeLeftStr, setTimeLeftStr] = useState("");

            // Modals & UI
            const [uiAlert, setUiAlert] = useState(null);
            const [uiConfirm, setUiConfirm] = useState(null);
            const [showFullNotice, setShowFullNotice] = useState(false);
            const [showFullLogs, setShowFullLogs] = useState(false);

            const showAlert = (msg, type = 'success') => setUiAlert({ message: msg, type });
            const closeAlert = () => setUiAlert(null);

            const handleResetSession = () => {
                setUiConfirm({ 
                    message: "길드원 정보를 초기화하고 이름 선택 화면으로 돌아가시겠습니까?", 
                    onConfirm: () => { 
                        localStorage.removeItem('cat_hero_nickname'); 
                        setNickname(''); 
                        setIsNameSet(false); 
                        window.location.reload(); 
                    } 
                });
            };

            const recentDates = useMemo(() => {
                const dates = [];
                for(let i=0; i<7; i++) {
                    const d = new Date();
                    d.setDate(d.getDate() - i);
                    dates.push(d.toISOString().split('T')[0]);
                }
                return dates;
            }, []);

            useEffect(() => {
                if (isDarkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
                localStorage.setItem('isDarkMode', isDarkMode);
            }, [isDarkMode]);

            useEffect(() => {
                const updateTimer = () => {
                    const now = new Date();
                    const day = now.getDay();
                    let target = new Date();
                    target.setHours(8, 45, 0, 0);
                    const daysUntilMonday = (1 + 7 - day) % 7 || 7;
                    target.setDate(now.getDate() + daysUntilMonday);
                    const diff = target - now;
                    if (diff <= 0) setTimeLeftStr("시즌 종료");
                    else {
                        const d = Math.floor(diff / 86400000);
                        const h = Math.floor((diff % 86400000) / 3600000);
                        const m = Math.floor((diff % 3600000) / 60000);
                        const s = Math.floor((diff % 60000) / 1000);
                        setTimeLeftStr(`${d}일 ${h}:${m}:${s}`);
                    }
                };
                const timerId = setInterval(updateTimer, 1000);
                updateTimer();
                return () => clearInterval(timerId);
            }, []);

            useEffect(() => {
                const initAuth = async () => {
                    try { await signInAnonymously(auth); } catch (e) { console.error(e); } 
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsubMembers = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'members_v24'), (snapshot) => {
                    if (snapshot.empty) {
                        INITIAL_MEMBERS.forEach(name => addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'members_v24'), { name, score: 0 }));
                    } else {
                        setMembers(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort((a, b) => (b.score || 0) - (a.score || 0)));
                    }
                }, (error) => console.error(error));

                const unsubLogs = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'conquest_logs_v24'), (snapshot) => {
                    setLogs(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0)));
                }, (error) => console.error(error));

                const unsubRaidLogs = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'raid_logs_v24'), (snapshot) => {
                    setRaidLogs(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                }, (error) => console.error(error));

                const unsubSettings = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'global'), (snapshot) => {
                    if (snapshot.exists()) setNotice(snapshot.data().notice || "");
                }, (error) => console.error(error));

                return () => { unsubMembers(); unsubLogs(); unsubRaidLogs(); unsubSettings(); };
            }, [user]);

            const rankingData = useMemo(() => {
                const sortedByScore = [...members].sort((a, b) => (b.score || 0) - (a.score || 0));
                const raidCounts = {};
                raidLogs.forEach(l => { raidCounts[l.nickname] = (raidCounts[l.nickname] || 0) + Number(l.keysUsed || 0); });

                const getPersonalStatus = (name) => {
                    const m = members.find(mem => mem.name === name) || { score: 0 };
                    const currentScore = m.score || 0;
                    const currentTitle = [...TITLES_LIST].reverse().find(t => currentScore >= t.score) || TITLES_LIST[0];
                    const nextTitle = TITLES_LIST.find(t => t.score > currentScore);
                    const rankIdx = sortedByScore.findIndex(mem => mem.name === name);
                    return { currentTitle, nextTitle, score: currentScore, rank: rankIdx + 1, raidCount: raidCounts[name] || 0 };
                };
                return { weekly: sortedByScore, season: sortedByScore, getPersonalStatus };
            }, [members, raidLogs]);

            const stats = useMemo(() => {
                const playerMap = {};
                members.forEach(m => playerMap[m.name] = { swords: 0, totalInputTimeSec: 0, bossTimeSec: 0, raidToday: 0 });
                logs.forEach(l => { 
                    if (playerMap[l.nickname]) { 
                        playerMap[l.nickname].swords += 1; 
                        const duration = (Number(l.playMin || 0) * 60 + Number(l.playSec || 0));
                        playerMap[l.nickname].totalInputTimeSec += duration;
                        if (l.mob === '보스') playerMap[l.nickname].bossTimeSec += duration;
                    } 
                });
                const todayStart = new Date(); todayStart.setHours(0,0,0,0);
                raidLogs.forEach(l => { 
                    const ld = l.timestamp?.seconds ? new Date(l.timestamp.seconds * 1000) : new Date(); 
                    if (ld >= todayStart && playerMap[l.nickname]) playerMap[l.nickname].raidToday += Number(l.keysUsed || 0); 
                });
                return { playerMap };
            }, [logs, raidLogs, members]);

            const diaryHistory = useMemo(() => {
                const getRaidReport = (targetDateStr) => {
                    return members.map(m => {
                        const dayLogs = raidLogs.filter(l => {
                            const d = l.timestamp?.seconds ? new Date(l.timestamp.seconds * 1000) : new Date();
                            return d.toISOString().split('T')[0] === targetDateStr && l.nickname === m.name;
                        });
                        const used = dayLogs.reduce((acc, curr) => acc + Number(curr.keysUsed), 0);
                        return { name: m.name, used, remaining: Math.max(0, 2 - used) };
                    }).sort((a, b) => b.remaining - a.remaining);
                };

                const getConquestSeasonsReport = () => {
                    const seasons = [];
                    let currentSat = new Date();
                    const day = currentSat.getDay();
                    const diffToSat = (day + 1) % 7; 
                    currentSat.setDate(currentSat.getDate() - diffToSat);
                    currentSat.setHours(9, 0, 0, 0);

                    for (let i = 0; i < 4; i++) {
                        let start = new Date(currentSat);
                        start.setDate(currentSat.getDate() - (i * 7));
                        let end = new Date(start);
                        end.setDate(start.getDate() + 2);
                        end.setHours(9, 0, 0, 0);

                        const label = `${start.getMonth() + 1}/${start.getDate()} ~ ${end.getMonth() + 1}/${end.getDate()}`;
                        const reports = members.map(m => {
                            const seasonLogs = logs.filter(l => {
                                const ld = l.timestamp?.seconds ? new Date(l.timestamp.seconds * 1000) : new Date();
                                return ld >= start && ld <= end && l.nickname === m.name;
                            });
                            const usedSwords = seasonLogs.length;
                            const usedSec = seasonLogs.reduce((acc, curr) => acc + (Number(curr.playMin) * 60 + Number(curr.playSec)), 0);
                            const totalBudgetSec = TOTAL_RESOURCES * BASE_TIME_PER_SWORD * 60;
                            const remainingSec = Math.max(0, totalBudgetSec - usedSec);
                            return {
                                name: m.name,
                                usedSwords,
                                remainingSwords: Math.max(0, TOTAL_RESOURCES - usedSwords),
                                remainingMin: Math.floor(remainingSec / 60),
                                remainingSec: remainingSec % 60
                            };
                        }).sort((a, b) => b.remainingSwords - a.remainingSwords); 
                        seasons.push({ label, range: `${start.toLocaleString()} ~ ${end.toLocaleString()}`, reports });
                    }
                    return seasons;
                };
                return { getRaidReport, conquestSeasons: getConquestSeasonsReport() };
            }, [logs, raidLogs, members]);

            // 격추 수치 계산 도우미 함수: (스탯 + 6 + 탈것) * 10 + 1000
            const getMemberGyeokchu = (m) => {
                // 관리자가 직접 입력한 격추가 있다면 1순위로 사용
                if (m.directGyeokchu && Number(m.directGyeokchu) > 0) {
                    return Number(m.directGyeokchu);
                }
                // 그렇지 않다면 자동 계산식 사용
                const statVal = Math.floor(Number(m.stat) || 0);
                const mountVal = Math.floor(Number(m.mount) || 0);
                if (statVal > 0 || mountVal > 0) {
                    return (statVal + 6 + mountVal) * 10 + 1000;
                }
                return 0; // 등록 안됨
            };

            // 로그인 한 유저의 현재 제원을 불러와 state에 동기화
            useEffect(() => {
                if (nickname && members.length > 0) {
                    const myInfo = members.find(m => m.name === nickname);
                    if (myInfo) {
                        setMyStatVal(myInfo.stat || '');
                        setMyMountVal(myInfo.mount || '');
                    }
                }
            }, [nickname, members]);

            // 내 격추 실시간 저장
            const handleSaveMyStats = async () => {
                const member = members.find(m => m.name === nickname);
                if(!member) return;
                try {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members_v24', member.id), {
                        stat: myStatVal === '' ? null : Number(myStatVal),
                        mount: myMountVal === '' ? null : Number(myMountVal)
                    });
                    showAlert("내 전투 제원이 저장되었습니다.");
                } catch (e) {
                    showAlert("저장 실패", "error");
                }
            };

            const handleSubmitConquest = async (e) => {
                e.preventDefault();
                const totalCount = normalMobCount + bossMobCount;
                if (!nickname || totalCount === 0) return showAlert("몬스터를 1마리 이상 지정해주세요.", "error");
                
                const member = members.find(m => m.name === nickname);
                const currentSwords = stats.playerMap[nickname]?.swords || 0;
                if (currentSwords + totalCount > TOTAL_RESOURCES) {
                    return showAlert(`한도 초과: 잔여 칼자루(${TOTAL_RESOURCES - currentSwords}개)보다 많습니다.`, "error");
                }
                
                try {
                    const totalSec = playMin * 60 + playSec;
                    const secPerMob = totalCount > 0 ? Math.floor(totalSec / totalCount) : 0;
                    let remainder = totalCount > 0 ? totalSec % totalCount : 0;
                    
                    const batchGroupId = Date.now(); // 다중 등록 일괄 취소용 그룹 ID
                    
                    for(let i=0; i<normalMobCount; i++) {
                        const m = Math.floor((secPerMob + (i === 0 ? remainder : 0)) / 60);
                        const s = (secPerMob + (i === 0 ? remainder : 0)) % 60;
                        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'conquest_logs_v24'), { nickname, mob: '일반몹', playMin: m, playSec: s, timestamp: serverTimestamp(), uid: user.uid, groupId: batchGroupId });
                    }
                    for(let i=0; i<bossMobCount; i++) {
                        const m = Math.floor((secPerMob + (normalMobCount === 0 && i === 0 ? remainder : 0)) / 60);
                        const s = (secPerMob + (normalMobCount === 0 && i === 0 ? remainder : 0)) % 60;
                        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'conquest_logs_v24'), { nickname, mob: '보스', playMin: m, playSec: s, timestamp: serverTimestamp(), uid: user.uid, groupId: batchGroupId });
                    }
                    
                    if (member) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members_v24', member.id), { score: (member.score || 0) + (totalCount * 5) });
                    
                    setPlayMin(0); setPlaySec(0); 
                    setNormalMobCount(0); setBossMobCount(0);
                    showAlert(`총 ${totalCount}건의 작전 보고 완료.`);
                } catch (err) { showAlert("실패", "error"); }
            };

            const handleUndoLastConquest = async () => {
                const myLogs = logs.filter(l => l.nickname === nickname).sort((a,b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
                const latestLogDoc = myLogs[0];
                if (!latestLogDoc) return showAlert("취소할 최근 균격 기록이 없습니다.", "error");

                setUiConfirm({
                    message: `마지막 균격 기록을 취소하시겠습니까? (다중 등록 건일 경우 한 번에 모두 취소됩니다)`,
                    onConfirm: async () => {
                        try {
                            let deletedCount = 0;
                            if (latestLogDoc.groupId) {
                                const logsToDelete = myLogs.filter(l => l.groupId === latestLogDoc.groupId);
                                for (const l of logsToDelete) {
                                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'conquest_logs_v24', l.id));
                                    deletedCount++;
                                }
                            } else {
                                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'conquest_logs_v24', latestLogDoc.id));
                                deletedCount = 1;
                            }
                            
                            const member = members.find(m => m.name === nickname);
                            if (member) {
                                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members_v24', member.id), { score: Math.max(0, (member.score || 0) - (deletedCount * 5)) });
                            }
                            showAlert(`마지막 균격 기록(${deletedCount}건)이 정상적으로 취소되었습니다.`);
                        } catch (err) { showAlert("취소 실패", "error"); }
                    }
                });
            };

            const handleSubmitRaid = async (keys) => {
                const member = members.find(m => m.name === nickname);
                try {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'raid_logs_v24'), { nickname, keysUsed: keys, timestamp: serverTimestamp(), uid: user.uid });
                    if (member) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members_v24', member.id), { score: (member.score || 0) + (keys * 10) });
                    showAlert(`${keys}개 보고 완료.`);
                } catch (err) { showAlert("실패", "error"); }
            };

            const handleResetRaid = async () => {
                const today = new Date(); today.setHours(0, 0, 0, 0);
                const myLogs = raidLogs.filter(l => l.nickname === nickname && (l.timestamp?.seconds ? new Date(l.timestamp.seconds * 1000) : new Date()) >= today);
                setUiConfirm({ message: "오늘의 기록을 초기화하시겠습니까?", onConfirm: async () => { 
                    let totalKeys = 0;
                    for (const l of myLogs) { totalKeys += Number(l.keysUsed); await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'raid_logs_v24', l.id)); }
                    const member = members.find(m => m.name === nickname);
                    if (member) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members_v24', member.id), { score: Math.max(0, (member.score || 0) - (totalKeys * 10)) });
                    showAlert("초기화 완료"); 
                } });
            };

            const handleUpdateAdminData = async (id, field, value) => {
                try {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members_v24', id), { [field]: value === '' ? null : Number(value) });
                    showAlert("수정 완료");
                } catch (e) { showAlert("실패", "error"); }
            };

            const adjustTime = (type, val) => {
                if (type === 'min') setPlayMin(p => Math.max(0, p + val));
                else setPlaySec(p => (p + val >= 60 ? (setPlayMin(m => m + 1), p + val - 60) : Math.max(0, p + val)));
            };

            const sortedConquestMembers = useMemo(() => {
                return members
                    .filter(m => {
                        if (conquestFilter === 'inactive') return (stats.playerMap[m.name]?.swords || 0) === 0;
                        return true;
                    })
                    .sort((a, b) => {
                        if (conquestFilter === 'all') {
                            return (stableRandomMap[a.name] || 0) - (stableRandomMap[b.name] || 0);
                        }
                        const timeA = stats.playerMap[a.name]?.totalInputTimeSec || 0;
                        const timeB = stats.playerMap[b.name]?.totalInputTimeSec || 0;
                        return timeA - timeB; 
                    });
            }, [members, conquestFilter, stats]);

            const sortedRaidMembers = useMemo(() => {
                return members
                    .filter(m => {
                        if (raidFilter === 'inactive') return (stats.playerMap[m.name]?.raidToday || 0) === 0;
                        return true;
                    })
                    .sort((a, b) => {
                        if (raidFilter === 'all') {
                            return (stableRandomMap[a.name] || 0) - (stableRandomMap[b.name] || 0);
                        }
                        return 0;
                    });
            }, [members, raidFilter, stats]);

            const filteredCalcMembers = useMemo(() => {
                return members.filter(m => {
                    if (!calcMemberSearch) return true;
                    return m.name.toLowerCase().includes(calcMemberSearch.toLowerCase());
                });
            }, [members, calcMemberSearch]);

            const calcStrikeReport = useMemo(() => {
                let totalGyeokchu = 0;
                const activeMembers = [];

                selectedCalcMembers.forEach(id => {
                    const m = members.find(mem => mem.id === id);
                    if (m) {
                        const gk = getMemberGyeokchu(m);
                        totalGyeokchu += gk;
                        activeMembers.push({ id: m.id, name: m.name, gyeokchu: gk });
                    }
                });

                const numBossScore = Number(bossScore) || 0;
                const expectedSeconds = (totalGyeokchu > 0 && numBossScore > 0) ? Math.ceil(numBossScore / totalGyeokchu) : 0;
                
                const individualReports = activeMembers.map(m => {
                    const rate = totalGyeokchu > 0 ? (m.gyeokchu / totalGyeokchu) * 100 : 0;
                    const score = (totalGyeokchu > 0 && numBossScore > 0) ? Math.round(numBossScore * (m.gyeokchu / totalGyeokchu)) : 0;
                    return { ...m, rate: Number(rate.toFixed(2)), expectedScore: score };
                }).sort((a, b) => b.gyeokchu - a.gyeokchu);

                return { totalGyeokchu, expectedSeconds, individualReports };
            }, [selectedCalcMembers, members, bossScore]);

            const handleRandomDistribute = () => {
                const participants = calcStrikeReport.individualReports.map(r => r.name);
                if (participants.length === 0) return showAlert("참여자를 먼저 지정해주세요.", "error");
                
                const standardKeys = Object.keys(selectedRewards).filter(k => selectedRewards[k] !== undefined);
                if (standardKeys.length === 0 && detailedEquips.length === 0) return showAlert("분배할 보상을 먼저 선택해주세요.", "error");

                let results = {};
                participants.forEach(p => results[p] = {});

                // 일반 보상 분배 (장비는 낱개 분배, 나머지는 1명 독식 일괄)
                standardKeys.forEach(itemName => {
                    if (itemName === '장비') {
                        const qty = selectedRewards[itemName] === '' ? 1 : Math.max(1, Number(selectedRewards[itemName]));
                        for(let i=0; i<qty; i++) {
                            const winner = participants[Math.floor(Math.random() * participants.length)];
                            results[winner][itemName] = (results[winner][itemName] || 0) + 1;
                        }
                    } else {
                        const winner = participants[Math.floor(Math.random() * participants.length)];
                        const displayQty = selectedRewards[itemName] ? ` (값:${selectedRewards[itemName]})` : '';
                        const keyName = `${itemName}${displayQty} (일괄)`;
                        results[winner][keyName] = (results[winner][keyName] || 0) + 1;
                    }
                });

                // 상세 지정 장비 보상은 낱개별로 랜덤 분배
                detailedEquips.forEach(eq => {
                    const qty = eq.qty === '' ? 1 : Math.max(1, Number(eq.qty));
                    for(let i=0; i<qty; i++) {
                        const winner = participants[Math.floor(Math.random() * participants.length)];
                        results[winner][eq.type] = (results[winner][eq.type] || 0) + 1;
                    }
                });

                let textOutput = `[무작위 랜덤 분배 결과]\n`;
                participants.forEach(p => {
                    const items = Object.keys(results[p]).map(k => `${k} ${results[p][k]}개`);
                    if(items.length > 0) textOutput += `${p} ➔ ${items.join(', ')}\n`;
                });
                
                setDistResultsText(textOutput);
                showAlert("무작위 랜덤 분배 완료");
            };

            const handleRateDistribute = () => {
                if (calcStrikeReport.individualReports.length === 0) return showAlert("참여자를 먼저 지정해주세요.", "error");
                
                const standardKeys = Object.keys(selectedRewards).filter(k => selectedRewards[k] !== undefined);
                if (standardKeys.length === 0 && detailedEquips.length === 0) return showAlert("분배할 보상을 먼저 선택해주세요.", "error");

                let textOutput = `[기여도 기반 분배 결과]\n`;

                // 해밀턴 방식(최대 잔여율) 배분 알고리즘
                const allocateByRate = (totalQty) => {
                    let allocations = calcStrikeReport.individualReports.map(r => ({ name: r.name, qty: 0, remainder: 0, rate: r.rate }));
                    let remainingQty = totalQty;
                    // 1차 분배: 정수 몫
                    allocations.forEach(a => {
                        const exact = (totalQty * a.rate) / 100;
                        a.qty = Math.floor(exact);
                        a.remainder = exact - a.qty;
                        remainingQty -= a.qty;
                    });
                    // 2차 분배: 나머지 큰 순서대로
                    allocations.sort((a, b) => b.remainder - a.remainder);
                    for(let i=0; i<remainingQty; i++) {
                        allocations[i % allocations.length].qty += 1;
                    }
                    return allocations.sort((a,b) => b.qty - a.qty);
                };

                standardKeys.forEach(itemName => {
                    const qty = selectedRewards[itemName] === '' ? 1 : Math.max(1, Number(selectedRewards[itemName]));
                    if (qty > 1) {
                        textOutput += `\n[${itemName} x${qty}]\n`;
                        const allocs = allocateByRate(qty);
                        allocs.forEach(a => { if(a.qty > 0) textOutput += `${a.name} : ${a.qty}개\n`; });
                    } else {
                        // 수량이 1이거나 생략된 경우 기여도 1위에게 지급
                        textOutput += `\n[${itemName} 일괄]\n`;
                        if(calcStrikeReport.individualReports.length > 0) {
                            textOutput += `${calcStrikeReport.individualReports[0].name} : 1개\n`;
                        }

                    const qty = eq.qty === '' ? 1 : Math.max(1, Number(eq.qty));
                    textOutput += `\n[상세 장비: ${eq.type} x${qty}]\n`;
                    const allocs = allocateByRate(qty);
                    allocs.forEach(a => { if(a.qty > 0) textOutput += `${a.name} : ${a.qty}개\n`; });
                });

                showAlert("기여도 분배 산출 완료");
            };

                                </div>

                                        <button onClick={async () => { await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'global'), { notice: newNotice }); showAlert("반영됨"); }} className="px-5 bg-blue-600 text-white rounded-xl font-black shadow-lg">송출</button>

                                            <button onClick={() => setUiConfirm({ message: "일격 기록을 삭제합니까?", onConfirm: async () => { const snap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'raid_logs_v24')); for (const d of snap.docs) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'raid_logs_v24', d.id)); showAlert("일격 초기화 완료"); } })} className="p-3 bg-orange-50 dark:bg-orange-900/20 border border-orange-100 dark:border-orange-900 rounded-xl text-orange-600 dark:text-orange-400 text-[10px] uppercase">기록(일격) 초기화</button>
                                            <button onClick={() => setUiConfirm({ message: "랭킹 점수를 초기화합니까?", onConfirm: async () => { for (const m of members) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members_v24', m.id), { score: 0 }); showAlert("점수 초기화 완료"); } })} className="p-3 bg-red-50 dark:bg-red-900/20 border border-red-100 dark:border-red-900 rounded-xl text-red-600 dark:text-red-400 text-[10px] uppercase">랭킹(점수) 초기화</button>
                                        </div>
                                    </div>
                                </section>

                            <section>
                                <label className="text-[10px] text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-3 block">길드원 관리 (인원, 점수, 직접 격추) - {members.length}명</label>
                                <div className="flex gap-2 mb-4 max-w-sm">
                                    <input type="text" className="flex-1 p-2.5 border-2 border-slate-100 dark:border-slate-800 rounded-xl outline-none focus:border-blue-500 bg-white dark:bg-slate-900 text-slate-900 dark:text-white text-sm font-bold" value={newMemberName} onChange={e => setNewMemberName(e.target.value)} placeholder="새 길드원 이름" />
                                    <button onClick={async () => { if(!newMemberName) return; await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'members_v24'), { name: newMemberName, score: 0 }); setNewMemberName(""); showAlert("추가됨"); }} className="px-5 bg-slate-800 dark:bg-slate-700 text-white rounded-xl font-bold">추가</button>

                                                    <td className="p-2 text-center"><button onClick={async () => { setUiConfirm({ message: `${m.name} 님을 삭제합니까?`, onConfirm: async () => { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members_v24', m.id)); showAlert("완료"); } }); }} className="text-red-500 p-2"><i className="fas fa-trash"></i></button></td>

            } else {

                                                        </div>

                                                <button onClick={() => setConquestFilter('inactive')} className={`whitespace-nowrap px-4 py-1.5 rounded-lg text-[10px] font-black transition-all ${conquestFilter === 'inactive' ? 'bg-white dark:bg-slate-600 shadow-sm text-red-600' : 'text-slate-500 dark:text-slate-400'}`}>미참여</button>

                                        <div className="agent-grid">
                                            {sortedConquestMembers.map(mDoc => {

                                                        <div className="flex flex-col mb-4 gap-1.5 min-w-0">
                                                            <div className="flex justify-between items-start gap-2">
                                                                <span className={`text-lg font-black break-words italic ${!isInactive ? 'text-slate-900 dark:text-white' : 'text-slate-600 dark:text-slate-300'}`}>{mDoc.name}</span>

                                                                {rankingData.getPersonalStatus(mDoc.name).currentTitle.name}
                                                            </span>
                                                        </div>
                                                        <div className="space-y-4">
                                                            <div className="relative h-2 w-full bg-slate-100 dark:bg-black/30 rounded-full overflow-hidden">

                                                        </div>
                                                    </div>

                                                    <div className="flex flex-col md:flex-row gap-4 items-start md:items-center">
                                                        <div className="flex gap-2 w-full md:w-1/2">
                                                            <input type="number" className="flex-1 p-3.5 bg-slate-50 dark:bg-slate-900 border-2 border-slate-200 dark:border-slate-700 rounded-xl outline-none focus:border-blue-500 font-mono text-lg font-bold text-slate-900 dark:text-white" value={bossScore} onChange={e => setBossScore(e.target.value)} placeholder="입력 생략 시 비율만 도출됨" />

                                                        </div>
                                                        <div className="flex flex-wrap gap-2 w-full md:w-1/2">
                                                            <button onClick={() => setBossScore(prev => Number(prev||0) + 100000)} className="px-3 py-2.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-lg text-[10px] font-black font-mono">+10만</button>

                                                        </div>

                                                        {filteredCalcMembers.map(m => {
                                                            const isSelected = selectedCalcMembers.includes(m.id);

                                                                <button key={m.id} type="button" onClick={() => {

                                                                }} className={`p-3.5 rounded-xl border-2 transition-all flex items-center gap-2 text-left min-w-0 ${isSelected ? 'border-blue-600 bg-blue-500/10 shadow-sm' : 'border-slate-100 dark:border-slate-800 bg-white dark:bg-slate-800 hover:border-slate-300 dark:hover:border-slate-600'}`}>
                                                                    <div className={`w-3.5 h-3.5 rounded-md border flex items-center justify-center text-[8px] text-white shrink-0 ${isSelected ? 'bg-blue-600 border-blue-600' : 'border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-950'}`}>{isSelected && '✓'}</div>

                                <div className="animate-fadeIn space-y-10">
                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-10">
                                        <section className="space-y-6">
                                            <h3 className="font-black text-2xl italic uppercase text-blue-600 px-2">주간 기여 랭킹</h3>
                                            <div className="dashboard-card overflow-hidden">
                                                <table className="w-full text-left">
                                                    <thead className="bg-slate-50 dark:bg-slate-800 text-slate-400 text-[10px] uppercase border-b dark:border-slate-700">
                                                        <tr>
                                                            <th className="px-5 py-4">순위</th>
                                                            <th className="px-5 py-4">길드원</th>
                                                            <th className="px-5 py-4 text-right">점수</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y dark:divide-slate-700 text-slate-900 dark:text-white">
                                                        {rankingData.weekly.slice(0, 10).map((r, i) => (
                                                            <tr key={r.name} className={`hover:bg-slate-50 dark:hover:bg-slate-800/40 ${r.name === nickname ? 'bg-blue-50/50 dark:bg-blue-900/20' : ''}`}>
                                                                <td className="px-5 py-5 italic text-xl font-black">{i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `#${i+1}`}</td>
                                                                <td className="px-5 py-5">
                                                                    <div className="flex flex-col">
                                                                        <span className="font-bold break-words">{r.name}</span>
                                                                        <span className="text-[9px] text-blue-500 dark:text-blue-400 italic break-words">{rankingData.getPersonalStatus(r.name).currentTitle.name}</span>
                                                                    </div>
                                                                </td>
                                                                <td className="px-5 py-5 text-right text-blue-600 dark:text-blue-400 italic whitespace-nowrap">{r.score} P</td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </section>
                                        <section className="space-y-6">
                                            <h3 className="font-black text-2xl italic uppercase text-emerald-600 px-2">시즌 명예의 전당</h3>
                                            <div className="dashboard-card overflow-hidden">
                                                <table className="w-full text-left">
                                                    <thead className="bg-slate-50 dark:bg-slate-800 text-slate-400 text-[10px] uppercase border-b dark:border-slate-700">
                                                        <tr>
                                                            <th className="px-5 py-4">순위</th>
                                                            <th className="px-5 py-4">길드원</th>
                                                            <th className="px-5 py-4 text-right">점수</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y dark:divide-slate-700 text-slate-900 dark:text-white">
                                                        {rankingData.season.slice(0, 10).map((r, i) => (
                                                            <tr key={r.name} className={`hover:bg-slate-50 dark:hover:bg-slate-800/40 ${r.name === nickname ? 'bg-emerald-50/50 dark:bg-emerald-900/20' : ''}`}>
                                                                <td className="px-5 py-5 italic text-xl font-black">{i === 0 ? '👑' : i === 1 ? '💎' : i === 2 ? '⭐' : `#${i+1}`}</td>
                                                                <td className="px-5 py-5">
                                                                    <div className="flex flex-col">
                                                                        <span className="font-bold break-words">{r.name}</span>
                                                                        <span className="text-[9px] text-emerald-500 dark:text-emerald-400 italic break-words">{rankingData.getPersonalStatus(r.name).currentTitle.name}</span>
                                                                    </div>
                                                                </td>
                                                                <td className="px-5 py-5 text-right text-emerald-600 dark:text-emerald-400 italic whitespace-nowrap">{r.score} P</td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </section>
                                    </div>
                                </div>
                            )}

                            {}
                            {mainCategory === 'history' && (
                                <div className="animate-fadeIn space-y-10 max-w-4xl mx-auto">
                                    <div className="flex flex-col gap-8">
                                        <div className="flex justify-between items-center px-2">
                                            <h3 className="font-black text-2xl italic uppercase text-pink-500">작전 다이어리</h3>
                                            <div className="text-[10px] text-slate-400 uppercase tracking-widest">Missed Ops Detailed Analytics</div>
                                        </div>
                                        <section className="space-y-6">
                                            <div className="flex items-center gap-2 px-2">
                                                <div className="w-1.5 h-6 bg-emerald-500 rounded-full"></div>
                                                <h4 className="font-black text-lg italic uppercase text-emerald-600">일별 일격 상세 현황</h4>
                                            </div>
                                            <div className="flex gap-3 overflow-x-auto no-scrollbar pb-4 px-2">
                                                {recentDates.map(date => {
                                                    const d = new Date(date);
                                                    const isToday = new Date().toISOString().split('T')[0] === date;
                                                    return (
                                                        <button key={date} onClick={() => setSelectedDiaryDate(date)} className={`shrink-0 w-24 py-5 rounded-[2rem] flex flex-col items-center gap-1 transition-all border-2 ${selectedDiaryDate === date ? 'bg-emerald-500 text-white border-emerald-500 shadow-xl scale-105' : 'bg-white dark:bg-slate-800 text-slate-400 border-slate-100 dark:border-slate-700'}`}>
                                                            <span className="text-[10px] uppercase tracking-tighter">{['일','월','화','수','목','금','토'][d.getDay()]}요일</span>
                                                            <span className="text-xl font-black italic leading-none">{d.getDate()}</span>
                                                            {isToday && <span className="text-[8px] bg-white text-emerald-500 px-2 py-0.5 rounded-full mt-1.5 shadow-sm">TODAY</span>}
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                            <div className="dashboard-card p-8 border-l-[12px] border-emerald-500 shadow-lg bg-white dark:bg-slate-800">
                                                <div className="flex justify-between items-center mb-8 border-b pb-4 dark:border-slate-700">
                                                    <h5 className="font-black text-slate-400 uppercase tracking-widest text-xs"><i className="far fa-calendar-alt mr-2"></i> {selectedDiaryDate} STRIKE Report</h5>
                                                </div>
                                                <div className="agent-grid">
                                                    {diaryHistory.getRaidReport(selectedDiaryDate).map(report => (
                                                        <div key={report.name} className={`p-4 rounded-2xl border-2 flex items-center justify-between transition-all ${report.remaining > 0 ? 'border-red-100 dark:border-red-900/30 bg-red-50/30 dark:bg-red-950/20' : 'border-emerald-100 dark:border-emerald-900/30 bg-emerald-50/20 dark:bg-emerald-950/20'}`}>
                                                            <div className="flex flex-col">
                                                                <span className="font-bold text-slate-700 dark:text-slate-200">{report.name}</span>
                                                                <span className={`text-[10px] ${report.remaining > 0 ? 'text-red-500 animate-pulse' : 'text-emerald-500 dark:text-emerald-400'}`}>{report.remaining > 0 ? `열쇠 ${report.remaining}개 미사용` : '열쇠 사용 완료'}</span>
                                                            </div>
                                                            <div className="text-right">
                                                                <div className="text-xs text-slate-400 dark:text-slate-500 uppercase">Usage</div>
                                                                <div className={`text-lg font-black italic ${report.remaining > 0 ? 'text-red-600 dark:text-red-400' : 'text-emerald-600 dark:text-emerald-400'}`}>{report.used} / 2</div>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        </section>
                                        <hr className="border-slate-200 dark:border-slate-700 mx-2" />
                                        <section className="space-y-6">
                                            <div className="flex items-center gap-2 px-2">
                                                <div className="w-1.5 h-6 bg-blue-500 rounded-full"></div>
                                                <h4 className="font-black text-lg italic uppercase text-blue-600">균격 시즌 상세 현황 (최근 4주)</h4>
                                            </div>
                                            <div className="flex gap-3 overflow-x-auto no-scrollbar pb-4 px-2">
                                                {diaryHistory.conquestSeasons.map((season, idx) => (
                                                    <button key={idx} onClick={() => setSelectedConquestSeasonIndex(idx)} className={`shrink-0 px-6 py-5 rounded-[2rem] flex flex-col items-center gap-1 transition-all border-2 ${selectedConquestSeasonIndex === idx ? 'bg-blue-500 text-white border-blue-500 shadow-xl scale-105' : 'bg-white dark:bg-slate-800 text-slate-400 border-slate-100 dark:border-slate-700'}`}>
                                                        <span className="text-[10px] uppercase tracking-tighter">{idx === 0 ? 'Current' : `${idx}주 전`}</span>
                                                        <span className="text-sm font-black italic leading-none whitespace-nowrap">{season.label}</span>
                                                    </button>
                                                ))}
                                            </div>
                                            <div className="dashboard-card p-8 border-l-[12px] border-blue-500 shadow-lg bg-white dark:bg-slate-800">
                                                <div className="flex flex-col mb-8 border-b pb-4 dark:border-slate-700">
                                                    <h5 className="font-black text-slate-400 uppercase tracking-widest text-xs mb-1"><i className="fas fa-shield-alt mr-2"></i> Conquest Detail Report</h5>
                                                    <p className="text-[10px] font-bold text-blue-400 italic">{diaryHistory.conquestSeasons[selectedConquestSeasonIndex].range}</p>
                                                </div>
                                                <div className="agent-grid">
                                                    {diaryHistory.conquestSeasons[selectedConquestSeasonIndex].reports.map(report => {
                                                        const isCompleted = report.remainingSwords === 0;
                                                        return (
                                                            <div key={report.name} className={`p-5 rounded-[2rem] border-2 flex flex-col gap-4 transition-all ${!isCompleted ? 'border-blue-100 dark:border-blue-900/30 bg-blue-50/20 dark:bg-blue-950/20' : 'border-slate-100 dark:border-slate-800 bg-slate-50/10 dark:bg-slate-900/10'}`}>
                                                                <div className="flex justify-between items-start">
                                                                    <div className="flex flex-col">
                                                                        <span className={`text-lg font-black italic leading-none mb-1 ${!isCompleted ? 'text-slate-800 dark:text-white' : 'text-slate-400 dark:text-slate-500'}`}>{report.name}</span>
                                                                        <span className={`text-[10px] font-bold ${!isCompleted ? 'text-blue-600 dark:text-blue-400' : 'text-slate-400 dark:text-slate-500'}`}>{!isCompleted ? `${report.remainingSwords}자루 남음` : '전부 사용됨'}</span>
                                                                    </div>
                                                                    <div className={`px-3 py-1 rounded-full text-[10px] font-black italic ${!isCompleted ? 'bg-slate-900 dark:bg-slate-800 text-white' : 'bg-slate-200 dark:bg-slate-700 text-slate-500 dark:text-slate-400'}`}>{report.usedSwords} / 10</div>
                                                                </div>
                                                                <div className="flex items-end justify-between">
                                                                    <div className="flex flex-col">
                                                                        <span className="text-[9px] text-slate-400 dark:text-slate-500 uppercase tracking-widest">Left Time</span>
                                                                        <span className={`text-base font-black font-mono leading-none ${!isCompleted ? 'text-blue-500 dark:text-blue-400' : 'text-slate-400 dark:text-slate-500'}`}>{report.remainingMin}m {report.remainingSec}s</span>
                                                                    </div>
                                                                    <div className="w-16 h-1.5 bg-slate-100 dark:bg-black/30 rounded-full overflow-hidden">
                                                                        <div className={`h-full ${!isCompleted ? 'bg-blue-500' : 'bg-slate-300 dark:bg-slate-600'} transition-all duration-1000`} style={{ width: `${(report.usedSwords / 10) * 100}%` }}></div>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        </section>
                                    </div>
                                </div>
                            )}
                        </main>

                        {}
                        <div className="fixed bottom-3 md:bottom-6 left-1/2 -translate-x-1/2 w-[95%] md:w-full md:max-w-6xl z-[150] animate-fadeIn font-bold">
                            <div className="bg-slate-950/95 backdrop-blur-3xl text-white px-4 md:px-12 py-3.5 md:py-5 rounded-[2rem] md:rounded-[3.5rem] flex flex-col md:flex-row justify-between items-center shadow-2xl border border-white/10 gap-3 md:gap-0">
                                <div className="flex items-center gap-4 w-full md:w-auto min-w-0 border-b md:border-b-0 border-white/10 pb-2 md:pb-0">
                                    <div className="flex flex-col min-w-0">
                                        <span className="text-[8px] md:text-[9px] text-blue-400 uppercase tracking-[0.2em] mb-0.5">식별된 길드원</span>
                                        <div className="flex items-baseline gap-2">
                                            <span className="text-sm md:text-xl font-black italic tracking-tighter truncate text-white">{nickname}</span>
                                            <span className="text-[8px] md:text-[10px] text-blue-300 italic truncate">{myStatusObj.currentTitle.name}</span>
                                        </div>
                                        {myStatusObj.nextTitle && (
                                            <span className="text-[7px] md:text-[9px] text-slate-300">다음 단계까지 <span className="text-yellow-400 font-bold">{myStatusObj.nextTitle.score - myStatusObj.score}p 남음</span></span>
                                        )}
                                    </div>
                                </div>
                                <div className="hidden lg:flex flex-col items-center justify-center flex-1 px-8 border-x border-white/10 mx-6 overflow-hidden">
                                    <span className="text-[8px] text-slate-400 uppercase tracking-widest mb-1">실시간 처치 기록</span>
                                    <div className="text-[10px] text-slate-200 italic truncate max-w-full text-center log-animate" key={latestLog ? latestLog.timestamp?.seconds : 'init'}>
                                        {latestLog ? (<>🚩 <span className="text-blue-400 font-black">[{latestLog.nickname}]</span> {latestLog.mob} 공략 성공</>) : ("새로운 작전 데이터를 기다리는 중...")}
                                    </div>
                                </div>
                                <div className="flex items-center justify-around md:justify-end gap-4 md:gap-10 w-full md:w-auto shrink-0">
                                    <div className="flex flex-col text-center">
                                        <span className="text-[8px] md:text-[9px] text-emerald-400 uppercase tracking-[0.1em] mb-0.5">나의 일격 성과</span>
                                        <div className="flex items-center justify-center gap-1.5">
                                            <span className="text-xs md:text-lg font-black italic">{myStatusObj.rank}위</span>
                                            <span className="text-[8px] md:text-[10px] text-slate-400">({myStatusObj.raidCount}개)</span>
                                        </div>
                                    </div>
                                    <div className="h-8 w-px bg-white/10"></div>
                                    <div className="flex flex-col text-center">
                                        <span className="text-[8px] md:text-[9px] text-slate-400 uppercase mb-0.5">시스템 상태</span>
                                        <div className="flex items-center gap-1.5 justify-center">
                                            <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                                            <span className="text-[9px] md:text-xs uppercase tracking-tighter text-emerald-400">정상</span>
                                        </div>
                                    </div>
                                    <button onClick={handleResetSession} className="bg-white/10 hover:bg-red-600 text-white p-2.5 md:p-3.5 rounded-xl md:rounded-2xl text-[9px] md:text-[11px] uppercase transition-all border border-white/5 active:scale-90"><i className="fas fa-power-off"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <React.Fragment>
                    {pageContent}

                    {showFullNotice && (
                        <div className="fixed inset-0 z-[1100] flex items-center justify-center p-4 bg-black/60 backdrop-blur-md animate-fadeIn font-bold">
                            <div className="bg-white dark:bg-slate-800 dashboard-card p-6 md:p-8 w-full max-w-xl border-t-8 border-blue-600 shadow-2xl space-y-6 max-h-[80vh] flex flex-col">
                                <div className="flex justify-between items-center border-b pb-4 dark:border-slate-700 shrink-0">
                                    <h3 className="text-lg font-black dark:text-white flex items-center gap-2"><i className="fas fa-bullhorn text-blue-500"></i>전체 공지사항</h3>
                                    <button onClick={() => setShowFullNotice(false)} className="w-8 h-8 flex items-center justify-center bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 rounded-full transition-colors"><i className="fas fa-times"></i></button>
                                </div>
                                <div className="overflow-y-auto pr-2 flex-1 min-h-[200px]">
                                    <p className="text-sm text-slate-700 dark:text-slate-200 whitespace-pre-wrap leading-relaxed">{notice}</p>
                                    {!notice && <p className="text-slate-400 text-center py-10">등록된 공지사항이 없습니다.</p>}
                                </div>
                            </div>
                        </div>
                    )}

                    {showFullLogs && (
                        <div className="fixed inset-0 z-[1100] flex items-center justify-center p-4 bg-black/60 backdrop-blur-md animate-fadeIn font-bold">
                            <div className="bg-white dark:bg-slate-800 dashboard-card p-6 md:p-8 w-full max-w-xl border-t-8 border-emerald-500 shadow-2xl space-y-6 max-h-[80vh] flex flex-col">
                                <div className="flex justify-between items-center border-b pb-4 dark:border-slate-700 shrink-0">
                                    <h3 className="text-lg font-black dark:text-white flex items-center gap-2"><i className="fas fa-history text-emerald-500"></i>전체 처치 기록</h3>
                                    <button onClick={() => setShowFullLogs(false)} className="w-8 h-8 flex items-center justify-center bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 rounded-full transition-colors"><i className="fas fa-times"></i></button>
                                </div>
                                <div className="overflow-y-auto pr-2 flex-1 space-y-2">
                                    {logs.map(l => {
                                        const dt = l.timestamp?.seconds ? new Date(l.timestamp.seconds * 1000) : new Date();
                                        return (
                                            <div key={l.id} className="p-3 bg-slate-50 dark:bg-slate-900/50 rounded-xl border border-slate-100 dark:border-slate-800 text-xs flex justify-between items-center">
                                                <div className="flex items-center gap-2">
                                                    <span className="text-blue-600 dark:text-blue-400 font-black">[{l.nickname}]</span>
                                                    <span className="text-slate-700 dark:text-slate-300">{l.mob} 처치</span>
                                                </div>
                                                <span className="text-[10px] text-slate-400">{dt.toLocaleString()}</span>
                                            </div>
                                        );
                                    })}
                                    {logs.length === 0 && <p className="text-slate-400 text-center py-10">활동 기록 대기 중...</p>}
                                </div>
                            </div>
                        </div>
                    )}

                    {showAdminEntry && (
                        <div className="fixed inset-0 z-[1200] flex items-center justify-center p-4 bg-black/60 backdrop-blur-md animate-fadeIn font-bold">
                            <div className="bg-white dark:bg-slate-800 dashboard-card p-8 w-full max-w-[320px] border-t-8 border-blue-600 shadow-2xl">
                                <div className="mb-6 text-center">
                                    <p className="text-[10px] text-slate-500 uppercase tracking-widest mb-1">보안 인증</p>
                                    <h3 className="text-lg font-black dark:text-white">관리자 코드 입력</h3>
                                </div>
                                <div className="flex flex-col gap-4">
                                    <input type="password" autoFocus placeholder="Passkey" className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl px-4 py-4 text-center text-xl outline-none focus:border-blue-500 text-slate-900 dark:text-white font-black tracking-widest" value={adminPass} onChange={e => setAdminPass(e.target.value)} onKeyDown={e => { if(e.key === 'Enter' && adminPass === "123456") { setIsAdminMode(true); setShowAdminEntry(false); setAdminPass(""); } }} />
                                    <div className="grid grid-cols-2 gap-3">
                                        <button onClick={() => { setShowAdminEntry(false); setAdminPass(""); }} className="py-3 bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-white rounded-xl font-bold text-sm">취소</button>
                                        <button onClick={() => { if(adminPass === "123456") { setIsAdminMode(true); setShowAdminEntry(false); setAdminPass(""); } else { showAlert("비밀번호 오류", "error"); } }} className="py-3 bg-blue-600 text-white rounded-xl font-bold text-sm shadow-lg">인증</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                    {uiAlert && (
                        <div className="fixed inset-0 z-[1300] flex items-center justify-center p-4 custom-modal-overlay animate-fadeIn text-slate-900 font-bold">
                            <div className="bg-white dark:bg-slate-900 rounded-[2.5rem] shadow-2xl p-10 max-w-sm w-full text-center border-t-[8px] border-blue-500">
                                <p className="text-lg mb-8 dark:text-white font-bold whitespace-pre-wrap leading-relaxed">{uiAlert.message}</p>
                                <button onClick={closeAlert} className="w-full bg-blue-600 text-white py-4 rounded-2xl font-black shadow-lg">확인</button>
                            </div>
                        </div>
                    )}
                    {uiConfirm && (
                        <div className="fixed inset-0 z-[1300] flex items-center justify-center p-4 custom-modal-overlay animate-fadeIn text-slate-900 font-bold">
                            <div className="bg-white dark:bg-slate-900 rounded-[2.5rem] shadow-2xl p-10 max-w-sm w-full text-center border-t-[8px] border-orange-500">
                                <p className="text-lg mb-8 dark:text-white font-bold whitespace-pre-wrap leading-relaxed">{uiConfirm.message}</p>
                                <div className="grid grid-cols-2 gap-3">
                                    <button onClick={() => setUiConfirm(null)} className="py-4 bg-slate-100 dark:bg-slate-800 dark:text-white rounded-2xl font-bold">취소</button>
                                    <button onClick={() => { uiConfirm.onConfirm(); setUiConfirm(null); }} className="py-4 bg-orange-500 text-white rounded-2xl font-bold shadow-lg">확인</button>
                                </div>
                            </div>
                        </div>
                    )}
                </React.Fragment>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
