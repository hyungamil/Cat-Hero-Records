<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>길드 통합 관리 시스템</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
        
        :root {
            --brand-primary: #2563eb;
        }

        body { 
            font-family: 'Noto Sans KR', 'Inter', sans-serif; 
            transition: background-color 0.2s, color 0.2s;
            background-color: #F8FAFC; 
            color: #0F172A;
            letter-spacing: -0.025em;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            width: 100%;
        }

        .dark body { 
            background-color: #0B1220; 
            color: #F8FAFC;
        }

        .dashboard-card { 
            border-radius: 1rem; 
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            transition: background-color 0.2s, border-color 0.2s;
        }

        .dark .dashboard-card {
            background-color: #1E293B;
            border-color: #334155;
            color: #F8FAFC;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }

        .app-container {
            width: 100%;
            max-width: 1440px;
            margin: 0 auto;
            min-height: 100vh;
        }

        .agent-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 0.75rem;
        }

        @media (min-width: 768px) {
            .agent-grid { grid-template-columns: repeat(2, 1fr); gap: 1.25rem; }
        }

        @media (min-width: 1024px) {
            .desktop-layout { display: grid; grid-template-columns: 380px 1fr; gap: 1.5rem; align-items: start; }
        }

        .main-tab-active { background-color: var(--brand-primary); color: white; box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2); }
        .custom-modal-overlay { background-color: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px); }

        @keyframes slideUpFade {
            0% { transform: translateY(10px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        .log-animate { animation: slideUpFade 0.5s ease-out forwards; }
        .animate-fadeIn { animation: slideUpFade 0.3s ease-out forwards; }
    </style>
</head>
<body class="font-bold">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, serverTimestamp, deleteDoc, doc, setDoc, updateDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCOt_5hYk7Y9EDwo1Cd55et5-JT6k7LIcc",
            authDomain: "cat-hero-record.firebaseapp.com",
            projectId: "cat-hero-record",
            storageBucket: "cat-hero-record.firebasestorage.app",
            messagingSenderId: "1059204432454",
            appId: "1:1059204432454:web:b365ddd7d6a3da2c624047"
        };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'cat-hero-v24-final';
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const { useState, useEffect, useMemo, useRef } = React;

        const TOTAL_RESOURCES = 10; 
        const BASE_TIME_PER_SWORD = 2; 
        const INITIAL_MEMBERS = ["늑대벼리", "마자유", "고기쟁이", "김동순", "일민", "캣핑", "콘스", "하늘구름바다", "창식2", "나는도비", "노들노들", "포저", "라잌늑냥", "베리발", "장귝", "유나s"];
        
        const TITLES_LIST = [
            { id: 1, name: "길드의 새싹", score: 0 },
            { id: 2, name: "견습 길드원", score: 50 },
            { id: 3, name: "정식 길드원", score: 100 },
            { id: 4, name: "베테랑", score: 200 },
            { id: 5, name: "에이스", score: 400 },
            { id: 6, name: "정예 길드원", score: 600 },
            { id: 7, name: "전설의 길드원", score: 800 },
            { id: 8, name: "길드의 수호자", score: 1000 },
            { id: 9, name: "불멸의 전사", score: 1500 },
            { id: 10, name: "길드의 태양", score: 2000 },
            { id: 11, name: "길드의 자부심", score: 5000 },
            { id: 12, name: "길드의 신", score: 10000 },
        ];

        const REWARDS_LIST = ['장비', '레시피', '픽업', '룬 소환서', '특수룬 소환서'];

        function App() {
            const [user, setUser] = useState(null);
            const [nickname, setNickname] = useState(localStorage.getItem('cat_hero_nickname') || '');
            const [isNameSet, setIsNameSet] = useState(!!localStorage.getItem('cat_hero_nickname'));
            const [isAdminMode, setIsAdminMode] = useState(false);
            const [adminPass, setAdminPass] = useState("");
            const [showAdminEntry, setShowAdminEntry] = useState(false);
            
            // 환경 설정 (다크모드 및 UI 스케일)
            const [isDarkMode, setIsDarkMode] = useState(localStorage.getItem('isDarkMode') === 'true');
            const [uiScale, setUiScale] = useState(localStorage.getItem('uiScale') || '100%');
            const [mainCategory, setMainCategory] = useState('conquest'); // 'conquest', 'strike', 'ranking', 'history'
            const [conquestFilter, setConquestFilter] = useState('timeSort');

            // 균격(다중) 상태
            const [conquestNormalCount, setConquestNormalCount] = useState(0);
            const [conquestBossCount, setConquestBossCount] = useState(0);
            const [playMin, setPlayMin] = useState(0);
            const [playSec, setPlaySec] = useState(0);
            
            // 데이터 연동
            const [logs, setLogs] = useState([]);
            const [members, setMembers] = useState([]);
            const [notice, setNotice] = useState("시스템 가동 중입니다.");
            const [newNotice, setNewNotice] = useState("");
            const [newMemberName, setNewMemberName] = useState("");
            
            // 내정보(격추) 상태
            const [myStat, setMyStat] = useState("");
            const [myMount, setMyMount] = useState("");

            // 즐겨찾기 상태
            const [favorites, setFavorites] = useState(JSON.parse(localStorage.getItem('cat_hero_favorites')) || []);

            const [uiAlert, setUiAlert] = useState(null);
            const [uiConfirm, setUiConfirm] = useState(null);
            const [showNoticeModal, setShowNoticeModal] = useState(false);
            const [showHistoryModal, setShowHistoryModal] = useState(false);

            // 일격 상태
            const [strikeSubTab, setStrikeSubTab] = useState('calc'); 
            const [bossScoreStr, setBossScoreStr] = useState("");
            const [selectedCalcMembers, setSelectedCalcMembers] = useState([]); 
            const [calcMemberSearch, setCalcMemberSearch] = useState(''); 
            
            // 분배 상태
            const [basketItems, setBasketItems] = useState([]);
            const [distResult, setDistResult] = useState(null);
            const captureRef = useRef(null);

            const showAlert = (msg, type = 'success') => setUiAlert({ message: msg, type });
            const closeAlert = () => setUiAlert(null);

            // [핵심 해결 지점] 정의되지 않았던 함수 생성
            const handleResetSession = () => {
                setUiConfirm({ 
                    message: "길드원 정보를 초기화하고 이름 선택 화면으로 돌아가시겠습니까?", 
                    onConfirm: () => { 
                        localStorage.removeItem('cat_hero_nickname'); 
                        setNickname(''); 
                        setIsNameSet(false); 
                    } 
                });
            };

            const toggleFavorite = (e, targetName) => {
                e.stopPropagation();
                let newFavs = [...favorites];
                if (newFavs.includes(targetName)) {
                    newFavs = newFavs.filter(f => f !== targetName);
                } else {
                    newFavs.push(targetName);
                }
                setFavorites(newFavs);
                localStorage.setItem('cat_hero_favorites', JSON.stringify(newFavs));
            };

            const getMemberGyeokchu = (m) => {
                if (m.directGyeokchu && Number(m.directGyeokchu) > 0) return Number(m.directGyeokchu);
                const statVal = Math.floor(Number(m.stat) || 0);
                const mountVal = Math.floor(Number(m.mount) || 0);
                if (statVal > 0 || mountVal > 0) return (statVal + 6 + mountVal) * 10 + 1000;
                return 0; 
            };

            const copyToClipboard = (text) => {
                const ta = document.createElement("textarea");
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showAlert("텍스트가 복사되었습니다.");
            };

            const handleCaptureImage = () => {
                if(!captureRef.current) return;
                setTimeout(() => {
                    html2canvas(captureRef.current, {
                        scale: window.devicePixelRatio || 2,
                        useCORS: true,
                        backgroundColor: isDarkMode ? '#0B1220' : '#F8FAFC',
                        scrollY: -window.scrollY
                    }).then(canvas => {
                        const link = document.createElement('a');
                        link.download = `분배결과_${new Date().getTime()}.png`;
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                        showAlert("분배 결과가 이미지로 저장되었습니다.");
                    }).catch(e => showAlert("이미지 생성 오류", "error"));
                }, 300); 
            };

            useEffect(() => {
                if (isDarkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
                localStorage.setItem('isDarkMode', isDarkMode);
            }, [isDarkMode]);

            useEffect(() => {
                const sizeMap = { '작게': '14px', '기본': '16px', '크게': '18px', '매우 크게': '20px' };
                document.documentElement.style.fontSize = sizeMap[uiScale] || '16px';
                localStorage.setItem('uiScale', uiScale);
            }, [uiScale]);

            useEffect(() => {
                const initAuth = async () => { try { await signInAnonymously(auth); } catch (e) { console.error(e); } };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsubMembers = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'members_v24'), (snapshot) => {
                    if (snapshot.empty) {
                        INITIAL_MEMBERS.forEach(name => addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'members_v24'), { name, score: 0 }));
                    } else {
                        const loaded = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort((a, b) => (b.score || 0) - (a.score || 0));
                        setMembers(loaded);
                        const me = loaded.find(m => m.name === nickname);
                        if(me) {
                            setMyStat(me.stat || '');
                            setMyMount(me.mount || '');
                        }
                    }
                });

                const unsubLogs = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'conquest_logs_v24'), (snapshot) => {
                    setLogs(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0)));
                });

                const unsubSettings = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'global'), (snapshot) => {
                    if (snapshot.exists()) setNotice(snapshot.data().notice || "");
                });

                return () => { unsubMembers(); unsubLogs(); unsubSettings(); };
            }, [user, nickname]);

            const rankingData = useMemo(() => {
                const sortedByScore = [...members].sort((a, b) => (b.score || 0) - (a.score || 0));
                const getPersonalStatus = (name) => {
                    const m = members.find(mem => mem.name === name) || { score: 0 };
                    const currentScore = m.score || 0;
                    const currentTitle = [...TITLES_LIST].reverse().find(t => currentScore >= t.score) || TITLES_LIST[0];
                    const nextTitle = TITLES_LIST.find(t => t.score > currentScore);
                    const rankIdx = sortedByScore.findIndex(mem => mem.name === name);
                    return { currentTitle, nextTitle, score: currentScore, rank: rankIdx + 1 };
                };
                return { weekly: sortedByScore, getPersonalStatus };
            }, [members]);

            const stats = useMemo(() => {
                const playerMap = {};
                members.forEach(m => playerMap[m.name] = { swords: 0, totalInputTimeSec: 0, bossTimeSec: 0, joinedLogs: [] });
                logs.forEach(l => { 
                    if (playerMap[l.nickname]) { 
                        playerMap[l.nickname].swords += 1; 
                        const duration = (Number(l.playMin || 0) * 60 + Number(l.playSec || 0));
                        playerMap[l.nickname].totalInputTimeSec += duration;
                        playerMap[l.nickname].joinedLogs.push(l);
                    } 
                });
                return { playerMap };
            }, [logs, members]);

            const sortedConquestMembers = useMemo(() => {
                return members
                    .filter(m => {
                        if (conquestFilter === 'inactive') return (stats.playerMap[m.name]?.swords || 0) === 0;
                        return true;
                    })
                    .sort((a, b) => {
                        if (conquestFilter === 'all') return a.name.localeCompare(b.name);
                        const timeA = stats.playerMap[a.name]?.totalInputTimeSec || 0;
                        const timeB = stats.playerMap[b.name]?.totalInputTimeSec || 0;
                        return timeA - timeB; 
                    });
            }, [members, conquestFilter, stats]);

            const handleSaveMyStat = async () => {
                const member = members.find(m => m.name === nickname);
                if (!member) return;
                try {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members_v24', member.id), {
                        stat: myStat === '' ? null : Math.floor(Number(myStat)),
                        mount: myMount === '' ? null : Math.floor(Number(myMount))
                    });
                    showAlert("격추 제원이 연동되었습니다.");
                } catch(e) { showAlert("저장 실패", "error"); }
            };

            const handleSubmitConquest = async (e) => {
                e.preventDefault();
                const totalCount = conquestNormalCount + conquestBossCount;
                if (totalCount === 0 || !nickname) return showAlert("입력된 처치 마릿수가 없습니다.", "error");
                
                const member = members.find(m => m.name === nickname);
                if ((stats.playerMap[nickname]?.swords || 0) + totalCount > TOTAL_RESOURCES) return showAlert(`한도(${TOTAL_RESOURCES}회) 초과 불가`, "error");
                
                try {
                    const batchGroupId = `grp_${new Date().getTime()}`;
                    for(let i=0; i<conquestNormalCount; i++){
                        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'conquest_logs_v24'), { nickname, mob: '일반몹', playMin: Number(playMin), playSec: Number(playSec), groupId: batchGroupId, timestamp: serverTimestamp(), uid: user.uid });
                    }
                    for(let i=0; i<conquestBossCount; i++){
                        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'conquest_logs_v24'), { nickname, mob: '보스', playMin: Number(playMin), playSec: Number(playSec), groupId: batchGroupId, timestamp: serverTimestamp(), uid: user.uid });
                    }
                    if (member) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members_v24', member.id), { score: (member.score || 0) + (totalCount * 5) });
                    
                    setConquestNormalCount(0); setConquestBossCount(0); setPlayMin(0); setPlaySec(0);
                    showAlert(`총 ${totalCount}건의 작전 기록이 승인되었습니다.`);
                } catch (err) { showAlert("실패", "error"); }
            };

            const handleUndoLastConquest = async () => {
                const myLogs = logs.filter(l => l.nickname === nickname).sort((a,b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
                if (myLogs.length === 0) return showAlert("취소할 기록이 없습니다.", "error");
                const latestLogDoc = myLogs[0];
                const targetGroupId = latestLogDoc.groupId;
                
                let targetLogs = targetGroupId ? myLogs.filter(l => l.groupId === targetGroupId) : [latestLogDoc];
                
                setUiConfirm({
                    message: `마지막으로 등록한 ${targetLogs.length}건의 기록을 취소하시겠습니까?`,
                    onConfirm: async () => {
                        try {
                            for(const tl of targetLogs) {
                                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'conquest_logs_v24', tl.id));
                            }
                            const member = members.find(m => m.name === nickname);
                            if (member) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members_v24', member.id), { score: Math.max(0, (member.score || 0) - (targetLogs.length * 5)) });
                            showAlert("기록이 취소되었습니다.");
                        } catch (err) { showAlert("취소 실패", "error"); }
                    }
                });
            };

            const calcStrikeReport = useMemo(() => {
                let totalGyeokchu = 0;
                const activeMembers = [];
                const bScore = Number(bossScoreStr) || 0;

                selectedCalcMembers.forEach(id => {
                    const m = members.find(mem => mem.id === id);
                    if (m) {
                        const gk = getMemberGyeokchu(m);
                        totalGyeokchu += gk;
                        activeMembers.push({ id: m.id, name: m.name, gyeokchu: gk });
                    }
                });

                const expectedSeconds = totalGyeokchu > 0 ? Math.ceil(bScore / totalGyeokchu) : 0;
                
                const individualReports = activeMembers.map(m => {
                    const rate = totalGyeokchu > 0 ? (m.gyeokchu / totalGyeokchu) * 100 : 0;
                    const score = totalGyeokchu > 0 ? Math.round(bScore * (m.gyeokchu / totalGyeokchu)) : 0;
                    return { ...m, rate: Number(rate.toFixed(2)), expectedScore: score };
                }).sort((a, b) => b.gyeokchu - a.gyeokchu);

                return { totalGyeokchu, expectedSeconds, individualReports };
            }, [selectedCalcMembers, members, bossScoreStr]);

            const executeDistribution = (type) => {
                if(selectedCalcMembers.length === 0) return showAlert("참여 길드원이 없습니다.", "error");
                if(basketItems.length === 0) return showAlert("등록된 보상이 없습니다.", "error");

                let resultArr = [];
                const pNames = selectedCalcMembers.map(id => members.find(m => m.id === id)?.name).filter(Boolean);

                if (type === 'random') {
                    basketItems.forEach(item => {
                        if (item.name === '장비') {
                            for(let i=0; i<item.qty; i++){
                                const winner = pNames[Math.floor(Math.random() * pNames.length)];
                                resultArr.push({ itemStr: '장비', winner });
                            }
                        } else {
                            const winner = pNames[Math.floor(Math.random() * pNames.length)];
                            resultArr.push({ itemStr: `${item.name} (일괄)`, winner });
                        }
                    });
                } else if (type === 'contrib') {
                    if(calcStrikeReport.individualReports.length === 0) return showAlert("격추 데이터가 없습니다.", "error");
                    basketItems.forEach(item => {
                        let totalQty = item.qty;
                        let remain = totalQty;
                        let fractions = [];
                        
                        calcStrikeReport.individualReports.forEach(r => {
                            const alloc = totalQty * (r.rate / 100);
                            const base = Math.floor(alloc);
                            remain -= base;
                            fractions.push({ name: r.name, frac: alloc - base, base });
                        });
                        
                        fractions.sort((a,b) => b.frac - a.frac);
                        for(let i=0; i<remain; i++){ fractions[i].base += 1; }
                        
                        fractions.forEach(f => {
                            if(f.base > 0) resultArr.push({ itemStr: `${item.name} x${f.base}`, winner: f.name });
                        });
                    });
                }

                setDistResult({ type: type === 'random' ? '무작위 랜덤 분배' : '기여도 기반 분배', list: resultArr });
            };

            let pageContent;

            // [관리자 모드를 최우선으로 검사하여 무한 로딩/튕김 버그 완전 해결]
            if (isAdminMode) {
                pageContent = (
                    <div className="min-h-screen bg-slate-100 dark:bg-slate-950 p-4 md:p-8 animate-fadeIn text-slate-900 dark:text-slate-100 font-bold">
                        <div className="max-w-6xl mx-auto dashboard-card p-6 md:p-8 border-t-8 border-slate-800 shadow-2xl">
                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 gap-4 border-b pb-6 dark:border-slate-700">
                                <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 bg-slate-100 dark:bg-slate-800 rounded-xl flex items-center justify-center text-slate-800 dark:text-slate-200 font-bold"><i className="fas fa-shield-alt"></i></div>
                                    <h2 className="text-xl md:text-2xl font-black italic">관리 센터</h2>
                                </div>
                                <button onClick={() => setIsAdminMode(false)} className="px-6 py-2.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 rounded-xl font-black shadow-sm text-slate-900 dark:text-white uppercase text-xs">나가기</button>
                            </div>
                            
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                <div className="space-y-8">
                                    <section>
                                        <label className="text-[10px] text-slate-400 uppercase tracking-widest mb-3 block font-bold">전체 공지사항 (모든 화면 상단 노출)</label>
                                        <div className="flex gap-2">
                                            <input type="text" className="flex-1 p-3 border-2 border-slate-100 dark:border-slate-800 rounded-xl bg-white dark:bg-slate-900 text-sm outline-none focus:border-blue-500" value={newNotice} onChange={e => setNewNotice(e.target.value)} placeholder="모든 길드원에게 노출될 공지사항" />

                                                                        <div className="w-8 h-8 rounded-full bg-emerald-100 dark:bg-emerald-900/40 text-emerald-600 dark:text-emerald-400 flex items-center justify-center shrink-0 text-sm"><i className="fas fa-gift"></i></div>
                                                                        <div className="flex-1 text-sm font-black text-slate-800 dark:text-slate-100 break-words">
                                                                            <span className="text-emerald-600 dark:text-emerald-400">{r.itemStr}</span> - {r.winner}
                                                                        </div>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                            <div className="mt-6 text-right text-[9px] text-slate-400 font-mono">
                                                                생성일시: {new Date().toLocaleString()}
                                                            </div>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {mainCategory === 'ranking' && (
                                <div className="animate-fadeIn space-y-10">
                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-10">
                                        <section className="space-y-6">
                                            <h3 className="font-black text-2xl italic uppercase text-blue-600 px-2">주간 기여 랭킹</h3>
                                            <div className="dashboard-card overflow-hidden">
                                                <table className="w-full text-left">
                                                    <thead className="bg-slate-50 dark:bg-slate-800 text-slate-400 text-[10px] uppercase border-b dark:border-slate-700">
                                                        <tr><th className="px-5 py-4">순위</th><th className="px-5 py-4">길드원</th><th className="px-5 py-4 text-right">점수</th></tr>
                                                    </thead>
                                                    <tbody className="divide-y dark:divide-slate-700 text-slate-900 dark:text-white">
                                                        {rankingData.weekly.slice(0, 10).map((r, i) => (
                                                            <tr key={r.name} className={`hover:bg-slate-50 dark:hover:bg-slate-800/40 ${r.name === nickname ? 'bg-blue-50/50 dark:bg-blue-900/20' : ''}`}>
                                                                <td className="px-5 py-5 italic text-xl font-black">{i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `#${i+1}`}</td>
                                                                <td className="px-5 py-5 break-words">
                                                                    <div className="flex flex-col">
                                                                        <span className="font-bold">{r.name}</span>
                                                                        <span className="text-[9px] text-blue-500 dark:text-blue-400 italic truncate break-words">{rankingData.getPersonalStatus(r.name).currentTitle.name}</span>
                                                                    </div>
                                                                </td>
                                                                <td className="px-5 py-5 text-right text-blue-600 dark:text-blue-400 italic whitespace-nowrap">{r.score} P</td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </section>
                                        <section className="space-y-6">
                                            <h3 className="font-black text-2xl italic uppercase text-emerald-600 px-2">시즌 명예의 전당 (누적)</h3>
                                            <div className="dashboard-card overflow-hidden">
                                                <table className="w-full text-left">
                                                    <thead className="bg-slate-50 dark:bg-slate-800 text-slate-400 text-[10px] uppercase border-b dark:border-slate-700">
                                                        <tr><th className="px-5 py-4">순위</th><th className="px-5 py-4">길드원</th><th className="px-5 py-4 text-right">통계</th></tr>
                                                    </thead>
                                                    <tbody className="divide-y dark:divide-slate-700 text-slate-900 dark:text-white">
                                                        {rankingData.weekly.slice(0, 10).map((r, i) => {
                                                            const st = stats.playerMap[r.name] || {};
                                                            return (
                                                                <tr key={r.name} className={`hover:bg-slate-50 dark:hover:bg-slate-800/40 ${r.name === nickname ? 'bg-emerald-50/50 dark:bg-emerald-900/20' : ''}`}>
                                                                    <td className="px-5 py-5 italic text-xl font-black">{i === 0 ? '👑' : i === 1 ? '💎' : i === 2 ? '⭐' : `#${i+1}`}</td>
                                                                    <td className="px-5 py-5 break-words">
                                                                        <div className="flex flex-col">
                                                                            <span className="font-bold">{r.name}</span>
                                                                            <span className="text-[9px] text-emerald-500 dark:text-emerald-400 italic break-words">{rankingData.getPersonalStatus(r.name).currentTitle.name}</span>
                                                                        </div>
                                                                    </td>
                                                                    <td className="px-5 py-5 text-right whitespace-nowrap">
                                                                        <div className="flex flex-col items-end">
                                                                            <span className="text-xs font-bold text-slate-600 dark:text-slate-300">총 참여: {st.swords || 0}회</span>
                                                                            <span className="text-[10px] text-slate-400">누적 점수: {r.score} P</span>
                                                                        </div>
                                                                    </td>
                                                                </tr>
                                                            );
                                                        })}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </section>
                                    </div>
                                </div>
                            )}

                            {mainCategory === 'history' && (
                                <div className="animate-fadeIn space-y-10 max-w-4xl mx-auto">
                                    <div className="flex flex-col gap-8">
                                        <div className="flex justify-between items-center px-2">
                                            <h3 className="font-black text-2xl italic uppercase text-pink-500">균격 작전 다이어리</h3>
                                            <div className="text-[10px] text-slate-400 uppercase tracking-widest">Conquest Seasonal Analytics</div>
                                        </div>
                                        <section className="space-y-6">
                                            <div className="flex items-center gap-2 px-2">
                                                <div className="w-1.5 h-6 bg-blue-500 rounded-full"></div>
                                                <h4 className="font-black text-lg italic uppercase text-blue-600 dark:text-blue-400">균격 시즌 상세 현황 (최근 4주)</h4>
                                            </div>
                                            <div className="dashboard-card p-8 border-l-[12px] border-blue-500 shadow-lg bg-white dark:bg-slate-800">
                                                <div className="text-slate-400 text-sm text-center">현재 시즌 통계는 개발 중입니다. (기존 레이드 데이터 정리 완료)</div>
                                            </div>
                                        </section>
                                    </div>
                                </div>
                            )}
                        </main>

                        {/* 하단 플로팅 컨트롤 (모바일/데스크톱 공용) */}
                        <div className="fixed bottom-3 md:bottom-6 left-1/2 -translate-x-1/2 w-[95%] md:w-full md:max-w-6xl z-[150] animate-fadeIn font-bold">
                            <div className="bg-slate-900/95 dark:bg-black/80 backdrop-blur-3xl text-white px-4 md:px-12 py-3.5 md:py-5 rounded-[2rem] md:rounded-[3.5rem] flex flex-col md:flex-row justify-between items-center shadow-2xl border border-white/10 gap-3 md:gap-0">
                                <div className="flex items-center gap-4 w-full md:w-auto min-w-0 border-b md:border-b-0 border-white/10 pb-2 md:pb-0">
                                    <div className="flex flex-col min-w-0">
                                        <span className="text-[8px] md:text-[9px] text-blue-400 uppercase tracking-[0.2em] mb-0.5">식별된 길드원</span>
                                        <div className="flex items-baseline gap-2">
                                            <span className="text-sm md:text-xl font-black italic tracking-tighter truncate text-white">{nickname}</span>
                                            <span className="text-[8px] md:text-[10px] text-blue-300 italic truncate">{myStatusObj.currentTitle.name}</span>
                                        </div>
                                    </div>
                                </div>
                                <div className="hidden lg:flex flex-col items-center justify-center flex-1 px-8 border-x border-white/10 mx-6 overflow-hidden">
                                    <span className="text-[8px] text-slate-400 uppercase tracking-widest mb-1">실시간 작전 피드</span>
                                    <div className="text-[10px] text-slate-200 italic truncate max-w-full text-center log-animate" key={latestLog ? latestLog.timestamp?.seconds : 'init'}>
                                        {latestLog ? (<>🚩 <span className="text-blue-400 font-black">[{latestLog.nickname}]</span> {latestLog.mob} 공략 성공</>) : ("새로운 작전 데이터를 기다리는 중...")}
                                    </div>
                                </div>
                                <div className="flex items-center justify-around md:justify-end gap-4 md:gap-10 w-full md:w-auto shrink-0">
                                    <div className="flex flex-col text-center">
                                        <span className="text-[8px] md:text-[9px] text-slate-400 uppercase mb-0.5">시스템 상태</span>
                                        <div className="flex items-center gap-1.5 justify-center">
                                            <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                                            <span className="text-[9px] md:text-xs uppercase tracking-tighter text-emerald-400">정상</span>
                                        </div>
                                    </div>
                                    <button onClick={handleResetSession} className="bg-white/10 hover:bg-red-600 text-white p-2.5 md:p-3.5 rounded-xl md:rounded-2xl text-[9px] md:text-[11px] uppercase transition-all border border-white/5 active:scale-90"><i className="fas fa-power-off"></i></button>
                                </div>
                            </div>
                        </div>

                        {/* 공지사항 모달 */}
                        {showNoticeModal && (
                            <div className="fixed inset-0 z-[1000] flex items-center justify-center p-4 custom-modal-overlay animate-fadeIn text-slate-900 dark:text-white" onClick={() => setShowNoticeModal(false)}>
                                <div className="bg-white dark:bg-slate-900 rounded-[2rem] shadow-2xl p-8 max-w-md w-full border-t-8 border-blue-500" onClick={e=>e.stopPropagation()}>
                                    <div className="flex justify-between items-center mb-6">
                                        <h3 className="text-lg font-black flex items-center gap-2"><i className="fas fa-bullhorn text-blue-500"></i>전체 공지사항</h3>
                                        <button onClick={() => setShowNoticeModal(false)} className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"><i className="fas fa-times"></i></button>
                                    </div>
                                    <p className="text-sm text-slate-700 dark:text-slate-300 leading-relaxed whitespace-pre-wrap">{notice}</p>
                                </div>
                            </div>
                        )}

                        {/* 히스토리 모달 */}
                        {showHistoryModal && (
                            <div className="fixed inset-0 z-[1000] flex items-center justify-center p-4 custom-modal-overlay animate-fadeIn text-slate-900 dark:text-white" onClick={() => setShowHistoryModal(false)}>
                                <div className="bg-white dark:bg-slate-900 rounded-[2rem] shadow-2xl w-full max-w-lg max-h-[80vh] flex flex-col border-t-8 border-blue-500" onClick={e=>e.stopPropagation()}>
                                    <div className="p-6 border-b dark:border-slate-800 flex justify-between items-center shrink-0">
                                        <h3 className="text-lg font-black"><i className="fas fa-history text-blue-500 mr-2"></i>모든 처치 기록</h3>
                                        <button onClick={() => setShowHistoryModal(false)} className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"><i className="fas fa-times"></i></button>
                                    </div>
                                    <div className="p-6 overflow-y-auto flex-1 space-y-3">
                                        {logs.map((l, idx) => (
                                            <div key={idx} className="p-3 bg-slate-50 dark:bg-slate-800/50 rounded-xl border border-slate-100 dark:border-slate-700 flex justify-between items-center">
                                                <div className="flex items-center gap-2">
                                                    <span className="text-xs font-black text-blue-600 dark:text-blue-400">{l.nickname}</span>
                                                    <span className="text-xs text-slate-700 dark:text-slate-300">{l.mob}</span>
                                                </div>
                                                <div className="text-right">
                                                    <div className="text-[10px] text-slate-400 font-mono">{l.timestamp?.seconds ? new Date(l.timestamp.seconds * 1000).toLocaleString() : ''}</div>
                                                    <div className="text-[10px] text-slate-500">{l.playMin}분 {l.playSec}초</div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            return (
                <React.Fragment>
                    {pageContent}
                    {/* 모달: 관리자 패스워드 등 공통 UI 모달 */}
                    {showAdminEntry && (
                        <div className="fixed inset-0 z-[1000] flex items-center justify-center p-4 bg-black/60 backdrop-blur-md animate-fadeIn font-bold">
                            <div className="bg-white dark:bg-slate-800 dashboard-card p-8 w-full max-w-[320px] border-t-8 border-blue-600 shadow-2xl">
                                <div className="mb-6 text-center">
                                    <p className="text-[10px] text-slate-500 uppercase tracking-widest mb-1">보안 인증</p>
                                    <h3 className="text-lg font-black dark:text-white">관리자 코드 입력</h3>
                                </div>
                                <div className="flex flex-col gap-4">
                                    <input type="password" autoFocus placeholder="Passkey" className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl px-4 py-4 text-center text-xl outline-none focus:border-blue-500 text-slate-900 dark:text-white font-black tracking-widest" value={adminPass} onChange={e => setAdminPass(e.target.value)} onKeyDown={e => { if(e.key === 'Enter' && adminPass === "123456") { setIsAdminMode(true); setShowAdminEntry(false); setAdminPass(""); } }} />
                                    <div className="grid grid-cols-2 gap-3">
                                        <button onClick={() => { setShowAdminEntry(false); setAdminPass(""); }} className="py-3 bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-white rounded-xl font-bold text-sm">취소</button>
                                        <button onClick={() => { if(adminPass === "123456") { setIsAdminMode(true); setShowAdminEntry(false); setAdminPass(""); } else { showAlert("비밀번호 오류", "error"); } }} className="py-3 bg-blue-600 text-white rounded-xl font-bold text-sm shadow-lg">인증</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                    {uiAlert && (
                        <div className="fixed inset-0 z-[1001] flex items-center justify-center p-4 custom-modal-overlay animate-fadeIn text-slate-900 font-bold">
                            <div className="bg-white dark:bg-slate-900 rounded-[2.5rem] shadow-2xl p-10 max-w-sm w-full text-center border-t-[8px] border-blue-500">
                                <p className="text-lg mb-8 dark:text-white font-bold">{uiAlert.message}</p>
                                <button onClick={closeAlert} className="w-full bg-blue-600 text-white py-4 rounded-2xl font-black shadow-lg">확인</button>
                            </div>
                        </div>
                    )}
                    {uiConfirm && (
                        <div className="fixed inset-0 z-[1001] flex items-center justify-center p-4 custom-modal-overlay animate-fadeIn text-slate-900 font-bold">
                            <div className="bg-white dark:bg-slate-900 rounded-[2.5rem] shadow-2xl p-10 max-w-sm w-full text-center border-t-[8px] border-orange-500">
                                <p className="text-lg mb-8 dark:text-white font-bold">{uiConfirm.message}</p>
                                <div className="grid grid-cols-2 gap-3">
                                    <button onClick={() => setUiConfirm(null)} className="py-4 bg-slate-100 dark:bg-slate-800 dark:text-white rounded-2xl font-bold">취소</button>
                                    <button onClick={() => { uiConfirm.onConfirm(); setUiConfirm(null); }} className="py-4 bg-orange-500 text-white rounded-2xl font-bold shadow-lg">확인</button>
                                </div>
                            </div>
                        </div>
                    )}
                </React.Fragment>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
