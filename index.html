<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>길드 통합 관리 시스템</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
        
        :root {
            --brand-primary: #2563EB;
        }

        body { 
            font-family: 'Noto Sans KR', 'Inter', sans-serif; 
            transition: background-color 0.2s, color 0.2s;
            background-color: #F8FAFC; 
            color: #0F172A;
            letter-spacing: -0.025em;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            width: 100%;
        }

        /* 다크모드 프리미엄 색상 지정 */
        .dark body { 
            background-color: #0B1220; 
            color: #F8FAFC;
        }

        .dashboard-card { 
            border-radius: 1.25rem; 
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            transition: background-color 0.2s, border-color 0.2s;
        }

        .dark .dashboard-card {
            background-color: #1E293B;
            border-color: #334155;
            color: #F8FAFC;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.3), 0 4px 6px -4px rgb(0 0 0 / 0.3);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }

        .app-container {
            width: 100%;
            max-width: 1440px;
            margin: 0 auto;
            min-height: 100vh;
        }

        .agent-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 0.75rem;
        }

        @media (min-width: 768px) {
            .agent-grid { grid-template-columns: repeat(2, 1fr); gap: 1.25rem; }
        }

        @media (min-width: 1024px) {
            .desktop-layout { display: grid; grid-template-columns: 380px 1fr; gap: 1.5rem; align-items: start; }
        }

        .main-tab-active { background-color: var(--brand-primary); color: white; box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2); }
        .custom-modal-overlay { background-color: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px); }

        @keyframes slideUpFade {
            0% { transform: translateY(10px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        .log-animate { animation: slideUpFade 0.5s ease-out forwards; }
        .animate-fadeIn { animation: slideUpFade 0.3s ease-out forwards; }

        @keyframes slotSpin {
            0% { transform: translateY(-20px); opacity: 0; }
            50% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(20px); opacity: 0; }
        }
        .slot-animation {
            animation: slotSpin 0.15s infinite linear;
        }
    </style>
</head>
<body class="font-bold">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, deleteDoc, doc, updateDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCOt_5hYk7Y9EDwo1Cd55et5-JT6k7LIcc",
            authDomain: "cat-hero-record.firebaseapp.com",
            projectId: "cat-hero-record",
            storageBucket: "cat-hero-record.firebasestorage.app",
            messagingSenderId: "1059204432454",
            appId: "1:1059204432454:web:b365ddd7d6a3da2c624047"
        };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'cat-hero-v24-final';
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const { useState, useEffect, useMemo, useRef } = React;

        const TOTAL_RESOURCES = 10; 
        const BASE_TIME_PER_SWORD = 2; 
        const INITIAL_MEMBERS = ["늑대벼리", "마자유", "고기쟁이", "김동순", "일민", "캣핑", "콘스", "하늘구름바다", "창식2", "나는도비", "노들노들", "포저", "라잌늑냥", "베리발", "장귝", "유나s"];
        
        const TITLES_LIST = [
            { id: 1, name: "길드의 새싹", score: 0 },
            { id: 2, name: "견습 길드원", score: 50 },
            { id: 3, name: "정식 길드원", score: 100 },
            { id: 4, name: "베테랑", score: 200 },
            { id: 5, name: "에이스", score: 400 },
            { id: 6, name: "정예 길드원", score: 600 },
            { id: 7, name: "전설의 길드원", score: 800 },
            { id: 8, name: "길드의 수호자", score: 1000 },
            { id: 9, name: "불멸의 전사", score: 1500 },
            { id: 10, name: "길드의 태양", score: 2000 },
            { id: 11, name: "길드의 자부심", score: 5000 },
            { id: 12, name: "길드의 신", score: 10000 },
        ];

        const REWARDS_LIST = ['레시피', '픽업', '룬 소환서', '특수룬 소환서', '동료 소환서'];
        const ZOOM_LEVELS = [50, 75, 90, 100, 110, 125, 150, 175, 200];

        function App() {
            const [user, setUser] = useState(null);
            const [nickname, setNickname] = useState(localStorage.getItem('cat_hero_nickname') || '');
            const [isNameSet, setIsNameSet] = useState(!!localStorage.getItem('cat_hero_nickname'));
            const [isAdminMode, setIsAdminMode] = useState(false);
            const [isSuperAdmin, setIsSuperAdmin] = useState(sessionStorage.getItem('isSuperAdmin') === 'true');
            const [adminPass, setAdminPass] = useState("");
            const [showAdminEntry, setShowAdminEntry] = useState(false);
            
            // 통합 테마 설정 ('light', 'dark', 'system')
            const [themeMode, setThemeMode] = useState(localStorage.getItem('cat_hero_theme') || 'system');
            
            // 줌(확대/축소) 레벨 설정
            const [zoomIndex, setZoomIndex] = useState(() => {
                const saved = localStorage.getItem('cat_hero_zoom');
                return saved !== null ? Number(saved) : 3; // 기본값 100% (index 3)
            });

            const [mainCategory, setMainCategory] = useState('conquest'); 
            const [conquestFilter, setConquestFilter] = useState('timeSort');
            const [historyTab, setHistoryTab] = useState('conquest');

            const [conquestNormalCount, setConquestNormalCount] = useState(0);
            const [conquestBossCount, setConquestBossCount] = useState(0);
            const [playMin, setPlayMin] = useState(0);
            const [playSec, setPlaySec] = useState(0);
            
            const [logs, setLogs] = useState([]);
            const [lootLogs, setLootLogs] = useState([]);
            const [members, setMembers] = useState([]);
            const [notice, setNotice] = useState("시스템 가동 중입니다.");
            const [newNotice, setNewNotice] = useState("");
            const [newMemberName, setNewMemberName] = useState("");
            
            const [myStat, setMyStat] = useState("");
            const [myMount, setMyMount] = useState("");

            const [favorites, setFavorites] = useState(JSON.parse(localStorage.getItem('cat_hero_favorites')) || []);

            const [uiAlert, setUiAlert] = useState(null);
            const [uiConfirm, setUiConfirm] = useState(null);
            const [showNoticeModal, setShowNoticeModal] = useState(false);
            const [showHistoryModal, setShowHistoryModal] = useState(false);

            const [strikeSubTab, setStrikeSubTab] = useState('calc'); 
            const [bossScoreStr, setBossScoreStr] = useState("");
            const [selectedCalcMembers, setSelectedCalcMembers] = useState([]); 
            const [calcMemberSearch, setCalcMemberSearch] = useState(''); 
            
            const [basketItems, setBasketItems] = useState([]);
            const [customEquipments, setCustomEquipments] = useState([]);
            const [equipType, setEquipType] = useState('모자');
            const [equipQty, setEquipQty] = useState('');
            
            const [distResult, setDistResult] = useState(null);
            const captureRef = useRef(null);
            const ratioCaptureRef = useRef(null); 

            // 수동 이력 추가 관련 상태
            const [manualLootDate, setManualLootDate] = useState('');
            const [manualLootItem, setManualLootItem] = useState('룬 소환서');
            const [manualLootWinner, setManualLootWinner] = useState('');
            const [manualLootQty, setManualLootQty] = useState(1);

            // 분배 애니메이션 연출 상태
            const [isDistAnimating, setIsDistAnimating] = useState(false);
            const [tempDistList, setTempDistList] = useState([]);
            const [slotDisplayNames, setSlotDisplayNames] = useState([]);
            const [enableAnimation, setEnableAnimation] = useState(localStorage.getItem('cat_hero_enable_anim') !== 'false');

            // 관리자 모드 전용 상태
            const [adminSearch, setAdminSearch] = useState('');
            const [adminSortType, setAdminSortType] = useState('score');

            // 스탯 수정 모달용 상태 변수
            const [statModalMember, setStatModalMember] = useState(null);
            const [inputStat, setInputStat] = useState('');
            const [inputMount, setInputMount] = useState('');
            const [inputDirectGyeokchu, setInputDirectGyeokchu] = useState('');

            const showAlert = (msg, type = 'success') => setUiAlert({ message: msg, type });
            const closeAlert = () => setUiAlert(null);

            // ---------- 시간 입력 관련 개선 로직 시작 ----------
            const handleTimeChange = (type, val) => {
                const strVal = val.replace(/[^0-9]/g, '');
                if (strVal === '') {
                    if (type === 'min') setPlayMin('');
                    else setPlaySec('');
                    return;
                }
                const num = parseInt(strVal, 10);
                if (type === 'min') setPlayMin(num);
                else setPlaySec(num);
            };

            const handleTimeBlur = () => {
                let currentMin = playMin === '' ? 0 : parseInt(playMin, 10);
                let currentSec = playSec === '' ? 0 : parseInt(playSec, 10);

                if (currentSec >= 60) {
                    currentMin += Math.floor(currentSec / 60);
                    currentSec = currentSec % 60;
                }
                setPlayMin(currentMin);
                setPlaySec(currentSec);
            };

            const handleAddTime = (type, val) => {
                let currentMin = playMin === '' ? 0 : parseInt(playMin, 10);
                let currentSec = playSec === '' ? 0 : parseInt(playSec, 10);

                if (type === 'min') {
                    setPlayMin(Math.max(0, currentMin + val));
                    setPlaySec(currentSec);
                } else {
                    let newSec = currentSec + val;
                    let newMin = currentMin;
                    
                    if (newSec >= 60) {
                        newMin += Math.floor(newSec / 60);
                        newSec = newSec % 60;
                    } else if (newSec < 0) {
                        if (newMin > 0) {
                            const borrow = Math.ceil(Math.abs(newSec) / 60);
                            if (newMin >= borrow) {
                                newMin -= borrow;
                                newSec = 60 * borrow + newSec;
                            } else {
                                newMin = 0;
                                newSec = 0;
                            }
                        } else {
                            newSec = 0;
                        }
                    }
                    setPlayMin(newMin);
                    setPlaySec(newSec);
                }
            };
            // ---------- 시간 입력 관련 개선 로직 끝 ----------

            const handleResetSession = () => {
                setUiConfirm({ 
                    message: "길드원 정보를 초기화하고 이름 선택 화면으로 돌아가시겠습니까?", 
                    onConfirm: () => { 
                        localStorage.removeItem('cat_hero_nickname'); 
                        setNickname(''); 
                        setIsNameSet(false); 
                    } 
                });
            };

            const toggleFavorite = (e, targetName) => {
                e.stopPropagation();
                let newFavs = [...favorites];
                if (newFavs.includes(targetName)) {
                    newFavs = newFavs.filter(f => f !== targetName);
                } else {
                    newFavs.push(targetName);
                }
                setFavorites(newFavs);
                localStorage.setItem('cat_hero_favorites', JSON.stringify(newFavs));
            };

            const getMemberGyeokchu = (m) => {
                if (m.directGyeokchu && Number(m.directGyeokchu) > 0) return Number(m.directGyeokchu);
                const statVal = Math.floor(Number(m.stat) || 0);
                const mountVal = Math.floor(Number(m.mount) || 0);
                if (statVal > 0 || mountVal > 0) return (statVal + 6 + mountVal) * 10 + 1000;
                return 0; 
            };

            const copyToClipboard = (text) => {
                const ta = document.createElement("textarea");
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showAlert("텍스트가 복사되었습니다.");
            };

            const handleAdminUpdateField = async (id, field, value) => {
                try {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members_v24', id), { [field]: value });
                    showAlert("저장되었습니다.");
                } catch (e) {
                    showAlert("저장에 실패했습니다.", "error");
                }
            };

            const handleSaveMemberStats = async () => {
                if (!statModalMember) return;
                try {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members_v24', statModalMember.id), {
                        stat: inputStat === '' ? null : Number(inputStat),
                        mount: inputMount === '' ? null : Number(inputMount),
                        directGyeokchu: inputDirectGyeokchu === '' ? null : Number(inputDirectGyeokchu)
                    });
                    showAlert("저장되었습니다.");
                    setStatModalMember(null);
                } catch (e) {
                    showAlert("저장에 실패했습니다.", "error");
                }
            };

            const handleCaptureImage = () => {
                if(!captureRef.current) return;
                setTimeout(() => {
                    html2canvas(captureRef.current, {
                        scale: window.devicePixelRatio || 2,
                        useCORS: true,
                        backgroundColor: document.documentElement.classList.contains('dark') ? '#0B1220' : '#F8FAFC',
                        scrollY: -window.scrollY
                    }).then(canvas => {
                        const link = document.createElement('a');
                        link.download = `분배결과_${new Date().getTime()}.png`;
                        link.href = canvas.toDataURL('image/png', 1.0);
                        link.click();
                        showAlert("분배 결과가 이미지로 저장되었습니다.");
                    }).catch(e => showAlert("이미지 생성 오류", "error"));
                }, 300); 
            };

            const handleCaptureRatio = () => {
                if(!ratioCaptureRef.current) return;
                setTimeout(() => {
                    html2canvas(ratioCaptureRef.current, {
                        scale: 2, 
                        useCORS: true,
                        backgroundColor: document.documentElement.classList.contains('dark') ? '#0B1220' : '#F8FAFC',
                        windowWidth: 1000, 
                        onclone: (clonedDoc) => {
                            const el = clonedDoc.getElementById(ratioCaptureRef.current.id);
                            if (el) {
                                el.style.width = '1000px';
                                el.style.minHeight = '1000px';
                                el.style.display = 'flex';
                                el.style.flexDirection = 'column';
                                el.style.justifyContent = 'center';
                                el.style.padding = '60px'; 
                                el.style.borderRadius = '0px'; 
                            }
                        }
                    }).then(canvas => {
                        const link = document.createElement('a');
                        link.download = `비율결과_${new Date().getTime()}.png`;
                        link.href = canvas.toDataURL('image/png', 1.0);
                        link.click();
                        showAlert("비율 결과가 1:1 이미지로 저장되었습니다.");
                    }).catch(e => showAlert("이미지 생성 오류", "error"));
                }, 300); 
            };

            const handleResetDistribution = () => {
                setUiConfirm({
                    message: "현재 분배 결과를 초기화하시겠습니까?\n(선택된 보상 목록도 함께 초기화됩니다)",
                    checkboxLabel: "참여 길드원 목록도 함께 초기화",
                    onConfirm: (clearMembers) => {
                        setDistResult(null);
                        setBasketItems([]);
                        setCustomEquipments([]);
                        setIsDistAnimating(false);
                        if (clearMembers) {
                            setSelectedCalcMembers([]);
                        }
                        showAlert("분배 결과가 초기화되었습니다.");
                    }
                });
            };

            // 테마 변경 Effect
            useEffect(() => {
                const applyTheme = () => {
                    let isDark = false;
                    if (themeMode === 'system') {
                        isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                    } else {
                        isDark = themeMode === 'dark';
                    }
                    if (isDark) document.documentElement.classList.add('dark');
                    else document.documentElement.classList.remove('dark');
                };
                
                applyTheme();
                localStorage.setItem('cat_hero_theme', themeMode);
                
                if (themeMode === 'system') {
                    const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
                    const listener = () => applyTheme();
                    mediaQuery.addEventListener('change', listener);
                    return () => mediaQuery.removeEventListener('change', listener);
                }
            }, [themeMode]);

            // 확대/축소 Effect
            useEffect(() => {
                const scale = ZOOM_LEVELS[zoomIndex] / 100;
                document.documentElement.style.fontSize = `${16 * scale}px`;
                localStorage.setItem('cat_hero_zoom', zoomIndex);
            }, [zoomIndex]);

            useEffect(() => {
                localStorage.setItem('cat_hero_enable_anim', enableAnimation);
            }, [enableAnimation]);

            useEffect(() => {
                const initAuth = async () => { try { await signInAnonymously(auth); } catch (e) { console.error(e); } };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsubMembers = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'members_v24'), (snapshot) => {
                    if (snapshot.empty) {
                        INITIAL_MEMBERS.forEach(name => addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'members_v24'), { name, score: 0 }));
                    } else {
                        const loaded = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        setMembers(loaded);
                        const me = loaded.find(m => m.name === nickname);
                        if(me) {
                            setMyStat(me.stat || '');
                            setMyMount(me.mount || '');
                        }
                    }
                });

                const unsubLogs = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'conquest_logs_v24'), (snapshot) => {
                    setLogs(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0)));
                });

                const unsubLoot = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'loot_history_v24'), (snapshot) => {
                    setLootLogs(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort((a, b) => {
                        const timeA = a.timestamp?.seconds ? a.timestamp.seconds * 1000 : new Date(a.timestamp).getTime();
                        const timeB = b.timestamp?.seconds ? b.timestamp.seconds * 1000 : new Date(b.timestamp).getTime();
                        return timeB - timeA;
                    }));
                });

                const unsubSettings = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'global'), (snapshot) => {
                    if (snapshot.exists()) setNotice(snapshot.data().notice || "");
                });

                return () => { unsubMembers(); unsubLogs(); unsubLoot(); unsubSettings(); };
            }, [user, nickname]);

            const stats = useMemo(() => {
                const playerMap = {};
                members.forEach(m => playerMap[m.name] = { 
                    swords: 0, totalInputTimeSec: 0, joinedLogs: [], latestTime: 0, 
                    normalCount: 0, bossCount: 0, points: 0 
                });
                logs.forEach(l => { 
                    if (playerMap[l.nickname]) { 
                        playerMap[l.nickname].swords += 1; 
                        const duration = (Number(l.playMin || 0) * 60 + Number(l.playSec || 0));
                        playerMap[l.nickname].totalInputTimeSec += duration;
                        playerMap[l.nickname].joinedLogs.push(l);
                        if(l.timestamp?.seconds && l.timestamp.seconds > playerMap[l.nickname].latestTime) {
                            playerMap[l.nickname].latestTime = l.timestamp.seconds;
                        }
                        if (l.mob === '일반몹') {
                            playerMap[l.nickname].normalCount += 1;
                            playerMap[l.nickname].points += 5;
                        } else if (l.mob === '보스') {
                            playerMap[l.nickname].bossCount += 1;
                            playerMap[l.nickname].points += 10;
                        }
                    } 
                });
                return { playerMap };
            }, [logs, members]);

            const rankingData = useMemo(() => {
                const sortedByPoints = [...members].sort((a, b) => {
                    const statA = stats.playerMap[a.name] || { points: 0, bossCount: 0, latestTime: 0 };
                    const statB = stats.playerMap[b.name] || { points: 0, bossCount: 0, latestTime: 0 };
                    
                    const pointsA = a.rankingPoints !== undefined ? a.rankingPoints : statA.points;
                    const pointsB = b.rankingPoints !== undefined ? b.rankingPoints : statB.points;

                    if (pointsB !== pointsA) return pointsB - pointsA;
                    
                    const bossA = a.rankingBoss !== undefined ? a.rankingBoss : statA.bossCount;
                    const bossB = b.rankingBoss !== undefined ? b.rankingBoss : statB.bossCount;
                    if (bossB !== bossA) return bossB - bossA;
                    
                    const timeA = a.latestTime?.seconds ? a.latestTime.seconds : statA.latestTime;
                    const timeB = b.latestTime?.seconds ? b.latestTime.seconds : statB.latestTime;
                    if (timeB !== timeA) return timeB - timeA;
                    
                    return a.name.localeCompare(b.name);
                });

                const getPersonalStatus = (name) => {
                    const m = members.find(mem => mem.name === name) || { score: 0 };
                    const pStat = stats.playerMap[name] || { points: 0 };
                    const currentPoints = m.rankingPoints !== undefined ? m.rankingPoints : pStat.points;
                    
                    const currentTitle = [...TITLES_LIST].reverse().find(t => currentPoints >= t.score) || TITLES_LIST[0];
                    const nextTitle = TITLES_LIST.find(t => t.score > currentPoints);
                    const rankIdx = sortedByPoints.findIndex(mem => mem.name === name);
                    
                    return { currentTitle, nextTitle, score: currentPoints, rank: rankIdx + 1, rankObj: m };
                };
                
                return { weekly: sortedByPoints, getPersonalStatus };
            }, [members, stats]);

            const sortedConquestMembers = useMemo(() => {
                return members
                    .filter(m => {
                        if (conquestFilter === 'inactive') return (stats.playerMap[m.name]?.swords || 0) === 0;
                        return true;
                    })
                    .sort((a, b) => {
                        if (conquestFilter === 'all') return a.name.localeCompare(b.name);
                        const timeA = stats.playerMap[a.name]?.totalInputTimeSec || 0;
                        const timeB = stats.playerMap[b.name]?.totalInputTimeSec || 0;
                        return timeA - timeB; 
                    });
            }, [members, conquestFilter, stats]);

            const adminSortedMembers = useMemo(() => {
                return [...members]
                    .filter(m => !adminSearch || m.name.toLowerCase().includes(adminSearch.toLowerCase()))
                    .sort((a, b) => {
                        const statA = stats.playerMap[a.name] || { points: 0, latestTime: 0, swords: 0 };
                        const statB = stats.playerMap[b.name] || { points: 0, latestTime: 0, swords: 0 };
                        
                        const pointsA = a.rankingPoints !== undefined ? a.rankingPoints : statA.points;
                        const pointsB = b.rankingPoints !== undefined ? b.rankingPoints : statB.points;

                        if (adminSortType === 'score') return pointsB - pointsA;
                        if (adminSortType === 'gyeokchu') return getMemberGyeokchu(b) - getMemberGyeokchu(a);
                        if (adminSortType === 'latest') {
                            const timeA = a.latestTime?.seconds ? a.latestTime.seconds : statA.latestTime;
                            const timeB = b.latestTime?.seconds ? b.latestTime.seconds : statB.latestTime;
                            return timeB - timeA;
                        }
                        if (adminSortType === 'count') {
                            const countA = a.rankingNormal !== undefined ? (a.rankingNormal + (a.rankingBoss || 0)) : statA.swords;
                            const countB = b.rankingNormal !== undefined ? (b.rankingNormal + (b.rankingBoss || 0)) : statB.swords;
                            return countB - countA;
                        }
                        return 0;
                    });
            }, [members, adminSearch, adminSortType, stats]);

            const handleSaveMyStat = async () => {
                const member = members.find(m => m.name === nickname);
                if (!member) return;
                try {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members_v24', member.id), {
                        stat: myStat === '' ? null : Math.floor(Number(myStat)),
                        mount: myMount === '' ? null : Math.floor(Number(myMount))
                    });
                    showAlert("저장되었습니다.");
                } catch(e) { showAlert("저장에 실패했습니다.", "error"); }
            };

            const handleSubmitConquest = async (e) => {
                e.preventDefault();
                const totalCount = conquestNormalCount + conquestBossCount;
                if (totalCount === 0 || !nickname) return showAlert("입력된 처치 마릿수가 없습니다.", "error");
                
                const member = members.find(m => m.name === nickname);
                if ((stats.playerMap[nickname]?.swords || 0) + totalCount > TOTAL_RESOURCES) return showAlert(`한도(${TOTAL_RESOURCES}회) 초과 불가`, "error");
                
                try {
                    const batchGroupId = `grp_${new Date().getTime()}`;
                    const finalMin = Number(playMin) || 0;
                    const finalSec = Number(playSec) || 0;

                    for(let i=0; i<conquestNormalCount; i++){
                        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'conquest_logs_v24'), { nickname, mob: '일반몹', playMin: finalMin, playSec: finalSec, groupId: batchGroupId, timestamp: serverTimestamp(), uid: user.uid });
                    }
                    for(let i=0; i<conquestBossCount; i++){
                        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'conquest_logs_v24'), { nickname, mob: '보스', playMin: finalMin, playSec: finalSec, groupId: batchGroupId, timestamp: serverTimestamp(), uid: user.uid });
                    }
                    
                    if (member) {
                        const currentPoints = member.rankingPoints !== undefined ? member.rankingPoints : (stats.playerMap[nickname]?.points || 0);
                        const currentNormal = member.rankingNormal !== undefined ? member.rankingNormal : (stats.playerMap[nickname]?.normalCount || 0);
                        const currentBoss = member.rankingBoss !== undefined ? member.rankingBoss : (stats.playerMap[nickname]?.bossCount || 0);

                        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members_v24', member.id), { 
                            score: (member.score || 0) + (totalCount * 5),
                            rankingPoints: currentPoints + (conquestNormalCount * 5) + (conquestBossCount * 10),
                            rankingNormal: currentNormal + conquestNormalCount,
                            rankingBoss: currentBoss + conquestBossCount,
                            latestTime: serverTimestamp()
                        });
                    }
                    
                    setConquestNormalCount(0); setConquestBossCount(0); setPlayMin(0); setPlaySec(0);
                    showAlert(`총 ${totalCount}건의 작전 기록이 승인되었습니다.`);
                } catch (err) { showAlert("실패", "error"); }
            };

            const handleUndoLastConquest = async () => {
                const myLogs = logs.filter(l => l.nickname === nickname).sort((a,b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
                if (myLogs.length === 0) return showAlert("취소할 최근 기록이 없습니다.", "error");
                const latestLogDoc = myLogs[0];
                const targetGroupId = latestLogDoc.groupId;
                
                let targetLogs = targetGroupId ? myLogs.filter(l => l.groupId === targetGroupId) : [latestLogDoc];
                
                setUiConfirm({
                    message: `마지막으로 등록한 ${targetLogs.length}건의 기록을 취소하시겠습니까?`,
                    onConfirm: async () => {
                        try {
                            let normalToUndo = 0;
                            let bossToUndo = 0;
                            for(const tl of targetLogs) {
                                if (tl.mob === '일반몹') normalToUndo++;
                                else if (tl.mob === '보스') bossToUndo++;
                                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'conquest_logs_v24', tl.id));
                            }
                            const member = members.find(m => m.name === nickname);
                            if (member) {
                                const currentPoints = member.rankingPoints !== undefined ? member.rankingPoints : (stats.playerMap[nickname]?.points || 0);
                                const currentNormal = member.rankingNormal !== undefined ? member.rankingNormal : (stats.playerMap[nickname]?.normalCount || 0);
                                const currentBoss = member.rankingBoss !== undefined ? member.rankingBoss : (stats.playerMap[nickname]?.bossCount || 0);

                                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members_v24', member.id), { 
                                    score: Math.max(0, (member.score || 0) - (targetLogs.length * 5)),
                                    rankingPoints: Math.max(0, currentPoints - (normalToUndo * 5) - (bossToUndo * 10)),
                                    rankingNormal: Math.max(0, currentNormal - normalToUndo),
                                    rankingBoss: Math.max(0, currentBoss - bossToUndo)
                                });
                            }
                            showAlert("기록이 성공적으로 취소 및 차감되었습니다.");
                        } catch (err) { showAlert("취소 실패", "error"); }
                    }
                });
            };

            const handleAddManualLoot = async (e) => {
                e.preventDefault();
                if(!manualLootWinner) return showAlert("당첨될 길드원을 지정해주세요.", "error");
                try {
                    const ts = manualLootDate ? new Date(manualLootDate) : new Date();
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'loot_history_v24'), {
                        distType: '수동 이력 추가',
                        list: [{ itemStr: `${manualLootItem} x${manualLootQty}`, winner: manualLootWinner }],
                        timestamp: ts
                    });
                    showAlert("수동 이력이 정상 추가되었습니다.");
                    setManualLootQty(1);
                    setManualLootWinner('');
                } catch(err) { showAlert("저장 실패", "error"); }
            };

            const calcStrikeReport = useMemo(() => {
                let totalGyeokchu = 0;
                const activeMembers = [];
                const bScore = Number(bossScoreStr) || 0;

                selectedCalcMembers.forEach(id => {
                    const m = members.find(mem => mem.id === id);
                    if (m) {
                        const gk = getMemberGyeokchu(m);
                        totalGyeokchu += gk;
                        activeMembers.push({ id: m.id, name: m.name, gyeokchu: gk });
                    }
                });

                const expectedSeconds = totalGyeokchu > 0 ? Math.ceil(bScore / totalGyeokchu) : 0;
                
                const individualReports = activeMembers.map(m => {
                    const rate = totalGyeokchu > 0 ? (m.gyeokchu / totalGyeokchu) * 100 : 0;
                    const score = totalGyeokchu > 0 ? Math.round(bScore * (m.gyeokchu / totalGyeokchu)) : 0;
                    
                    const indExpectedSec1x = (bScore > 0 && m.gyeokchu > 0) ? Math.ceil(bScore / m.gyeokchu) : 0;
                    const indExpectedSec2x = (bScore > 0 && m.gyeokchu > 0) ? Math.ceil(bScore / (m.gyeokchu * 2)) : 0;

                    return { ...m, rate: Number(rate.toFixed(2)), expectedScore: score, indExpectedSec1x, indExpectedSec2x };
                }).sort((a, b) => b.gyeokchu - a.gyeokchu);

                return { totalGyeokchu, expectedSeconds, individualReports };
            }, [selectedCalcMembers, members, bossScoreStr]);

            const saveDistributionHistory = async (result) => {
                try {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'loot_history_v24'), {
                        distType: result.type,
                        list: result.list,
                        timestamp: serverTimestamp()
                    });
                } catch (err) { console.error("Failed to save history", err); }
            };

            const executeDistribution = (type) => {
                if(selectedCalcMembers.length === 0) return showAlert("참여 길드원이 없습니다.", "error");
                if(basketItems.length === 0 && customEquipments.length === 0) return showAlert("등록된 보상이 없습니다.", "error");

                let resultArr = [];
                const pNames = selectedCalcMembers.map(id => members.find(m => m.id === id)?.name).filter(Boolean);

                if (type === 'random') {
                    const equipItem = basketItems.find(b => b.name === '장비');
                    if (equipItem) {
                        for(let i=0; i<equipItem.qty; i++){
                            const winner = pNames[Math.floor(Math.random() * pNames.length)];
                            resultArr.push({ itemStr: '장비', winner, isEquip: true, isRandom: true });
                        }
                    }
                    customEquipments.forEach(eq => {
                        for(let i=0; i<eq.qty; i++){
                            const winner = pNames[Math.floor(Math.random() * pNames.length)];
                            resultArr.push({ itemStr: `장비(${eq.type})`, winner, isEquip: true, isRandom: true });
                        }
                    });

                    basketItems.filter(b => b.name !== '장비').forEach(item => {
                        const winner = pNames[Math.floor(Math.random() * pNames.length)];
                        resultArr.push({ itemStr: `${item.name} (일괄)`, winner, isEquip: false, isRandom: true });
                    });
                } else if (type === 'contrib') {
                    if(calcStrikeReport.individualReports.length === 0) return showAlert("격추 데이터가 없습니다.", "error");
                    
                    let allItems = [];
                    basketItems.forEach(b => { allItems.push({ name: b.name, qty: b.qty, isEquip: b.name === '장비' }); });
                    customEquipments.forEach(eq => { allItems.push({ name: `장비(${eq.type})`, qty: eq.qty, isEquip: true }); });

                    allItems.forEach(item => {
                        let totalQty = item.qty;
                        let remain = totalQty;
                        let fractions = [];
                        
                        calcStrikeReport.individualReports.forEach(r => {
                            const alloc = totalQty * (r.rate / 100);
                            const base = Math.floor(alloc);
                            remain -= base;
                            fractions.push({ name: r.name, frac: alloc - base, base });
                        });
                        
                        fractions.sort((a,b) => b.frac - a.frac);
                        for(let i=0; i<remain; i++){ fractions[i].base += 1; }
                        
                        fractions.forEach(f => {
                            if(f.base > 0) resultArr.push({ itemStr: `${item.name} x${f.base}`, winner: f.name, isEquip: item.isEquip, isRandom: false });
                        });
                    });
                }

                const finalResult = { type: type === 'random' ? '무작위 랜덤 분배' : '기여도 기반 분배', list: resultArr };

                if (enableAnimation) {
                    setDistResult(null);
                    setTempDistList(resultArr);
                    setIsDistAnimating(true);
                    setSlotDisplayNames(resultArr.map(() => pNames[Math.floor(Math.random() * pNames.length)]));
                } else {
                    setDistResult(finalResult);
                    saveDistributionHistory(finalResult);
                }
            };

            useEffect(() => {
                let interval;
                let timeout;
                if (isDistAnimating) {
                    const pNames = selectedCalcMembers.map(id => members.find(m => m.id === id)?.name).filter(Boolean);
                    if (pNames.length > 0) {
                        interval = setInterval(() => {
                            setSlotDisplayNames(tempDistList.map(() => pNames[Math.floor(Math.random() * pNames.length)]));
                        }, 80);
                    }
                    timeout = setTimeout(() => {
                        setIsDistAnimating(false);
                        const finalResult = { type: tempDistList[0]?.isRandom ? '무작위 랜덤 분배' : '기여도 기반 분배', list: tempDistList };
                        setDistResult(finalResult);
                        saveDistributionHistory(finalResult);
                    }, 2500); 
                }
                return () => { clearInterval(interval); clearTimeout(timeout); };
            }, [isDistAnimating, tempDistList, selectedCalcMembers, members]);

            const handleSkipAnimation = () => {
                setIsDistAnimating(false);
                const finalResult = { type: tempDistList[0]?.isRandom ? '무작위 랜덤 분배' : '기여도 기반 분배', list: tempDistList };
                setDistResult(finalResult);
                saveDistributionHistory(finalResult);
            };

            const groupedDistResult = useMemo(() => {
                if (!distResult || !distResult.list) return {};
                return distResult.list.reduce((acc, curr) => {
                    if (!acc[curr.winner]) acc[curr.winner] = {};
                    if (!acc[curr.winner][curr.itemStr]) {
                        acc[curr.winner][curr.itemStr] = { ...curr, count: 0 };
                    }
                    acc[curr.winner][curr.itemStr].count += 1;
                    return acc;
                }, {});
            }, [distResult]);

            let pageContent;

            if (isAdminMode) {
                pageContent = (
                    <div className="min-h-screen bg-slate-100 dark:bg-slate-950 p-4 md:p-8 animate-fadeIn text-slate-900 dark:text-slate-100 font-bold pb-40">
                        <div className="max-w-7xl mx-auto dashboard-card p-6 md:p-8 border-t-8 border-slate-800 shadow-2xl">
                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 gap-4 border-b pb-6 dark:border-slate-700">
                                <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 bg-slate-100 dark:bg-slate-800 rounded-xl flex items-center justify-center text-slate-800 dark:text-slate-200 font-bold"><i className="fas fa-shield-alt"></i></div>
                                    <h2 className="text-xl md:text-2xl font-black italic">관리 센터</h2>
                                </div>
                                <button onClick={() => setIsAdminMode(false)} className="px-6 py-2.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 rounded-xl font-black shadow-sm text-slate-900 dark:text-white uppercase text-xs">나가기</button>
                            </div>
                            
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                <div className="space-y-8 lg:col-span-1">
                                    <section>
                                        <label className="text-[10px] text-slate-400 uppercase tracking-widest mb-3 block font-bold">전체 공지사항 (상단 노출)</label>
                                        <div className="flex gap-2">
                                            <input type="text" className="flex-1 p-3 border-2 border-slate-100 dark:border-slate-800 rounded-xl bg-white dark:bg-slate-900 text-sm outline-none focus:border-blue-500" value={newNotice} onChange={e => setNewNotice(e.target.value)} placeholder="모든 길드원에게 노출될 공지사항" />
                                            <button onClick={async () => { await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'global'), { notice: newNotice }); showAlert("저장되었습니다."); }} className="px-5 bg-blue-600 text-white rounded-xl font-black shadow-lg hover:bg-blue-700 transition-colors">송출</button>
                                        </div>
                                    </section>
                                    
                                    <section>
                                        <label className="text-[10px] text-slate-400 uppercase tracking-widest mb-3 block font-bold">데이터 관리 도구</label>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                            <button onClick={() => setUiConfirm({ message: "균격 기록을 삭제합니까?\n(랭킹 누적 포인트 및 시즌 통계는 안전하게 보존됩니다)", onConfirm: async () => { const snap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'conquest_logs_v24')); for (const d of snap.docs) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'conquest_logs_v24', d.id)); showAlert("기록이 초기화되었습니다."); } })} className="p-4 bg-blue-50 dark:bg-blue-900/20 border border-blue-100 dark:border-blue-900 rounded-xl text-blue-600 dark:text-blue-400 text-xs font-black uppercase hover:bg-blue-100 transition-colors">기록(균격) 초기화</button>
                                            <button onClick={() => setUiConfirm({ message: "랭킹 점수를 완전 초기화합니까?", onConfirm: async () => { for (const m of members) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members_v24', m.id), { rankingPoints: 0, rankingNormal: 0, rankingBoss: 0, score: 0 }); showAlert("점수가 0으로 초기화되었습니다."); } })} className="p-4 bg-red-50 dark:bg-red-900/20 border border-red-100 dark:border-red-900 rounded-xl text-red-600 dark:text-red-400 text-xs font-black uppercase hover:bg-red-100 transition-colors">랭킹(점수) 초기화</button>
                                        </div>
                                    </section>
                                    
                                    <section className="dashboard-card p-5 border-l-[4px] border-amber-500 bg-amber-50/20 dark:bg-amber-900/10">
                                        <h3 className="text-xs font-black mb-3 text-amber-600 dark:text-amber-400">길드원 추가</h3>
                                        <div className="flex gap-2">
                                            <input type="text" className="flex-1 p-3 border border-slate-200 dark:border-slate-700 rounded-xl outline-none focus:border-amber-500 bg-white dark:bg-slate-900 text-sm" value={newMemberName} onChange={e => setNewMemberName(e.target.value)} placeholder="신규 닉네임" />
                                            <button onClick={async () => { if(!newMemberName) return; await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'members_v24'), { name: newMemberName, score: 0 }); setNewMemberName(""); showAlert("추가되었습니다."); }} className="px-5 bg-slate-800 dark:bg-slate-700 text-white rounded-xl font-bold hover:bg-slate-900 transition-colors">등록</button>
                                        </div>
                                    </section>
                                </div>
                                
                                <section className="lg:col-span-2 flex flex-col h-full min-h-[500px]">
                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-end mb-4 gap-4">
                                        <div className="space-y-1">
                                            <label className="text-[10px] text-slate-400 uppercase tracking-widest block font-bold">인원 상세 정보 및 관리 ({members.length}명)</label>
                                            <p className="text-[10px] text-slate-500">포인트나 스탯을 변경하면 자동으로 <strong className="text-blue-500">저장</strong>됩니다.</p>
                                        </div>
                                        <div className="flex gap-2 w-full sm:w-auto">
                                            <select className="p-2 border border-slate-200 dark:border-slate-700 rounded-xl text-xs outline-none focus:border-blue-500 bg-white dark:bg-slate-800 font-bold" value={adminSortType} onChange={e => setAdminSortType(e.target.value)}>
                                                <option value="score">랭킹 점수순</option>
                                                <option value="gyeokchu">누적 격추순</option>
                                                <option value="latest">최근 참여순</option>
                                                <option value="count">참여 횟수순</option>
                                            </select>
                                            <div className="relative flex-1">
                                                <input type="text" value={adminSearch} onChange={e => setAdminSearch(e.target.value)} placeholder="🔍 길드원 이름 검색" className="w-full p-2 pl-8 border border-slate-200 dark:border-slate-700 rounded-xl text-xs outline-none focus:border-blue-500 bg-white dark:bg-slate-800" />
                                                <i className="fas fa-search absolute left-3 top-[10px] text-[10px] text-slate-400"></i>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="flex-1 overflow-y-auto border-2 border-slate-100 dark:border-slate-800 rounded-2xl bg-white dark:bg-slate-900 shadow-inner no-scrollbar">
                                        {adminSortedMembers.map(m => {
                                            const mStat = stats.playerMap[m.name] || {};
                                            const isFav = favorites.includes(m.name);
                                            const gyeokchu = getMemberGyeokchu(m);
                                            const pts = m.rankingPoints !== undefined ? m.rankingPoints : (mStat.points || 0);

                                            return (
                                                <div key={m.id} className="p-4 md:p-5 hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors border-b dark:border-slate-800 last:border-b-0 flex flex-col gap-4">
                                                    <div className="flex justify-between items-start">
                                                        <div className="flex items-center gap-3">
                                                            <button onClick={(e) => toggleFavorite(e, m.name)} className="text-lg focus:outline-none">
                                                                <i className={`fas fa-star ${isFav ? 'text-yellow-400' : 'text-slate-300 dark:text-slate-600'}`}></i>
                                                            </button>
                                                            <div>
                                                                <span className="font-black text-blue-600 dark:text-blue-400 text-base">{m.name}</span>
                                                                <div className="text-[10px] text-slate-500 flex items-center gap-3 mt-1 font-mono">
                                                                    <span>참여: {m.rankingNormal !== undefined ? (m.rankingNormal + (m.rankingBoss||0)) : (mStat.swords || 0)}회</span>
                                                                    <span>최근: {m.latestTime?.seconds ? new Date(m.latestTime.seconds * 1000).toLocaleDateString() : (mStat.latestTime ? new Date(mStat.latestTime * 1000).toLocaleDateString() : '없음')}</span>
                                                                </div>
                                                            </div>
                                                        </div>
                                                        <button onClick={() => setUiConfirm({ message: `${m.name} 님을 길드에서 삭제합니까?`, onConfirm: async () => { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members_v24', m.id)); showAlert("삭제되었습니다."); } })} className="text-slate-400 hover:text-red-500 text-xs p-1 transition-colors"><i className="fas fa-trash"></i></button>
                                                    </div>
                                                    
                                                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 bg-slate-50 dark:bg-slate-950/50 p-3 rounded-xl border border-slate-100 dark:border-slate-800">

                                        </div>
                                    </div>
                                    <div className="flex items-center justify-around md:justify-end gap-4 md:gap-10 w-full md:w-auto shrink-0">
                                        <div className="flex flex-col text-center">
                                            <span className="text-[8px] md:text-[9px] text-emerald-400 uppercase tracking-[0.1em] mb-0.5">길드 내 랭킹</span>
                                            <div className="flex items-center justify-center gap-1.5">
                                                <span className="text-xs md:text-lg font-black italic">{myStatusObj.rank}위</span>
                                                <span className="text-[8px] md:text-[10px] text-slate-400">({myStatusObj.score}p)</span>
                                            </div>
                                        </div>
                                        <div className="h-8 w-px bg-white/10"></div>
                                        <div className="flex flex-col text-center">
                                            <span className="text-[8px] md:text-[9px] text-slate-400 uppercase mb-0.5">시스템 상태</span>
                                            <div className="flex items-center gap-1.5 justify-center">
                                                <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                                                <span className="text-[9px] md:text-xs uppercase tracking-tighter text-emerald-400">정상</span>
                                            </div>
                                        </div>
                                        <button onClick={handleResetSession} className="bg-white/10 hover:bg-red-600 text-white p-2.5 md:p-3.5 rounded-xl md:rounded-2xl text-[9px] md:text-[11px] uppercase transition-all border border-white/5 active:scale-90"><i className="fas fa-power-off"></i></button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* 공지사항 모달 */}
                        {showNoticeModal && (
                            <div className="fixed inset-0 z-[1000] flex items-center justify-center p-4 custom-modal-overlay animate-fadeIn text-slate-900 dark:text-white" onClick={() => setShowNoticeModal(false)}>
                                <div className="bg-white dark:bg-slate-900 rounded-[2rem] shadow-2xl p-8 max-w-md w-full border-t-8 border-blue-500" onClick={e=>e.stopPropagation()}>
                                    <div className="flex justify-between items-center mb-6">
                                        <h3 className="text-lg font-black flex items-center gap-2"><i className="fas fa-bullhorn text-blue-500"></i>전체 공지사항</h3>
                                        <button onClick={() => setShowNoticeModal(false)} className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"><i className="fas fa-times"></i></button>
                                    </div>
                                    <p className="text-sm text-slate-700 dark:text-slate-300 leading-relaxed whitespace-pre-wrap">{notice}</p>
                                </div>
                            </div>
                        )}

                        {/* 기록 모달 */}
                        {showHistoryModal && (
                            <div className="fixed inset-0 z-[1000] flex items-center justify-center p-4 custom-modal-overlay animate-fadeIn text-slate-900 dark:text-white" onClick={() => setShowHistoryModal(false)}>
                                <div className="bg-white dark:bg-slate-900 rounded-[2.5rem] shadow-2xl w-full max-w-lg max-h-[85vh] flex flex-col border-t-8 border-blue-500" onClick={e=>e.stopPropagation()}>
                                    <div className="p-6 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center shrink-0">
                                        <h3 className="text-lg font-black"><i className="fas fa-history text-blue-500 mr-2"></i>모든 처치 기록</h3>
                                        <button onClick={() => setShowHistoryModal(false)} className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors"><i className="fas fa-times text-xl"></i></button>
                                    </div>
                                    <div className="p-6 overflow-y-auto flex-1 space-y-3 no-scrollbar">
                                        {logs.map((l, idx) => (
                                            <div key={idx} className="p-4 bg-slate-50 dark:bg-slate-800/50 rounded-xl border border-slate-100 dark:border-slate-700 flex justify-between items-center hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                                                <div className="flex items-center gap-3">
                                                    <div className={`w-8 h-8 rounded-full flex items-center justify-center text-sm shadow-inner shrink-0 ${l.mob === '보스' ? 'bg-red-100 text-red-600 dark:bg-red-900/30' : 'bg-blue-100 text-blue-600 dark:bg-blue-900/30'}`}>
                                                        <i className={`fas ${l.mob === '보스' ? 'fa-skull' : 'fa-check'}`}></i>
                                                    </div>
                                                    <div>
                                                        <div className="text-sm font-black text-slate-900 dark:text-white">{l.nickname}</div>
                                                        <div className="text-[10px] text-slate-500 dark:text-slate-400 font-bold">{l.mob} 처치</div>
                                                    </div>
                                                </div>
                                                <div className="text-right">
                                                    <div className="text-[10px] text-slate-400 dark:text-slate-500 font-mono mb-0.5">{l.timestamp?.seconds ? new Date(l.timestamp.seconds * 1000).toLocaleString() : '방금 전'}</div>
                                                    <div className="text-[11px] font-black text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/20 px-2 py-0.5 rounded-md inline-block">{l.playMin}분 {l.playSec}초 소요</div>
                                                </div>
                                            </div>
                                        ))}
                                        {logs.length === 0 && <div className="text-center text-slate-400 dark:text-slate-500 py-10 font-bold">기록이 없습니다.</div>}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            return (
                <React.Fragment>
                    {pageContent}

                    {/* 길드원 스탯 세팅 팝업 모달 */}
                    {statModalMember && (
                        <div className="fixed inset-0 z-[1100] flex items-center justify-center p-4 custom-modal-overlay animate-fadeIn font-bold text-slate-900 dark:text-white">
                            <div className="bg-white dark:bg-slate-900 rounded-[2.5rem] shadow-2xl p-8 max-w-sm w-full border-t-[8px] border-blue-500 space-y-6">
                                <div className="text-center">
                                    <span className="text-[10px] text-blue-500 dark:text-blue-400 uppercase tracking-widest font-black block mb-1">격추 제원 설정</span>
                                    <h3 className="text-xl font-black italic break-words">[{statModalMember.name}] 대원 스탯</h3>
                                </div>

                                <div className="space-y-4">
                                    <div className="p-5 rounded-2xl bg-slate-50 dark:bg-slate-800/50 border border-slate-100 dark:border-slate-700 space-y-4">
                                        <span className="text-[11px] text-slate-500 dark:text-slate-400 block font-black border-b border-slate-200 dark:border-slate-700 pb-2">A. 스탯공식 자동 계산</span>
                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="text-[10px] text-slate-500 dark:text-slate-400 block mb-1.5 font-bold">스탯 수치</label>
                                                <input type="number" placeholder="입력" className="w-full p-2.5 border border-slate-200 dark:border-slate-700 rounded-xl dark:bg-slate-900 text-sm outline-none focus:border-blue-500 text-center font-mono font-bold text-slate-900 dark:text-white" value={inputStat} onChange={e => setInputStat(e.target.value)} onFocus={e=>e.target.select()} />
                                            </div>
                                            <div>
                                                <label className="text-[10px] text-slate-500 dark:text-slate-400 block mb-1.5 font-bold">탈것 수치</label>
                                                <input type="number" placeholder="입력" className="w-full p-2.5 border border-slate-200 dark:border-slate-700 rounded-xl dark:bg-slate-900 text-sm outline-none focus:border-blue-500 text-center font-mono font-bold text-slate-900 dark:text-white" value={inputMount} onChange={e => setInputMount(e.target.value)} onFocus={e=>e.target.select()} />
                                            </div>
                                        </div>
                                    </div>

                                    <div className="text-center text-[10px] text-slate-400 dark:text-slate-500 font-bold bg-slate-100 dark:bg-slate-800 py-1 rounded-full mx-10">OR</div>

                                    <div className="p-5 rounded-2xl bg-slate-50 dark:bg-slate-800/50 border border-slate-100 dark:border-slate-700 space-y-4">
                                        <span className="text-[11px] text-amber-500 dark:text-amber-400 block font-black border-b border-slate-200 dark:border-slate-700 pb-2">B. 최종 격추 직접 입력</span>
                                        <div>
                                            <input type="number" placeholder="예: 2556" className="w-full p-3 border-2 border-amber-200 dark:border-amber-900/50 rounded-xl dark:bg-slate-900 text-base outline-none focus:border-amber-500 text-center font-mono font-black text-slate-900 dark:text-white" value={inputDirectGyeokchu} onChange={e => setInputDirectGyeokchu(e.target.value)} onFocus={e=>e.target.select()} />
                                            <p className="text-[9px] text-slate-400 dark:text-slate-500 mt-2 font-bold leading-tight">* 직접 입력 시 자동 계산된 값을 무시하고 이 수치로 강제 고정됩니다.</p>
                                        </div>
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 gap-3 pt-2">
                                    <button onClick={() => setStatModalMember(null)} className="py-3.5 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-2xl text-xs font-black transition-colors">취소</button>
                                    <button onClick={handleSaveMemberStats} className="py-3.5 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl text-xs font-black shadow-lg transition-colors">저장 및 반영</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 공통 컴포넌트: 관리자 로그인 */}
                    {showAdminEntry && (
                        <div className="fixed inset-0 z-[1200] flex items-center justify-center p-4 custom-modal-overlay animate-fadeIn font-bold">
                            <div className="bg-white dark:bg-slate-900 rounded-[2.5rem] shadow-2xl p-8 md:p-10 max-w-sm w-full border-t-[8px] border-slate-800 text-center">
                                <div className="mb-8">
                                    <div className="w-12 h-12 bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center mx-auto mb-4 text-slate-800 dark:text-slate-300 text-xl"><i className="fas fa-lock"></i></div>
                                    <p className="text-[10px] text-slate-500 dark:text-slate-400 uppercase tracking-widest mb-1">보안 인증</p>
                                    <h3 className="text-xl font-black text-slate-900 dark:text-white">관리자 코드 입력</h3>
                                </div>
                                <div className="flex flex-col gap-4">
                                    <input type="password" autoFocus placeholder="Passkey" className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl px-4 py-4 text-center text-xl outline-none focus:border-slate-500 text-slate-900 dark:text-white font-black tracking-widest" value={adminPass} onChange={e => setAdminPass(e.target.value)} onKeyDown={e => { if(e.key === 'Enter' && adminPass === "123456") { setIsAdminMode(true); setShowAdminEntry(false); setAdminPass(""); } }} />
                                    <div className="grid grid-cols-2 gap-3 mt-2">
                                        <button onClick={() => { setShowAdminEntry(false); setAdminPass(""); }} className="py-4 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-2xl font-bold transition-colors">취소</button>
                                        <button onClick={() => { if(adminPass === "123456") { setIsAdminMode(true); setShowAdminEntry(false); setAdminPass(""); } else { showAlert("비밀번호 오류", "error"); } }} className="py-4 bg-slate-800 hover:bg-slate-900 dark:bg-slate-700 dark:hover:bg-slate-600 text-white rounded-2xl font-bold shadow-lg transition-colors">인증</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 공통 컴포넌트: 알럿 */}
                    {uiAlert && (
                        <div className="fixed inset-0 z-[1300] flex items-center justify-center p-4 custom-modal-overlay animate-fadeIn text-slate-900 font-bold">
                            <div className={`bg-white dark:bg-slate-900 rounded-[2.5rem] shadow-2xl p-8 md:p-10 max-w-sm w-full text-center border-t-[8px] ${uiAlert.type === 'error' ? 'border-red-500' : 'border-blue-500'}`}>
                                <div className={`w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-6 text-2xl ${uiAlert.type === 'error' ? 'bg-red-100 text-red-500 dark:bg-red-900/30' : 'bg-blue-100 text-blue-500 dark:bg-blue-900/30'}`}>
                                    <i className={`fas ${uiAlert.type === 'error' ? 'fa-exclamation-triangle' : 'fa-check'}`}></i>
                                </div>
                                <p className="text-base md:text-lg mb-8 text-slate-900 dark:text-white font-bold leading-relaxed">{uiAlert.message}</p>
                                <button onClick={closeAlert} className={`w-full text-white py-4 rounded-2xl font-black shadow-lg transition-colors ${uiAlert.type === 'error' ? 'bg-red-500 hover:bg-red-600' : 'bg-blue-600 hover:bg-blue-700'}`}>확인</button>
                            </div>
                        </div>
                    )}

                    {/* 공통 컴포넌트: 컨펌 (체크박스 지원) */}
                    {uiConfirm && (
                        <div className="fixed inset-0 z-[1300] flex items-center justify-center p-4 custom-modal-overlay animate-fadeIn text-slate-900 font-bold">
                            <div className="bg-white dark:bg-slate-900 rounded-[2.5rem] shadow-2xl p-8 md:p-10 max-w-sm w-full text-center border-t-[8px] border-orange-500 flex flex-col">
                                <div className="w-12 h-12 bg-orange-100 dark:bg-orange-900/30 text-orange-500 rounded-full flex items-center justify-center mx-auto mb-6 text-2xl"><i className="fas fa-question"></i></div>
                                <p className="text-base md:text-lg mb-6 text-slate-900 dark:text-white font-bold whitespace-pre-wrap leading-relaxed">{uiConfirm.message}</p>
                                
                                {uiConfirm.checkboxLabel && (
                                    <label className="flex items-center justify-center gap-2 mb-8 cursor-pointer text-sm text-slate-700 dark:text-slate-300 p-3 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700">
                                        <input type="checkbox" id="confirm-checkbox" className="w-5 h-5 accent-orange-500 rounded" />
                                        <span className="font-bold">{uiConfirm.checkboxLabel}</span>
                                    </label>
                                )}

                                <div className={`grid grid-cols-2 gap-3 mt-auto ${!uiConfirm.checkboxLabel ? 'pt-2' : ''}`}>
                                    <button onClick={() => setUiConfirm(null)} className="py-4 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-2xl font-bold transition-colors">취소</button>
                                    <button onClick={() => { 
                                        let isChecked = false;
                                        if (uiConfirm.checkboxLabel) {
                                            const cb = document.getElementById('confirm-checkbox');
                                            if (cb) isChecked = cb.checked;
                                        }
                                        uiConfirm.onConfirm(isChecked); 
                                        setUiConfirm(null); 
                                    }} className="py-4 bg-orange-500 hover:bg-orange-600 text-white rounded-2xl font-bold shadow-lg transition-colors">확인</button>
                                </div>
                            </div>
                        </div>
                    )}
                </React.Fragment>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
