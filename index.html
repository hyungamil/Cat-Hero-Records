            try {

        };

            const [basketItems, setBasketItems] = useState([]);

            const [equipGrade, setEquipGrade] = useState('일반'); 
            const [equipQty, setEquipQty] = useState('');
            const [recipeGrade, setRecipeGrade] = useState('일반');
            const [recipeQty, setRecipeQty] = useState('');
            
            const [distMonster, setDistMonster] = useState('');

            const [isDistSaved, setIsDistSaved] = useState(false);
            const captureRef = useRef(null);
            const ratioCaptureRef = useRef(null); 

            const [preventDupLoot, setPreventDupLoot] = useState(false);

            const [manualStagingList, setManualStagingList] = useState([]);
            const [manualLootMonster, setManualLootMonster] = useState('');

            const showAlert = (msg, type = 'success') => setUiAlert({ message: msg, type });

            const isManager = currentUserMember?.isManager === true;

            const renderBadges = (m) => {
                if (!m) return null;

                    <span className="inline-flex gap-1 items-center align-middle">
                        {m.isAdmin && <span className="px-1.5 py-0.5 rounded text-[8px] font-black bg-red-100 text-red-600 dark:bg-red-900/30 dark:text-red-400 border border-red-200 dark:border-red-800/50 shadow-sm leading-none whitespace-nowrap">👑 관리자</span>}
                        {m.isManager && !m.isAdmin && <span className="px-1.5 py-0.5 rounded text-[8px] font-black bg-yellow-100 text-yellow-600 dark:bg-yellow-900/30 dark:text-yellow-400 border border-yellow-200 dark:border-yellow-800/50 shadow-sm leading-none whitespace-nowrap">⭐ 총무</span>}
                    </span>
                );
            };

            const getCalendarDotClass = (evt) => {
                if(!evt) return null;
                const { hasLoot, hasMemo, hasUnallocated } = evt;
                if(hasLoot && hasMemo && hasUnallocated) return 'bg-slate-700 dark:bg-slate-300';
                if(hasLoot && hasUnallocated) return 'bg-purple-500';
                if(hasMemo && hasUnallocated) return 'bg-orange-500';
                if(hasLoot && hasMemo) return 'bg-green-500';
                if(hasUnallocated) return 'bg-red-500';
                if(hasLoot) return 'bg-blue-500';
                if(hasMemo) return 'bg-yellow-400';
                return null;
            };

            const handleTimeChange = (type, val) => {
                const strVal = val.replace(/[^0-9]/g, '');
                if (strVal === '') {
                    if (type === 'min') setPlayMin('');
                    else setPlaySec('');
                    return;
                }
                const num = parseInt(strVal, 10);
                if (type === 'min') setPlayMin(num);
                else setPlaySec(num);
            };

            const handleTimeBlur = () => {
                let currentMin = playMin === '' ? 0 : parseInt(playMin, 10);
                let currentSec = playSec === '' ? 0 : parseInt(playSec, 10);

                if (currentSec >= 60) {
                    currentMin += Math.floor(currentSec / 60);
                    currentSec = currentSec % 60;
                }
                setPlayMin(currentMin);
                setPlaySec(currentSec);
            };

            const handleAddTime = (type, val) => {
                let currentMin = playMin === '' ? 0 : parseInt(playMin, 10);
                let currentSec = playSec === '' ? 0 : parseInt(playSec, 10);

                if (type === 'min') {
                    setPlayMin(Math.max(0, currentMin + val));
                    setPlaySec(currentSec);
                } else {
                    let newSec = currentSec + val;
                    let newMin = currentMin;
                    
                    if (newSec >= 60) {
                        newMin += Math.floor(newSec / 60);
                        newSec = newSec % 60;
                    } else if (newSec < 0) {
                        if (newMin > 0) {
                            const borrow = Math.ceil(Math.abs(newSec) / 60);
                            if (newMin >= borrow) {
                                newMin -= borrow;
                                newSec = 60 * borrow + newSec;
                            } else {
                                newMin = 0;
                                newSec = 0;
                            }
                        } else {
                            newSec = 0;
                        }
                    }
                    setPlayMin(newMin);
                    setPlaySec(newSec);
                }
            };

                        safeRemoveItem('cat_hero_nickname'); 
                        setNickname(''); 
                        setIsNameSet(false); 
                    } 
                });
            };

                    newFavs.push(targetName);
                }
                setFavorites(newFavs);
                safeSetItem('cat_hero_favorites', JSON.stringify(newFavs));
            };

            const getMemberGyeokchu = (m) => {
                if (m.directGyeokchu && Number(m.directGyeokchu) > 0) return Number(m.directGyeokchu);
                const statVal = Math.floor(Number(m.stat) || 0);
                const mountVal = Math.floor(Number(m.mount) || 0);
                if (statVal > 0 || mountVal > 0) return (statVal + 6 + mountVal) * 10 + 1000;
                return 0; 
            };

            const copyToClipboard = (text) => {
                const ta = document.createElement("textarea");
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                try {
                    document.execCommand('copy');
                    showAlert("텍스트가 복사되었습니다.");
                } catch(e) {
                    showAlert("복사 실패", "error");
                }
                document.body.removeChild(ta);
            };

            const handleAdminUpdateField = async (id, field, value) => {
                try {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members_v24', id), { [field]: value });
                    showAlert("권한/정보가 안전하게 저장되었습니다.");
                } catch (e) {
                    showAlert("저장에 실패했습니다.", "error");
                }
            };

                if (!statModalMember) return;
                try {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members_v24', statModalMember.id), {
                        stat: inputStat === '' ? null : Number(inputStat),
                        mount: inputMount === '' ? null : Number(inputMount),

                    showAlert("저장에 실패했습니다.", "error");

            };

            const handleSaveMyStat = async () => {
                const member = members.find(m => m.name === nickname);
                if (!member) return;
                try {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members_v24', member.id), {
                        stat: myStat === '' ? null : Math.floor(Number(myStat)),
                        mount: myMount === '' ? null : Math.floor(Number(myMount))
                    });
                    showAlert("저장되었습니다.");
                } catch(e) { showAlert("저장에 실패했습니다.", "error"); }
            };

            const handleChangeNickname = async () => {
                if (!newNicknameInput || newNicknameInput.trim() === '') return showAlert('새 닉네임을 입력해주세요.', 'error');
                const targetName = newNicknameInput.trim();
                if (targetName === nickname) return showAlert('현재 닉네임과 동일합니다.', 'error');
                
                if (members.find(m => m.name === targetName)) return showAlert('이미 존재하는 닉네임입니다. 다른 닉네임을 사용해주세요.', 'error');
                
                setUiConfirm({
                    message: `[${nickname}] 에서 [${targetName}](으)로 닉네임을 변경하시겠습니까?\n변경 시 랭킹, 통계, 분배 이력 등 모든 데이터가 즉시 업데이트됩니다.`,
                    onConfirm: async () => {
                        try {
                            const myMem = members.find(m => m.name === nickname);

                    const pointsA = a.rankingPoints !== undefined ? a.rankingPoints : statA.points;
                    const pointsB = b.rankingPoints !== undefined ? b.rankingPoints : statB.points;

                    if (pointsB !== pointsA) return pointsB - pointsA;
                    
                    const bossA = a.rankingBoss !== undefined ? a.rankingBoss : statA.bossCount;

                    const timeA = a.latestTime?.seconds ? a.latestTime.seconds : statA.latestTime;
                    const timeB = b.latestTime?.seconds ? b.latestTime.seconds : statB.latestTime;

                    const nextTitle = TITLES_LIST.find(t => t.score > currentPoints);
                    const rankIdx = sortedByPoints.findIndex(mem => mem.name === name);
                    
                    return { currentTitle, nextTitle, score: currentPoints, rank: rankIdx + 1, rankObj: m };

                    if (parentDoc) {
                        const newList = [...parentDoc.list];
                        newList[editLootItem.idx] = { 
                            ...newList[editLootItem.idx], 
                            winner: editLootItem.winner, 
                            itemStr: editLootItem.itemStr,
                            qty: editLootItem.qty
                        };
                        await updateDoc(docRef, { list: newList });
                        showAlert("수정되었습니다.");
                        setEditLootItem(null);
                    }
                } catch (e) {
                    showAlert("수정 실패", "error");
                }
            };

            const calcStrikeReport = useMemo(() => {
                let totalGyeokchu = 0;
                const activeMembers = [];
                const bScore = Number(bossScoreStr) || 0;

                selectedCalcMembers.forEach(id => {
                    const m = members.find(mem => mem.id === id);
                    if (m) {
                        const gk = getMemberGyeokchu(m);
                        totalGyeokchu += gk;
                        activeMembers.push({ id: m.id, name: m.name, gyeokchu: gk });
                    }
                });

                const expectedSeconds = totalGyeokchu > 0 ? Math.ceil(bScore / totalGyeokchu) : 0;
                
                const individualReports = activeMembers.map(m => {
                    const rate = totalGyeokchu > 0 ? (m.gyeokchu / totalGyeokchu) * 100 : 0;
                    const score = totalGyeokchu > 0 ? Math.round(bScore * (m.gyeokchu / totalGyeokchu)) : 0;
                    
                    const indExpectedSec1x = (bScore > 0 && m.gyeokchu > 0) ? Math.ceil(bScore / m.gyeokchu) : 0;
                    const indExpectedSec2x = (bScore > 0 && m.gyeokchu > 0) ? Math.ceil(bScore / (m.gyeokchu * 2)) : 0;

                    return { ...m, rate: Number(rate.toFixed(2)), expectedScore: score, indExpectedSec1x, indExpectedSec2x };
                }).sort((a, b) => b.gyeokchu - a.gyeokchu);

                return { totalGyeokchu, expectedSeconds, individualReports };
            }, [selectedCalcMembers, members, bossScoreStr]);

            const saveDistributionHistory = async (result) => {
                if(!distMonster) return showAlert("먼저 몬스터를 선택해 주세요.", "error");
                try {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'loot_history_v24'), {
                        distType: result.type,
                        monster: distMonster,
                        list: result.list,
                        timestamp: serverTimestamp()
                    });
                    setIsDistSaved(true);
                    showAlert("분배 결과가 기록에 안전하게 저장되었습니다.");
                } catch (err) { console.error("Failed to save history", err); }
            };

            const getAlreadyWonPlayers = (itemStr) => {
                const wonPlayers = new Set();
                lootLogs.forEach(log => {
                    log.list?.forEach(l => {
                        if (l.itemStr === itemStr && l.winner) {
                            wonPlayers.add(l.winner);
                        }
                    });
                });
                return wonPlayers;
            };

            const executeDistribution = (type) => {
                if(selectedCalcMembers.length === 0) return showAlert("참여 길드원이 없습니다.", "error");
                if(basketItems.length === 0 && customEquipments.length === 0 && customRecipes.length === 0) return showAlert("등록된 보상이 없습니다.", "error");

                let resultArr = [];
                const pNames = selectedCalcMembers.map(id => members.find(m => m.id === id)?.name).filter(Boolean);

                if (type === 'random') {
                    let allItemsToDistribute = [];
                    customEquipments.forEach(eq => {
                        for(let i=0; i<eq.qty; i++){
                            allItemsToDistribute.push({ name: `${eq.grade} ${eq.type}`, isEquip: true });
                        }
                    });
                    customRecipes.forEach(rcp => {
                        for(let i=0; i<rcp.qty; i++){
                            allItemsToDistribute.push({ name: `${rcp.grade} 레시피`, isEquip: false });
                        }
                    });
                    basketItems.forEach(item => {
                        for(let i=0; i<item.qty; i++){
                            allItemsToDistribute.push({ name: item.name, isEquip: false });
                        }
                    });

                    allItemsToDistribute.forEach(item => {
                        let candidates = [...pNames];
                        
                        if (preventDupLoot && item.isEquip) {
                            const wonHistory = getAlreadyWonPlayers(item.name);
                            const wonCurrentSession = new Set(resultArr.filter(r => r.itemStr === item.name).map(r => r.winner));
                            candidates = pNames.filter(name => !wonHistory.has(name) && !wonCurrentSession.has(name));
                            if (candidates.length === 0) candidates = [...pNames];
                        }

                        const winner = candidates[Math.floor(Math.random() * candidates.length)];
                        resultArr.push({ itemStr: item.name, winner, isEquip: item.isEquip, isRandom: true });
                    });

                } else if (type === 'contrib') {
                    if(calcStrikeReport.individualReports.length === 0) return showAlert("격추 데이터가 없습니다.", "error");
                    
                    let allItemTypes = [];
                    basketItems.forEach(b => { allItemTypes.push({ name: b.name, qty: b.qty, isEquip: false }); });
                    customRecipes.forEach(rcp => { allItemTypes.push({ name: `${rcp.grade} 레시피`, qty: rcp.qty, isEquip: false }); });
                    customEquipments.forEach(eq => { allItemTypes.push({ name: `${eq.grade} ${eq.type}`, qty: eq.qty, isEquip: true }); });

                    allItemTypes.forEach(item => {
                        let totalQty = item.qty;
                        let validReports = calcStrikeReport.individualReports;

                        if (preventDupLoot && item.isEquip) {
                            const wonHistory = getAlreadyWonPlayers(item.name);
                            validReports = validReports.filter(r => !wonHistory.has(r.name));
                            if (validReports.length === 0) {
                                validReports = calcStrikeReport.individualReports;
                            } else {
                                const subTotalGk = validReports.reduce((sum, r) => sum + r.gyeokchu, 0);
                                validReports = validReports.map(r => ({
                                    ...r,
                                    rate: subTotalGk > 0 ? (r.gyeokchu / subTotalGk) * 100 : 0
                                }));
                            }
                        }

                        let remain = totalQty;
                        let fractions = [];
                        
                        validReports.forEach(r => {
                            const alloc = totalQty * (r.rate / 100);
                            const base = Math.floor(alloc);
                            remain -= base;
                            fractions.push({ name: r.name, frac: alloc - base, base });
                        });
                        
                        fractions.sort((a,b) => b.frac - a.frac);
                        for(let i=0; i<remain; i++){ fractions[i].base += 1; }
                        
                        fractions.forEach(f => {
                            if(f.base > 0) resultArr.push({ itemStr: `${item.name}`, winner: f.name, qty: f.base, isEquip: item.isEquip, isRandom: false });
                        });
                    });
                }

                const finalResult = { type: type === 'random' ? '무작위 랜덤 분배' : '기여도 기반 분배', list: resultArr };

                setIsDistSaved(false);
                if (enableAnimation) {
                    setDistResult(null);
                    setTempDistList(resultArr);
                    setIsDistAnimating(true);
                    setSlotDisplayNames(resultArr.map(() => pNames[Math.floor(Math.random() * pNames.length)]));
                } else {
                    setDistResult(finalResult);
                }
            };

            useEffect(() => {
                let interval;
                let timeout;
                if (isDistAnimating) {
                    const pNames = selectedCalcMembers.map(id => members.find(m => m.id === id)?.name).filter(Boolean);
                    if (pNames.length > 0) {
                        interval = setInterval(() => {
                            setSlotDisplayNames(tempDistList.map(() => pNames[Math.floor(Math.random() * pNames.length)]));
                        }, 80);
                    }
                    timeout = setTimeout(() => {
                        setIsDistAnimating(false);
                        const finalResult = { type: tempDistList[0]?.isRandom ? '무작위 랜덤 분배' : '기여도 기반 분배', list: tempDistList };
                        setDistResult(finalResult);
                    }, 2500); 
                }
                return () => { clearInterval(interval); clearTimeout(timeout); };
            }, [isDistAnimating, tempDistList, selectedCalcMembers, members]);

            const handleSkipAnimation = () => {
                setIsDistAnimating(false);
                const finalResult = { type: tempDistList[0]?.isRandom ? '무작위 랜덤 분배' : '기여도 기반 분배', list: tempDistList };

            const groupedDistResult = useMemo(() => {
                if (!distResult || !distResult.list) return {};
                return distResult.list.reduce((acc, curr) => {

                    if (!acc[curr.winner][curr.itemStr]) {
                        acc[curr.winner][curr.itemStr] = { ...curr, count: 0 };
                    }
                    acc[curr.winner][curr.itemStr].count += curr.qty || 1;
                    return acc;
                }, {});

                const month = currentMonth.getMonth();
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                
                const today = new Date();

                const days = [];
                for(let i = 0; i < firstDay; i++) {
                    days.push(<div key={`empty-${i}`} className="p-2 opacity-0"></div>);
                }
                
                for(let i = 1; i <= daysInMonth; i++) {
                    const dateStr = `${year}-${String(month+1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                    const isSelected = selectedDateStr === dateStr;
                    const isToday = todayStr === dateStr;

                        >
                            <span className={`text-[11px] md:text-sm ${isToday && !isSelected ? 'text-blue-500 font-black' : ''}`}>{i}</span>
                            {dotClass && (
                                <span className={`absolute bottom-1.5 w-1.5 h-1.5 rounded-full ${dotClass}`}></span>
                            )}
                        </button>
                    );
                }
                return days;
            };

            let pageContent;

            if (!isNameSet) {
                pageContent = (
                    <div className="min-h-screen flex flex-col p-4 bg-slate-200 dark:bg-slate-950 transition-colors pb-40">
                        {notice && (

                                <div className="flex items-center gap-3 truncate">
                                    <i className="fas fa-bullhorn animate-pulse"></i>
                                    <span className="text-xs font-black truncate">{notice}</span>

                                <p className="text-[10px] text-slate-400 mb-10 tracking-[0.2em]">Personnel Verification</p>
                                <div className="space-y-6 text-left">
                                    <label className="text-[11px] font-black text-slate-500 dark:text-slate-400 uppercase ml-1 mb-2 block">길드원 인증</label>
                                    <select className="w-full p-4 bg-white dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 focus:border-blue-500 outline-none rounded-xl font-black text-slate-900 dark:text-white" value={nickname} onChange={e => setNickname(e.target.value)}>
                                        <option value="" className="text-slate-400">본인 성명을 선택하십시오</option>
                                        {members.map(m => (
                                            <option key={m.id} value={m.name} className="text-slate-900 dark:text-white">{m.name}</option>
                                        ))}
                                    </select>
                                    <button onClick={() => { if(nickname) { safeSetItem('cat_hero_nickname', nickname); setIsNameSet(true); } }} className="w-full bg-blue-600 text-white font-black py-4 rounded-xl shadow-lg hover:bg-blue-700 active:scale-95 transition-all text-lg">대시보드 접속</button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            } else {
                const myStatusObj = rankingData.getPersonalStatus(nickname);
                const latestLog = logs[0] || null;
                
                const filteredCalcMembers = [...members]
                    .filter(m => !calcMemberSearch || m.name.toLowerCase().includes(calcMemberSearch.toLowerCase()))
                    .sort((a,b) => {
                        const aFav = favorites.includes(a.name);
                        const bFav = favorites.includes(b.name);
                        if(aFav && !bFav) return -1;
                        if(!aFav && bFav) return 1;
                        return a.name.localeCompare(b.name);
                    });

                pageContent = (
                    <div className="app-container pb-40">
                        <header className="bg-white dark:bg-slate-900 p-3 sm:p-4 border-b-2 border-slate-100 dark:border-slate-800 sticky top-0 z-30 shadow-sm">
                            <div className="flex justify-between items-center gap-2 sm:gap-4">
                                <div className="flex items-center gap-1 sm:gap-3 min-w-0">
                                    <button onClick={handleResetSession} className="shrink-0 w-8 h-8 sm:w-10 sm:h-10 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-500 hover:text-red-500 transition-all shadow-sm flex items-center justify-center font-bold">
                                        <i className="fas fa-power-off"></i>
                                    </button>
                                    <div className="space-y-1 min-w-0">
                                        <div className="flex gap-1 md:gap-2 overflow-x-auto no-scrollbar pb-1">
                                            <button onClick={() => setMainCategory('conquest')} className={`shrink-0 px-2 sm:px-3 py-1.5 rounded-lg text-[9px] sm:text-[10px] md:text-xs font-black transition-all ${mainCategory === 'conquest' ? 'main-tab-active' : 'bg-slate-50 dark:bg-slate-800 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700'}`}>01. 균격</button>
                                            <button onClick={() => setMainCategory('strike')} className={`shrink-0 px-2 sm:px-3 py-1.5 rounded-lg text-[9px] sm:text-[10px] md:text-xs font-black transition-all ${mainCategory === 'strike' ? 'main-tab-active' : 'bg-slate-50 dark:bg-slate-800 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700'}`}>02. 일격</button>
                                            <button onClick={() => setMainCategory('ranking')} className={`shrink-0 px-2 sm:px-3 py-1.5 rounded-lg text-[9px] sm:text-[10px] md:text-xs font-black transition-all ${mainCategory === 'ranking' ? 'main-tab-active bg-yellow-500 border-yellow-600 text-white shadow-yellow-500/30' : 'bg-slate-50 dark:bg-slate-800 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700'}`}>03. 랭킹</button>
                                            <button onClick={() => setMainCategory('history')} className={`shrink-0 px-2 sm:px-3 py-1.5 rounded-lg text-[9px] sm:text-[10px] md:text-xs font-black transition-all ${mainCategory === 'history' ? 'main-tab-active bg-pink-500 border-pink-600 text-white shadow-pink-500/30' : 'bg-slate-50 dark:bg-slate-800 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700'}`}>04. 기록</button>
                                        </div>
                                    </div>
                                </div>
                                
                                <div className="flex items-center gap-1 md:gap-2 shrink-0">
                                    <div className="flex items-center bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg p-0.5 sm:p-1">
                                        <button onClick={() => setZoomIndex(p => Math.max(0, p-1))} className="px-1.5 sm:px-2 text-slate-500 hover:text-blue-500 font-black">-</button>
                                        <button onClick={() => setZoomIndex(3)} className="px-1 text-[8px] sm:text-[9px] text-slate-500 font-bold w-8 sm:w-10 text-center hover:text-blue-500 transition-colors">{ZOOM_LEVELS[zoomIndex]}%</button>
                                        <button onClick={() => setZoomIndex(p => Math.min(ZOOM_LEVELS.length-1, p+1))} className="px-1.5 sm:px-2 text-slate-500 hover:text-blue-500 font-black">+</button>
                                    </div>

                                    <select className="text-[9px] sm:text-[10px] p-1 sm:p-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg outline-none font-bold text-slate-500 dark:text-slate-400" value={themeMode} onChange={e => setThemeMode(e.target.value)}>
                                        <option value="light">☀️</option>
                                        <option value="dark">🌙</option>
                                        <option value="system">⚙️</option>

                                    <button onClick={() => setShowAdminEntry(true)} className="w-7 h-7 sm:w-9 sm:h-9 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl flex items-center justify-center text-slate-400 hover:text-blue-500 transition-colors shadow-sm"><i className="fas fa-cog"></i></button>

                        {notice && (

                                <div className="flex items-center gap-3 truncate min-w-0">

                            </div>
                        )}

                        <main className="p-4 md:p-8">
                            {mainCategory === 'settings' && (
                                <div className="animate-fadeIn">
                                    <div className="max-w-4xl mx-auto dashboard-card p-6 md:p-8 border-t-8 border-slate-800 shadow-2xl">
                                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 gap-4 border-b pb-6 dark:border-slate-700">
                                            <div className="flex items-center gap-3">
                                                <div className="w-10 h-10 bg-slate-100 dark:bg-slate-800 rounded-xl flex items-center justify-center text-slate-800 dark:text-slate-200 font-bold"><i className="fas fa-cog"></i></div>
                                                <h2 className="text-xl md:text-2xl font-black italic">설정 {isAdminMode ? '& 관리 센터' : ''}</h2>
                                            </div>
                                        </div>

                                        <section className="dashboard-card p-5 border-l-[4px] border-blue-500 bg-blue-50/20 dark:bg-blue-900/10 mb-8">
                                            <h3 className="text-sm font-black mb-4 text-blue-600 dark:text-blue-400 flex items-center gap-2">
                                                <i className="fas fa-id-badge"></i> 내 정보 (닉네임 변경)
                                            </h3>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 items-end">

                                                    <p className="text-[10px] text-red-500 dark:text-red-400 font-bold">* 변경 시 랭킹, 분배 이력 등 길드 내 모든 기록이 새 닉네임으로 일괄 교체됩니다.</p>

                                        {isAdminMode && (

                                                    <h3 className="text-sm font-black mb-4 text-purple-600 dark:text-purple-400 flex items-center gap-2">

                                                            </div>
                                                        </section>
                                                        
                                                        <section>
                                                            <label className="text-[10px] text-slate-400 uppercase tracking-widest mb-3 block font-bold">데이터 관리 도구</label>

                                                                <button onClick={() => setUiConfirm({ message: "균격 기록을 삭제합니까?\n(랭킹 누적 포인트 및 시즌 통계는 안전하게 보존됩니다)", onConfirm: async () => { const snap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'conquest_logs_v24')); for (const d of snap.docs) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'conquest_logs_v24', d.id)); showAlert("기록이 초기화되었습니다."); } })} className="p-4 bg-blue-50 dark:bg-blue-900/20 border border-blue-100 dark:border-blue-900 rounded-xl text-blue-600 dark:text-blue-400 text-xs font-black uppercase hover:bg-blue-100 transition-colors">기록(균격) 초기화</button>
                                                                <button onClick={() => setUiConfirm({ message: "랭킹 점수를 완전 초기화합니까?", onConfirm: async () => { for (const m of members) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members_v24', m.id), { rankingPoints: 0, rankingNormal: 0, rankingBoss: 0, score: 0 }); showAlert("점수가 0으로 초기화되었습니다."); } })} className="p-4 bg-red-50 dark:bg-red-900/20 border border-red-100 dark:border-red-900 rounded-xl text-red-600 dark:text-red-400 text-xs font-black uppercase hover:bg-red-100 transition-colors">랭킹(점수) 초기화</button>
                                                                {/* 복구 기능 버튼이 여기에 구현되어 있습니다. */}
                                                                <button onClick={handleRestoreSampleData} className="p-4 bg-emerald-50 dark:bg-emerald-900/20 border border-emerald-100 dark:border-emerald-900 rounded-xl text-emerald-600 dark:text-emerald-400 text-xs font-black uppercase hover:bg-emerald-100 transition-colors">샘플 데이터 복구</button>
                                                            </div>
                                                        </section>
                                                        
                                                        <section className="dashboard-card p-5 border-l-[4px] border-amber-500 bg-amber-50/20 dark:bg-amber-900/10">

                                                            {adminSortedMembers.map(m => {
                                                                const mStat = stats.playerMap[m.name] || {};
                                                                const isFav = favorites.includes(m.name);
                                                                const gyeokchu = getMemberGyeokchu(m);
                                                                const pts = m.rankingPoints !== undefined ? m.rankingPoints : (mStat.points || 0);

                                                                return (
                                                                    <div key={m.id} className="p-4 md:p-5 hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors border-b dark:border-slate-800 last:border-b-0 flex flex-col gap-4">
                                                                        <div className="flex justify-between items-start">
                                                                            <div className="flex items-center gap-3">

                                                                                <div>
                                                                                    <div className="flex flex-wrap items-center gap-2 mb-1">

                                                                                        {renderBadges(m)}
                                                                                    </div>
                                                                                    <div className="text-[10px] text-slate-500 flex flex-wrap items-center gap-2 mt-1 font-mono">
                                                                                        <span>참여: {m.rankingNormal !== undefined ? (m.rankingNormal + (m.rankingBoss||0)) : (mStat.swords || 0)}회</span>
                                                                                        <span>최근: {m.latestTime?.seconds ? new Date(m.latestTime.seconds * 1000).toLocaleDateString() : (mStat.latestTime ? new Date(mStat.latestTime * 1000).toLocaleDateString() : '없음')}</span>
                                                                                        
                                                                                        <div className="flex gap-1 ml-1">
                                                                                            <button 
                                                                                                onClick={() => handleAdminUpdateField(m.id, 'isManager', !m.isManager)}
                                                                                                className={`px-2 py-0.5 rounded text-[9px] font-black transition-colors ${m.isManager ? 'bg-slate-200 dark:bg-slate-700 text-slate-500 dark:text-slate-400 hover:text-red-500' : 'bg-purple-50 text-purple-600 hover:bg-purple-100 dark:bg-purple-900/30 dark:text-purple-400'}`}>
                                                                                                {m.isManager ? '총무 해제' : '총무 지정'}
                                                                                            </button>
                                                                                            <button 
                                                                                                onClick={() => handleAdminUpdateField(m.id, 'isAdmin', !m.isAdmin)}
                                                                                                className={`px-2 py-0.5 rounded text-[9px] font-black transition-colors ${m.isAdmin ? 'bg-slate-200 dark:bg-slate-700 text-slate-500 dark:text-slate-400 hover:text-red-500' : 'bg-red-50 text-red-600 hover:bg-red-100 dark:bg-red-900/30 dark:text-red-400'}`}>
                                                                                                {m.isAdmin ? '관리자 해제' : '관리자 지정'}
                                                                                            </button>
                                                                                        </div>
                                                                                    </div>
                                                                                </div>
                                                                            </div>
                                                                            <button onClick={() => setUiConfirm({ message: `${m.name} 님을 길드에서 삭제합니까?`, onConfirm: async () => { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members_v24', m.id)); showAlert("삭제되었습니다."); } })} className="text-slate-400 hover:text-red-500 text-xs p-1 transition-colors shrink-0"><i className="fas fa-trash"></i></button>
                                                                        </div>
                                                                        
                                                                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 bg-slate-50 dark:bg-slate-950/50 p-3 rounded-xl border border-slate-100 dark:border-slate-800">
                                                                            <div className="flex flex-col gap-1">
                                                                                <span className="text-[10px] text-slate-400 uppercase font-bold tracking-wider">스탯 <span className="text-slate-300 font-normal">(수식용)</span></span>
                                                                                <input type="number" className="w-full p-2 border border-slate-200 dark:border-slate-700 rounded-lg text-center dark:bg-slate-800 outline-none focus:border-blue-500 text-xs font-mono" defaultValue={m.stat||''} onBlur={(e) => handleAdminUpdateField(m.id, 'stat', e.target.value ? Number(e.target.value) : null)} onFocus={e=>e.target.select()} placeholder="값 입력" />
                                                                            </div>
                                                                            <div className="flex flex-col gap-1">
                                                                                <span className="text-[10px] text-slate-400 uppercase font-bold tracking-wider">탈것 <span className="text-slate-300 font-normal">(수식용)</span></span>
                                                                                <input type="number" className="w-full p-2 border border-slate-200 dark:border-slate-700 rounded-lg text-center dark:bg-slate-800 outline-none focus:border-blue-500 text-xs font-mono" defaultValue={m.mount||''} onBlur={(e) => handleAdminUpdateField(m.id, 'mount', e.target.value ? Number(e.target.value) : null)} onFocus={e=>e.target.select()} placeholder="값 입력" />
                                                                            </div>
                                                                            <div className="flex flex-col gap-1">
                                                                                <span className="text-[10px] text-amber-500 uppercase font-bold tracking-wider">직접 격추 <span className="text-amber-300 font-normal">(최우선)</span></span>
                                                                                <input type="number" className="w-full p-2 border border-amber-200 dark:border-amber-900/50 bg-amber-50/30 rounded-lg text-center dark:bg-slate-800 text-amber-600 dark:text-amber-400 outline-none focus:border-amber-500 text-xs font-mono font-bold" defaultValue={m.directGyeokchu||''} onBlur={(e) => handleAdminUpdateField(m.id, 'directGyeokchu', e.target.value ? Number(e.target.value) : null)} onFocus={e=>e.target.select()} placeholder={gyeokchu > 0 ? `(${gyeokchu})` : '값 입력'} />
                                                                            </div>
                                                                            <div className="flex flex-col gap-1">
                                                                                <span className="text-[10px] text-blue-500 uppercase font-bold tracking-wider">누적 포인트 <span className="text-blue-300 font-normal">(조정 가능)</span></span>
                                                                                <input type="number" className="w-full p-2 border border-blue-200 dark:border-blue-900/50 bg-blue-50/30 rounded-lg text-center dark:bg-slate-800 text-blue-600 dark:text-blue-400 outline-none focus:border-blue-500 text-xs font-mono font-black" defaultValue={pts} onBlur={(e) => handleAdminUpdateField(m.id, 'rankingPoints', Number(e.target.value))} onFocus={e=>e.target.select()} placeholder="값 입력" />
                                                                            </div>
                                                                        </div>
                                                                    </div>
                                                                );
                                                            })}
                                                            {adminSortedMembers.length === 0 && <div className="text-center py-10 text-slate-400 text-sm">검색 결과가 없습니다.</div>}
                                                        </div>
                                                    </section>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}

                            {mainCategory === 'conquest' && (
                                <div className="flex flex-col gap-6">
                                    <div className="desktop-layout">
                                        <aside className="space-y-6">
                                            <div className="dashboard-card p-5 space-y-4">
                                                <div className="flex justify-between items-center border-b border-slate-100 dark:border-slate-800 pb-3">
                                                    <h3 className="text-xs font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest flex items-center gap-2"><i className="fas fa-broadcast-tower text-red-500 animate-pulse"></i> 실시간 처치 기록</h3>
                                                    <button onClick={() => {setMainCategory('history'); setHistoryTab('conquest');}} className="text-[10px] text-blue-500 dark:text-blue-400 font-bold hover:underline">전체 보기</button>
                                                </div>
                                                <div className="space-y-2.5 max-h-[150px] overflow-y-auto no-scrollbar">
                                                    {logs.slice(0, 5).map((l, idx) => {

                                                        return (
                                                        <div key={idx} className="text-[10px] leading-relaxed border-b border-slate-50 dark:border-slate-800/50 pb-1.5 animate-fadeIn">
                                                            <span className="text-blue-500 dark:text-blue-400 font-black">[{l.nickname}]</span>
                                                            {renderBadges(mObj)}
                                                            <span className="dark:text-slate-200 ml-1">{l.mob} 성공</span> 
                                                            <span className="text-slate-400 ml-1">
                                                                {l.isMulti ? "(다중 등록됨)" : `(${l.playMin}m ${l.playSec}s)`}
                                                            </span>
                                                        </div>

                                                    })}
                                                    {logs.length === 0 && <p className="text-[10px] text-slate-400 text-center py-4">활동 기록 대기 중...</p>}
                                                </div>
                                            </div>
                                            
                                            <form onSubmit={handleSubmitConquest} className="dashboard-card p-6 md:p-8 space-y-6 text-slate-900 dark:text-white border-l-[8px] border-blue-500">
                                                <h2 className="text-lg uppercase italic border-b border-slate-100 pb-4 dark:border-slate-700 font-bold">균격 기록 다중 등록</h2>
                                                
                                                <div className="grid grid-cols-2 gap-4">
                                                    <div className="bg-slate-50 dark:bg-slate-900/50 p-4 rounded-2xl border border-slate-100 dark:border-slate-800 flex flex-col items-center gap-3">
                                                        <span className="text-xs font-black text-slate-500 dark:text-slate-400">일반몹</span>
                                                        <div className="flex items-center gap-3 bg-white dark:bg-slate-800 rounded-xl p-1 shadow-sm border border-slate-100 dark:border-slate-700">
                                                            <button type="button" onClick={() => setConquestNormalCount(p => Math.max(0, p-1))} className="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-600 dark:text-slate-300 font-black transition-colors">-</button>
                                                            <span className="w-6 text-center font-mono font-black text-lg">{conquestNormalCount}</span>
                                                            <button type="button" onClick={() => setConquestNormalCount(p => p+1)} className="w-8 h-8 rounded-lg bg-blue-100 dark:bg-blue-900/30 hover:bg-blue-200 dark:hover:bg-blue-800/50 text-blue-600 dark:text-blue-400 font-black transition-colors">+</button>
                                                        </div>
                                                    </div>
                                                    <div className="bg-slate-50 dark:bg-slate-900/50 p-4 rounded-2xl border border-slate-100 dark:border-slate-800 flex flex-col items-center gap-3">
                                                        <span className="text-xs font-black text-red-500">보스</span>
                                                        <div className="flex items-center gap-3 bg-white dark:bg-slate-800 rounded-xl p-1 shadow-sm border border-slate-100 dark:border-slate-700">
                                                            <button type="button" onClick={() => setConquestBossCount(p => Math.max(0, p-1))} className="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-600 dark:text-slate-300 font-black transition-colors">-</button>
                                                            <span className="w-6 text-center font-mono font-black text-lg">{conquestBossCount}</span>
                                                            <button type="button" onClick={() => setConquestBossCount(p => p+1)} className="w-8 h-8 rounded-lg bg-red-100 dark:bg-red-900/30 hover:bg-red-200 dark:hover:bg-red-800/50 text-red-600 dark:text-red-400 font-black transition-colors">+</button>
                                                        </div>
                                                    </div>
                                                </div>

                                                <div className="bg-slate-900 dark:bg-[#0B1220] rounded-[2rem] p-6 text-center border border-slate-800">
                                                    <span className="text-[10px] text-slate-400 block mb-2 font-bold">1회당 시간 (공통 반영)</span>
                                                    <div className="flex justify-center items-center text-4xl md:text-5xl font-black text-white italic mb-6 font-mono">
                                                        <input 
                                                            type="number" 
                                                            min="0" 
                                                            className="w-20 md:w-24 bg-transparent border-b-2 border-white/20 text-center outline-none focus:border-blue-500 transition-colors placeholder:text-white/20" 
                                                            value={playMin === '' ? '' : String(playMin).padStart(2, '0')} 
                                                            onChange={e => handleTimeChange('min', e.target.value)} 
                                                            onBlur={handleTimeBlur}
                                                            onFocus={e => e.target.select()} 
                                                        />
                                                        <span className="text-blue-500 mx-1.5">:</span>
                                                        <input 
                                                            type="number" 
                                                            min="0" 
                                                            className="w-20 md:w-24 bg-transparent border-b-2 border-white/20 text-center outline-none focus:border-blue-500 transition-colors placeholder:text-white/20" 
                                                            value={playSec === '' ? '' : String(playSec).padStart(2, '0')} 
                                                            onChange={e => handleTimeChange('sec', e.target.value)} 
                                                            onBlur={handleTimeBlur}
                                                            onFocus={e => e.target.select()} 
                                                        />
                                                    </div>
                                                    <div className="grid grid-cols-3 gap-2">
                                                        {[{v: 1, t: 'min', label: '분'}, {v: 10, t: 'sec', label: '초'}, {v: 1, t: 'sec', label: '초'}].map((item, i) => (
                                                            <button key={`plus${i}`} type="button" onClick={() => handleAddTime(item.t, item.v)} className="bg-white/10 hover:bg-white/20 transition-colors p-2.5 rounded-lg text-[10px] font-black text-white">
                                                                +{item.v}{item.label}
                                                            </button>
                                                        ))}
                                                        {[{v: 1, t: 'min', label: '분'}, {v: 10, t: 'sec', label: '초'}, {v: 1, t: 'sec', label: '초'}].map((item, i) => (
                                                            <button key={`minus${i}`} type="button" onClick={() => handleAddTime(item.t, -item.v)} className="bg-red-500/10 hover:bg-red-500/20 transition-colors p-2.5 rounded-lg text-[10px] font-black text-red-400">
                                                                -{item.v}{item.label}
                                                            </button>
                                                        ))}
                                                    </div>
                                                </div>

                                                <div className="flex flex-col gap-3">
                                                    <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white py-6 rounded-2xl font-black text-xl shadow-lg shadow-blue-500/20 transition-all active:scale-95 uppercase italic border-b-4 border-blue-800">총 {conquestNormalCount + conquestBossCount}건 제출 승인</button>
                                                    <button type="button" onClick={handleUndoLastConquest} className="w-full bg-slate-100 dark:bg-slate-800 hover:bg-red-50 dark:hover:bg-red-900/30 text-red-500 border border-slate-200 dark:border-slate-700 py-3.5 rounded-xl font-black text-xs uppercase tracking-widest transition-all">마지막 균격 기록 취소</button>
                                                </div>
                                            </form>
                                        </aside>

                                        <section className="space-y-6 mt-8 lg:mt-0">
                                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 px-2">
                                                <h3 className="font-black text-lg italic uppercase text-blue-500 shrink-0">길드원 기록 현황</h3>
                                                <div className="flex gap-1.5 bg-slate-200 dark:bg-slate-800 p-1 rounded-xl w-full md:w-auto overflow-x-auto no-scrollbar">
                                                    <button onClick={() => setConquestFilter('timeSort')} className={`whitespace-nowrap px-4 py-1.5 rounded-lg text-[10px] font-black transition-all ${conquestFilter === 'timeSort' ? 'bg-white dark:bg-slate-600 shadow-sm text-emerald-600' : 'text-slate-500 dark:text-slate-400 hover:bg-slate-300 dark:hover:bg-slate-700'}`}>남은시간 순</button>
                                                    <button onClick={() => setConquestFilter('all')} className={`whitespace-nowrap px-4 py-1.5 rounded-lg text-[10px] font-black transition-all ${conquestFilter === 'all' ? 'bg-white dark:bg-slate-600 shadow-sm text-blue-600' : 'text-slate-500 dark:text-slate-400 hover:bg-slate-300 dark:hover:bg-slate-700'}`}>전체</button>
                                                    <button onClick={() => setConquestFilter('inactive')} className={`whitespace-nowrap px-4 py-1.5 rounded-lg text-[10px] font-black transition-all ${conquestFilter === 'inactive' ? 'bg-white dark:bg-slate-600 shadow-sm text-red-600' : 'text-slate-500 dark:text-slate-400 hover:bg-slate-300 dark:hover:bg-slate-700'}`}>미참여</button>
                                                </div>
                                            </div>
                                            <div className="agent-grid">
                                                {sortedConquestMembers.map(mDoc => {
                                                    const st = stats.playerMap[mDoc.name] || { swords: 0, totalInputTimeSec: 0 };
                                                    const usedSwordsCount = mDoc.rankingNormal !== undefined ? (mDoc.rankingNormal + (mDoc.rankingBoss||0)) : (st.swords || 0);
                                                    const totalBudgetSec = TOTAL_RESOURCES * BASE_TIME_PER_SWORD * 60; 
                                                    const remainingSec = Math.max(0, totalBudgetSec - st.totalInputTimeSec);
                                                    const isInactive = usedSwordsCount === 0;
                                                    
                                                    return (
                                                        <div key={mDoc.id} className={`dashboard-card p-5 md:p-6 border-l-[6px] ${!isInactive ? 'border-l-blue-500 shadow-md' : 'border-l-slate-300 dark:border-l-slate-700 bg-slate-50/50 dark:bg-slate-800/40'} hover:translate-y-[-4px] transition-transform`}>
                                                            <div className="flex flex-col mb-4 gap-1.5 min-w-0">
                                                                <div className="flex justify-between items-start gap-2">
                                                                    <div className="flex items-center gap-1">
                                                                        <span className={`text-lg font-black break-words italic ${!isInactive ? 'text-slate-900 dark:text-slate-100' : 'text-slate-600 dark:text-slate-300'}`}>{mDoc.name}</span>
                                                                        {renderBadges(mDoc)}
                                                                    </div>
                                                                    <span className={`text-[8px] md:text-[9px] font-black px-2 py-0.5 rounded-full shadow-sm whitespace-nowrap shrink-0 ${isInactive ? 'bg-slate-100 dark:bg-slate-800 text-slate-400 dark:text-slate-500' : (TOTAL_RESOURCES - usedSwordsCount) <= 0 ? 'bg-red-50 dark:bg-red-950/30 text-red-500' : 'bg-blue-50 dark:bg-blue-950/30 text-blue-600 dark:text-blue-400'}`}>
                                                                        {isInactive ? '미참여' : `잔여: ${TOTAL_RESOURCES - usedSwordsCount}`}
                                                                    </span>
                                                                </div>
                                                                <span className={`text-[9px] font-black italic tracking-widest break-words ${!isInactive ? 'text-blue-500 dark:text-blue-300' : 'text-slate-400 dark:text-slate-400'}`}>
                                                                    {rankingData.getPersonalStatus(mDoc.name).currentTitle.name}
                                                                </span>
                                                            </div>
                                                            <div className="space-y-4">
                                                                <div className="relative h-2 w-full bg-slate-100 dark:bg-black/30 rounded-full overflow-hidden">
                                                                    <div className={`h-full ${!isInactive ? 'bg-gradient-to-r from-blue-600 to-cyan-400' : 'bg-slate-300 dark:bg-slate-700'} transition-all duration-1000`} style={{ width: `${(usedSwordsCount / TOTAL_RESOURCES) * 100}%` }}></div>
                                                                </div>
                                                                <div className={`flex flex-col gap-1.5 text-[10px] md:text-[11px] font-black ${!isInactive ? 'text-slate-500 dark:text-slate-300' : 'text-slate-400 dark:text-slate-500'}`}>
                                                                    <div className="flex justify-between items-center">
                                                                        <span>남은 칼</span>
                                                                        <span className={!isInactive ? 'text-slate-900 dark:text-slate-100 italic font-black text-sm' : ''}>
                                                                            {TOTAL_RESOURCES - usedSwordsCount}개
                                                                        </span>
                                                                    </div>
                                                                    <div className={`flex justify-between items-center border-t pt-2 ${!isInactive ? 'text-emerald-500 border-slate-50 dark:border-slate-800' : 'text-slate-400 dark:text-slate-500 border-slate-100 dark:border-slate-800/40'}`}>
                                                                        <span>예상 남은 시간</span>
                                                                        <span className={`italic font-mono font-black ${!isInactive ? 'text-blue-600 dark:text-blue-400' : ''}`}>
                                                                            {Math.floor(remainingSec / 60)}분 {remainingSec % 60 > 0 ? `${remainingSec % 60}초` : ''}
                                                                        </span>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </section>
                                    </div>
                                </div>
                            )}

                                <div className="space-y-6">
                                    <div className="flex flex-wrap justify-center gap-4 mb-8 bg-slate-200 dark:bg-slate-800/80 p-1.5 rounded-2xl w-fit mx-auto shadow-sm">
                                        <button onClick={() => setStrikeSubTab('calc')} className={`px-6 py-2.5 rounded-xl text-xs font-black transition-all flex items-center gap-2 ${strikeSubTab === 'calc' ? 'bg-white dark:bg-slate-700 text-blue-600 dark:text-blue-400 shadow-md' : 'text-slate-500 dark:text-slate-400 hover:bg-slate-300 dark:hover:bg-slate-700'}`}><i className="fas fa-calculator"></i>격전지 추가 점수(격추)</button>
                                        <button onClick={() => setStrikeSubTab('dist')} className={`px-6 py-2.5 rounded-xl text-xs font-black transition-all flex items-center gap-2 ${strikeSubTab === 'dist' ? 'bg-white dark:bg-slate-700 text-emerald-600 dark:text-emerald-400 shadow-md' : 'text-slate-500 dark:text-slate-400 hover:bg-slate-300 dark:hover:bg-slate-700'}`}><i className="fas fa-gift"></i>격전지 분배 시스템</button>

                                                <div className="flex items-center gap-2 mb-4">
                                                    <i className="fas fa-user-shield text-blue-500"></i>
                                                    <h3 className="font-black text-sm text-slate-800 dark:text-white">{nickname}님의 격추</h3>
                                                </div>
                                                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 items-end">
                                                    <div className="space-y-1">
                                                        <label className="text-[10px] text-slate-500 dark:text-slate-400 font-bold">스탯 값 입력 (소수점 제외)</label>
                                                        <input type="number" className="w-full p-2.5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg outline-none font-mono text-xs focus:border-blue-500 text-slate-900 dark:text-white" value={myStat} onChange={e => setMyStat(e.target.value.replace(/[^0-9]/g, ''))} onFocus={e=>e.target.select()} placeholder="값 입력" />

                                                    <div className="space-y-1">
                                                        <label className="text-[10px] text-slate-500 dark:text-slate-400 font-bold">탈것 값 입력</label>
                                                        <input type="number" className="w-full p-2.5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg outline-none font-mono text-xs focus:border-blue-500 text-slate-900 dark:text-white" value={myMount} onChange={e => setMyMount(e.target.value.replace(/[^0-9]/g, ''))} onFocus={e=>e.target.select()} placeholder="값 입력" />

                                                    <div className="flex gap-2 h-[42px]">
                                                        <div className="flex-1 bg-slate-900 dark:bg-[#0B1220] text-white rounded-lg flex items-center justify-center text-xs font-mono font-bold shadow-inner">

                                                    </div>
                                                </div>
                                            </div>

                                            <div className="dashboard-card p-6 md:p-8 space-y-8">
                                                <div className="space-y-3">
                                                    <label className="text-[10px] text-slate-400 dark:text-slate-500 uppercase tracking-widest block font-bold">1단계: 몬스터 체력(점수) 값 입력 <span className="text-blue-500 dark:text-blue-400 font-normal">(선택사항)</span></label>
                                                    <div className="flex flex-col sm:flex-row gap-3">
                                                        <input type="number" className="flex-1 p-3.5 bg-slate-50 dark:bg-slate-900 border-2 border-slate-200 dark:border-slate-700 rounded-xl outline-none focus:border-blue-500 font-mono text-lg font-bold text-slate-900 dark:text-white" value={bossScoreStr} onChange={e => setBossScoreStr(e.target.value.replace(/[^0-9]/g, ''))} onFocus={e=>e.target.select()} placeholder="체력 미입력 시 기여도(%)만 산출됩니다" />

                                                            <button onClick={() => setBossScoreStr("300000")} className="px-3 py-2 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-lg text-[10px] font-black hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">+30만</button>
                                                            <button onClick={() => setBossScoreStr("500000")} className="px-3 py-2 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-lg text-[10px] font-black hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">+50만</button>

                                                        </div>
                                                    </div>
                                                </div>

                                                <div className="space-y-4 pt-4 border-t border-slate-100 dark:border-slate-800">
                                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">

                                                            <label className="text-[10px] text-slate-400 dark:text-slate-500 uppercase tracking-widest block font-bold">2단계: 참여 길드원 선택 ({selectedCalcMembers.length}명 지정됨)</label>

                                                        <div className="flex w-full sm:w-auto gap-2">
                                                            <button onClick={() => setSelectedCalcMembers([])} className="px-3 py-2 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 text-[10px] font-black rounded-xl hover:bg-slate-200 dark:hover:bg-slate-700 shrink-0 transition-colors">전체 선택 해제</button>
                                                            <div className="relative flex-1 sm:w-48">

                                                            </div>
                                                        </div>
                                                    </div>

                                                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 max-h-[320px] overflow-y-auto pr-1 no-scrollbar bg-slate-50 dark:bg-slate-900/40 p-3 rounded-2xl border border-slate-100 dark:border-slate-800">
                                                        {filteredCalcMembers.map(m => {
                                                            const isSelected = selectedCalcMembers.includes(m.id);
                                                            const gyeokchu = getMemberGyeokchu(m);
                                                            const isFav = favorites.includes(m.name);
                                                            return (
                                                                <div key={m.id} className={`p-3.5 rounded-xl border-2 transition-all flex items-center justify-between gap-2 relative cursor-pointer ${isSelected ? 'border-blue-600 bg-blue-500/10 shadow-sm' : 'border-slate-100 dark:border-slate-800 bg-white dark:bg-slate-800'}`} onClick={() => setSelectedCalcMembers(p => isSelected ? p.filter(id => id !== m.id) : [...p, m.id])}>
                                                                    <div className="flex-1 text-left min-w-0">
                                                                        <div className="flex items-center gap-2">
                                                                            <div className={`w-3.5 h-3.5 rounded-md border flex items-center justify-center text-[8px] text-white shrink-0 ${isSelected ? 'bg-blue-600 border-blue-600' : 'border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-950'}`}>{isSelected && '✓'}</div>
                                                                            <div className="flex items-center gap-1">
                                                                                <span className={`text-xs font-black break-words ${isSelected ? 'text-blue-600 dark:text-blue-400' : 'text-slate-800 dark:text-slate-200'}`}>{m.name}</span>
                                                                                {renderBadges(m)}
                                                                            </div>
                                                                        </div>
                                                                        <div className={`text-[10px] font-bold font-mono mt-1 pl-5 ${gyeokchu > 0 ? 'text-slate-500 dark:text-slate-400' : 'text-red-400'}`}>
                                                                            {gyeokchu > 0 ? `격추: ${gyeokchu.toLocaleString()}` : '격추 미등록'}
                                                                        </div>
                                                                    </div>
                                                                    <button type="button" onClick={(e) => toggleFavorite(e, m.name)} className="shrink-0 p-1 rounded hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                                                                        <i className={`fas fa-star text-xs ${isFav ? 'text-yellow-400' : 'text-slate-300 dark:text-slate-600'}`}></i>
                                                                    </button>
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                </div>

                                                <div className="space-y-4 pt-6 border-t border-slate-100 dark:border-slate-800">
                                                    <div className="flex flex-wrap justify-between items-center gap-3">
                                                        <h3 className="text-xs font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest flex items-center gap-2"><i className="fas fa-poll-h text-blue-500"></i>격전지 비율 최종 결과</h3>
                                                        <div className="flex gap-2">
                                                            <button onClick={() => {
                                                                let txt = `━━━━━━━━━━━━\n격전지 비율 최종 결과\n총 격추 : ${calcStrikeReport.totalGyeokchu.toLocaleString()}\n`;
                                                                if (bossScoreStr) txt += `몬스터 체력 : ${Number(bossScoreStr).toLocaleString()}\n`;
                                                                txt += `━━━━━━━━━━━━\n`;
                                                                calcStrikeReport.individualReports.forEach(r => {
                                                                    if (bossScoreStr) {
                                                                        const min1x = Math.floor(r.indExpectedSec1x / 60);
                                                                        const sec1x = r.indExpectedSec1x % 60;
                                                                        const min2x = Math.floor(r.indExpectedSec2x / 60);
                                                                        const sec2x = r.indExpectedSec2x % 60;
                                                                        txt += `${r.name}\n기여율 : ${r.rate}% (남은 ${(100 - r.rate).toFixed(2)}%)\n예상 시간 (1배속) : ${min1x}분 ${sec1x}초\n예상 시간 (2배속) : ${min2x}분 ${sec2x}초\n예상 점수 : ${r.expectedScore.toLocaleString()}\n━━━━━━━━━━━━\n`;
                                                                    } else {
                                                                        txt += `${r.name}\n기여율 : ${r.rate}% (남은 ${(100 - r.rate).toFixed(2)}%)\n━━━━━━━━━━━━\n`;
                                                                    }
                                                                });
                                                                copyToClipboard(txt);
                                                            }} className="px-3 py-1.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg text-[10px] font-black text-slate-700 dark:text-slate-300 transition-colors shadow-sm"><i className="far fa-copy mr-1"></i>텍스트 복사</button>
                                                            <button onClick={handleCaptureRatio} className="px-3 py-1.5 bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-400 hover:bg-blue-200 dark:hover:bg-blue-800/50 rounded-lg text-[10px] font-black transition-colors shadow-sm"><i className="fas fa-camera mr-1"></i>결과 이미지 저장</button>
                                                        </div>
                                                    </div>
                                                    
                                                    <div id="ratio-result-card" ref={ratioCaptureRef} className="p-6 md:p-8 rounded-[2rem] bg-white dark:bg-slate-900 border-2 border-blue-500 shadow-2xl relative mt-4">
