<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>라임길드 통합 관리 시스템</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
        
        :root {
            --brand-primary: #2563eb;
            --brand-slate: #f8fafc;
            --brand-dark: #0f172a;
        }

        body { 
            font-family: 'Noto Sans KR', 'Inter', sans-serif; 
            transition: background-color 0.2s;
            background-color: #f1f5f9; 
            letter-spacing: -0.025em;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            width: 100%;
        }

        .dark body { background-color: #020617; }

        .dashboard-card { 
            border-radius: 0.75rem; 
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
        }

        .dark .dashboard-card {
            background-color: #1e293b;
            border-color: #334155;
            color: #f1f5f9;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .animate-marquee {
            display: inline-block;
            white-space: nowrap;
            animation: marquee 30s linear infinite;
        }

        .app-container {
            width: 100%;
            max-width: 1440px;
            margin: 0 auto;
            min-height: 100vh;
        }

        .agent-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 0.75rem;
        }

        @media (min-width: 768px) {
            .agent-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1.25rem;
            }
        }

        @media (min-width: 1024px) {
            .desktop-layout {
                display: grid;
                grid-template-columns: 380px 1fr;
                gap: 1.5rem;
                align-items: start;
            }
        }

        .main-tab-active {
            background-color: var(--brand-primary);
            color: white;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
        }

        .custom-modal-overlay {
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
        }

        @keyframes slideUpFade {
            0% { transform: translateY(10px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        .log-animate {
            animation: slideUpFade 0.5s ease-out forwards;
        }
    </style>
</head>
<body class="text-slate-900 font-bold">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, serverTimestamp, deleteDoc, doc, setDoc, updateDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCOt_5hYk7Y9EDwo1Cd55et5-JT6k7LIcc",
            authDomain: "cat-hero-record.firebaseapp.com",
            projectId: "cat-hero-record",
            storageBucket: "cat-hero-record.firebasestorage.app",
            messagingSenderId: "1059204432454",
            appId: "1:1059204432454:web:b365ddd7d6a3da2c624047"
        };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'cat-hero-v24-final';
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const { useState, useEffect, useMemo } = React;

        const TOTAL_RESOURCES = 10; 
        const BASE_TIME_PER_SWORD = 2; // 1회당 2분, 총 20분
        const INITIAL_MEMBERS = ["늑대벼리", "마자유", "고기쟁이", "김동순", "일민", "캣핑", "콘스", "하늘구름바다", "창식2", "나는도비", "노들노들", "포저", "라잌늑냥", "베리발", "장귝", "유나s"];
        
        const mobs = ['일반몹', '보스'];

        const TITLES_LIST = [
            { id: 1, name: "라임의 새싹", score: 0 },
            { id: 2, name: "견습 길드원", score: 50 },
            { id: 3, name: "정식 길드원", score: 100 },
            { id: 4, name: "베테랑", score: 200 },
            { id: 5, name: "에이스", score: 400 },
            { id: 6, name: "정예 길드원", score: 600 },
            { id: 7, name: "전설의 길드원", score: 800 },
            { id: 8, name: "라임의 수호자", score: 1000 },
            { id: 9, name: "불멸의 전사", score: 1500 },
            { id: 10, name: "라임의 태양", score: 2000 },
            { id: 11, name: "길드의 자부심", score: 5000 },
            { id: 12, name: "라임의 신", score: 10000 },
        ];

        function App() {
            const [user, setUser] = useState(null);
            const [nickname, setNickname] = useState(localStorage.getItem('cat_hero_nickname') || '');
            const [isNameSet, setIsNameSet] = useState(!!localStorage.getItem('cat_hero_nickname'));
            const [isAdminMode, setIsAdminMode] = useState(false);
            const [adminPass, setAdminPass] = useState("");
            const [showAdminEntry, setShowAdminEntry] = useState(false);
            const [isDarkMode, setIsDarkMode] = useState(localStorage.getItem('isDarkMode') === 'true');
            const [mainCategory, setMainCategory] = useState('conquest');
            
            // 필터 기본값을 'timeSort'로 설정
            const [conquestFilter, setConquestFilter] = useState('timeSort');
            const [raidFilter, setRaidFilter] = useState('all');

            const [selectedMob, setSelectedMob] = useState('일반몹');
            const [playMin, setPlayMin] = useState(0);
            const [playSec, setPlaySec] = useState(0);
            
            const [logs, setLogs] = useState([]);
            const [raidLogs, setRaidLogs] = useState([]);
            const [members, setMembers] = useState([]);
            const [notice, setNotice] = useState("시스템 가동 중입니다.");
            const [newNotice, setNewNotice] = useState("");
            const [newMemberName, setNewMemberName] = useState("");
            const [timeLeftStr, setTimeLeftStr] = useState("");

            const [uiAlert, setUiAlert] = useState(null);
            const [uiConfirm, setUiConfirm] = useState(null);

            const showAlert = (msg, type = 'success') => setUiAlert({ message: msg, type });
            const closeAlert = () => setUiAlert(null);

            const handleResetSession = () => {
                setUiConfirm({ 
                    message: "길드원 정보를 초기화하고 이름 선택 화면으로 돌아가시겠습니까?", 
                    onConfirm: () => { 
                        localStorage.removeItem('cat_hero_nickname'); 
                        setNickname(''); 
                        setIsNameSet(false); 
                        window.location.reload(); 
                    } 
                });
            };

            useEffect(() => {
                if (isDarkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
                localStorage.setItem('isDarkMode', isDarkMode);
            }, [isDarkMode]);

            useEffect(() => {
                const updateTimer = () => {
                    const now = new Date();
                    const day = now.getDay();
                    let target = new Date();
                    target.setHours(8, 45, 0, 0);
                    const daysUntilMonday = (1 + 7 - day) % 7 || 7;
                    target.setDate(now.getDate() + daysUntilMonday);
                    const diff = target - now;
                    if (diff <= 0) setTimeLeftStr("시즌 종료");
                    else {
                        const d = Math.floor(diff / 86400000);
                        const h = Math.floor((diff % 86400000) / 3600000);
                        const m = Math.floor((diff % 3600000) / 60000);
                        const s = Math.floor((diff % 60000) / 1000);
                        setTimeLeftStr(`${d}일 ${h}:${m}:${s}`);
                    }
                };
                const timerId = setInterval(updateTimer, 1000);
                updateTimer();
                return () => clearInterval(timerId);
            }, []);

            useEffect(() => {
                const initAuth = async () => {
                    try { await signInAnonymously(auth); } catch (e) { console.error(e); } 
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsubMembers = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'members_v24'), (snapshot) => {
                    if (snapshot.empty) {
                        INITIAL_MEMBERS.forEach(name => addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'members_v24'), { name, score: 0 }));
                    } else {
                        setMembers(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort((a, b) => (b.score || 0) - (a.score || 0)));
                    }
                });
                const unsubLogs = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'conquest_logs_v24'), (snapshot) => {
                    setLogs(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0)));
                });
                const unsubRaidLogs = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'raid_logs_v24'), (snapshot) => {
                    setRaidLogs(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });
                const unsubSettings = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'global'), (snapshot) => {
                    if (snapshot.exists()) setNotice(snapshot.data().notice || "");
                });
                return () => { unsubMembers(); unsubLogs(); unsubRaidLogs(); unsubSettings(); };
            }, [user]);

            const rankingData = useMemo(() => {
                const sortedByScore = [...members].sort((a, b) => (b.score || 0) - (a.score || 0));
                const raidCounts = {};
                raidLogs.forEach(l => { raidCounts[l.nickname] = (raidCounts[l.nickname] || 0) + Number(l.keysUsed || 0); });

                const getPersonalStatus = (name) => {
                    const m = members.find(mem => mem.name === name) || { score: 0 };
                    const currentScore = m.score || 0;
                    const currentTitle = [...TITLES_LIST].reverse().find(t => currentScore >= t.score) || TITLES_LIST[0];
                    const nextTitle = TITLES_LIST.find(t => t.score > currentScore);
                    const rankIdx = sortedByScore.findIndex(mem => mem.name === name);
                    return { currentTitle, nextTitle, score: currentScore, rank: rankIdx + 1, raidCount: raidCounts[name] || 0 };
                };
                return { weekly: sortedByScore, season: sortedByScore, getPersonalStatus };
            }, [members, raidLogs]);

            const stats = useMemo(() => {
                const playerMap = {};
                members.forEach(m => playerMap[m.name] = { swords: 0, totalInputTimeSec: 0, bossTimeSec: 0, raidToday: 0 });
                logs.forEach(l => { 
                    if (playerMap[l.nickname]) { 
                        playerMap[l.nickname].swords += 1; 
                        const duration = (Number(l.playMin || 0) * 60 + Number(l.playSec || 0));
                        playerMap[l.nickname].totalInputTimeSec += duration;
                        if (l.mob === '보스') playerMap[l.nickname].bossTimeSec += duration;
                    } 
                });
                const todayStart = new Date(); todayStart.setHours(0,0,0,0);
                raidLogs.forEach(l => { 
                    const ld = l.timestamp?.seconds ? new Date(l.timestamp.seconds * 1000) : new Date(); 
                    if (ld >= todayStart && playerMap[l.nickname]) playerMap[l.nickname].raidToday += Number(l.keysUsed || 0); 
                });
                return { playerMap };
            }, [logs, raidLogs, members]);

            const handleSubmitConquest = async (e) => {
                e.preventDefault();
                if (!nickname || (playMin === 0 && playSec === 0)) return;
                const member = members.find(m => m.name === nickname);
                if ((stats.playerMap[nickname]?.swords || 0) >= TOTAL_RESOURCES) return showAlert(`한도(${TOTAL_RESOURCES}회) 초과`, "error");
                try {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'conquest_logs_v24'), { nickname, mob: selectedMob, playMin: Number(playMin), playSec: Number(playSec), timestamp: serverTimestamp(), uid: user.uid });
                    if (member) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members_v24', member.id), { score: (member.score || 0) + 5 });
                    setPlayMin(0); setPlaySec(0); showAlert("작전 보고 완료.");
                } catch (err) { showAlert("실패", "error"); }
            };

            const handleSubmitRaid = async (keys) => {
                const member = members.find(m => m.name === nickname); // Syntax error fixed here (added ===)
                try {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'raid_logs_v24'), { nickname, keysUsed: keys, timestamp: serverTimestamp(), uid: user.uid });
                    if (member) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members_v24', member.id), { score: (member.score || 0) + (keys * 10) });
                    showAlert(`${keys}개 보고 완료.`);
                } catch (err) { showAlert("실패", "error"); }
            };

            const handleReduceRaid = async () => {
                const today = new Date(); today.setHours(0, 0, 0, 0);
                const myLogs = raidLogs.filter(l => l.nickname === nickname && (l.timestamp?.seconds ? new Date(l.timestamp.seconds * 1000) : new Date()) >= today).sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
                if (myLogs.length > 0) {
                    const logToDelete = myLogs[0];
                    const member = members.find(m => m.name === nickname);
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'raid_logs_v24', logToDelete.id));
                    if (member) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members_v24', member.id), { score: Math.max(0, (member.score || 0) - (Number(logToDelete.keysUsed) * 10)) });
                    showAlert("취소됨");
                }
            };

            const handleResetRaid = async () => {
                const today = new Date(); today.setHours(0, 0, 0, 0);
                const myLogs = raidLogs.filter(l => l.nickname === nickname && (l.timestamp?.seconds ? new Date(l.timestamp.seconds * 1000) : new Date()) >= today);
                setUiConfirm({ message: "오늘의 기록을 초기화하시겠습니까?", onConfirm: async () => { 
                    let totalKeys = 0;
                    for (const l of myLogs) { totalKeys += Number(l.keysUsed); await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'raid_logs_v24', l.id)); }
                    const member = members.find(m => m.name === nickname);
                    if (member) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members_v24', member.id), { score: Math.max(0, (member.score || 0) - (totalKeys * 10)) });
                    showAlert("초기화 완료"); 
                } });
            };

            const handleAdminResetAllRaid = async () => {
                setUiConfirm({ message: "길드 전체의 레이드 기록을 삭제합니까? (랭킹 점수는 유지됩니다)", onConfirm: async () => { 
                    const snap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'raid_logs_v24'));
                    for (const d of snap.docs) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'raid_logs_v24', d.id));
                    showAlert("전체 기록 초기화 완료"); 
                } });
            };

            const handleAdminResetAllConquest = async () => {
                setUiConfirm({ message: "길드 전체의 균격 기록을 삭제합니까? (랭킹 점수는 유지됩니다)", onConfirm: async () => { 
                    const snap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'conquest_logs_v24'));
                    for (const d of snap.docs) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'conquest_logs_v24', d.id));
                    showAlert("전체 기록 초기화 완료"); 
                } });
            };

            const handleAdminResetAllScores = async () => {
                setUiConfirm({ message: "모든 길드원의 랭킹 점수를 0으로 초기화합니까?", onConfirm: async () => {
                    for (const m of members) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members_v24', m.id), { score: 0 });
                    showAlert("랭킹 점수 전체 초기화 완료");
                }});
            };

            const handleUpdateScore = async (id, newScore) => {
                try {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members_v24', id), { score: Number(newScore) });
                    showAlert("점수가 수정되었습니다.");
                } catch (e) { showAlert("실패", "error"); }
            };

            const adjustTime = (type, val) => {
                if (type === 'min') setPlayMin(p => Math.max(0, p + val));
                else setPlaySec(p => (p + val >= 60 ? (setPlayMin(m => m + 1), p + val - 60) : Math.max(0, p + val)));
            };

            const latestLog = logs[0] || null;
            const myStatus = rankingData.getPersonalStatus(nickname);

            // -- 렌더링 로직 --
            
            // 관리자 모드
            if (isAdminMode) {
                return (
                    <div className="fixed inset-0 z-[400] overflow-y-auto bg-slate-100 dark:bg-slate-950 p-4 md:p-8 animate-fadeIn text-slate-900 font-bold">
                        <div className="max-w-4xl mx-auto dashboard-card p-6 md:p-8 border-t-8 border-slate-800 shadow-2xl">
                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 gap-4 border-b pb-6 text-slate-900 dark:text-white">
                                <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 bg-slate-100 dark:bg-slate-800 rounded-xl flex items-center justify-center text-slate-800 dark:text-white font-bold"><i className="fas fa-shield-alt"></i></div>
                                    <h2 className="text-xl md:text-2xl font-black italic">관리 센터</h2>
                                </div>
                                <button onClick={() => { setIsAdminMode(false); }} className="w-full md:w-auto px-6 py-2.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 rounded-xl font-black shadow-sm text-slate-900 dark:text-white uppercase text-xs">나가기</button>
                            </div>
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                <div className="space-y-8 font-black">
                                    <section>
                                        <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3 block">전체 공지사항</label>
                                        <div className="flex gap-2">
                                            <input type="text" className="flex-1 p-3 border-2 border-slate-100 dark:bg-slate-800 dark:border-slate-700 rounded-xl outline-none focus:border-blue-500 font-bold text-sm text-slate-900 dark:text-white" value={newNotice} onChange={e => setNewNotice(e.target.value)} placeholder="실시간 공지 입력" />
                                            <button onClick={async () => { await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'global'), { notice: newNotice }); showAlert("반영됨"); }} className="px-5 bg-blue-600 text-white rounded-xl font-black shadow-lg">송출</button>
                                        </div>
                                    </section>
                                    <section>
                                        <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3 block">데이터 관리 도구</label>
                                        <div className="flex flex-col gap-3">
                                            <button onClick={() => {
                                                let text = `[라임길드 현황 요약]\n\n■ 균격 미참여자:\n`;
                                                members.forEach(m => { if ((stats.playerMap[m.name]?.swords || 0) === 0) text += `- ${m.name}\n`; });
                                                text += `\n■ 레이드 미참여자:\n`;
                                                members.forEach(m => { if ((stats.playerMap[m.name]?.raidToday || 0) === 0) text += `- ${m.name}\n`; });
                                                const textArea = document.createElement("textarea"); textArea.value = text; document.body.appendChild(textArea); textArea.select(); document.execCommand('copy'); document.body.removeChild(textArea);
                                                showAlert("명단이 복사되었습니다.");
                                            }} className="w-full flex items-center justify-center gap-2 p-4 bg-slate-50 dark:bg-slate-800 border-2 border-dashed border-slate-200 dark:border-slate-700 rounded-2xl font-black text-slate-900 dark:text-white text-xs uppercase"><i className="fas fa-copy"></i> 미참여자 명단 복사</button>
                                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                                <button onClick={handleAdminResetAllConquest} className="p-3 bg-blue-50 dark:bg-blue-900/30 border-2 border-blue-100 dark:border-blue-900/50 rounded-xl text-blue-600 font-black text-[10px] uppercase hover:bg-blue-100">기록(균격) 초기화</button>
                                                <button onClick={handleAdminResetAllRaid} className="p-3 bg-orange-50 dark:bg-orange-900/30 border-2 border-orange-100 dark:border-orange-900/50 rounded-xl text-orange-600 font-black text-[10px] uppercase hover:bg-orange-100">기록(레이드) 초기화</button>
                                                <button onClick={handleAdminResetAllScores} className="p-3 bg-red-50 dark:bg-red-900/30 border-2 border-red-100 dark:border-red-900/50 rounded-xl text-red-600 font-black text-[10px] uppercase hover:bg-red-100">랭킹(점수) 초기화</button>
                                            </div>
                                        </div>
                                    </section>
                                </div>
                                <section>
                                    <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3 block">인원 및 점수(랭킹) 관리 ({members.length})</label>
                                    <div className="flex gap-2 mb-4">
                                        <input type="text" className="flex-1 p-2.5 border-2 border-slate-100 dark:bg-slate-800 dark:border-slate-700 rounded-xl outline-none focus:border-blue-500 font-bold text-slate-900 dark:text-white text-sm" value={newMemberName} onChange={e => setNewMemberName(e.target.value)} placeholder="이름 입력" />
                                        <button onClick={async () => { if(!newMemberName) return; await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'members_v24'), { name: newMemberName, score: 0 }); setNewMemberName(""); showAlert("추가됨"); }} className="px-5 bg-slate-800 dark:bg-slate-700 text-white rounded-xl font-bold">추가</button>
                                    </div>
                                    <div className="max-h-[300px] overflow-y-auto divide-y border-2 border-slate-100 dark:border-slate-800 rounded-2xl bg-white dark:bg-slate-900 shadow-inner no-scrollbar">
                                        {members.map(m => (
                                            <div key={m.id} className="flex flex-wrap justify-between p-4 text-sm items-center hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors text-slate-900 dark:text-white font-black">
                                                <div className="flex items-center gap-3"><span className="w-2 h-2 rounded-full bg-blue-500"></span><span className="font-bold">{m.name}</span></div>
                                                <div className="flex items-center gap-2 mt-2 sm:mt-0">
                                                    <span className="text-[10px] text-slate-400 uppercase">점수:</span>
                                                    <input type="number" className="w-16 p-1 border rounded text-center text-xs dark:bg-slate-800 dark:border-slate-700" defaultValue={m.score || 0} onBlur={(e) => handleUpdateScore(m.id, e.target.value)} />
                                                    <button onClick={async () => { setUiConfirm({ message: `${m.name} 님을 삭제합니까?`, onConfirm: async () => { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members_v24', m.id)); showAlert("완료"); } }); }} className="text-red-500 p-2"><i className="fas fa-trash"></i></button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </section>
                            </div>
                        </div>
                    </div>
                );
            }

            // 로그인 화면
            if (!isNameSet) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-slate-200">
                        <div className="dashboard-card p-10 md:p-12 w-full max-sm:px-6 w-full max-w-sm text-center shadow-2xl border-t-8 border-blue-600 animate-fadeIn font-bold">
                            <h1 className="text-2xl font-black text-blue-600 mb-1 uppercase italic">LIME HQ</h1>
                            <p className="text-[10px] text-slate-400 mb-10 font-bold uppercase tracking-[0.2em]">Personnel Verification</p>
                            <div className="space-y-6 text-left">
                                <label className="text-[11px] font-black text-slate-500 uppercase ml-1 mb-2 block">길드원 인증</label>
                                <select className="w-full p-4 bg-slate-50 border-2 border-slate-200 focus:border-blue-500 outline-none rounded-xl font-black text-slate-900" value={nickname} onChange={e => setNickname(e.target.value)}>
                                    <option value="">본인 성명을 선택하십시오</option>
                                    {members.map(m => <option key={m.id} value={m.name}>{m.name}</option>)}
                                </select>
                                <button onClick={() => { if(nickname) { localStorage.setItem('cat_hero_nickname', nickname); setIsNameSet(true); } }} className="w-full bg-blue-600 text-white font-black py-4 rounded-xl shadow-lg hover:bg-blue-700 active:scale-95 transition-all">대시보드 접속</button>
                                <button onClick={() => setShowAdminEntry(true)} className="w-full text-center text-[9px] text-slate-400 font-bold uppercase mt-6">Administrator Portal</button>
                            </div>
                        </div>

                        {showAdminEntry && (
                            <div className="fixed inset-0 z-[500] flex items-center justify-center p-4 bg-black/60 backdrop-blur-md animate-fadeIn font-bold">
                                <div className="bg-white dark:bg-slate-800 dashboard-card p-8 w-full max-w-[320px] border-t-8 border-blue-600 shadow-2xl">
                                    <div className="mb-6 text-center">
                                        <p className="text-[10px] text-slate-500 uppercase tracking-widest mb-1 font-black">보안 인증</p>
                                        <h3 className="text-lg font-black dark:text-white">관리자 코드 입력</h3>
                                    </div>
                                    <div className="flex flex-col gap-4 font-black">
                                        <input type="password" autoFocus placeholder="Passkey" className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl px-4 py-4 text-center text-xl outline-none focus:border-blue-500 text-slate-900 dark:text-white font-black tracking-widest" value={adminPass} onChange={e => setAdminPass(e.target.value)} onKeyDown={e => { if(e.key === 'Enter' && adminPass === "123456") { setIsAdminMode(true); setShowAdminEntry(false); setAdminPass(""); } }} />
                                        <div className="grid grid-cols-2 gap-3">
                                            <button onClick={() => { setShowAdminEntry(false); setAdminPass(""); }} className="py-3 bg-slate-100 dark:bg-slate-700 text-slate-600 rounded-xl font-bold text-sm">취소</button>
                                            <button onClick={() => { if(adminPass === "123456") { setIsAdminMode(true); setShowAdminEntry(false); setAdminPass(""); } else { showAlert("비밀번호 오류", "error"); } }} className="py-3 bg-blue-600 text-white rounded-xl font-bold text-sm shadow-lg">인증</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            // 대시보드 메인
            return (
                <div className="app-container">
                    {/* 상단 공지 */}
                    <div className="bg-slate-900 text-white h-10 flex items-center relative overflow-hidden border-b-2 border-blue-500/40">
                        <div className="px-3 bg-blue-600 font-black h-full flex items-center z-20 skew-x-[-15deg] -ml-3 text-white border-r-4 border-blue-400 shadow-xl">
                            <span className="skew-x-[15deg] text-[10px] tracking-widest italic uppercase font-black">공지</span>
                        </div>
                        <div className="animate-marquee whitespace-nowrap font-bold text-xs md:text-sm opacity-100 tracking-wide pl-8 z-10 font-black">
                            {notice} &nbsp;&nbsp;&nbsp; {notice} &nbsp;&nbsp;&nbsp; {notice}
                        </div>
                        <div className="absolute right-0 top-0 bottom-0 w-24 bg-gradient-to-l from-slate-900 to-transparent z-20"></div>
                    </div>

                    <header className="bg-white dark:bg-slate-900 p-4 border-b-2 border-slate-100 dark:border-slate-800 sticky top-0 z-30 shadow-sm text-slate-900 dark:text-white font-black">
                        <div className="flex justify-between items-center gap-4">
                            <div className="flex items-center gap-2 md:gap-3">
                                <button onClick={handleResetSession} className="w-10 h-10 bg-slate-50 dark:bg-slate-800 border border-slate-200 rounded-xl text-slate-500 hover:text-red-500 transition-all shadow-sm flex items-center justify-center font-bold">
                                    <i className="fas fa-power-off"></i>
                                </button>
                                <div className="space-y-1">
                                    <div className="flex gap-1 md:gap-2 overflow-x-auto no-scrollbar pb-1">
                                        <button onClick={() => setMainCategory('conquest')} className={`px-2.5 py-1.5 rounded-lg text-[10px] md:text-xs font-black whitespace-nowrap transition-all ${mainCategory === 'conquest' ? 'main-tab-active shadow-[0_0_15px_rgba(37,99,235,0.3)]' : 'bg-slate-50 dark:bg-slate-800 text-slate-400'}`}>01. 균격</button>
                                        <button onClick={() => setMainCategory('raid')} className={`px-2.5 py-1.5 rounded-lg text-[10px] md:text-xs font-black whitespace-nowrap transition-all ${mainCategory === 'raid' ? 'main-tab-active shadow-[0_0_15px_rgba(37,99,235,0.3)]' : 'bg-slate-50 dark:bg-slate-800 text-slate-400'}`}>02. 레이드</button>
                                        <button onClick={() => setMainCategory('ranking')} className={`px-2.5 py-1.5 rounded-lg text-[10px] md:text-xs font-black whitespace-nowrap transition-all ${mainCategory === 'ranking' ? 'main-tab-active bg-yellow-500 border-yellow-600 text-white' : 'bg-slate-50 dark:bg-slate-800 text-slate-400'}`}>03. 랭킹</button>
                                    </div>
                                    <div className="flex items-center gap-2 font-black">
                                        <span className="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse shrink-0"></span>
                                        <span className="text-[9px] md:text-[10px] font-black text-slate-500 dark:text-slate-400 uppercase tracking-widest truncate">로그인: <span className="text-blue-600 font-bold">{nickname}</span></span>
                                    </div>
                                </div>
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={() => setShowAdminEntry(true)} className="w-9 h-9 border rounded-xl flex items-center justify-center text-slate-400 hover:text-blue-500 transition-colors shadow-sm relative">
                                    <i className="fas fa-cog"></i>
                                </button>
                                <button onClick={() => setIsDarkMode(!isDarkMode)} className="w-9 h-9 border rounded-xl flex items-center justify-center text-slate-400 hover:text-yellow-500 shadow-sm"><i className={`fas ${isDarkMode ? 'fa-sun' : 'fa-moon'}`}></i></button>
                            </div>
                        </div>
                    </header>

                    <main className="p-4 md:p-8 mb-32">
                        {mainCategory === 'conquest' && (
                            <div className="desktop-layout">
                                <aside className="space-y-6">
                                    <div className="dashboard-card p-5 space-y-4">
                                        <h3 className="text-xs font-black text-slate-400 uppercase tracking-widest flex items-center gap-2"><i className="fas fa-broadcast-tower text-red-500 animate-pulse"></i> 실시간 작전 로그</h3>
                                        <div className="space-y-2.5 max-h-[150px] overflow-y-auto no-scrollbar font-bold">
                                            {logs.slice(0, 5).map((l, idx) => (
                                                <div key={idx} className="text-[10px] leading-relaxed border-b border-slate-50 dark:border-slate-800 pb-1.5 animate-fadeIn">
                                                    <span className="text-blue-500">[{l.nickname}]</span> {l.mob} 성공
                                                </div>
                                            ))}
                                            {logs.length === 0 && <p className="text-[10px] text-slate-400 text-center py-4">활동 기록 대기 중...</p>}
                                        </div>
                                    </div>
                                    <form onSubmit={handleSubmitConquest} className="dashboard-card p-6 md:p-8 space-y-8 text-slate-900 dark:text-white border-l-[8px] border-blue-500">
                                        <h2 className="text-lg uppercase italic border-b pb-4 dark:border-slate-700 font-bold">작전 보고서 제출</h2>
                                        
                                        <div className="space-y-4">
                                            <label className="text-[10px] text-slate-400 uppercase tracking-widest block mb-2 font-bold">01. 대상 등급</label>
                                            <div className="grid grid-cols-2 gap-2.5">
                                                {mobs.map(m => (
                                                    <button key={m} type="button" onClick={() => setSelectedMob(m)} className={`py-3.5 rounded-xl border-2 text-[10px] font-black uppercase transition-all ${selectedMob === m ? 'border-blue-600 bg-blue-600 text-white' : 'border-slate-100 dark:border-slate-800 text-slate-400'}`}>{m}</button>
                                                ))}
                                            </div>
                                        </div>
                                        <div className="bg-slate-900 rounded-[2rem] p-6 text-center border border-slate-800">
                                            <div className="text-4xl md:text-5xl font-black text-white italic mb-8 font-mono">{String(playMin).padStart(2, '0')}<span className="text-blue-500 mx-1.5">:</span>{String(playSec).padStart(2, '0')}</div>
                                            <div className="grid grid-cols-3 gap-2">
                                                {[1, 10, 1].map((v, i) => (
                                                    <button key={i} type="button" onClick={() => adjustTime(i===0?'min':'sec', v)} className="bg-white/10 p-2.5 rounded-lg text-[10px] font-black text-white">+{v}{i===0?'분':'초'}</button>
                                                ))}
                                                {[-1, -10, -1].map((v, i) => (
                                                    <button key={i} type="button" onClick={() => adjustTime(i===0?'min':'sec', v)} className="bg-red-500/10 p-2.5 rounded-lg text-[10px] font-black text-red-400">{v}{i===0?'분':'초'}</button>
                                                ))}
                                            </div>
                                        </div>
                                        <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white py-8 rounded-2xl font-black text-2xl shadow-lg shadow-blue-500/20 transition-all active:scale-95 uppercase italic border-b-4 border-blue-800">제출 승인</button>
                                    </form>
                                </aside>

                                <section className="space-y-6 mt-8 lg:mt-0">
                                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 px-2">
                                        <h3 className="font-black text-lg italic uppercase text-blue-500 shrink-0">길드원 작전 현황</h3>
                                        {/* 균격 필터 UI - '남은시간 순'을 최우선으로 배치 */}
                                        <div className="flex gap-1.5 bg-slate-200 dark:bg-slate-800 p-1 rounded-xl w-full md:w-auto overflow-x-auto no-scrollbar">
                                            <button onClick={() => setConquestFilter('timeSort')} className={`whitespace-nowrap px-4 py-1.5 rounded-lg text-[10px] font-black transition-all ${conquestFilter === 'timeSort' ? 'bg-white dark:bg-slate-600 shadow-sm text-emerald-600' : 'text-slate-500'}`}>남은시간 순</button>
                                            <button onClick={() => setConquestFilter('all')} className={`whitespace-nowrap px-4 py-1.5 rounded-lg text-[10px] font-black transition-all ${conquestFilter === 'all' ? 'bg-white dark:bg-slate-600 shadow-sm text-blue-600' : 'text-slate-50'}`}>전체</button>
                                            <button onClick={() => setConquestFilter('inactive')} className={`whitespace-nowrap px-4 py-1.5 rounded-lg text-[10px] font-black transition-all ${conquestFilter === 'inactive' ? 'bg-white dark:bg-slate-600 shadow-sm text-red-600' : 'text-slate-500'}`}>미참여</button>
                                        </div>
                                    </div>
                                    <div className="agent-grid">
                                        {members
                                            .filter(m => {
                                                const st = stats.playerMap[m.name] || { swords: 0 };
                                                if (conquestFilter === 'inactive') return st.swords === 0;
                                                return true;
                                            })
                                            .sort((a, b) => {
                                                // '남은시간 순' (사용한 시간이 적은 순)으로 정렬
                                                const timeA = stats.playerMap[a.name]?.totalInputTimeSec || 0;
                                                const timeB = stats.playerMap[b.name]?.totalInputTimeSec || 0;
                                                
                                                if (conquestFilter === 'timeSort') {
                                                    return timeA - timeB;
                                                }
                                                
                                                if (conquestFilter === 'all') {
                                                    // '전체' 필터에서도 남은시간 많은 사람 우선
                                                    if (timeA !== timeB) return timeA - timeB;
                                                    return (b.score || 0) - (a.score || 0);
                                                }
                                                
                                                return timeA - timeB;
                                            })
                                            .map(mDoc => {
                                                const st = stats.playerMap[mDoc.name] || { swords: 0, totalInputTimeSec: 0, bossTimeSec: 0 };
                                                const usedSwordsCount = st.swords || 0;
                                                
                                                const totalBudgetSec = TOTAL_RESOURCES * BASE_TIME_PER_SWORD * 60; // 1200초 (20분)
                                                const remainingSec = totalBudgetSec - st.totalInputTimeSec;
                                                
                                                const remMin = Math.floor(Math.max(0, remainingSec) / 60);
                                                const remSec = Math.max(0, remainingSec) % 60;
                                                return (
                                                    <div key={mDoc.id} className={`dashboard-card p-5 md:p-6 border-l-[6px] ${usedSwordsCount > 0 ? 'border-l-blue-500 shadow-md' : 'opacity-30 grayscale border-l-slate-400'} hover:translate-y-[-4px] transition-all`}>
                                                        <div className="flex flex-col mb-4 gap-1.5 min-w-0">
                                                            <div className="flex justify-between items-start gap-2">
                                                                <span className="text-lg font-black truncate text-slate-900 dark:text-white italic">{mDoc.name}</span>
                                                                <span className={`text-[8px] md:text-[9px] font-black px-2 py-0.5 rounded-full shadow-sm whitespace-nowrap ${(TOTAL_RESOURCES - usedSwordsCount) <= 0 ? 'bg-red-50 text-red-500' : 'bg-blue-50 text-blue-600'}`}>잔여: {TOTAL_RESOURCES - usedSwordsCount}</span>
                                                            </div>
                                                            <span className="text-[9px] text-blue-500 font-black italic tracking-widest truncate">{rankingData.getPersonalStatus(mDoc.name).currentTitle.name}</span>
                                                        </div>
                                                        <div className="space-y-4">
                                                            <div className="relative h-2 w-full bg-slate-100 dark:bg-black/30 rounded-full overflow-hidden"><div className="h-full bg-gradient-to-r from-blue-600 to-cyan-400 transition-all duration-1000" style={{ width: `${(usedSwordsCount / TOTAL_RESOURCES) * 100}%` }}></div></div>
                                                            <div className="flex flex-col gap-1 text-[10px] md:text-[11px] font-black text-slate-500">
                                                                <div className="flex justify-between"><span>칼 사용</span><span className="text-slate-900 dark:text-white italic">{usedSwordsCount} / {TOTAL_RESOURCES}</span></div>
                                                                <div className="flex justify-between text-emerald-500 border-t pt-2 border-slate-50 dark:border-slate-800"><span>남은 시간</span><span className="italic font-mono font-bold text-blue-600 dark:text-blue-400">{remMin}분 {remSec}초</span></div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                );
                                        })}
                                    </div>
                                </section>
                            </div>
                        )}

                        {mainCategory === 'raid' && (
                            <div className="desktop-layout text-slate-900 dark:text-white">
                                <section className="mb-10">
                                    <div className="dashboard-card p-6 md:p-10 space-y-10 border-t-[10px] border-emerald-500 shadow-2xl">
                                        <div className="flex justify-between items-center border-b pb-4 dark:border-slate-700">
                                            <h2 className="font-black text-xl italic uppercase tracking-tighter">레이드 관제 시스템</h2>
                                            <span className="text-[9px] text-emerald-500 bg-emerald-50 dark:bg-emerald-900/30 px-2.5 py-1 rounded-full uppercase font-bold">ACTIVE</span>
                                        </div>
                                        <div className="p-6 md:p-10 bg-slate-50 dark:bg-slate-800/50 rounded-[2.5rem] text-center space-y-10 shadow-inner">
                                            <div className="space-y-2">
                                                <div className="text-[11px] font-black text-slate-400 uppercase tracking-[0.3em] font-bold">열쇠 소모 데이터 보고</div>
                                                <p className="text-[9px] text-red-500 font-black uppercase tracking-widest italic animate-pulse">최대 2개 지급 / 6개 보관</p>
                                            </div>
                                            <button onClick={() => handleSubmitRaid(1)} className="w-full bg-emerald-600 hover:bg-emerald-500 text-white border-b-[10px] border-emerald-800 py-10 rounded-[3rem] font-black text-3xl shadow-xl active:scale-95 active:border-b-0 active:translate-y-2 flex flex-col items-center justify-center gap-4 italic"><i className="fas fa-bolt text-yellow-300 text-4xl"></i>열쇠 승인</button>
                                            <div className="grid grid-cols-2 gap-3 font-black">
                                                <button onClick={handleReduceRaid} className="bg-white dark:bg-slate-700 text-red-500 border-2 border-red-100 dark:border-red-900/30 py-4.5 rounded-2xl font-black text-xs uppercase tracking-widest font-bold">취소 (-1)</button>
                                                <button onClick={handleResetRaid} className="bg-slate-800 text-slate-300 border border-slate-700 py-4.5 rounded-2xl font-black text-xs uppercase tracking-widest font-bold">전체 리셋</button>
                                            </div>
                                        </div>
                                    </div>
                                </section>
                                <section className="space-y-8 animate-fadeIn">
                                    <div className="flex justify-end mb-4">
                                        <div className="flex gap-1.5 bg-slate-200 dark:bg-slate-800 p-1 rounded-xl">
                                            <button onClick={() => setRaidFilter('all')} className={`px-4 py-1.5 rounded-lg text-[10px] font-black transition-all ${raidFilter === 'all' ? 'bg-white dark:bg-slate-600 shadow-sm text-emerald-600' : 'text-slate-500'}`}>전체인원</button>
                                            <button onClick={() => setRaidFilter('inactive')} className={`px-4 py-1.5 rounded-lg text-[10px] font-black transition-all ${raidFilter === 'inactive' ? 'bg-white dark:bg-slate-600 shadow-sm text-red-600' : 'text-slate-500'}`}>미참여</button>
                                        </div>
                                    </div>
                                    <div className="agent-grid">
                                        {members
                                            .filter(m => {
                                                const st = stats.playerMap[m.name] || { raidToday: 0 };
                                                if (raidFilter === 'inactive') return st.raidToday === 0;
                                                return true;
                                            })
                                            .map(mDoc => {
                                                const st = stats.playerMap[mDoc.name] || { raidToday: 0 };
                                                return (
                                                    <div key={mDoc.id} className={`dashboard-card p-6 md:p-7 rounded-[2rem] border-l-[10px] ${st.raidToday > 0 ? 'border-l-emerald-500 shadow-xl font-bold' : 'opacity-30 grayscale border-l-slate-400 font-bold'} transition-all font-black`}>
                                                        <div className="flex justify-between items-start mb-10 gap-3">
                                                            <div className="flex flex-col min-w-0">
                                                                <span className="text-xl md:text-2xl font-black truncate text-slate-900 dark:text-white italic leading-tight">{mDoc.name}</span>
                                                                <span className="text-[10px] text-emerald-500 font-black italic tracking-widest mt-1 truncate font-bold">{rankingData.getPersonalStatus(mDoc.name).currentTitle.name}</span>
                                                            </div>
                                                            <div className={`shrink-0 w-4 h-4 rounded-full ${st.raidToday >= 2 ? 'bg-emerald-500 shadow-[0_0_15px_rgba(16,185,129,1)]' : 'bg-slate-300'}`}></div>
                                                        </div>
                                                        <div className="grid grid-cols-2 gap-3 mb-6 text-center">
                                                            <div className="bg-slate-50 dark:bg-slate-800/60 p-4 rounded-[1.5rem] border border-slate-100"><div className="text-[9px] text-slate-400 uppercase mb-1 font-bold">오늘</div><div className="text-xl font-black dark:text-white italic">{st.raidToday}</div></div>
                                                            <div className="bg-emerald-50 dark:bg-emerald-900/20 p-4 rounded-[1.5rem] border border-emerald-100"><div className="text-[9px] text-emerald-600 uppercase mb-1 font-bold">누적</div><div className="text-xl font-black text-emerald-600 italic">{rankingData.getPersonalStatus(mDoc.name).raidCount}</div></div>
                                                        </div>
                                                    </div>
                                                );
                                        })}
                                    </div>
                                </section>
                            </div>
                        )}

                        {mainCategory === 'ranking' && (
                            <div className="animate-fadeIn space-y-10">
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-10">
                                    <section className="space-y-6">
                                        <h3 className="font-black text-2xl italic uppercase text-blue-600 px-2">주간 기여 랭킹</h3>
                                        <div className="dashboard-card overflow-hidden">
                                            <table className="w-full text-left font-black">
                                                <thead className="bg-slate-50 dark:bg-slate-800 text-slate-400 text-[10px] uppercase border-b"><tr><th className="px-5 py-4">순위</th><th className="px-5 py-4">길드원</th><th className="px-5 py-4 text-right">점수</th></tr></thead>
                                                <tbody className="divide-y font-black dark:text-white">
                                                    {rankingData.weekly.slice(0, 10).map((r, i) => (
                                                        <tr key={r.name} className={`hover:bg-slate-50 dark:hover:bg-slate-800/40 ${r.name === nickname ? 'bg-blue-50/50 dark:bg-blue-900/20' : ''}`}><td className="px-5 py-5 italic text-xl font-black">{i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `#${i+1}`}</td><td className="px-5 py-5 font-black"><div className="flex flex-col"><span className="font-black">{r.name}</span><span className="text-[9px] text-blue-500 italic truncate">{rankingData.getPersonalStatus(r.name).currentTitle.name}</span></div></td><td className="px-5 py-5 text-right font-black text-blue-600 italic whitespace-nowrap">{r.score} P</td></tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </section>
                                    <section className="space-y-6">
                                        <h3 className="font-black text-2xl italic uppercase text-emerald-600 px-2">시즌 명예의 전당</h3>
                                        <div className="dashboard-card overflow-hidden">
                                            <table className="w-full text-left font-black">
                                                <thead className="bg-slate-50 dark:bg-slate-800 text-slate-400 text-[10px] uppercase border-b"><tr><th className="px-5 py-4">순위</th><th className="px-5 py-4">길드원</th><th className="px-5 py-4 text-right">점수</th></tr></thead>
                                                <tbody className="divide-y font-black dark:text-white">
                                                    {rankingData.season.slice(0, 10).map((r, i) => (
                                                        <tr key={r.name} className={`hover:bg-slate-50 dark:hover:bg-slate-800/40 ${r.name === nickname ? 'bg-emerald-50/50 dark:bg-emerald-900/20' : ''}`}><td className="px-5 py-5 italic text-xl font-black">{i === 0 ? '👑' : i === 1 ? '💎' : i === 2 ? '⭐' : `#${i+1}`}</td><td className="px-5 py-5 font-black"><div><span>{r.name}</span><span className="text-[9px] text-emerald-500 italic truncate">{rankingData.getPersonalStatus(r.name).currentTitle.name}</span></div></td><td className="px-5 py-5 text-right font-black text-emerald-600 italic whitespace-nowrap">{r.score} P</td></tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </section>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* 하단 HUD */}
                    <div className="fixed bottom-3 md:bottom-6 left-1/2 -translate-x-1/2 w-[95%] md:w-full md:max-w-6xl z-[150] animate-fadeIn font-bold">
                        <div className="bg-slate-950/95 backdrop-blur-3xl text-white px-4 md:px-12 py-3.5 md:py-5 rounded-[2rem] md:rounded-[3.5rem] flex flex-col md:flex-row justify-between items-center shadow-2xl border border-white/10 gap-3 md:gap-0 font-black">
                            <div className="flex items-center gap-4 w-full md:w-auto min-w-0 border-b md:border-b-0 border-white/10 pb-2 md:pb-0 font-black">
                                <div className="flex flex-col min-w-0 font-bold">
                                    <span className="text-[8px] md:text-[9px] text-blue-400 font-black uppercase tracking-[0.2em] mb-0.5">식별된 길드원</span>
                                    <div className="flex items-baseline gap-2">
                                        <span className="text-sm md:text-xl font-black italic tracking-tighter truncate">{nickname}</span>
                                        <span className="text-[8px] md:text-[10px] text-blue-300 italic truncate">{myStatus.currentTitle.name}</span>
                                    </div>
                                    {myStatus.nextTitle && (
                                        <span className="text-[7px] md:text-[9px] text-slate-400 font-bold">
                                            다음 단계까지 <span className="text-yellow-400 font-black">{myStatus.nextTitle.score - myStatus.score}p 남음</span>
                                        </span>
                                    )}
                                </div>
                            </div>
                            <div className="hidden lg:flex flex-col items-center justify-center flex-1 px-8 border-x border-white/10 mx-6 overflow-hidden font-black">
                                <span className="text-[8px] text-slate-500 uppercase tracking-widest mb-1">실시간 작전 피드</span>
                                <div className="text-[10px] text-slate-200 italic truncate max-w-full text-center log-animate" key={latestLog ? latestLog.timestamp?.seconds : 'init'}>
                                    {latestLog ? (
                                        <>🚩 <span className="text-blue-400">[{latestLog.nickname}]</span> {latestLog.mob} 공략 성공</>
                                    ) : (
                                        "새로운 작전 데이터를 기다리는 중..."
                                    )}
                                </div>
                            </div>
                            <div className="flex items-center justify-around md:justify-end gap-4 md:gap-10 w-full md:w-auto shrink-0 font-black">
                                <div className="flex flex-col text-center">
                                    <span className="text-[8px] md:text-[9px] text-emerald-400 font-black uppercase tracking-[0.1em] mb-0.5">나의 레이드 성과</span>
                                    <div className="flex items-center justify-center gap-1.5 font-black">
                                        <span className="text-xs md:text-lg font-black italic">{myStatus.rank}위</span>
                                        <span className="text-[8px] md:text-[10px] text-slate-500 font-bold">({myStatus.raidCount}개)</span>
                                    </div>
                                </div>
                                <div className="h-8 w-px bg-white/10"></div>
                                <div className="flex flex-col text-center">
                                    <span className="text-[8px] md:text-[9px] text-slate-500 font-black uppercase mb-0.5">시스템 상태</span>
                                    <div className="flex items-center gap-1.5 font-black justify-center">
                                        <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                                        <span className="text-[9px] md:text-xs font-black uppercase tracking-tighter text-emerald-400">정상</span>
                                    </div>
                                </div>
                                <button onClick={handleResetSession} className="bg-white/10 hover:bg-red-600 text-white p-2.5 md:p-3.5 rounded-xl md:rounded-2xl text-[9px] md:text-[11px] font-black uppercase transition-all border border-white/5 active:scale-90"><i className="fas fa-power-off"></i></button>
                            </div>
                        </div>
                    </div>

                    {/* 관리자 번호 입력 모달 */}
                    {showAdminEntry && (
                        <div className="fixed inset-0 z-[1000] flex items-center justify-center p-4 bg-black/60 backdrop-blur-md animate-fadeIn font-bold">
                            <div className="bg-white dark:bg-slate-800 dashboard-card p-8 w-full max-w-[320px] border-t-8 border-blue-600 shadow-2xl">
                                <div className="mb-6 text-center">
                                    <p className="text-[10px] text-slate-500 uppercase tracking-widest mb-1 font-black">보안 인증</p>
                                    <h3 className="text-lg font-black dark:text-white">관리자 코드 입력</h3>
                                </div>
                                <div className="flex flex-col gap-4 font-black">
                                    <input type="password" autoFocus placeholder="Passkey" className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl px-4 py-4 text-center text-xl outline-none focus:border-blue-500 text-slate-900 dark:text-white font-black tracking-widest" value={adminPass} onChange={e => setAdminPass(e.target.value)} onKeyDown={e => { if(e.key === 'Enter' && adminPass === "123456") { setIsAdminMode(true); setShowAdminEntry(false); setAdminPass(""); } }} />
                                    <div className="grid grid-cols-2 gap-3">
                                        <button onClick={() => { setShowAdminEntry(false); setAdminPass(""); }} className="py-3 bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-white rounded-xl font-bold text-sm">취소</button>
                                        <button onClick={() => { if(adminPass === "123456") { setIsAdminMode(true); setShowAdminEntry(false); setAdminPass(""); } else { showAlert("비밀번호 오류", "error"); } }} className="py-3 bg-blue-600 text-white rounded-xl font-bold text-sm shadow-lg">인증</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 알림 및 확인 모달 */}
                    {uiAlert && (
                        <div className="fixed inset-0 z-[1000] flex items-center justify-center p-4 custom-modal-overlay animate-fadeIn text-slate-900 font-bold">
                            <div className="bg-white dark:bg-slate-900 rounded-[2.5rem] shadow-2xl p-10 max-w-sm w-full text-center border-t-[8px] border-blue-500 font-black">
                                <p className="text-lg mb-8 dark:text-white font-bold">{uiAlert.message}</p>
                                <button onClick={closeAlert} className="w-full bg-blue-600 text-white py-4 rounded-2xl font-black shadow-lg">확인</button>
                            </div>
                        </div>
                    )}
                    {uiConfirm && (
                        <div className="fixed inset-0 z-[1000] flex items-center justify-center p-4 custom-modal-overlay animate-fadeIn text-slate-900 font-bold">
                            <div className="bg-white dark:bg-slate-900 rounded-[2.5rem] shadow-2xl p-10 max-w-sm w-full text-center border-t-[8px] border-orange-500 font-black">
                                <p className="text-lg mb-8 dark:text-white font-bold">{uiConfirm.message}</p>
                                <div className="grid grid-cols-2 gap-3">
                                    <button onClick={() => setUiConfirm(null)} className="py-4 bg-slate-100 dark:bg-slate-800 dark:text-white rounded-2xl font-black font-bold">취소</button>
                                    <button onClick={() => { uiConfirm.onConfirm(); setUiConfirm(null); }} className="py-4 bg-orange-500 text-white rounded-2xl font-black shadow-lg font-bold">확인</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
