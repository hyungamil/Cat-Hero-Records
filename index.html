                                                            <h3 className="text-2xl font-black italic text-slate-900 dark:text-white">격전지 비율 최종 결과</h3>
                                                        </div>

                                                        <div className="flex justify-around items-center bg-blue-50 dark:bg-blue-950/20 rounded-2xl p-4 mb-6 border border-blue-100 dark:border-blue-900/50">
                                                            <div className="text-center">
                                                                <span className="text-[10px] text-blue-600 dark:text-blue-400 uppercase tracking-wider block font-bold">총 격추 수치</span>
                                                                <span className="text-xl md:text-2xl font-black font-mono text-blue-700 dark:text-blue-400 mt-1 block">{calcStrikeReport.totalGyeokchu.toLocaleString()}</span>
                                                            </div>
                                                            {bossScoreStr && (
                                                                <>
                                                                    <div className="w-px h-10 bg-blue-200 dark:bg-blue-800/50"></div>
                                                                    <div className="text-center">
                                                                        <span className="text-[10px] text-emerald-600 dark:text-emerald-400 uppercase tracking-wider block font-bold">몬스터 체력</span>
                                                                        <span className="text-xl md:text-2xl font-black font-mono text-emerald-700 dark:text-emerald-400 mt-1 block">{Number(bossScoreStr).toLocaleString()}</span>
                                                                    </div>
                                                                </>
                                                            )}
                                                        </div>

                                                        <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                                                            {calcStrikeReport.individualReports.map((report, idx) => {
                                                                const min1x = Math.floor(report.indExpectedSec1x / 60);
                                                                const sec1x = report.indExpectedSec1x % 60;
                                                                const min2x = Math.floor(report.indExpectedSec2x / 60);
                                                                const sec2x = report.indExpectedSec2x % 60;
                                                                
                                                                return (
                                                                <div key={report.id} className={`p-4 rounded-xl border ${idx === 0 ? 'border-amber-400 bg-amber-50/30 dark:bg-amber-950/20' : 'border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50'} flex flex-col`}>
                                                                    <div className="flex items-center gap-2 mb-2 border-b border-slate-200 dark:border-slate-700/50 pb-2">
                                                                        {idx === 0 && <span className="text-sm">👑</span>}
                                                                        <span className="font-black text-slate-800 dark:text-slate-100 truncate">{report.name}</span>
                                                                    </div>
                                                                    <div className="flex justify-between items-end mb-1">
                                                                        <span className="text-[10px] text-slate-500 dark:text-slate-400 font-bold">기여율</span>
                                                                        <span className={`text-sm font-black font-mono ${idx === 0 ? 'text-amber-600 dark:text-amber-400' : 'text-slate-700 dark:text-slate-200'}`}>{report.rate}%</span>
                                                                    </div>
                                                                    <div className="text-[9px] text-right text-slate-400 font-bold mb-3">(남은 {(100-report.rate).toFixed(2)}%)</div>
                                                                    
                                                                    {bossScoreStr && report.indExpectedSec1x > 0 && (
                                                                        <div className="flex flex-col gap-1 mb-3 bg-white dark:bg-slate-900/50 p-2 rounded-lg border border-slate-100 dark:border-slate-700/50">
                                                                            <div className="flex justify-between items-center text-[9px] font-bold">
                                                                                <span className="text-slate-500 dark:text-slate-400">예상 시간(1배속)</span>
                                                                                <span className="text-slate-700 dark:text-slate-300 font-mono">{min1x}분 {sec1x}초</span>
                                                                            </div>
                                                                            <div className="flex justify-between items-center text-[9px] font-bold">
                                                                                <span className="text-slate-500 dark:text-slate-400">예상 시간(2배속)</span>
                                                                                <span className="text-blue-500 dark:text-blue-400 font-mono">{min2x}분 {sec2x}초</span>
                                                                            </div>
                                                                        </div>
                                                                    )}

                                                                    <div className="mt-auto pt-2 border-t border-slate-200 dark:border-slate-700/50 flex justify-between items-center">
                                                                        <span className="text-[10px] font-bold text-blue-500 dark:text-blue-400">{bossScoreStr ? '예상 점수' : '개인 격추'}</span>
                                                                        <span className="text-sm font-black font-mono text-blue-600 dark:text-blue-400 italic">
                                                                            {bossScoreStr ? report.expectedScore.toLocaleString() : report.gyeokchu.toLocaleString()}
                                                                        </span>
                                                                    </div>
                                                                </div>
                                                                );
                                                            })}
                                                        </div>
                                                        {calcStrikeReport.individualReports.length === 0 && (
                                                            <div className="py-12 text-center text-slate-400 dark:text-slate-500 font-bold bg-slate-50 dark:bg-slate-800/50 rounded-xl">참여시킬 길드원들을 위 리스트에서 지정해 주세요.</div>
                                                        )}
                                                        <div className="mt-6 text-center text-[10px] text-slate-400 dark:text-slate-500 font-mono tracking-widest">
                                                            생성일시: {new Date().toLocaleString()}
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="space-y-8 animate-fadeIn">
                                            <div className="dashboard-card p-6 md:p-8 space-y-8">
                                                <div>
                                                    <h2 className="text-xl font-black italic text-emerald-600 dark:text-emerald-400 flex items-center gap-2"><i className="fas fa-gift"></i>격전지 분 분배 시스템</h2>
                                                    <p className="text-xs text-slate-400 dark:text-slate-500 mt-1 mb-4">
                                                        계산기에서 지정한 <strong className="text-emerald-500 dark:text-emerald-400">{selectedCalcMembers.length}명</strong>의 길드원 정보를 그대로 가져와 실제 드랍된 보상을 공정하게 분배합니다.
                                                    </p>
                                                    {selectedCalcMembers.length > 0 ? (
                                                        <div className="bg-slate-50 dark:bg-slate-800/50 p-4 rounded-xl border border-slate-200 dark:border-slate-700">
                                                            <div className="text-[10px] font-black text-slate-500 dark:text-slate-400 mb-2 border-b border-slate-200 dark:border-slate-700 pb-2">현재 선택된 길드원 (총 {selectedCalcMembers.length}명)</div>
                                                            <div className="flex flex-wrap gap-2">
                                                                {selectedCalcMembers.map(id => {
                                                                    const mObj = members.find(m => m.id === id);
                                                                    return mObj ? (
                                                                        <span key={id} className="text-[10px] bg-white dark:bg-slate-900 border border-emerald-200 dark:border-emerald-800 text-emerald-700 dark:text-emerald-400 px-2 py-1 rounded-md flex items-center gap-1 shadow-sm">
                                                                            <i className="fas fa-check"></i> {mObj.name} {renderBadges(mObj)}
                                                                        </span>
                                                                    ) : null;
                                                                })}
                                                            </div>
                                                        </div>

                                                                        <div className="flex justify-between items-center bg-slate-50 dark:bg-slate-900/50 p-3 rounded-xl mb-4 border border-slate-100 dark:border-slate-700/50">
                                                                            <div className="flex flex-col items-center flex-1 border-r border-slate-200 dark:border-slate-700">
                                                                                <span className="text-[9px] text-slate-400 font-bold mb-0.5">참여 인원</span>
                                                                                <span className="text-sm font-black text-slate-700 dark:text-slate-200">{uniqueWinners}명</span>
                                                                            </div>
                                                                            <div className="flex flex-col items-center flex-1">
                                                                                <span className="text-[9px] text-slate-400 font-bold mb-0.5">보상 총합</span>
                                                                                <span className="text-sm font-black text-slate-700 dark:text-slate-200">{totalItems}건</span>
                                                                            </div>
                                                                        </div>
                                                                    )}
                                                                    
                                                                    {docItem.memo && (
                                                                        <div className="text-[10px] text-slate-500 dark:text-slate-400 bg-yellow-50 dark:bg-yellow-900/10 px-3 py-2 rounded-lg mb-4 border border-yellow-100 dark:border-yellow-800/30">
                                                                            <span className="font-bold text-yellow-600 dark:text-yellow-400 mr-1">🟨 메모:</span>{docItem.memo}
                                                                        </div>
                                                                    )}
                                                                    
                                                                    <div className="mt-auto pt-2">
                                                                        <button onClick={() => setSelectedLootGroupId(docItem.id)} className="w-full py-2.5 bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 rounded-xl text-xs font-black hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors flex justify-center items-center gap-1.5">
                                                                            상세보기 <i className="fas fa-chevron-right text-[10px]"></i>
                                                                        </button>
                                                                    </div>
                                                                </div>
                                                                );
                                                            })}
                                                            {selectedLogs.length === 0 && (
                                                                <div className="flex flex-col items-center justify-center h-full text-slate-400 dark:text-slate-500 pb-20">
                                                                    <i className="far fa-calendar-times text-4xl mb-4 opacity-50"></i>
                                                                    <p className="font-bold text-sm">해당 날짜에 저장된 기록이 없습니다.</p>
                                                                </div>
                                                            )}
                                                        </div>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            )}
                        </main>

                        {/* 하단 플로팅 컨트롤 */}
                        <div className="fixed inset-x-0 bottom-3 md:bottom-6 z-[150] flex justify-center pointer-events-none">
                            <div className="w-[95%] md:w-full md:max-w-6xl animate-fadeIn font-bold pointer-events-auto">
                                <div className="bg-slate-950/95 dark:bg-[#0B1220]/95 backdrop-blur-3xl text-white px-4 md:px-12 py-3.5 md:py-5 rounded-[2rem] md:rounded-[3.5rem] flex flex-col md:flex-row justify-between items-center shadow-[0_10px_40px_-10px_rgba(0,0,0,0.5)] border border-white/10 gap-3 md:gap-0">
                                    <div className="flex items-center gap-4 w-full md:w-auto min-w-0 border-b md:border-b-0 border-white/10 pb-2 md:pb-0">
                                        <div className="flex flex-col min-w-0">
                                            <span className="text-[8px] md:text-[9px] text-blue-400 uppercase tracking-[0.2em] mb-0.5">식별된 길드원</span>
                                            <div className="flex items-baseline gap-2">
                                                <span className="text-sm md:text-xl font-black italic tracking-tighter truncate text-white">{nickname}</span>
                                                <span className="text-[8px] md:text-[10px] text-blue-300 italic truncate">{myStatusObj.currentTitle.name}</span>
                                            </div>
                                            {myStatusObj.nextTitle && (
                                                <span className="text-[7px] md:text-[9px] text-slate-300">다음 단계까지 <span className="text-yellow-400 font-bold">{myStatusObj.nextTitle.score - myStatusObj.score}p 남음</span></span>
                                            )}
                                        </div>
                                    </div>
                                    <div className="hidden lg:flex flex-col items-center justify-center flex-1 px-8 border-x border-white/10 mx-6 overflow-hidden">
                                        <span className="text-[8px] text-slate-400 uppercase tracking-widest mb-1">실시간 작전 피드</span>
                                        <div className="text-[10px] text-slate-200 italic truncate max-w-full text-center log-animate" key={latestLog ? latestLog.timestamp?.seconds : 'init'}>
                                            {latestLog ? (<>🚩 <span className="text-blue-400 font-black">[{latestLog.nickname}]</span> {latestLog.mob} 공략 성공 {latestLog.isMulti ? '(다중 등록)' : ''}</>) : ("새로운 작전 데이터를 기다리는 중...")}
                                        </div>
                                    </div>
                                    <div className="flex items-center justify-around md:justify-end gap-4 md:gap-10 w-full md:w-auto shrink-0">
                                        <div className="flex flex-col text-center">
                                            <span className="text-[8px] md:text-[9px] text-emerald-400 uppercase tracking-[0.1em] mb-0.5">길드 내 랭킹</span>
                                            <div className="flex items-center justify-center gap-1.5">
                                                <span className="text-xs md:text-lg font-black italic">{myStatusObj.rank}위</span>
                                                <span className="text-[8px] md:text-[10px] text-slate-400">({myStatusObj.score}p)</span>
                                            </div>
                                        </div>
                                        <div className="h-8 w-px bg-white/10"></div>
                                        <div className="flex flex-col text-center">
                                            <span className="text-[8px] md:text-[9px] text-slate-400 uppercase mb-0.5">시스템 상태</span>
                                            <div className="flex items-center gap-1.5 justify-center">
                                                <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                                                <span className="text-[9px] md:text-xs uppercase tracking-tighter text-emerald-400">정상</span>
                                            </div>
                                        </div>
                                        <button onClick={handleResetSession} className="bg-white/10 hover:bg-red-600 text-white p-2.5 md:p-3.5 rounded-xl md:rounded-2xl text-[9px] md:text-[11px] uppercase transition-all border border-white/5 active:scale-90"><i className="fas fa-power-off"></i></button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* 공지사항 모달 */}
                        {showNoticeModal && (
                            <div className="fixed inset-0 z-[1000] flex items-center justify-center p-4 custom-modal-overlay animate-fadeIn text-slate-900 dark:text-white" onClick={() => setShowNoticeModal(false)}>
                                <div className="bg-white dark:bg-slate-900 rounded-[2rem] shadow-2xl p-8 max-w-md w-full border-t-8 border-blue-500" onClick={e=>e.stopPropagation()}>
                                    <div className="flex justify-between items-center mb-6">
                                        <h3 className="text-lg font-black flex items-center gap-2"><i className="fas fa-bullhorn text-blue-500"></i>전체 공지사항</h3>
                                        <button onClick={() => setShowNoticeModal(false)} className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"><i className="fas fa-times"></i></button>
                                    </div>
                                    <p className="text-sm text-slate-700 dark:text-slate-300 leading-relaxed whitespace-pre-wrap">{notice}</p>
                                </div>
                            </div>
                        )}

                        {/* 처치 기록 모달 */}
                        {showHistoryModal && (
                            <div className="fixed inset-0 z-[1000] flex items-center justify-center p-4 custom-modal-overlay animate-fadeIn text-slate-900 dark:text-white" onClick={() => setShowHistoryModal(false)}>
                                <div className="bg-white dark:bg-slate-900 rounded-[2.5rem] shadow-2xl w-full max-w-lg max-h-[85vh] flex flex-col border-t-8 border-blue-500" onClick={e=>e.stopPropagation()}>
                                    <div className="p-6 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center shrink-0">
                                        <h3 className="text-lg font-black"><i className="fas fa-history text-blue-500 mr-2"></i>모든 처치 기록</h3>
                                        <button onClick={() => setShowHistoryModal(false)} className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors"><i className="fas fa-times text-xl"></i></button>
                                    </div>
                                    <div className="p-6 overflow-y-auto flex-1 space-y-3 no-scrollbar">
                                        {logs.map((l, idx) => {
                                            const mObj = members.find(m => m.name === l.nickname);
                                            return(
                                            <div key={idx} className="p-4 bg-slate-50 dark:bg-slate-800/50 rounded-xl border border-slate-100 dark:border-slate-700 flex justify-between items-center hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                                                <div className="flex items-center gap-3">
                                                    <div className={`w-8 h-8 rounded-full flex items-center justify-center text-sm shadow-inner shrink-0 ${l.mob === '보스' ? 'bg-red-100 text-red-600 dark:bg-red-900/30' : 'bg-blue-100 text-blue-600 dark:bg-blue-900/30'}`}>
                                                        <i className={`fas ${l.mob === '보스' ? 'fa-skull' : 'fa-check'}`}></i>
                                                    </div>
                                                    <div>
                                                        <div className="text-sm font-black text-slate-900 dark:text-white flex items-center gap-1">
                                                            {l.nickname}
                                                            {renderBadges(mObj)}
                                                        </div>
                                                        <div className="text-[10px] text-slate-500 dark:text-slate-400 font-bold">{l.mob} 처치</div>
                                                    </div>
                                                </div>
                                                <div className="text-right flex flex-col items-end gap-1">
                                                    <div className="text-[10px] text-slate-400 dark:text-slate-500 font-mono">{l.timestamp?.seconds ? new Date(l.timestamp.seconds * 1000).toLocaleString() : '방금 전'}</div>
                                                    <div className={`text-[11px] font-black px-2 py-0.5 rounded-md inline-block ${l.isMulti ? 'bg-purple-50 text-purple-600 dark:bg-purple-900/20 dark:text-purple-400' : 'bg-blue-50 text-blue-600 dark:bg-blue-900/20 dark:text-blue-400'}`}>
                                                        {l.isMulti ? '다중 등록됨' : `${l.playMin}분 ${l.playSec}초 소요`}
                                                    </div>
                                                </div>
                                            </div>
                                        )})}
                                        {logs.length === 0 && <div className="text-center text-slate-400 dark:text-slate-500 py-10 font-bold">기록이 없습니다.</div>}
                                    </div>
                                </div>
                            </div>
                        )}
                        
                        {/* 분배 이력 그룹 상세 보기 모달 */}
                        {currentSelectedGroup && (
                            <div className="fixed inset-0 z-[1400] flex items-center justify-center p-4 custom-modal-overlay animate-fadeIn text-slate-900 dark:text-white" onClick={() => setSelectedLootGroupId(null)}>
                                <div className="bg-white dark:bg-slate-900 rounded-[2.5rem] shadow-2xl w-full max-w-lg max-h-[85vh] flex flex-col border-t-8 border-emerald-500" onClick={e=>e.stopPropagation()}>
                                    <div className="p-6 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center shrink-0">
                                        <div>
                                            <h3 className="text-lg font-black flex items-center gap-2">
                                                <i className="fas fa-list text-emerald-500"></i> 분배 결과 상세
                                            </h3>
                                            <span className="text-[10px] text-slate-400 font-mono mt-1 block">
                                                {currentSelectedGroup.timestamp?.seconds ? new Date(currentSelectedGroup.timestamp.seconds * 1000).toLocaleString() : (currentSelectedGroup.timestamp ? new Date(currentSelectedGroup.timestamp).toLocaleString() : '')}
                                            </span>
                                        </div>
                                        <button onClick={() => setSelectedLootGroupId(null)} className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors"><i className="fas fa-times text-xl"></i></button>
                                    </div>
                                    <div className="p-6 overflow-y-auto flex-1 space-y-3 no-scrollbar bg-slate-50 dark:bg-[#0B1220] rounded-b-[2rem]">
                                        {currentSelectedGroup.list?.map((item, idx) => {
                                            const mObj = members.find(m => m.name === item.winner);
                                            return (
                                            <div key={idx} className="p-4 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl flex justify-between items-center shadow-sm">
                                                <div className="flex items-center gap-3 min-w-0">
                                                    <div className={`w-8 h-8 rounded-full flex items-center justify-center text-xs shrink-0 ${item.isEquip || (item.itemStr && item.itemStr.includes('장비')) ? 'bg-amber-100 text-amber-500 dark:bg-amber-900/30' : 'bg-emerald-100 text-emerald-500 dark:bg-emerald-900/30'}`}>
                                                        <i className={`fas ${item.isEquip || (item.itemStr && item.itemStr.includes('장비')) ? 'fa-khanda' : 'fa-gift'}`}></i>
                                                    </div>
                                                    <div className="truncate">
                                                        <div className="text-[10px] text-slate-500 dark:text-slate-400 font-bold mb-0.5 flex items-center gap-1">{item.winner} {renderBadges(mObj)}</div>
                                                        <div className="text-sm font-black text-slate-800 dark:text-slate-100 truncate">
                                                            <span className={item.itemStr?.includes('장비') ? 'text-amber-600 dark:text-amber-400' : 'text-emerald-600 dark:text-emerald-400'}>{item.itemStr}</span>
                                                            {item.qty && item.qty > 1 && <span className="ml-1 text-purple-500 text-[10px] font-mono">x{item.qty}</span>}
                                                        </div>
                                                    </div>
                                                </div>
                                                {canEditLoot && (
                                                    <div className="flex gap-2 shrink-0 ml-2">
                                                        <button onClick={() => setEditLootItem({ docId: currentSelectedGroup.id, idx, ...item })} className="w-7 h-7 rounded-lg bg-slate-100 dark:bg-slate-700 text-blue-500 hover:text-blue-400 transition-colors" title="수정"><i className="fas fa-edit"></i></button>
                                                        <button onClick={() => handleDeleteLootItem(currentSelectedGroup.id, idx)} className="w-7 h-7 rounded-lg bg-slate-100 dark:bg-slate-700 text-red-400 hover:text-red-500 transition-colors" title="삭제"><i className="fas fa-trash-alt"></i></button>
                                                    </div>
                                                )}
                                            </div>
                                            );
                                        })}
                                        {currentSelectedGroup.list?.length === 0 && <div className="text-center py-10 text-slate-400 font-bold">상세 기록이 비어 있습니다.</div>}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 아이템 수정 모달 */}
                        {editLootItem && (
                            <div className="fixed inset-0 z-[1500] flex items-center justify-center p-4 custom-modal-overlay animate-fadeIn text-slate-900 dark:text-white" onClick={() => setEditLootItem(null)}>
                                <div className="bg-white dark:bg-slate-900 rounded-[2rem] shadow-2xl p-6 max-w-sm w-full border-t-8 border-blue-500" onClick={e=>e.stopPropagation()}>
                                    <h3 className="text-lg font-black mb-4">분배 기록 수정</h3>
                                    <form onSubmit={handleUpdateLootItem} className="space-y-4">
                                        <div>
                                            <label className="text-xs font-bold text-slate-500 block mb-1">당첨 길드원</label>
                                            <select className="w-full p-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl outline-none" value={editLootItem.winner} onChange={e => setEditLootItem({...editLootItem, winner: e.target.value})}>
                                                {members.map(m => <option key={m.id} value={m.name}>{m.name}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-slate-500 block mb-1">아이템 명</label>
                                            <input type="text" className="w-full p-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl outline-none" value={editLootItem.itemStr} onChange={e => setEditLootItem({...editLootItem, itemStr: e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-slate-500 block mb-1">수량</label>
                                            <input type="number" min="1" className="w-full p-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl outline-none" value={editLootItem.qty || 1} onChange={e => setEditLootItem({...editLootItem, qty: Number(e.target.value)})} />
                                        </div>
                                        <div className="flex gap-2 pt-2">
                                            <button type="button" onClick={() => setEditLootItem(null)} className="flex-1 py-3 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 rounded-xl font-bold">취소</button>
                                            <button type="submit" className="flex-1 py-3 bg-blue-600 text-white rounded-xl font-black shadow-md">저장</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}

                        {/* 글로벌 알림 모달 */}
                        {uiAlert && (
                            <div className="fixed top-4 right-4 z-[2000] animate-fadeIn">
                                <div className={`px-5 py-3 rounded-xl shadow-lg border-l-4 font-bold flex items-center gap-3 ${uiAlert.type === 'error' ? 'bg-white dark:bg-slate-800 border-red-500 text-slate-800 dark:text-white' : 'bg-slate-800 dark:bg-slate-700 border-emerald-500 text-white'}`}>
                                    <i className={`fas ${uiAlert.type === 'error' ? 'fa-exclamation-circle text-red-500' : 'fa-check-circle text-emerald-500'}`}></i>
                                    {uiAlert.message}
                                    <button onClick={closeAlert} className="ml-4 opacity-50 hover:opacity-100"><i className="fas fa-times"></i></button>
                                </div>
                            </div>
                        )}

                        {/* 글로벌 컨펌 모달 */}
                        {uiConfirm && (
                            <div className="fixed inset-0 z-[2000] flex items-center justify-center p-4 custom-modal-overlay animate-fadeIn text-slate-900 dark:text-white" onClick={() => setUiConfirm(null)}>
                                <div className="bg-white dark:bg-slate-900 rounded-[2rem] shadow-2xl p-6 md:p-8 max-w-sm w-full text-center border border-slate-200 dark:border-slate-700" onClick={e=>e.stopPropagation()}>
                                    <div className="w-16 h-16 bg-blue-50 dark:bg-blue-900/30 rounded-full flex items-center justify-center mx-auto mb-4 text-blue-500 text-2xl">
                                        <i className="fas fa-question-circle"></i>
                                    </div>
                                    <p className="text-sm md:text-base font-black mb-6 whitespace-pre-wrap leading-relaxed">{uiConfirm.message}</p>
                                    
                                    {uiConfirm.checkboxLabel && (
                                        <label className="flex items-center justify-center gap-2 text-xs text-slate-500 mb-6 cursor-pointer">
                                            <input type="checkbox" id="confirmCheckbox" className="w-4 h-4 accent-blue-500" />
                                            {uiConfirm.checkboxLabel}
                                        </label>
                                    )}

                                    <div className="flex gap-3">
                                        <button onClick={() => setUiConfirm(null)} className="flex-1 py-3.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 rounded-xl font-bold transition-colors">취소</button>
                                        <button onClick={() => { 
                                            const isChecked = uiConfirm.checkboxLabel ? document.getElementById('confirmCheckbox')?.checked : false;
                                            uiConfirm.onConfirm(isChecked); 
                                            setUiConfirm(null); 
                                        }} className="flex-1 py-3.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-black shadow-md shadow-blue-500/20 transition-all active:scale-95">확인</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 관리자 암호 입력 모달 */}
                        {showAdminEntry && !isAdminMode && (
                            <div className="fixed inset-0 z-[1000] flex items-center justify-center p-4 custom-modal-overlay animate-fadeIn text-slate-900 dark:text-white" onClick={() => setShowAdminEntry(false)}>
                                <div className="bg-white dark:bg-slate-900 rounded-[2rem] shadow-2xl p-6 max-w-sm w-full border-t-8 border-slate-800" onClick={e=>e.stopPropagation()}>
                                    <h3 className="text-lg font-black mb-2 flex items-center gap-2"><i className="fas fa-lock text-slate-400"></i>관리자 접근</h3>
                                    <p className="text-xs text-slate-500 dark:text-slate-400 mb-4">권한이 필요합니다. 비밀번호를 입력하세요.</p>
                                    <input type="password" value={adminPass} onChange={e=>setAdminPass(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleAdminLogin()} className="w-full p-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl outline-none focus:border-slate-800 dark:focus:border-slate-500 mb-4" placeholder="비밀번호" />
                                    <div className="flex gap-2">
                                        <button onClick={() => setShowAdminEntry(false)} className="flex-1 py-3 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 rounded-xl font-bold">취소</button>
                                        <button onClick={handleAdminLogin} className="flex-1 py-3 bg-slate-800 text-white rounded-xl font-black shadow-md hover:bg-slate-900">확인</button>
                                    </div>
                                </div>
                            </div>
                        )}

                    </div>
                );
            }

            return pageContent;
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
